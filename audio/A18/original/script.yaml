# 6章後半 回1（A18〜A22、魔女邸と森）の台詞 L534〜L717。原作音源パート20 の 00:00〜25:20（D-045）
# 原作テキストは Drive「mj100 5-6」の「拠点にはビスコ、百騎兵、ルッキーニィ、アルレッキーノがいる。」（A17 の泣き崩れるメタリカの後）〜
#   「まあ、女の子は色々と身だしなみとか、気をつかうものよ。察してあげなさい、百騎兵ちゃん。」。
#   場面の分け方と残す・削るは Living Spec「6章後半 準備（案）」（2026-11-02 ユーザー判断: 表のとおり約27分）。
#   A18 拠点・閉じこもるメタリカとマーニィ: L534〜L607
#   A19 バスルーム: L608〜L622（全部残す）
#   A20 拠点・余命: L623〜L638（全部残す）
#   A21 森の庭園とヘッカヘンネの隠し森: L639〜L661
#   A22 拠点・切符: L662〜L717
# use: false は選別で削った台詞（切り出しは位置合わせのためにすべて行い、シーンでは使わない）。
#   表の「削る」は A18「凶暴な魔獣がうじゃうじゃ」と支援の相談の半分、A21 マーニィの「ワクワクしてきたわ」など、A22「締め上げて屈服」の往復と「身だしなみ」。
#   それ以外の「縮める」は、表に書いた台詞と流れに要る台詞だけを残す（夜会編と同じ）。見直しで台詞を戻すことが多かったので、
#   前ふり・受けになっている台詞は残す側に倒した（A22 の L694・L695 は「交渉」の受けなので、表では削る側だが残した）。
# 話し手の直し（原作テキストの名義と声が合わない所。切り出しのときに声で確かめる）:
#   L586「ふふーん。その点については心配ご無用よ。」・L587「どらぁ！」はテキストではルッキーニィ名義 → マーニィ（声と口調から）。
#   L645 はテキスト「当然、アルレッキーノちゃんはこっちにいるわよ」、声は「（アルレッキ）ーノちゃんがこっちに（も）いるわよ」と聞こえる（書き起こし 14:30）。声を正とする。
# L567 は Revival の音声だけにある章の題の読み上げ（書き起こし 04:08「第2幕第6章」・04:17「魔女と魔女たちの夜会」）。題字の画に使う（提案、revival: true）。
# ネズミの鳴き声（L655・L657〜L659）は声として入っているか分からない。見つからなければ効果音で代える。
# cut（2026-11-02）: tools/refine_cuts.py（短い範囲を脚本の文を手がかりに書き起こし直す）の提案のうち一致 0.82 以上と、
#   語の時刻・声の音量から手で決めた範囲（L550〜L553・L555〜L557・L564・L565・L587・L657〜L659・L671・L672）。
#   L623 は最初の切り出しで 28.7秒（効果音の漏れ）、L655 は 12秒だったのを直した。L672「あらあら」は最初の切り出しで見つからなかった。
#   ネズミの鳴き声（L655・L657〜L659）は声の側に入っていた。17:28.8〜17:30.8 に百騎兵の「おきゅう？おきゅぱ！」がある（ちょっとした声に使える）。
#   確信が持てず、ユーザーに聞いてほしい台詞: L551（頭の「へぇ」）・L552（頭の「あの……」）・L555・L556（境目は語の時刻から）・L587「どらぁ！」・L657〜L659（鳴き声の切れ目）
# テキストの「ワタシ」「オマエ」の表記は原作テキストのまま
scene: A18
source: {part: 20, start: "00:00", vocals: "声とBGMの分離/パート20/パート20_声.mp3"}
lines:
  # --- A18 拠点・閉じこもるメタリカとマーニィ ---
  - {id: L534, who: bisco, text: "どうだった、アルレッキーノ。あいつは、まだ出てこないのか？", note: （魔女邸の居間。ビスコ、百騎兵、ルッキーニィ、アルレッキーノ）}
  - {id: L535, who: arlecchino, text: "はい。お食事をお持ちしたのですが、返事は御座いませんでした。"}
  - {id: L536, who: arlecchino, text: "お部屋の前に置いておきましたので、召し上がって頂けると良いのですが。"}
  - {id: L537, who: luckiny, text: "魔女様、大丈夫でしょうか……。", cut: ["00:25.23", "00:29.23"]}
  - {id: L538, who: arlecchino, text: "リカ様は、此度、柄にも無く……いえ、いつになく、張り切っておられましたゆえ……。"}
  - {id: L539, who: bisco, text: "それが、あんなことになったんだ……。少し、そっとしておいてやろう。"}
  - {id: L540, who: luckiny, text: "……魔女様。"}
  - {id: L541, who: arlecchino, text: "ところでビスコ様。あの声の中に、呪いをかけられた魔女様はいらっしゃいましたか？"}
  - {id: L542, who: luckiny, text: "やっぱり、ビスコさんのその姿は魔女の呪いだったんですね。どうしてそんな目にあったんですか？"}
  - {id: L543, who: bisco, text: "（あのとき、確かに呪いをかけた魔女がいると感じた。でも、なぜ……いったい誰だったんだ……？）", note: （心の声）, cut: ["01:13.47", "01:23.59"]}
  - {id: L544, who: bisco, text: "（わからない……。その魔女が、私に呪いをかけたヤツなのか……？）", note: （心の声）, use: false}
  - {id: L545, who: luckiny, text: "あの……？ビスコさん？", cut: ["01:34.82", "01:37.25"]}
  - {id: L546, who: bisco, text: "え、ああ！すまない……考え事をしていた。"}
  - {id: L547, who: bisco, text: "何で呪いをかけられたのかは私自身、実際によくわかっていないんだ……。", cut: ["01:46.48", "01:52.47"]}
  - {id: L548, who: bisco, text: "まわりからは、魔女の怒りをかったのだと言われたよ……。", use: false}
  - {id: L549, who: bisco, text: "ある朝、目が覚めたら突然こんな姿になっていたわけだしな……。"}
  - {id: L550, who: bisco, text: "ただ、アズ・ブロッケン山で魔女達の声を聞いた時、何かを感じたんだが……。", cut: ["02:07.05", "02:12.95"]}
  - {id: L551, who: luckiny, text: "へぇ……何かを？", cut: ["02:13.65", "02:17.82"]}
  - {id: L552, who: luckiny, text: "あの……まさか、ビスコさんは魔女だったりしないですよね？", cut: ["02:17.84", "02:25.60"]}
  - {id: L553, who: bisco, text: "あ、あたりまえだ！私が、いじわるで性悪の魔女なんかなものか！", cut: ["02:27.70", "02:33.80"]}
  - {id: L554, who: luckiny, text: "ご、ごめんなさい！そういうつもりで言ったんじゃないです……。", cut: ["02:36.91", "02:41.30"]}
  - {id: L555, who: bisco, text: "あ、ああ……そうだよな。こちらこそすまない。", cut: ["02:44.65", "02:48.80"]}
  - {id: L556, who: bisco, text: "まあ、私も小さいころは魔女の先生に憧れてたんだけど。", note: （伏線。8章の陽の魔女ヴェライエ）, cut: ["02:52.30", "02:57.10"]}
  - {id: L557, who: bisco, text: "それより、どうにかして、ヴァルプルギスの夜会に行くことはできないのか？", cut: ["03:00.55", "03:05.45"]}
  - {id: L558, who: bisco, text: "メタリカの件もあるが……、呪いを解く重要な手掛かりになるかもしれない。簡単に諦めたくないんだ！", cut: ["03:07.95", "03:15.25"]}
  - {id: L559, who: bisco, text: "ルッキーニィは何か、こう情報とか持っていないのか？夜会に関する。", use: false}
  - {id: L560, who: luckiny, text: "し、知りません……！知ってたら、真っ先にボクが行ってますよ……。", use: false}
  - {id: L561, who: bisco, text: "そ、そうか……。", use: false}
  - {id: L562, who: luckiny, text: "でも、夜会に行けるとなったら、魔女様も部屋から出てきますよね"}
  - {id: L563, who: arlecchino, text: "フム……。やむを得ません。", cut: ["03:47.58", "03:50.37"]}
  - {id: L564, who: arlecchino, text: "あのお方のチカラをお借りすることにいたしましょう。", cut: ["03:51.95", "03:55.50"]}
  - {id: L565, who: bisco, text: "あのお方？誰だ、そいつは？", cut: ["03:58.45", "04:01.65"]}
  - {id: L566, who: arlecchino, text: "偉大なる森の魔女……マーリカ様にございます。", cut: ["04:04.50", "04:08.09"]}
  - {id: L567, who: narrator, text: "第2幕 第6章 魔女と魔女たちの夜会", note: （Revival の音声だけ。章の題字の画に重ねる案）, revival: true, cut: ["04:14.97", "04:20.91"]}
  - {id: L568, who: bisco, text: "森の魔女……？生きているのか？確かメタリカの奴が……。"}
  - {id: L569, who: arlecchino, text: "マーリカ様はご存命です。ワタクシが停止していないのが何よりの証拠。"}
  - {id: L570, who: luckiny, text: "アルレッキーノさんの停止？"}
  - {id: L571, who: arlecchino, text: "……。以前、百騎兵様がマーリカ様と対峙された庭園の奥に、“ヘッカヘンネの隠し森”がございます。"}
  - {id: L572, who: arlecchino, text: "そこに行けば、何かわかるかもしれません。はい。", cut: ["04:53.65", "04:57.71"]}
  - {id: L573, who: luckiny, text: "何か、裏事情がありそうですね……。", use: false}
  - {id: L574, who: bisco, text: "（なんだ……あいつ、森の魔女を殺してなんかいなかったんじゃないか。）", note: （心の声）}
  - {id: L575, who: bisco, text: "（そうか……。）", note: （心の声）}
  - {id: L576, who: bisco, text: "とはいえ、森の魔女殿はメタリカを夜会に招待してくれるのか？"}
  - {id: L577, who: arlecchino, text: "わかりませぬ。しかし、リカ様のためとあれば、必ずやなんらかのご支援を賜れるでしょう。", use: false}
  - {id: L578, who: arlecchino, text: "マーリカ様は、かつては夜会の議長を任されていた程の権威の持ち主。"}
  - {id: L579, who: arlecchino, text: "夜会にご招待頂くのにこれほど相応しいお方もおりますまい。", use: false}
  - {id: L580, who: arlecchino, text: "ただ、“ヘッカヘンネの隠し森”はマーリカ様が保護していた野生の森。", use: false}
  - {id: L581, who: arlecchino, text: "凶暴な魔獣がうじゃうじゃおりますゆえできれば、百騎兵様に行って頂くのがよろしいかと存じます。", use: false}
  - {id: L582, who: arlecchino, text: "我々はこちらでリカ様のご様子を見守るのがよろしいかと。", use: false}
  - {id: L583, who: luckiny, text: "そうですね！ボク頑張ります！", use: false}
  - {id: L584, who: bisco, text: "ああ、そうだな。それはいいんだが、百騎兵の支援はどうするんだ。"}
  - {id: L585, who: bisco, text: "メタリカに引きこもられちゃ、いろいろと、問題があるんじゃないのか？"}
  - {id: L586, who: marny, text: "ふふーん。その点については心配ご無用よ。", note: （テキストはルッキーニィ名義。窓の外から）, cut: ["06:30.70", "06:34.92"]}
  - {id: L587, who: marny, text: "どらぁ！！！！！", note: （テキストはルッキーニィ名義。窓を破って飛び込む）, cut: ["06:37.75", "06:39.25"]}
  - {id: L588, who: luckiny, text: "う、うわっ！？窓から何かが飛び込んできた！！", cut: ["06:41.35", "06:44.76"]}
  - {id: L589, who: bisco, text: "ま、マーニィ？どうしてここに？", cut: ["06:46.90", "06:50.12"]}
  - {id: L590, who: arlecchino, text: "ガラス窓は通り道ではございません、マーニィ様。"}
  - {id: L591, who: luckiny, text: "ええっ！？ち、血まみれですよ！？", cut: ["06:57.58", "06:59.94"]}
  - {id: L592, who: luckiny, text: "な、何で皆さん、平然としていらっしゃるんですか？"}
  - {id: L593, who: arlecchino, text: "ルッキーニィ様はお会いするのがはじめてでございましたね。", use: false}
  - {id: L594, who: arlecchino, text: "マーニィ様は鋳掛屋の妖精です。その傍若無人さたるや、リカ様に負けず劣らず。"}
  - {id: L595, who: arlecchino, text: "妖精にしておくには惜しいくらいの反逆児……いえ、ご立派な方でございます。はい。"}
  - {id: L596, who: luckiny, text: "そ、そんな厄介な妖精が魔女様の代わりになるんですか……？"}
  - {id: L597, who: marny, text: "ちょっとちょっと！黙って聞いてたらずいぶんなご紹介じゃないの！"}
  - {id: L598, who: bisco, text: "というか、お前、放浪の旅に出たんじゃなかったのか。"}
  - {id: L599, who: marny, text: "リカちゃんのピンチには、颯爽とかけつけるマーニィちゃん！偉い！"}
  - {id: L600, who: bisco, text: "もしかして、お前……実は沼にいたんじゃないのか？", note: （伏線。マーニィは沼の精）}
  - {id: L601, who: marny, text: "な、なにを根拠に！ちゃんと旅にでてたわよ！"}
  - {id: L602, who: marny, text: "とりあえず、百騎兵ちゃんのサポートはまた私がしてあげるから大丈夫よ。"}
  - {id: L603, who: marny, text: "腕はリカちゃんにだって引けを取らないわよ！", use: false}
  - {id: L604, who: arlecchino, text: "それでは、百騎兵様のサポートはマーニィ様におまかせいたしましょう。", use: false}
  - {id: L605, who: arlecchino, text: "マーリカ様がおられるかもしれない“ヘッカヘンネの隠し森”は森の庭園のさらに奥でございます。"}
  - {id: L606, who: bisco, text: "……百騎兵。森の魔女殿の方は頼んだぞ！"}
  - {id: L607, who: marny, text: "それじゃ、行きましょうか。百騎兵ちゃん！今回もよろしくね！"}
  # --- A19 バスルーム（全部残す） ---
  - {id: L608, who: luckiny, text: "あ、百騎兵さん。お帰りなさい。", note: （赤いカーテンと大きな浴槽のあるバスルーム）}
  - {id: L609, who: luckiny, text: "ボクですか？早くここに慣れたくていろいろ見て回ってるんです。"}
  - {id: L610, who: luckiny, text: "ここは、お風呂場ですかね。地元では水が貴重なので……こういうの初めて見ます。"}
  - {id: L611, who: marny, text: "あら、百騎兵ちゃんとお弟子ちゃん。こんなところで何をしているの？お風呂に入るの？", note: （マーニィが現れる）}
  - {id: L612, who: luckiny, text: "いえ。そもそもボク、水に入るの苦手ですし。", cut: ["09:52.86", "09:59.07"]}
  - {id: L613, who: marny, text: "まあでも何事も経験よ。案外気に入っちゃうかもしれないわよ？"}
  - {id: L614, who: marny, text: "そうだ、今度リカちゃんと一緒に入ったら？"}
  - {id: L615, who: luckiny, text: "え！？だ、ダメですよ！そんなの"}
  - {id: L616, who: marny, text: "なんで？魔女の師弟が背中の流しっこって、そんなに変かしら？"}
  - {id: L617, who: luckiny, text: "い、いえ！そういうことではなく……。", note: （性別は曖昧なまま、D-029）}
  - {id: L618, who: luckiny, text: "す、すみません。ボクは失礼します！"}
  - {id: L619, who: marny, text: "逃げ出したくなるほど風呂が嫌いなのかしら……？"}
  - {id: L620, who: marny, text: "あ、そっか。リカちゃんの風呂って沼の水を使うから、お弟子ちゃんじゃむしろ危ないか。", note: （護符の伏線の続き）}
  - {id: L621, who: marny, text: "そりゃ入れないわね。忘れてたわ。"}
  - {id: L622, who: marny, text: "さて、しかし百騎兵ちゃんがお風呂で寛ぐのは、まだまだ先になりそうね。やることをやらなくちゃね。"}
  # --- A20 拠点・余命（全部残す） ---
  - {id: L623, who: bisco, text: "おい、メタリカのやつ、全然部屋から出てくる気配がないぞ……。", note: （拠点。ビスコとアルレッキーノ）, cut: ["12:07.53", "12:11.90"]}
  - {id: L624, who: bisco, text: "食事も摂っていないみたいだし心配だな……。", cut: ["12:13.34", "12:17.24"]}
  - {id: L625, who: arlecchino, text: "リカ様を処刑する為にここにおられるビスコ様に、ご心配までおかけするとは申し訳ございません。"}
  - {id: L626, who: bisco, text: "あ、ああ！別に忘れたわけじゃないぞ！", cut: ["12:29.27", "12:33.34"]}
  - {id: L627, who: bisco, text: "今だって、あいつの魔女としての行いを見極めているところなんだからな！"}
  - {id: L628, who: bisco, text: "それより、百騎兵の方はどうなんだ？順調なのか？", cut: ["12:42.60", "12:46.89"]}
  - {id: L629, who: arlecchino, text: "先ほど、マーニィ様にお聞きしたところそろそろ森の庭園にたどり着かれるようです。はい。"}
  - {id: L630, who: bisco, text: "そうか……。会えるといいな、森の魔女殿に……。", cut: ["12:58.27", "13:03.29"]}
  - {id: L631, who: arlecchino, text: "そうでございますね。リカ様にはお時間がございませんし。"}
  - {id: L632, who: bisco, text: "ん？それは、どういう……。", cut: ["13:10.61", "13:15.17"]}
  - {id: L633, who: arlecchino, text: "ビスコ様にはまだ申し上げておりませんでしたか。"}
  - {id: L634, who: arlecchino, text: "リカ様のお命は、もう長くはないのです。", cut: ["13:20.11", "13:25.75"]}
  - {id: L635, who: bisco, text: "そ、そうなのか……？理由は何なんだ？病か？"}
  - {id: L636, who: arlecchino, text: "それは存じ上げておりませぬ。リカ様がそう予知されているとしか……。"}
  - {id: L637, who: arlecchino, text: "詳しいことはリカ様ご自身もおわかりになっていないご様子で。"}
  - {id: L638, who: bisco, text: "わからない、だと……？"}
  # --- A21 森の庭園とヘッカヘンネの隠し森 ---
  - {id: L639, who: forest-servant, text: "いらっしゃいませ、お客様。どういったご用件でしょうか？", note: （森の中の円形の石造りの台座）}
  - {id: L640, who: forest-servant, text: "マーリカ様なら、残念ながらここにはいらっしゃいません。"}
  - {id: L641, who: forest-servant, text: "おかげで、魔力が足らず、植物がうまく育ちません。", cut: ["14:10.46", "14:14.24"]}
  - {id: L642, who: forest-servant, text: "ですが、ワタクシ達は、森の魔女マーリカ様の育んだ命をお守りするのが使命。"}
  - {id: L643, who: forest-servant, text: "手入れを怠るわけにはまいりませんので、これにて失礼いたします。はい。", cut: ["14:24.81", "14:30.40"]}
  - {id: L644, who: marny, text: "これは、ちょっとした驚きだわね。", note: （マーニィから通信）, cut: ["14:39.84", "14:43.12"]}
  - {id: L645, who: marny, text: "アルレッキーノちゃんがこっちにもいるわよ。", note: （テキストは「当然、アルレッキーノちゃんはこっちにいるわよ」。声に合わせた）}
  - {id: L646, who: marny, text: "ふーん、なるほどね。", cut: ["14:50.01", "14:52.35"]}
  - {id: L647, who: marny, text: "さあ、ここに森の魔女ちゃんはいないみたいだから予定通り、奥へ進みましょう。"}
  - {id: L648, who: marny, text: "あ、そうそう百騎兵ちゃん！", use: false}
  - {id: L649, who: marny, text: "アルレッキーノちゃんが言うには“ヘッカヘンネの隠し森”は殆ど人の手が入っていない森らしいから気をつけてね。", use: false}
  - {id: L650, who: marny, text: "きっと、強い魔獣が沢山いるわよ！ウフフ、なんだかワクワクしてきたわ。さあさあ！前進あるのみよ！", use: false}
  - {id: L651, who: marny, text: "んあ？こんなところに駅……？", note: （線路が伸びる円形の駅）, cut: ["16:36.03", "16:38.03"]}
  - {id: L652, who: marny, text: "うーん、これって……。", cut: ["16:51.82", "16:56.08"]}
  - {id: L653, who: marny, text: "まあ、あとで調べてみましょう。百騎兵ちゃん。", cut: ["16:58.10", "17:01.73"]}
  - {id: L654, who: marny, text: "今は、先を急ぐわよ！", use: false}
  - {id: L655, who: marika-mouse, text: "チュー。チューチュ！", note: （切り株や花がある森の開けた場所。ネズミ）, cut: ["17:19.95", "17:22.01"]}
  - {id: L656, who: marny, text: "もしかして、それが森の魔女ちゃん……？"}
  - {id: L657, who: marika-mouse, text: "チュー！チューチュチュー！", cut: ["17:37.50", "17:39.60"]}
  - {id: L658, who: marika-mouse, text: "チュ？", cut: ["17:47.35", "17:48.05"]}
  - {id: L659, who: marika-mouse, text: "チュ！？チュ、チュチュー！チューチュチュー！！", note: （鳥にさらわれる）, cut: ["17:48.05", "17:51.30"]}
  - {id: L660, who: marny, text: "それは……？", note: （紙切れが落ちている）, cut: ["18:06.70", "18:08.08"]}
  - {id: L661, who: marny, text: "百騎兵ちゃん！その紙切れを拾って一度、こっちに戻ってきてもらうってもいいかしら？"}
  # --- A22 拠点・切符 ---
  - {id: L662, who: bisco, text: "おお！百騎兵、帰ってきたのか！森の魔女殿にはお会いできたのか？", cut: ["18:40.52", "18:45.70"]}
  - {id: L663, who: arlecchino, text: "マーニィ様が言われるにはマーリカ様と思われるネズミは鳥にさらわれたと……。"}
  - {id: L664, who: luckiny, text: "そ、そんな……！じゃあ、夜会にはもう……。", cut: ["18:55.94", "19:00.80"]}
  - {id: L665, who: marny, text: "まあまあ、とりあえず、さっき拾った紙切れをみせてよ。", note: （マーニィが現れる）}
  - {id: L666, who: bisco, text: "ん？なんだこれは……切符じゃないのか？"}
  - {id: L667, who: marny, text: "もしやとは思ったけど、やっぱりそうね。"}
  - {id: L668, who: arlecchino, text: "夜会行き列車の切符のようでございますね。"}
  - {id: L669, who: bisco, text: "その切符があれば夜会へ行けるってことか？"}
  - {id: L670, who: luckiny, text: "やったじゃないですか！すごい！百騎兵さん、すごいですよ！"}
  - {id: L671, who: luckiny, text: "早速魔女様にお伝えしましょう。", note: （ルッキーニィが一度画面の外へ駆けていき、すぐ戻る）, cut: ["19:45.30", "19:47.60"]}
  - {id: L672, who: marny, text: "あらあら。", cut: ["19:50.95", "19:52.70"]}
  - {id: L673, who: bisco, text: "……なんか、浮き沈みの激しいヤツだな。", cut: ["19:52.59", "19:58.17"]}
  - {id: L674, who: marny, text: "あら、なかなか面白い子じゃない。", cut: ["20:00.45", "20:03.57"]}
  - {id: L675, who: arlecchino, text: "これで気を持ち直していただければよいのですが。"}
  - {id: L676, who: marny, text: "あら？早かったわね。どうだったのかしら？", cut: ["20:16.98", "20:19.87"]}
  - {id: L677, who: luckiny, text: "部屋にはおられるようで返事はありませんでした……。", cut: ["20:21.44", "20:25.64"]}
  - {id: L678, who: bisco, text: "はぁ……やっぱりそうだよな。"}
  - {id: L679, who: bisco, text: "いまさらあの魔女達がいる夜会にはいけないよな……。", cut: ["20:32.98", "20:37.52"]}
  - {id: L680, who: marny, text: "どちらにしても、森の魔女ちゃんがくれた切符をリカちゃんが素直に受け取るとも思えなかったけどね。"}
  - {id: L681, who: arlecchino, text: "左様でございますね……。", use: false}
  - {id: L682, who: luckiny, text: "あ、あの……ちなみに魔女様は森の魔女様とどのようなご関係なんですか？", cut: ["20:54.53", "21:00.91"]}
  - {id: L683, who: bisco, text: "そうだな、教えてくれよ。私も詳しいことは知らないんだ。", use: false}
  - {id: L684, who: marny, text: "とにかく、リカちゃんは森の魔女ちゃんを恨みに恨んでいることは間違いないわね。", cut: ["21:09.91", "21:16.53"]}
  - {id: L685, who: bisco, text: "どうせ、逆恨みかなんかなんだろう？", cut: ["21:19.26", "21:22.13"]}
  - {id: L686, who: marny, text: "それが、そうでもないんだけど……。まあ、詳しいところはおいおいかしら。", cut: ["21:24.14", "21:31.49"]}
  - {id: L687, who: marny, text: "さあ、どうやってリカちゃんをひっぱりだしましょっか。", cut: ["21:33.31", "21:37.39"]}
  - {id: L688, who: bisco, text: "……それなんだがちょっといいか？", cut: ["21:39.97", "21:42.28"]}
  - {id: L689, who: bisco, text: "切符があるなら私達が夜会に乗り込む、というわけにはいかないだろうか？"}
  - {id: L690, who: marny, text: "んあ？どうしたのビスコちゃん？呪いを掛けた魔女を探すつもり？"}
  - {id: L691, who: marny, text: "それとも……殴りこみでもするのかしら？"}
  - {id: L692, who: bisco, text: "そ、そんなんじゃない！……メタリカじゃあるまいし。"}
  - {id: L693, who: bisco, text: "要は、夜会の魔女たちにメタリカを認めさせればいいわけだろ。"}
  - {id: L694, who: marny, text: "んー、つまり締め上げて屈服させるってことでいいの？", note: （表では削る側。次の L695 の「交渉」の受けなので残した）}
  - {id: L695, who: bisco, text: "はぁ……なんでお前はそういう方向に考えるんだよ。そうじゃなくてだな……その、交渉とかはできないかなと……。", cut: ["22:27.01", "22:36.53"]}
  - {id: L696, who: bisco, text: "夜会の魔女に認めてさえもらえれば、正式に夜会に呼んでもらえるようになるはずだ。", cut: ["22:38.84", "22:44.69"]}
  - {id: L697, who: marny, text: "うーん。“あまあま”ね、ビスコちゃん。まるで、お伽の国のお姫様だわ。", note: （伏線。ビスコはアマタイアの王女）, cut: ["22:49.51", "22:55.06"]}
  - {id: L698, who: bisco, text: "そ、そうか……。やっぱりダメかな……。"}
  - {id: L699, who: marny, text: "でも、どうかしらね？魔女ってプライド高くて新参者には冷たいわよ。", use: false}
  - {id: L700, who: marny, text: "あなたが行って主張したくらいで認めてもらえるかしら？", use: false}
  - {id: L701, who: bisco, text: "で、でも、やってみればもしかしたら……。"}
  - {id: L702, who: marny, text: "……。まあ、それもそうね。どうせ今のままじゃ、何も進展しないわけだし。", cut: ["23:27.54", "23:33.52"]}
  - {id: L703, who: luckiny, text: "そ、それで、誰が行くんですか？切符は二人まで乗れるみたいですけど。"}
  - {id: L704, who: marny, text: "そりゃあ、百騎兵ちゃんでしょ。戦闘力的な意味でも。", cut: ["23:47.28", "23:51.23"]}
  - {id: L705, who: bisco, text: "戦うことが前提なんだな。", cut: ["23:53.40", "23:55.81"]}
  - {id: L706, who: marny, text: "ウフフ、敵の本拠地に乗り込むんだから、それくらいの用心はしなきゃダメよ。穏便にいくかどうかは別問題", use: false}
  - {id: L707, who: marny, text: "それに、ピラーがあれば咲かせることだってできるわけだし。なにかとね。", use: false}
  - {id: L708, who: luckiny, text: "それで、あと一人はどうするんです？", cut: ["24:17.14", "24:20.50"]}
  - {id: L709, who: marny, text: "すごく行きたそうな顔してるわよ。でも、今回はビスコちゃんが行った方がよさそうね。"}
  - {id: L710, who: luckiny, text: "そ、そうですよね……。", cut: ["24:33.14", "24:35.60"]}
  - {id: L711, who: bisco, text: "ところで、この切符はどうやって使うんだ？"}
  - {id: L712, who: arlecchino, text: "ワタクシが聞き及んだ限りでは、夜会行きの“夜光列車”が出る駅があるとか……ないとか……。"}
  - {id: L713, who: marny, text: "ウフフ、心配無用よ。怪しげな駅は、既にみつけてあるわ！", cut: ["24:53.45", "24:59.69"]}
  - {id: L714, who: marny, text: "百騎兵ちゃん、覚えているわね？“ヘッカヘンネの隠し森”にあった駅よ？"}
  - {id: L715, who: bisco, text: "それじゃあ、百騎兵。お前は先に行っていてくれ。", cut: ["25:09.15", "25:12.54"]}
  - {id: L716, who: bisco, text: "私も準備してから直ぐに向かうよ。", cut: ["25:14.43", "25:16.87"]}
  - {id: L717, who: marny, text: "まあ、女の子は色々と身だしなみとか、気をつかうものよ。察してあげなさい、百騎兵ちゃん。", use: false}
