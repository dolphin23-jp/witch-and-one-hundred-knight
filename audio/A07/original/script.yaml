# A07 井戸と地下の戦い（場面の選別 10・11、D-059）。原作音源パート17 の 21:50〜23:50。戦闘は台詞なし（パート17 の終わりの戦闘の BGM・効果音を使う）
scene: A07
source: {part: 17, start: "21:50", vocals: "声とBGMの分離/パート17/パート17_声.mp3"}
lines:
  - {id: L206, who: metallica, text: "おい……その井戸……臭うぞ。"}
  - {id: L207, who: metallica, text: "なるほどな。ピラーは地上にあるとは限らないってことか。"}
  - {id: L208, who: metallica, text: "キヒヒ、存在しないピラー、おとなしくなった砂食み……。すべてが繋がったな！"}
  - {id: L209, who: metallica, text: "百騎兵、目指すものはその中だ！"}
  - {id: L210, who: metallica, text: "闇の深遠から覗くその瞳……串刺しにしてやれ！"}
  - {id: L211, who: metallica, text: "飛び込め！百騎兵！", note: （百騎兵は、迷わず井戸に飛び込んだ）}
  - {id: L212, who: metallica, text: "キヒヒ、やはり地下空洞か。間違いない、ここからピラーの気配を感じるぞ……。"}
  - {id: L213, who: metallica, text: "そして……あいつの気配もな！"}
  - {id: L214, who: metallica, text: "キヒヒッ！来た来た！ピラーの守護者になったばかりのデカブツが！"}
  - {id: L215, who: metallica, text: "こいつ、食物連鎖の頂点にでもたったつもりか？"}
  - {id: L216, who: metallica, text: "さあ、百騎兵！この虫ケラに味あわせてやれ！絶対的搾取の恐怖をな！"}
