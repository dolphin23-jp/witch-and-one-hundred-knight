# A09〜A12（夜会編の回1）の台詞 L270〜L343。原作音源パート18 の 09:20〜22:30（D-045）
# 原作テキストは Drive「mj100 5-6」の「では帰るぞ、百騎兵」の後（魔女邸の夜〜「テタラにおもむき問題があれば排除しておくんだ」）。場面の分け方は Living Spec「夜会編 場面の選別（案）」（D-064）。
#   A09 魔女邸・帰らない二人と師匠の心得（選別 1・2）: L270〜L288
#   A10 マーリカの森・スケアコッコ（選別 3・4。4 は声なしの見せ場）: L289〜L302
#   A11 伝言とセント・ドルチェ（選別 5・6）: L303〜L327
#   A12 魔女邸・感謝（選別 7）: L328〜L343
# 切り出しは 1 回で A09〜A12 の全部を行う（A10〜A12 の original は A09 への symlink。A08b と同じ）。
# use: false は選別で削った台詞（切り出しは位置合わせのためにすべて行い、シーンでは使わない）。
# 原作テキストの誤字は、音声（書き起こし）に合わせて直した: L273「許しもな野タレ死んで」→「許しもなくのたれ死んで」
# 7 の「首を蹴るギャグ」は D-046 で入れない。代わりにアルレッキーノがにらまれて退散する形（台詞の追加はしない）なので、蹴られたときの声 L338 は use: false
# cut（2026-10-31）: 分離した声に効果音が漏れていて、音量だけでは台詞の後ろが長くなり（最大50秒）、続く台詞の境目もずれたため、
#   tools/refine_cuts.py（短い範囲を脚本の文を手がかりに書き起こし直す。一致が高いもの）の提案と、語の時刻・音量から手で決めた範囲を入れた。
#   確信が持てず、ユーザーに聞いてほしい台詞: L285（短い「あん？」）、L291・L318・L333・L334・L337（見直しが不調で、元の範囲のまま）、L292/L293 と L298 の境目
# テキストの「リカ様」「ワタシ」「オマエ」の表記は原作テキストのまま
scene: A09
source: {part: 18, start: "09:20", vocals: "声とBGMの分離/パート18/パート18_声.mp3"}
lines:
  # --- A09 魔女邸・帰らない二人と師匠の心得 ---
  - {id: L270, who: metallica, text: "あん？あいつらまだ戻っていないのか？", note: （魔女邸、夜）, cut: ["09:27.20", "09:34.40"]}
  - {id: L271, who: metallica, text: "まあ、まだ焦ることもないか。明日の朝には手に入れてくるだろ。"}
  - {id: L272, who: metallica, text: "遅いっ！！！あのふたり、まだ戻らんのか！", note: （翌朝）, cut: ["10:02.65", "10:07.35"]}
  - {id: L273, who: metallica, text: "まさかワタシの許しもなくのたれ死んでるんじゃないだろうな……？", use: false}
  - {id: L274, who: metallica, text: "まったく、何をやっているんだ。早いところ護符を作らねばならんのに……。", note: （護符は A15 の伏線）}
  - {id: L275, who: metallica, text: "おい、百騎兵。あいつらの様子を見てこい！"}
  - {id: L276, who: metallica, text: "まずは、アルレッキーノからだ。"}
  - {id: L277, who: metallica, text: "ちっ！あいつ、自信満々で出て行ったくせに一体何をしているんだ。", use: false}
  - {id: L278, who: metallica, text: "向かった先は、ゲロクソオンナの森のはずだ。すぐに見つかるだろう。"}
  - {id: L279, who: metallica, text: "犬コロはヴァレンティーヌ領のどこにいるかわからんからな。", use: false}
  - {id: L280, who: metallica, text: "オマエがアルレッキーノを捜している間に、ダウジング・ペンデュラムで居場所を割り出しておく。", cut: ["10:53.45", "10:59.35"]}
  - {id: L281, who: metallica, text: "さあ、わかったらさっさと行くんだ！", cut: ["11:01.70", "11:05.45"]}
  - {id: L282, who: metallica, text: "……何々。師匠として必要なものは何よりも人徳、だと？", note: （魔女邸、メタリカの寝室。メタリカは何かの本を熱心に読んでいる）}
  - {id: L283, who: metallica, text: "フン、ならばワタシは適任だな。ワタシほどの人徳を持ったすばらしい魔女など他にいるまい！"}
  - {id: L284, who: metallica, text: "他には……それに見合うだけの実力……。ふむ、これも余裕だな。あとは……", cut: ["11:43.20", "11:49.85"]}
  - {id: L285, who: metallica, text: "あん？", note: （メタリカの鉄拳が百騎兵の脳天を直撃する。兜があるのに、ナゼか痛い）, cut: ["11:50.00", "11:50.85"]}
  - {id: L286, who: metallica, text: "おい！オマエ、ノックくらいしろ！あと、寝室に黙って入ってくるんじゃない！"}
  - {id: L287, who: metallica, text: "まったく、オマエには社会常識というものがないのか。もっと人徳のあるこのワタシを見習え！"}
  - {id: L288, who: metallica, text: "ほら、ワタシは忙しいんだ。行った、行った！", cut: ["12:23.80", "12:28.00"]}
  # --- A10 マーリカの森・スケアコッコ ---
  - {id: L289, who: arlecchino, text: "おや、百騎兵様。これは丁度良いところにいらっしゃいました。お伝えしたいことがございます。", note: （探索、マーリカの森）, cut: ["13:17.30", "13:24.75"]}
  - {id: L290, who: arlecchino, text: "ワタクシが調査したところによると“尾の先がだるいニワトリ”とは、そもそも狩人達の隠語でございました。"}
  - {id: L291, who: arlecchino, text: "実際は“スケアコッコ”というレアな魔獣のことらしく、どうやらこの森にいるらしいという所までは突き止めたのですが……。"}
  - {id: L292, who: arlecchino, text: "これが、なかなかどうして探しても探してもみつかりませぬ。", cut: ["13:45.30", "13:50.45"]}
  - {id: L293, who: arlecchino, text: "そこでワタクシ、早々にギブアップしてお昼寝……いえ、どうしたものかと思案していたところです。", cut: ["13:51.85", "13:59.20"]}
  - {id: L294, who: metallica, text: "昼寝だと？はぁ……あきれてものが言えんとはこのことだ、このグータラ執事が。", note: （メタリカの通信）, cut: ["14:00.95", "14:10.85"]}
  - {id: L295, who: metallica, text: "帰ったらお仕置きだ！……と、言いたいところだが今日のところは大目に見てやる。", use: false}
  - {id: L296, who: metallica, text: "あとは百騎兵にやらせた方が早い。とりあえず、アルレッキーノお前は戻って来い。"}
  - {id: L297, who: arlecchino, text: "かしこまりました。では、百騎兵様。あとは、お願いいたします。", cut: ["14:28.10", "14:33.70"]}
  - {id: L298, who: metallica, text: "さて、百騎兵。“スケアコッコ”を代わりに探すのは当然、オマエの役目だ。", cut: ["14:43.30", "14:49.25"]}
  - {id: L299, who: metallica, text: "魔獣の捕獲は、アルレッキーノには荷が重過ぎるだろうが、オマエならさしたる苦労もないはずだからな。", use: false}
  - {id: L300, who: metallica, text: "先日、オマエに授けた捕獲用戦術トーチカを使うんだ。"}
  - {id: L301, who: metallica, text: "獲物を殺さない程度に十分に痛めつけてから、トーチカで捕獲するだけだ。キヒヒ、簡単だろ？"}
  - {id: L302, who: metallica, text: "さあ、もたもたしている時間はないぞ！さっさと捕まえてくるんだ！"}
  # --- A11 伝言とセント・ドルチェ ---
  - {id: L303, who: arlecchino, text: "おお！良いタイミングでございます百騎兵様。リカ様からの伝言がございます……が。", note: （スケアコッコを捕獲して魔女邸に帰還）, cut: ["15:50.65", "15:57.85"]}
  - {id: L304, who: arlecchino, text: "“百騎兵！その前にスケアコッコを出せ！”"}
  - {id: L305, who: arlecchino, text: "と、リカ様からのご通達でございます。“スケアコッコ”はお持ちでしょうか？", note: （百騎兵が渡す）}
  - {id: L306, who: arlecchino, text: "ありがとうございます。百騎兵様。これで夜会に行くのに必要な品のひとつが手に入りました。"}
  - {id: L307, who: arlecchino, text: "それでは百騎兵様。伝言の続きを申し上げます。", cut: ["16:29.10", "16:33.20"]}
  - {id: L308, who: arlecchino, text: "現在、ビスコ様はヴァレンティーヌ領のセント・ドルチェにおられるとのことでそちらに向かうように……とのことです。"}
  - {id: L309, who: arlecchino, text: "あと、現在リカ様は何やら怪しげな……いえ、素晴らしい魔法の道具を作っておられるようで……。", note: （A15 の護符の伏線）}
  - {id: L310, who: arlecchino, text: "キヒヒ！邪魔をしたら、あつあつの鍋に放り込んでやる！……とのことです。リカ様のお部屋には近づかれませんよう。"}
  - {id: L311, who: arlecchino, text: "それでは、いってらっしゃいませ。", cut: ["17:05.00", "17:07.35"]}
  - {id: L312, who: bisco, text: "百騎兵！いいところにきてくれた！", note: （探索、ヴァレンティーヌ領のビスコの元へ）, cut: ["17:58.00", "18:01.45"]}
  - {id: L313, who: bisco, text: "私一人じゃどうにもならず困っていたところなんだ。", cut: ["18:02.55", "18:06.60"]}
  - {id: L314, who: bisco, text: "“ヒゲが１３本あるネコ”……情報は掴んだのだがもう手に入らないかもしれないんだ。", cut: ["18:07.25", "18:16.95"]}
  - {id: L315, who: bisco, text: "華の大公爵ヴァレンティーヌが“ヒゲが１３本あるネコ”を飼っていたという噂なんだが……"}
  - {id: L316, who: bisco, text: "その猫は、とうの昔に死んでしまっているらしいんだよ……。"}
  - {id: L317, who: bisco, text: "他にいないか一晩中さがしているんだが手がかり無しだ……。", use: false}
  - {id: L318, who: bisco, text: "本当にすまない……。メタリカに何と言えばいいのか……。"}
  - {id: L319, who: metallica, text: "キヒヒ……、よくやったぞビスコ。その情報で充分だ！", note: （幻影のメタリカが出てくる）, cut: ["18:47.90", "18:53.35"]}
  - {id: L320, who: metallica, text: "ワタシに考えがある。一度、帰って来い。"}
  - {id: L321, who: bisco, text: "そうか。……わかった。", cut: ["18:59.65", "19:02.55"]}
  - {id: L322, who: bisco, text: "……あまり役に立てなくて、すまない。それじゃあ、とりあえず帰るとするよ。"}
  - {id: L323, who: metallica, text: "キヒヒ、探しているネコは、錬金術で作ればいい。", cut: ["19:12.55", "19:17.65"]}
  - {id: L324, who: metallica, text: "その猫が、実在していたとわかれば再生することなぞ、造作もないからな。"}
  - {id: L325, who: metallica, text: "まあ、ホムンクルス技術の一種といったところだ。", use: false}
  - {id: L326, who: metallica, text: "オマエが戻るまでに宝箱に入れて、沼においておいてやるよ。キヒヒ、逃げ出すと困るからな。", use: false}
  - {id: L327, who: metallica, text: "さあ、わかったらさっさと帰って来い！", cut: ["19:40.90", "19:44.10"]}
  # --- A12 魔女邸・感謝 ---
  - {id: L328, who: bisco, text: "すまない、みんな……。迷惑をかけた……。", note: （魔女邸に戻る、猫を入手）, cut: ["20:19.35", "20:23.25"]}
  - {id: L329, who: metallica, text: "キヒヒ、いいところに戻ってきたな。次は砂漠の村……テッタラだ。"}
  - {id: L330, who: metallica, text: "この手で指定の三品を揃え、ヴァルプルギスの夜会に出向くぞ！"}
  - {id: L331, who: metallica, text: "ワタシの晴れ舞台を、お前達にも見せてやろうじゃないか！", cut: ["20:40.40", "20:44.40"]}
  - {id: L332, who: bisco, text: "はあ……今度は砂漠の村か……。少し休ませてくれ。", cut: ["20:46.80", "20:53.30"]}
  - {id: L333, who: metallica, text: "キヒヒ、心配するな、すぐに出発ではない。ワタシはもう少しだけ準備があるからな。"}
  - {id: L334, who: metallica, text: "お前達は少し休んでいろ。あとで私が運んでやる。", cut: ["21:06.00", "21:08.30"]}
  - {id: L335, who: bisco, text: "なんだよ。お前にしちゃ優しいな。", cut: ["21:11.60", "21:15.35"]}
  - {id: L336, who: arlecchino, text: "それは勘違いというものです、ビスコ様。リカ様はあくまで、ご自身の晴れ舞台を自慢したくてウキウキされているだけでございます。"}
  - {id: L337, who: metallica, text: "あん？", note: （原作ではここでアルレッキーノの首を蹴り飛ばす。入れない。にらまれて退散する）}
  - {id: L338, who: arlecchino, text: "く、首はいけませぬ〜！！", use: false}
  - {id: L339, who: metallica, text: "ちっ、あの出来損ないめ。ワタシだって、感謝くらいするんだ。", cut: ["21:52.55", "21:57.40"]}
  - {id: L340, who: bisco, text: "えっ？お前が私たちに感謝しているのか？", cut: ["21:59.50", "22:03.10"]}
  - {id: L341, who: metallica, text: "お前もいちいちうるさいな！疲れているんだろ！さっさと休んでおけ！", cut: ["22:06.60", "22:12.85"]}
  - {id: L342, who: metallica, text: "しかし百騎兵！疲れ知らずのお前はここに留まる理由が無いぞ。", cut: ["22:17.85", "22:24.80"]}
  - {id: L343, who: metallica, text: "テッタラにおもむき問題があれば排除しておくんだ。キヒヒ！", cut: ["22:26.90", "22:32.00"]}
# 次の台詞（L344〜）は A13（テッタラ・幻影が見える。パート18 の 22:30 の「あいつじゃないか」から）。
