# 6章後半 回2（A23〜A27、夜光列車と魔女都）の台詞 L718〜L923。原作音源パート21 の 01:28〜終わり と パート22 の 00:00〜18:12（D-045）
# 原作テキストは Drive「mj100 5-6」の【駅のような場所】〜議事塔ブロッケントゥルムの門前（「魔女様を確認しました。開門いたします。」）。
#   場面の分け方と残す・削るは Living Spec「6章後半 準備（案）」（長さは表のとおり約27分、2026-11-02 ユーザー判断）。
#   A23 駅・夜光列車: L718〜L768（鐘で列車が現れる、乗せる・乗せないの口論は半分、ビスコを叩き伏せる、戦いは台詞なし、委任状、放り投げて乗せる）
#   A24 異空間・閉じた門: L769〜L808（「何も殴ることはないじゃないか」、門で急停車、流刑者の場所、三日もたずに発狂、門を閉めるのは魔女だけ。
#       切符を盗んだと疑うくだりと、列車前に戻る場面は削る）
#   A25 盲いた魔女と追憶の園: L809〜L878（核。列車の催促の合いの手は半分に）
#   A26 列車に飛び乗る・魔女都: L879〜L907（車中の「もうろくババア」などは削る。「七日七晩…今晩が最後」「冬のニワトリが三回鳴くまで」は A32 の仕掛け）
#   A27 道中のテレッサ・議事塔の門: L908〜L923
# use: false は選別で削った台詞（切り出しは位置合わせのためにすべて行い、シーンでは使わない）。前ふり・受けの台詞は残す側に倒した（docs/previs_checklist.md 2）。
# revival: true は原作テキストになく、Revival の音声だけにある台詞（文字は書き起こしから起こした。聞いて確かめる）:
#   L798〜L803 拠点のルッキーニィとマーニィ（パート21 16:38〜17:52。メタリカが閉じこもったままだと念を押す。A30 の伏線）。2026-11-05、ユーザー「台詞、声の分け方はあなたに任せます」で
#     Claude が入れると決め、幕間 A24b（夜の魔女邸の2階の廊下）にした
#   L917〜L920 テレッサがビスコを連れ去った後（パート22 15:13〜15:58）
# 話し手: lionel＝ライオネル13世（獅子の機関車）、godora・godol＝ゴードーラ・ゴードール（両側の山羊）、snaker＝スネーカー（最後尾の蛇）、
#   blind-witch＝盲いた魔女（テキストでは「？？？」「年老いた魔女」とも）、guide-witch＝魔女都・案内魔女、gate＝魔法生物の門。
#   ゴードーラとゴードールの声の分け方は切り出しのときに確かめる。
# 音声は tmp/src のパート21・22 の声（Drive「声とBGMの分離/パート21・22/」）を、パート21 の 01:28.0 から終わりまでと、パート22 の頭から 18:12.0 までをつないだもの。
#   cut の時刻は、つないだ音声の中の位置（パート21 の時刻 − 88秒。パート22 の時刻 ＋ 1462.18秒。つないだ音声は 2554.2秒）。
scene: A23
source: {parts: [21, 22], part21_from: "01:28.0", part22_to: "18:12.0", vocals: "声とBGMの分離/パート21/パート21_声.mp3 ＋ 声とBGMの分離/パート22/パート22_声.mp3"}
lines:
  # --- A23 駅・夜光列車 ---
  - {id: L718, who: bisco, text: "はぁはぁ……。さすがに早いな百騎兵。これでも、私も急いだんだが……", note: （隠し森の円形の駅。百騎兵が先に着いて待っている）}
  - {id: L719, who: bisco, text: "うん？これが駅……か？", cut: ["00:09.40", "00:14.42"]}
  - {id: L720, who: bisco, text: "線路も途中で途切れているし、廃線じゃないのか……"}
  - {id: L721, who: bisco, text: "……うん？なんだその鐘。", cut: ["00:23.40", "00:26.69"]}
  - {id: L722, who: bisco, text: "あはは、それを鳴らしたら、列車が来たりしてな。", cut: ["00:28.37", "00:34.30"]}
  - {id: L723, who: bisco, text: "な、なんだ！？何も無い空間から……列車！？", note: （百騎兵が鐘を鳴らすと、何もない空間から列車が現れる）}
  - {id: L724, who: lionel, text: "がおおおお〜ん！！ヴァルプルギスの夜会行き夜光列車、ただいま到着ですぞい！"}
  - {id: L725, who: godora, text: "“ヘッカヘンネの隠し森”なんて久しぶりだね。こんな場所にお呼びとはどんな物好きな魔女様かな？"}
  - {id: L726, who: godol, text: "あれ……？魔女様なんて、どこにもいないよ。"}
  - {id: L727, who: snaker, text: "いるのは妙なチビと犬人間だけじゃねーか！どーゆーこった！どーゆーこった！", cut: ["01:22.11", "01:27.46"]}
  - {id: L728, who: bisco, text: "な……！？", use: false}
  - {id: L729, who: lionel, text: "なんじゃい。もしかして、鐘を鳴らしたのはそこのおチビちゃんかいの？"}
  - {id: L730, who: godora, text: "本当に切符は持ってるの？偽物なんじゃないの！？"}
  - {id: L731, who: godora, text: "切符は本物だ！魔女様じゃないのに！？", note: （百騎兵が山羊の口の中に切符を入れる）}
  - {id: L732, who: snaker, text: "こんなワケのわからねーヤツら乗せるのかよ！乗せられねえよ！勘弁してくれよ！"}
  - {id: L733, who: marny, text: "なんか、雲行きがちょっとあやしいわね。でも、こういうのが嫌いじゃない私がいるわ。……血が騒ぐとでもいうのかしら？", note: （通信）, use: false}
  - {id: L734, who: snaker, text: "おい、どうすんだい？もういいから、こいつら食っちまおうぜ。食えんのかよ！丸呑みならいけるぜ！"}
  - {id: L735, who: bisco, text: "お、おい……百騎兵。ど、どうする……。", cut: ["02:31.90", "02:36.44"]}
  - {id: L736, who: marny, text: "百騎兵ちゃん、あなたが殺されることはないと思うけどビスコちゃんが心配ね。とりあえず、ビスコちゃんを避難させてあげて。わかるわね？", note: （通信）}
  - {id: L737, who: bisco, text: "な、なんだ？マーニィから何か連絡があったのか？"}
  - {id: L738, who: bisco, text: "ぐはぁ……！！な、なにを……う、うぐぐ……うう。", note: （百騎兵がビスコを叩き伏せる。ギャグ）}
  - {id: L739, who: lionel, text: "こんなことは初めてなんじゃが……。さあ、どうしたもんかの。"}
  - {id: L740, who: godora, text: "魔女様以外の奴を乗せて、列車の中で焼け死なれるのはゴメンだよ。"}
  - {id: L741, who: godol, text: "そうそう。それに契約違反だよ。乗せていいのは魔女様だけだ。"}
  - {id: L742, who: marny, text: "魔女との契約？", note: （通信）, use: false}
  - {id: L743, who: snaker, text: "もう、考えるのは面倒臭えよ！食っちまってから考えようぜ。それがいい！そうしようぜ。", use: false}
  - {id: L744, who: lionel, text: "まあ、そういうことじゃ。残念じゃが、乗せるわけにはいかんのう。おとなしく帰ってもらうぞい！", note: （戦い。台詞なしで約30秒）, cut: ["03:52.08", "04:01.60"]}
  - {id: L745, who: lionel, text: "こ、こいつは驚いた！", note: （戦いの後、列車の前）}
  - {id: L746, who: godora, text: "ボクたちが……負けた？"}
  - {id: L747, who: godol, text: "にわかには信じがたいね。", use: false}
  - {id: L748, who: snaker, text: "ちっ！負けたからには仕方ねー。認めてやるよ。運んでやるからさっさと乗りな！さっさと乗れよ！"}
  - {id: L749, who: lionel, text: "おい、蛇助！おヌシ、いい加減なことを言うでないわ。魔女様との契約、忘れたわけではあるまいな。"}
  - {id: L750, who: snaker, text: "お、おう……。", use: false}
  - {id: L751, who: godol, text: "せめて、魔女様の委任状でもあればね。"}
  - {id: L752, who: lionel, text: "おチビちゃん、おヌシが強いのはわかったがやはり魔女様以外を乗せるのはのう。ワシらも契約があるで、負けたからといってほいほい乗せてやるわけにはいかんのじゃ。すまんが、勘弁するぞい！", use: false}
  - {id: L753, who: arlecchino, text: "お待ちください。夜光列車様。", note: （アルレッキーノが現れる）}
  - {id: L754, who: arlecchino, text: "こちら、リカ様……いえ、魔女様の委任状にございます。"}
  - {id: L755, who: marny, text: "んあ？アルレッキーノちゃん、いつの間に、そんなところに", note: （通信）, cut: ["07:05.38", "07:10.89"]}
  - {id: L756, who: arlecchino, text: "ワタクシ、たまたまこの近くまでフィールドワークに来ておりましたゆえ。"}
  - {id: L757, who: arlecchino, text: "ご存知のとおり、リカ様は沼の外には出られませんので、ワタクシ、普段からこのようなものを預かっておるのです。"}
  - {id: L758, who: arlecchino, text: "こちら、ムダに枚数だけ……いえ、予備はたくさんございます。どうぞお使いくださいませ。"}
  - {id: L759, who: godora, text: "ちょっと食べさせてもらうよ。", note: （百騎兵が山羊の口の中に委任状を入れる）}
  - {id: L760, who: godora, text: "もしゃもしゃ……。うん？こりゃ非公式なものだね。"}
  - {id: L761, who: godol, text: "そうだね。魔女の印は本物だけど正式な魔女のものじゃない。"}
  - {id: L762, who: snaker, text: "けっ。切符は本物、魔女の印も本物。オレたちゃ、負けた。乗せるしかねえだろ？しょうがねえだろ？"}
  - {id: L763, who: lionel, text: "ふむ、まあ魔女の印が本物なら契約違反にはならんじゃろ……。いいじゃろう、乗せてやろう！", cut: ["08:23.21", "08:33.90"]}
  - {id: L764, who: godora, text: "フフフ。線路がないのが心配かい？心配しなくても大丈夫。ボクたちは異空間を走る夜光列車。線路なんかなくても大丈夫さ。"}
  - {id: L765, who: godol, text: "あっという間に、遥か彼方！ヴァルプルギスの夜会会場まで運んであげるよ。"}
  - {id: L766, who: lionel, text: "さあ、それじゃあそろそろ出発するぞい！ご乗車の方はお急ぎを！", note: （百騎兵がビスコを持ち上げて列車へ放り投げる）}
  - {id: L767, who: lionel, text: "がおおおお〜ん！！ヴァルプルギスの夜会行き夜光列車、ただいま出発ですぞい！", cut: ["09:20.90", "09:30.65"]}
  - {id: L768, who: arlecchino, text: "百騎兵様、ビスコ様。それでは、行ってらっしゃいませ。リカ様の件、よろしくお願いいたします。"}
  # --- A24 異空間・閉じた門 ---
  - {id: L769, who: bisco, text: "う……いたた……！……うん？ここはどこだ？列車に乗れたのか……？", note: （列車の座席のような真っ暗な空間）, cut: ["10:25.14", "10:31.74"]}
  - {id: L770, who: lionel, text: "ただいま、ウーランデキム山脈の裏を通過したぞい！"}
  - {id: L771, who: godora, text: "どうだい？異空間は？といっても、キミには何もみえないか。"}
  - {id: L772, who: bisco, text: "真っ暗でよくわからないが、順調のようだな……。"}
  - {id: L773, who: bisco, text: "それにしても……い、痛たたた……。百騎兵……お前の私に対する扱いは抗議に値するぞ……。何も、殴ることはないじゃないか……。"}
  - {id: L774, who: bisco, text: "まあ、善意でやってくれたのだろうが…………というか善意だったと信じたいところだ……。", cut: ["11:10.87", "11:22.17"]}
  - {id: L775, who: bisco, text: "な、なんだ！？"}
  - {id: L776, who: godol, text: "門だ！門が閉まってる！", note: （異空間の線路上で、大きな門の前に急停車）, cut: ["11:29.13", "11:31.71"]}
  - {id: L777, who: lionel, text: "もう少し、気がつくのが遅かったら、激突して潰れていたぞい。"}
  - {id: L778, who: snaker, text: "おいおい！こりゃどういうこった。門が閉まっているなんてありえるか？ありえねーだろ？なあ！なあ？"}
  - {id: L779, who: bisco, text: "ここは……。"}
  - {id: L780, who: godol, text: "ここは異空間さ。まあ、異次元世界と呼ぶ人もいるけどね。特に、ここは異空間のなかでも流刑者が送り込まれるような場所。魔女様だってめったに立ち入らない。"}
  - {id: L781, who: godora, text: "そうだよ、普段なら立ち往生するような場所じゃないんだ。でも、こんなことできるのは、魔女様しかいないよ！"}
  - {id: L782, who: snaker, text: "ケッケッケ！お前たちのせいだな！チビどもめ！チビと人間め！お前らが、魔女を怒らせたんだろう！そうだろう？むかつく顔しているもんな！", use: false}
  - {id: L783, who: bisco, text: "な！？どうして私たちが……！", use: false}
  - {id: L784, who: godora, text: "魔女様との契約で運行するボクたちが止められる理由なんてないよ。問題があるなら乗客に決まってるじゃないか！どうせ魔女様の恨みでも買っているんじゃないの？まさか、さっきの切符……盗んだんじゃないだろうね？", use: false}
  - {id: L785, who: bisco, text: "ぬ、盗みだと！侮辱するな！", use: false}
  - {id: L786, who: snaker, text: "ちっ、面倒なことに巻き込みやがって！だからこいつらを乗せるのは嫌だったんだ！乗せるとか言ったか？嫌に決まっているじゃねーか。", use: false}
  - {id: L787, who: snaker, text: "そうだ！お前たち、さっさと門を開けてこい！開けられるもんならな！開けられっこねーよ！"}
  - {id: L788, who: bisco, text: "……門を開ければいいんだな？"}
  - {id: L789, who: lionel, text: "我々は、魔女様との契約により誠実なる運行を定められた夜光列車。引き返すことなどできんぞい！", use: false}
  - {id: L790, who: bisco, text: "……行こう、百騎兵。ここで止まっている暇はない。なんとか門を開けよう。"}
  - {id: L791, who: lionel, text: "お嬢さん。門を閉めることができるのは魔女様だけじゃ。そう遠くないところにいるはずだぞい。", cut: ["13:58.43", "14:09.59"]}
  - {id: L792, who: godol, text: "魔女様を捜し出して、門を開けてもらってきてよ。", use: false}
  - {id: L793, who: snaker, text: "ケッケッケ！魔女の狙いがお前らなら、命でも差し出せばいいんじゃねーか。", use: false}
  - {id: L794, who: godora, text: "ま、とにかく頑張ってね。急いで頼むよ。言い忘れていたけど、ここにはあまり長い時間いちゃダメだよ。魔女様ですらここの瘴気にあてられると三日ともたずに発狂する危険な場所さ。"}
  - {id: L795, who: snaker, text: "ケッケッケ！まあ、お前らがおっ死んでくれればそれでも門は開くだろうがな！開くか？", use: false}
  - {id: L796, who: godora, text: "あとは、くれぐれも魔女様を怒らせたりしないようにね", use: false}
  - {id: L797, who: bisco, text: "瘴気か……仕方がない。長居は出来ないようだし、するつもりもない。手分けして魔女を捜そう。それじゃあ、気をつけてな、百騎兵。", cut: ["14:58.21", "15:11.24"]}
  - {id: L798, who: luckiny, text: "百騎兵さんたち、もう夜会には着きましたかね……。", note: （拠点。Revival だけ）, revival: true}
  - {id: L799, who: marny, text: "それはどうかしら。夜行列車に乗ってからは、百騎兵ちゃんの様子が見えないのよ。リカちゃんなら見えるのかもしれないけど、私じゃこれが限界ね。", revival: true}
  - {id: L800, who: luckiny, text: "そうですか……。ところで、魔女様の様子はどうですか？", revival: true}
  - {id: L801, who: marny, text: "相変わらずみたいね。アルレッキーノちゃんの食事にも、リカちゃん呼ばわりにも返答なし。", revival: true}
  - {id: L802, who: luckiny, text: "そこまで塞ぎ込んでるだなんて……。", revival: true}
  - {id: L803, who: marny, text: "とにかく今は、百騎兵ちゃんとビスコちゃんに任せるしかないわね。", revival: true}
  - {id: L804, who: snaker, text: "おい、コラ、チビスケ！！まだ門が開いてねえだろうが！！開いてないよな？", note: （異空間の列車前。削る）, use: false}
  - {id: L805, who: godora, text: "残念だけど、この状態で戻ってこられても、運行することはできないんだよね。", use: false}
  - {id: L806, who: godol, text: "早いところ、魔女様を見つけて扉を開けてもらいなよ。", use: false}
  - {id: L807, who: lionel, text: "断っておくが、引き返すのは却下じゃぞい。わしらは進むことしか許されておらんでな。", use: false}
  - {id: L808, who: snaker, text: "そういうわけだ。さっさと行ってきやがれ！行ってこいよ！", use: false}
  # --- A25 盲いた魔女と追憶の園 ---
  - {id: L809, who: blind-witch, text: "ヒッヒッヒ、なんだかよくわからないのが来たもんだねぇ。", note: （異空間の奥）, cut: ["18:06.54", "18:13.18"]}
  - {id: L810, who: blind-witch, text: "おやおや、自分からやってきておいてお前は誰だっ！……って顔してるねぇ。あたしかい？あたしは魔女さ！", cut: ["18:18.84", "18:31.90"]}
  - {id: L811, who: blind-witch, text: "あたしゃ目が見えないがあんたのことはよく見えるよ。ヒヒッ！", cut: ["18:32.86", "18:38.67"]}
  - {id: L812, who: blind-witch, text: "あんた、ただの魔法生物じゃないね？何もんだい？まあ、どうでもいいけどねぇ。ヒッヒッヒ。", cut: ["18:42.41", "18:55.55"]}
  - {id: L813, who: blind-witch, text: "おや？また怪しいのがやってくるねぇ。"}
  - {id: L814, who: bisco, text: "はぁはぁ……。魔女をみつけたんだな。すまない、道には迷うし、魔獣は強いわで、役には立てなかったな。"}
  - {id: L815, who: blind-witch, text: "おやおや、目の前の人間に挨拶も無しとは無礼な娘だねぇ。", cut: ["19:22.89", "19:31.64"]}
  - {id: L816, who: bisco, text: "……あ、その、申し遅れました。私は、ビスコール＝ドートリッシュ。アマタイアの騎士です。", cut: ["19:34.73", "19:42.61"]}
  - {id: L817, who: bisco, text: "こちらは沼の魔女、メタリカの使い魔にして伝説の悪魔と呼ばれる、百騎兵。"}
  - {id: L818, who: blind-witch, text: "ヒッヒッヒ、百騎兵だって？あたしの目が見えないからって、いい加減なことを言うんじゃないよ！"}
  - {id: L819, who: bisco, text: "そんな！父と母の名にかけて真実です。……たぶん。"}
  - {id: L820, who: bisco, text: "それより、魔女殿にお願いがあるのです……。"}
  - {id: L821, who: blind-witch, text: "みなまで言わずともわかっているよ。あんた達、門を開ける方法を探してるんだろ？"}
  - {id: L822, who: bisco, text: "……！？やはり……魔女殿が門を。", cut: ["20:29.94", "20:34.03"]}
  - {id: L823, who: bisco, text: "私たちは、わけあってヴァルプルギスの夜会に向かわなければなりません。急ぎ先に進みたいのです。門を開けてはいただけないでしょうか？"}
  - {id: L824, who: blind-witch, text: "イ〜ヒッヒッヒ！！たしかに、あの門を閉めたのはあたしさ。だけどね、開けることはできないよ。", cut: ["20:49.21", "21:04.64"]}
  - {id: L825, who: bisco, text: "な、何故です？"}
  - {id: L826, who: blind-witch, text: "ヒッヒッヒ、そんなことに理由なんてあるもんか。魔女ってのは意地悪をするのが仕事みたいなもんだからねぇ。諦めるんだね、ヒッヒッヒ！"}
  - {id: L827, who: bisco, text: "そんな……！"}
  - {id: L828, who: blind-witch, text: "でも、わずかなチャンスをやるのもまた魔女の仕事さ。どうだい？やるかい？やらないのかい？", cut: ["21:35.99", "21:49.77"]}
  - {id: L829, who: bisco, text: "（くっ……。こんなことをしている場合ではないのに。）……そ、それで、私達に何をしろと言うのですか？"}
  - {id: L830, who: blind-witch, text: "ヒッヒッヒ、そんなに難しいことじゃないさね。ちょっとした“お使い”だよ。“翠ノ実”を二つばかりとってきておくれな。どうだい？たいしたことじゃないだろう？"}
  - {id: L831, who: bisco, text: "“翠ノ実”？……しかし、ここから出られないのでは？"}
  - {id: L832, who: blind-witch, text: "ヒッヒッヒ！なあに、“翠ノ実”くらいここにだってあるさ。バカにしてもらっちゃ困るね！", cut: ["22:33.19", "22:43.08"]}
  - {id: L833, who: bisco, text: "いえ、そういうつもりでは……。ただ、私たちには時間が……。"}
  - {id: L834, who: blind-witch, text: "こんな老いぼれ魔女の、小さな願いすらきけないってのかい！！なにが騎士だい！薄情な娘だよ！"}
  - {id: L835, who: bisco, text: "う……。わ、わかりました。", cut: ["23:07.34", "23:10.30"]}
  - {id: L836, who: blind-witch, text: "ヒッヒッヒ、わかりゃいいのさ。ここには色々と仕掛けがあってね。自由に動けないのさ。まあ、仕掛けはあたしが作ったんだけどね！ヒ〜ッヒッヒ！！"}
  - {id: L837, who: blind-witch, text: "さあ、わかったらさっさとおゆき！！そうしたら門を開けてやろうさね。ヒ〜ッヒッヒ！！", cut: ["23:33.40", "23:48.60"]}
  - {id: L838, who: bisco, text: "……仕方がない。他に方法もなさそうだし、話も通じなさそうだ……。それじゃあ、また手分けして“翠ノ実”を探そうか。"}
  - {id: L839, who: bisco, text: "でも、今回は期待してくれ、百騎兵。フフン、私の嗅覚が役に立つときがきたようだな。", cut: ["24:05.12", "24:12.45"]}
  - {id: L840, who: bisco, text: "よいしょっと……。", note: （追憶の園。ここからパート22）}
  - {id: L841, who: bisco, text: "それにしても、いい香りだ。これを砂糖漬けにしたらと思うと……。じゅる……あっ、いかんいかん。", cut: ["24:41.61", "24:51.08"]}
  - {id: L842, who: bisco, text: "おっ、百騎兵！", cut: ["24:56.41", "24:58.53"]}
  - {id: L843, who: bisco, text: "フフン、どうだ。私が先にみつけたぞ。今回は、この鼻のおかげでなんの障害も無く簡単にみつかったぞ。"}
  - {id: L844, who: bisco, text: "どうだ、私だって少しは役に立てるんだ。私のことを見直してもいいんだぞ？"}
  - {id: L845, who: bisco, text: "……。お前とは、ちゃんと話が通じているのかときどき不安になるよ……。"}
  - {id: L846, who: bisco, text: "とりあえず、この“翠ノ実”はお前に渡しておく。さあ、早いところ戻ろうか。"}
  - {id: L847, who: snaker, text: "おい！あいつらまだかよ！早くしろってんだ！！急げってんだ！", use: false}
  - {id: L848, who: snaker, text: "運行時間をまもれないと何がおこるかわからねんだ！どうなっても知らねぇぞ！知ったこっちゃねえ！", use: false}
  - {id: L849, who: bisco, text: "まずいな。急いだ方がよさそうだ。", use: false}
  - {id: L850, who: blind-witch, text: "ふんふん！おお！こいつは良い香りだ！！ちゃんと見つけてきたようだね！"}
  - {id: L851, who: blind-witch, text: "さあ早く！とっとと“翠ノ実”をこっちによこしな！"}
  - {id: L852, who: blind-witch, text: "ヒッヒッヒ！この香りだよ！！この甘酸っぱい感じ！ふひぃ〜〜！！た、たまんないねぇ……。", cut: ["26:51.71", "27:05.72"]}
  - {id: L853, who: bisco, text: "い、いかがですか？魔女殿。これで、門を開けていただけないでしょうか。"}
  - {id: L854, who: blind-witch, text: "ヒ〜ヒッヒッヒ！いいだろう。開けてやろうじゃないか。", note: （魔女が指を鳴らすと、どこかで地響き）, cut: ["27:17.44", "27:23.38"]}
  - {id: L855, who: godora, text: "わーい！門が開いたぞー！"}
  - {id: L856, who: godol, text: "彼ら、魔女様を説得できたのかな？", use: false}
  - {id: L857, who: snaker, text: "でも、あいつら戻ってこねぇぞ。どこほっつき歩いてるんだ？道草食いやがって！道草って食えるのか？", use: false}
  - {id: L858, who: lionel, text: "がおぉぉぉぉぉ〜ん！！時間厳守だぞい。遅れたら置いていくだけだぞい。"}
  - {id: L859, who: bisco, text: "なっ！なんだと！！急いで戻るぞ、百騎兵！"}
  - {id: L860, who: blind-witch, text: "……。ちょいとお待ちな！娘さんや。ちょいと待っておくれ……。"}
  - {id: L861, who: bisco, text: "……？魔女殿。急ぎますので……。", cut: ["28:28.89", "28:31.98"]}
  - {id: L862, who: blind-witch, text: "イ〜ヒッヒッヒ。ちょっとした立ち話じゃないかい。老い先短い老人の話は聞くもんだよ。", cut: ["28:33.36", "28:44.02"]}
  - {id: L863, who: blind-witch, text: "なあに、ひとつ忠告さね。", cut: ["28:45.31", "28:49.38"]}
  - {id: L864, who: blind-witch, text: "本当に大事なものは、いつだって、その手の中にあるんだ。"}
  - {id: L865, who: blind-witch, text: "それを心に留めておけば色んなことが見えてくるはずだよ。", cut: ["28:58.56", "29:05.92"]}
  - {id: L866, who: bisco, text: "……それは、どういう。"}
  - {id: L867, who: blind-witch, text: "そのまんまの意味さ。イ〜ヒッヒッヒ！ああ、それからもうひとつ。"}
  - {id: L868, who: bisco, text: "……まだあるのですか。"}
  - {id: L869, who: blind-witch, text: "ヒッヒッヒ、そう言いなさんな。それに、これで最後さ。こっちにきて、ちょっとあたしの手をにぎっておくれな。"}
  - {id: L870, who: bisco, text: "これは……。", note: （手を握ると翠ノ実を手渡される）}
  - {id: L871, who: blind-witch, text: "ヒッヒッヒ、さあ、それを持っておきな。そいつは砂糖漬けにすると旨いんだ。", cut: ["29:59.80", "30:08.68"]}
  - {id: L872, who: bisco, text: "ありがとうございます、魔女殿……。感謝を。"}
  - {id: L873, who: snaker, text: "もう、これ以上待っても無駄だろ？あいつら、きっと魔女に食われたんだよ。帰ってこねぇよ、もういこうぜ！出発しようぜ！"}
  - {id: L874, who: lionel, text: "……。よしわかった！がおぉぉぉぉぉぉ〜ん！！出発進行だぞい！", cut: ["30:29.40", "30:38.48"]}
  - {id: L875, who: bisco, text: "なっ！あいつら！魔女殿！それでは、私はこれで！"}
  - {id: L876, who: blind-witch, text: "……。もう、いっちまったかい？見えないねえ、何も見えないさ。"}
  - {id: L877, who: blind-witch, text: "何も見えない……、……いや、違う、すべて視える。懐かしい……。", cut: ["31:18.41", "31:35.54"]}
  - {id: L878, who: blind-witch, text: "ああ……！今日だった。全部、見えていた。だから……私は……。", cut: ["31:49.63", "32:02.64"]}
  # --- A26 列車に飛び乗る・魔女都 ---
  - {id: L879, who: bisco, text: "待て！乗せてくれ！", note: （走り出した列車に追いつく）, cut: ["32:39.13", "32:41.80"]}
  - {id: L880, who: lionel, text: "おお！おぬしも生きておったのか！", cut: ["32:48.41", "32:51.54"]}
  - {id: L881, who: snaker, text: "まったく、しぶといヤツだぜ。面倒くせぇ！本当に面倒くせぇさっさと飛び乗りやがれ！", cut: ["32:52.84", "32:59.88"]}
  - {id: L882, who: godora, text: "生きてたんなら、もう少し早く戻ってきて欲しかったよね。", use: false}
  - {id: L883, who: godol, text: "さっさと乗らないと、今度こそ置いていくよ。", cut: ["33:06.94", "33:10.11"]}
  - {id: L884, who: lionel, text: "それじゃ、今度こそ出発するぞい！次は、ヴァルプルギスじゃ！がおぉぉぉぉぉ〜ん！！", cut: ["33:18.36", "33:23.40"]}
  - {id: L885, who: snaker, text: "よく戻って来られたな。幸運なやつだ！運のいいやつらだ！", use: false}
  - {id: L886, who: godora, text: "生きて戻ってきたってことは、命が狙いじゃなかったんだね。", use: false}
  - {id: L887, who: godol, text: "魔女様は気まぐれだし、単なるイタズラだったのかな？", use: false}
  - {id: L888, who: snaker, text: "もうろくした魔女が、ボケをかましただけだろ。もうろくババア！もうろく魔女！一緒だぜ！", use: false}
  - {id: L889, who: lionel, text: "さあ、出るぞい！夜会の会場……“魔女都ヴァルプルギス”じゃ！", cut: ["34:08.65", "34:15.00"]}
  - {id: L890, who: bisco, text: "なんて美しい……！これが、魔女の都……。まるで宝石のようだ……！", note: （魔女都ヴァルプルギスの全景）, cut: ["34:45.78", "34:54.10"]}
  - {id: L891, who: guide-witch, text: "ようこそ！魔女都ヴァルプルギスへ！", cut: ["35:07.62", "35:10.45"]}
  - {id: L892, who: guide-witch, text: "ここは世界中の魔女が訪れる魔女の都。歓迎しますわ。魔女様方。"}
  - {id: L893, who: snaker, text: "ケッケッケ！魔女様だってよ？乗客はできそこないの魔法生物と犬面の人間だけだったのに。", use: false}
  - {id: L894, who: bisco, text: "こんなところがあったのか……。ここはいったいどのあたりなんだ？"}
  - {id: L895, who: guide-witch, text: "あら、魔女都には初めていらっしゃるのね。", cut: ["35:42.29", "35:45.70"]}
  - {id: L896, who: guide-witch, text: "ここは、深遠なるどこかと、現世の狭間……とでもいったらいいのかしら。"}
  - {id: L897, who: guide-witch, text: "人が住まう世界とは別の、いうなれば世界の裏側のような場所でここには夜光列車でしかこれないの。"}
  - {id: L898, who: bisco, text: "この都で夜会が開かれているのか……？"}
  - {id: L899, who: guide-witch, text: "ほら、あそこに“塔”がみえるでしょう？あれが、議事塔ブロッケントゥルム。夜会の会場よ。", cut: ["36:14.36", "36:23.06"]}
  - {id: L900, who: guide-witch, text: "歴史あるこの都の中でも最も古くに建てられた、いわば、魔女の聖地みたいなものですわ。", use: false}
  - {id: L901, who: guide-witch, text: "夜会の開催は毎年七日七晩続くのだけれど今回の夜会は、今晩が最後。"}
  - {id: L902, who: guide-witch, text: "明朝……夜明けに冬のニワトリが三回鳴くまでだから、宴を楽しんでくださいな。", note: （A32 の仕掛け）, cut: ["36:49.24", "36:56.65"]}
  - {id: L903, who: bisco, text: "冬のニワトリが三回鳴く、か……", cut: ["37:02.84", "37:06.40"]}
  - {id: L904, who: lionel, text: "ヴァルプルギスの夜会会場、議事塔ブロッケントゥルム前に到着だぞい。お忘れ物のないようにの。"}
  - {id: L905, who: bisco, text: "ここか……なんか緊張してきたぞ。自分から言い出したとはいえ、メタリカより先に夜会に来ることになるとはな……。"}
  - {id: L906, who: bisco, text: "それで、ここからどう進んだらいいんだ？", use: false}
  - {id: L907, who: bisco, text: "……。まあ、いいか。百騎兵、用心していこう。"}
  # --- A27 道中のテレッサ・議事塔の門 ---
  - {id: L908, who: teressa, text: "フフフ、いました！いましたわ！なんて、ほうけた顔をしているのでしょう。これだから田舎者は嫌ですね。"}
  - {id: L909, who: teressa, text: "ようこそヴァルプルギスへ。お待ちしてましたわ。"}
  - {id: L910, who: bisco, text: "お、お前……！どうして……！？", cut: ["38:39.30", "38:41.46"]}
  - {id: L911, who: teressa, text: "もちろん、あなたたちに夜会の案内をするためですわ。"}
  - {id: L912, who: bisco, text: "何を、企んでいるんだ……？"}
  - {id: L913, who: teressa, text: "企みなんて人聞きが悪いですわね。今宵は夜会の最終日。騒ぎを起こすなどもってのほか。"}
  - {id: L914, who: teressa, text: "さあ、歴史ある魔女の都での年に一度の宴を存分に楽しみましょう。"}
  - {id: L915, who: bisco, text: "迷っていてもしかたない……か。覚悟を決めるか……！"}
  - {id: L916, who: teressa, text: "そうそう。素直が一番ですわ。", note: （閃光の魔法でビスコを連れ去る）}
  - {id: L917, who: bisco, text: "やはり騙して……！", note: （Revival だけ。書き起こしは「やはり騙して」）, revival: true, cut: ["39:45.16", "39:46.96"]}
  - {id: L918, who: teressa, text: "使い魔の方は捕まえ損ないましたが……ここは魔女が支配する魔女の都。使い魔ごときが好きにできるものは何一つありませんわ。", revival: true, cut: ["39:50.11", "40:06.98"]}
  - {id: L919, who: teressa, text: "放っておいても問題ありませんわね。", revival: true}
  - {id: L920, who: teressa, text: "少しおとなしくしていてもらいますわ。夜会が終わるまで。", revival: true}
  - {id: L921, who: gate, text: "ここは議事塔ブロッケントゥルム。ここには、魔女様方以外が立ち入ることはゆるされておりません。", note: （議事塔の門前。門に顔がある）}
  - {id: L922, who: gate, text: "どうぞ、お引取りを。", cut: ["42:19.97", "42:22.32"]}
  - {id: L923, who: gate, text: "魔女様を確認しました。開門いたします。"}
