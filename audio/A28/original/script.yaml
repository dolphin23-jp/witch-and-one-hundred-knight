  # --- A32 採決 ---
  - {id: L1100, who: metallica, text: "ニワトリがあと1回鳴く前に！夜会が終わる前に……。"}
  - {id: L1101, who: metallica, text: "お前たち三流魔女どもを皆殺しにしてやるぞ！！！"}
  - {id: L1102, who: bisco, text: "違う！待て、メタリカ！ニワトリは捕まえた！"}
  - {id: L1103, who: bisco, text: "これで、私が手を離すまでニワトリは鳴かない。夜会は終わらない！"}
  - {id: L1104, who: metallica, text: "キヒヒ。よくやったぞ、ビスコ！これでもう暫く楽しめる！", cut: ["27:22.83", "27:29.00"]}
  - {id: L1105, who: lily, text: "……っ！こ、殺されるのか……！！！", cut: ["27:32.56", "27:35.98"]}
  - {id: L1106, who: bisco, text: "だから違う！！待てと言ってるんだ、メタリカ！私は議長に話がある！"}
