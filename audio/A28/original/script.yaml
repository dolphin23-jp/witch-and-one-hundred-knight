  - {id: L1108, who: bisco, text: "議長……。ネザリア殿だったか……。私の提案を聞いてくれないか。"}
  - {id: L1109, who: bisco, text: "この夜会で、メタリカを……。メタリカを、正式な魔女として認めてほしいんだ！"}
  - {id: L1110, who: metallica, text: "な、なんだと……！キサマ、出すぎたマネをするなよ……！"}
  - {id: L1111, who: metallica, text: "こんな連中に認めてもらわなくともわたしは生まれながらの大魔女だぞ！"}
  - {id: L1112, who: bisco, text: "お前は黙ってろ！私が議長と話してるんだ！"}
  - {id: L1113, who: bisco, text: "見ての通り、メタリカは傍若無人なヤツだ……。だが、魔女としては申し分のない資質を持っているんじゃないのか？"}
  - {id: L1114, who: bisco, text: "だったら、正式に魔女として認めてやってもいいんじゃないか"}
  - {id: L1115, who: bisco, text: "そして、できれば今後は魔女として、夜会にも招待してもらえないだろうか？"}
  - {id: L1116, who: purple-peel, text: "……な、なんだって……こんだけ暴れておいて、夜会に参加させろだって！？"}
  - {id: L1117, who: bisco, text: "そ、それは……。たしかにメタリカはヒドイことをした。"}
  - {id: L1118, who: bisco, text: "しかし、あなた方もメタリカにヒドイことをしたじゃないか。"}
  - {id: L1119, who: bisco, text: "だから、お互い……。これまでのことは不問にするということで、どうだ？"}
  - {id: L1120, who: metallica, text: "ふ、不問だと！？わたしを愚弄したクズどもを許せるわけがないだろう！", cut: ["29:34.38", "29:41.37"]}
  - {id: L1121, who: bisco, text: "だからって全員殺すのか！？そんなことをして何になるんだ！お前だって、そんなことで気が済むのか！"}
  - {id: L1122, who: metallica, text: "……っ。い、いや、わたしの気は存分に晴れるぞ！それで十分だ！"}
  - {id: L1123, who: bisco, text: "ああもう！　いいからもう少しおとなしくしててくれ！"}
  - {id: L1124, who: bisco, text: "さあ、議長！　メタリカが再び暴れだす前に採決を！"}
  - {id: L1125, who: bisco, text: "早く！　ニワトリが３回鳴くまで、閉会できないんだろ！"}
  - {id: L1126, who: purple-peel, text: "ま、まさか……！ネザリア、本気で……！"}
  - {id: L1127, who: nezaria-staff, text: "その議案受け付けました。では、ここに採決をとりましょう。"}
  - {id: L1128, who: nezaria-staff, text: "”メタリカ”を魔女と認めることに賛成の者は、杖を打ち鳴らし、反対の者は、声をおあげください。"}
  - {id: L1129, who: bisco, text: "え！？　杖！？ええと……！", note: （ビスコはあたりを見回した後、自らの剣のつかを床に突き立て賛成の音を打ち鳴らす）}
  - {id: L1130, who: bisco, text: "私は賛成だ！"}
  - {id: L1131, who: nezaria-staff, text: "賛成、１……。"}
  - {id: L1132, who: purple-peel, text: "は、反対にきまっている！！これだけやったんだ、ただで済むと思うなよ！！"}
  - {id: L1133, who: nezaria-staff, text: "反対、１……。賛成１、反対１です。", cut: ["31:29.40", "31:35.21"]}
  - {id: L1134, who: purple-peel, text: "お、お前……！何を考えてるんだ！？", note: （ラビィが杖を打ち鳴らす）}
  - {id: L1135, who: rabi, text: "いや……、だって、こいつ面白れーじゃん", cut: ["31:46.10", "31:50.53"]}
  - {id: L1136, who: usamaru, text: "ははっ！ラビィちゃんは、メタリカと戦いたいだけなんだよね？", cut: ["31:53.25", "31:56.64"]}
  - {id: L1137, who: rabi, text: "へへっ、流石はウサマール先生！よくわかってんじゃん。", cut: ["31:59.50", "32:03.65"]}
  - {id: L1138, who: purple-peel, text: "くっ……あんた……後で再教育だ！覚えてなよ！！", cut: ["32:05.31", "32:10.49"]}
  - {id: L1139, who: nezaria-staff, text: "賛成、２。反対、１……。", cut: ["32:12.50", "32:16.25"]}
  - {id: L1140, who: metallica, text: "おい！　待て！ワタシは……。"}
  - {id: L1141, who: metallica, text: "ビスコっ！！！", note: （テキストではビスコ名義。L1140 の続き）}
  - {id: L1142, who: nezaria-staff, text: "賛成２、反対１。議案は可決されました。", cut: ["32:28.16", "32:33.09"]}
  - {id: L1143, who: nezaria-staff, text: "ヴァルプルギスに集いし魔女の下、メタリカを沼の魔女と認めます！"}
  - {id: L1144, who: nezaria-staff, text: "おめでとう……と言ってもいいのかしら。"}
