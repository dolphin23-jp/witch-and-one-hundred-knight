# 6章後半 回3（A28〜A32、議会場: 宴〜採決）の台詞 L924〜L1145。原作音源パート22 の 18:11.0〜終わり と パート23 の 00:00〜25:30（D-045）
# 原作テキストは Drive「mj100 5-6」の【議事塔の内部、魔女達の宴】〜「メタリカを沼の魔女と認めます！」「チュー！　チュチュー！」（6章の終わり）。
#   その次（パート24 の頭、魔女会報が届く魔女邸）からは7章（Living Spec「7章 準備（案）」）。
#   場面の分け方と残す・削るは Living Spec「6章後半 準備（案）」（長さは表のとおり、2026-11-02 ユーザー判断）。
#   A28 議会場・魔女たちの宴: L924〜L972（ビスコが目覚める、「かかりそこなってるじゃんか」（呪いの伏線）、ツギハギの魔女が本に息を吹きかけて百騎兵を倒す、
#       「魔女の本性なのか」、ベルダ「噂の姫君」「国王陛下もさぞやお嘆き」。ヴァレンティーヌの欠席のうわさは短く）
#   A29 議長と議題: L973〜L1022（霧と議長の登場、杖が話す、呼び出し（一人ずつ顔見せ）、ベルダの議題、リリーの怒り、「ただの茶番じゃないか」。
#       ラビィとパープルピールの口げんかは縮める）
#   A30 毒沼の乱入: L1023〜L1080（地震、「何が伝統だ」、「ありったけの沼をプレゼント」、夜光列車が毒沼を運んで突入して逃げる、テレッサが沼を浴びて倒れる、
#       メタリカの名乗り、ビスコの吹き出し笑い、「目覚めろっ！百騎兵！！！」「初めての共同作業」、小瓶を飲んで巨大化。パープルピールとリリーの作戦の相談は縮める）
#   A31 巨大メタリカとの戦い: L1081〜L1099（台詞なしの戦い約40秒の後、「踊れ！踊れぇっ！！！」（A16 のダンスの回収）、杖の「ちゅー……」、霧と朝の光、「……時間。」）
#   A32 採決: L1100〜L1145（台詞はほぼ全部。「ニワトリは捕まえた」〜可決〜マーリカのネズミ）
# use: false は選別で削った台詞（切り出しは位置合わせのためにすべて行い、シーンでは使わない）。前ふり・受けの台詞は残す側に倒した（docs/previs_checklist.md 2）。
# revival: true は原作テキストになく、Revival の音声だけにある台詞（文字は書き起こしから起こした。聞いて確かめる）。
#   L1081〜L1083（戦いの掛け声）は、戦いの最中の声が重なって1本ずつに分けられないので使わない（use: false）。戦いは台詞なしで見せる。
# cut: 範囲の見直し（tools/refine_cuts.py --auto、2026-11-05）の提案のうち一致の高いものを写した。笑い声・うなりが頭や尾にある台詞（L1047・L1057・L1072・L1092）は
#   それを残した。hear が付いたものは、書き起こしに出ない声（笑い・うめき・息をのむ声）で、範囲を声の大きさの山から手で決めた（聞いて確かめる）。
# 話し手の付け替え（原作テキストの表記が合わないもの。準備（案）の「既に設定画がある人物の注意」のとおり。声で確かめる）:
#   テレッサ名義の L931・L933〜L935・L943・L944 → ラビィ（テレッサは「〜ですわ」で話す。テキストのウサギ人形の受け「ひどいよ、ラビィちゃん！」から）
#   浅黒い魔女 → パープルピール、知的な魔女 → リリー、おとなしそうな魔女 → ベルダ、ツギハギの魔女 → リューベンス（夜会編と同じ割り当て）
#   パープルピール名義の L946「パープルピール！あなた弟子のしつけくらい」→ ベルダ（L945 の続き）
#   パープルピール名義の L1060「砂塵の……やるのか？」→ リリー（L1061「やろうかいリリアーヌ」の受け）
#   ビスコ名義の L1141「ビスコっ！！！」→ 巨大メタリカ（L1140 の続き。書き起こしも「おい待て私は…ビスコ」）
# 話し手: nezaria-staff＝議長の杖（ネザリアの杖。ネザリア本人はほとんど話さず、杖が話す）、rubens＝リューベンス（南瓜の魔女。テキストでは「ツギハギの魔女」）、
#   usamaru＝ウサギ人形（ラビィのそばに浮かぶ）、witches＝魔女たち、metallica は巨大になってからも metallica（テキストでは「巨大メタリカ」）。
#   列車（lionel・godora・godol・snaker）は A23 と同じ。
# 音声は tmp/src のパート22・23 の声（Drive「声とBGMの分離/パート22・23/」）を、パート22 の 18:11.0 から終わり（25:36.16）までと、
#   パート23 の頭から 25:30.0 までをつないだもの（tools/concat_parts.sh ではなく ffmpeg で直接つないだ。下の source）。
#   cut の時刻は、つないだ音声の中の位置（パート22 の時刻 − 1091.0秒。パート23 の時刻 ＋ 445.16秒。つないだ音声は 1975.16秒）。
scene: A28
source: {parts: [22, 23], part22_from: "18:11.0", part23_to: "25:30.0", offset_part23: 445.16,
         vocals: "声とBGMの分離/パート22/パート22_声.mp3 ＋ 声とBGMの分離/パート23/パート23_声.mp3"}
lines:
  # --- A28 議会場・魔女たちの宴 ---
  - {id: L924, who: witches, text: "おほほほほ……。あははははは……。", note: （議事塔の内部、魔女達の宴。ビスコは議場の床に寝かされている）, cut: ["00:18.10", "00:22.40"], hear: 範囲を手で決めた（声の大きさの山。聞いて確かめる）}
  - {id: L925, who: bisco, text: "……ん……。う、うぅ……。", cut: ["00:26.40", "00:28.20"], hear: 範囲を手で決めた（声の大きさの山。聞いて確かめる）}
  - {id: L926, who: bisco, text: "ここは……？どこだ……？", cut: ["00:31.75", "00:34.33"]}
  - {id: L927, who: teressa, text: "ふふふ、ここは伝統あるヴァルプルギスの議会場ですわ。", cut: ["00:38.54", "00:42.31"]}
  - {id: L928, who: purple-peel, text: "それにしても、沼の魔女などと名乗るから、どれほどの者かと思ったらあんな古臭いヘタレ魔女とはね。", note: （テキストでは「浅黒い魔女」）}
  - {id: L929, who: purple-peel, text: "最近、魔女狩りが活発なのは、あんないい加減な輩が横行しているせいじゃないのかい"}
  - {id: L930, who: rubens, text: "……これ、誰？", note: （テキストでは「ツギハギの魔女」）, cut: ["01:05.17", "01:08.05"]}
  - {id: L931, who: rabi, text: "そういや、こいつ沼の魔女の仲間なんだって？こんなところに連れてきてどうすんだよ", note: （テキストではテレッサ名義）}
  - {id: L932, who: usamaru, text: "ははっ！ひどいよ、ラビィちゃん！“こいつ”じゃなくて、この“犬”だよね？", cut: ["01:21.32", "01:27.08"]}
  - {id: L933, who: rabi, text: "なんかクセーと思ったら犬化の魔法がかかってんのか。", note: （テキストではテレッサ名義）}
  - {id: L934, who: rabi, text: "しかも、これ……アハハハハ！！！", note: （テキストではテレッサ名義）, cut: ["01:35.13", "01:38.45"]}
  - {id: L935, who: rabi, text: "かかりそこなってるじゃんか！……こんな魔法に失敗するなんて素人の仕事だな！", note: （テキストではテレッサ名義。呪いの伏線）}
  - {id: L936, who: berda, text: "相変わらず、下品なしゃべりね。ラビィ。", note: （テキストでは「おとなしそうな魔女」）}
  - {id: L937, who: berda, text: "大公爵がこられたら、またこっぴどくお仕置きされますわよ。"}
  - {id: L938, who: usamaru, text: "うっ……。", use: false}
  - {id: L939, who: lily, text: "まあ、ヴァレンティーヌ候は今日も欠席のようだけどね。", note: （テキストでは「知的な魔女」）, cut: ["02:03.47", "02:07.79"]}
  - {id: L940, who: rabi, text: "マジか！　ラッキー！あのクサレババアは目が怖ぇーんだよー。", cut: ["02:10.34", "02:15.59"]}
  - {id: L941, who: usamaru, text: "ははっ！大公爵なんて、いい加減死ねばいいのにね！　ラビィちゃん。", use: false}
  - {id: L942, who: purple-peel, text: "結局、今年は一日もこなかったね。", use: false}
  - {id: L943, who: rabi, text: "それより、泣き虫ベルダ！お前、弱えーくせにあたしに文句たれてんじゃねーよ！", note: （テキストではテレッサ名義）}
  - {id: L944, who: rabi, text: "死にてぇなら別だけどな。", note: （テキストではテレッサ名義）}
  - {id: L945, who: berda, text: "はぁ……。少し黙りなさい、ラビィ・ラルラ・ラー！！", cut: ["02:45.16", "02:49.78"]}
  - {id: L946, who: berda, text: "パープルピール！あなた弟子のしつけくらいなんとかしなさいな。", note: （テキストではパープルピール名義。L945 の続き）}
  - {id: L947, who: purple-peel, text: "なんだい？　そいつだってもう一人前の魔女さ。自分のケツは自分でふけるよ。"}
  - {id: L948, who: usamaru, text: "ははっ！なんせ、ラビィちゃんはここの誰よりも強い、天才魔女だもんね！", cut: ["03:07.46", "03:12.38"]}
  - {id: L949, who: purple-peel, text: "……あん？", note: （ウサギ人形の「ここの誰よりも強い」に皆が気色ばむ）}
  - {id: L950, who: rabi, text: "はっ……！", cut: ["03:17.45", "03:18.10"], hear: 範囲を手で決めた（声の大きさの山。聞いて確かめる）}
  - {id: L951, who: rubens, text: "そこ、とまりなさい。", note: （百騎兵が宴の場に入ってくる。リューベンスが本に息を吹きかけると、百騎兵の意識が遠のく）}
  - {id: L952, who: lily, text: "へえ、それがあの魔女の使い魔？噂だと、伝説の魔神、百騎兵って話だけど。"}
  - {id: L953, who: purple-peel, text: "これが百騎兵ねぇ……。眉唾もいいところじゃないかい？", cut: ["04:00.29", "04:06.55"]}
  - {id: L954, who: rabi, text: "ふーん……。", cut: ["04:09.20", "04:10.50"], hear: 範囲を手で決めた（声の大きさの山。聞いて確かめる）}
  - {id: L955, who: lily, text: "あまり強そうには見えないけどね。"}
  - {id: L956, who: rabi, text: "それで、結局肝心の沼の魔女はどうなったんだ？もう殺しちゃったのか？強いんならアタシと勝負させろよ！"}
  - {id: L957, who: usamaru, text: "ははっ！ラビィちゃんが勝負するまでもないよ。あのダンスみただろう？", cut: ["04:29.28", "04:33.98"]}
  - {id: L958, who: purple-peel, text: "まったく、あれは傑作だったねえ。あたしゃ数年分笑っちまったよ！"}
  - {id: L959, who: lily, text: "しかし、あんな“ただの山”から本当に、ここに来られると思っていたんだからね。無知とはときに、驚愕に値するよ。"}
  - {id: L960, who: berda, text: "沼の魔女……私達ですら、知らなかった魔女ですからね。"}
  - {id: L961, who: berda, text: "当然、魔女同士の繋がりもなかったのでしょう。"}
  - {id: L962, who: rabi, text: "まあ、あいつ性格悪そうだし絶対に友達とか仲間がいないタイプだぜ。"}
  - {id: L963, who: purple-peel, text: "ああいう勝手に魔女を名乗る輩を処分するのも、魔女会のつとめじゃないのかい？", note: （百騎兵は目が回り、倒れる）}
  - {id: L964, who: teressa, text: "ウフフ、いい気味ですわ。沼の魔女には私を馬鹿にした償いをたっぷりとして頂きますわ"}
  - {id: L965, who: bisco, text: "……なんだこれは……勝手なことばかり……！"}
  - {id: L966, who: bisco, text: "気に入らない者を騙し、傷つけ、笑いものにして……"}
  - {id: L967, who: bisco, text: "これが、こいつらの……魔女の本性なのか……！"}
  - {id: L968, who: berda, text: "あら？もしかしてあなた……。"}
  - {id: L969, who: berda, text: "あぁ、なるほど。あなたが噂の姫君ですか。"}
  - {id: L970, who: berda, text: "沼の魔女とやらにたぶらかされてこのようなところまで来られるとは……。"}
  - {id: L971, who: berda, text: "国王陛下もさぞやお嘆きのことでありましょう"}
  - {id: L972, who: bisco, text: "な、なんだと？……お前に何がわかる……。"}
  # --- A29 議長と議題 ---
  - {id: L973, who: lily, text: "おっと、静かに！……議長だ。", note: （屋内なのに、あたりを急に霧が包む）}
  - {id: L974, who: berda, text: "おほん。皆様、ご静粛に！議長がこられましたわ。", cut: ["07:09.95", "07:15.81"]}
  - {id: L975, who: bisco, text: "あれが、議長……？", cut: ["07:19.31", "07:21.29"]}
  - {id: L976, who: nezaria-staff, text: "今宵も集いし、麗しき魔女たる皆々様方、ご静粛に。", note: （議長の杖が話す）}
  - {id: L977, who: bisco, text: "なんだ、杖が喋っているのか？"}
  - {id: L978, who: nezaria-staff, text: "南方のナハトより砂塵の魔女パープルピール様。"}
  - {id: L979, who: nezaria-staff, text: "同じく、ナハトより焔の魔女ラビリ・ラルラ・ラー様。"}
  - {id: L980, who: rabi, text: "おい！　ネザリア！なんであたしが、二番目によばれんだよ！"}
  - {id: L981, who: purple-peel, text: "お前、ネザリア様に向かって！ったく、毎日言わせるんじゃないよ！いい加減、口を慎みな"}
  - {id: L982, who: berda, text: "一人前の魔女……でしたっけ。", use: false}
  - {id: L983, who: purple-peel, text: "あん？なんだい、文句でもあるのかい。灰汁の！", use: false}
  - {id: L984, who: berda, text: "いいえ、別に。", use: false}
  - {id: L985, who: rabi, text: "……？　なんだ、泣かねえんだ。最近、お前つまんねーよな、ベルダ。", use: false}
  - {id: L986, who: nezaria-staff, text: "ご静粛に！"}
  - {id: L987, who: nezaria-staff, text: "北と東の境目の氷原ツェーンライブより薄氷の魔女リリアーヌ様。", cut: ["08:45.03", "08:51.59"]}
  - {id: L988, who: lily, text: "いい加減、ボクのことはリリーって呼んでくれよ。"}
  - {id: L989, who: nezaria-staff, text: "アマタイア王国より灰汁の魔女ベルダ様。"}
  - {id: L990, who: nezaria-staff, text: "チンクエより、南瓜の魔女リューベンス様。"}
  - {id: L991, who: rubens, text: "はい。", cut: ["09:13.35", "09:13.95"], hear: 範囲を手で決めた（声の大きさの山。聞いて確かめる）}
  - {id: L992, who: nezaria-staff, text: "魔女の承認の儀のため召喚されし、ヤニの魔女テレッサ。"}
  - {id: L993, who: nezaria-staff, text: "証人としてアマタイア王国からビスコール＝ドートリッシュ様。", cut: ["09:22.68", "09:27.17"]}
  - {id: L994, who: bisco, text: "わ、私だって……？", cut: ["09:29.42", "09:31.76"]}
  - {id: L995, who: nezaria-staff, text: "そして、最後になりますが、議長はこの私、霧の魔女ネザリアが務めさせていただきます。"}
  - {id: L996, who: nezaria-staff, text: "なお、本日も華の大公爵ヴァレンティーヌ様、森の魔女マーリカ様は、ご欠席となっております。"}
  - {id: L997, who: nezaria-staff, text: "さて、夜会も７日目の本日が最終日。"}
  - {id: L998, who: nezaria-staff, text: "早速ではございますが、時間も押し迫ってまいりました。今回の夜会、最後の議題でございます。"}
  - {id: L999, who: berda, text: "それでは、灰汁の魔女ベルダが提案いたします。"}
  - {id: L1000, who: berda, text: "議題は、沼の魔女を”自称”する、メタリカという娘に関してです。"}
  - {id: L1001, who: bisco, text: "なに……！？", cut: ["10:24.63", "10:26.27"]}
  - {id: L1002, who: berda, text: "魔女として正式に修行もせず認められていない者が、魔女の術を公に使うことは重罪です。"}
  - {id: L1003, who: berda, text: "その上、森の魔女マーリカをその忌まわしい手にかけた罪。"}
  - {id: L1004, who: berda, text: "一刻も早くあの者に償わせるべきだと私は考えます。"}
  - {id: L1005, who: lily, text: "マ、マーリカ様を手に掛けただと！？", cut: ["10:58.49", "11:01.89"]}
  - {id: L1006, who: berda, text: "そこで、あの者から一切の”魔力”を剥奪することを提案いたします！"}
  - {id: L1007, who: bisco, text: "……な、なんだって！？"}
  - {id: L1008, who: berda, text: "奪った魔力で、都を照らすならばその灯火は、むこう百年、光り続けるでしょう！"}
  - {id: L1009, who: purple-peel, text: "あん？あの小娘がそれほどまでの魔力を持っているっていうのかい？にわかにゃ、信じられないね。"}
  - {id: L1010, who: rabi, text: "はい、はーい！アタシにそいつの処刑をさせてくれよ！"}
  - {id: L1011, who: rabi, text: "つーか、本当にそれほどの魔力を持つヤツならアタシ以外じゃ勝てねーだろ！"}
  - {id: L1012, who: lily, text: "マ、マーリカ様のような素晴らしい魔女を……。"}
  - {id: L1013, who: lily, text: "許さない……。そいつに、その報いをうけさせるんだ！"}
  - {id: L1014, who: nezaria-staff, text: "皆様、ご静粛に。ご意見は後ほど伺います。"}
  - {id: L1015, who: teressa, text: "（ウフフ……これで、沼の魔女も年貢の納め時ですわね。）", cut: ["12:18.35", "12:22.45"]}
  - {id: L1016, who: berda, text: "さあ、霧の魔女ことネザリア議長！"}
  - {id: L1017, who: berda, text: "本議題の採決を！沼の魔女の魔力剥奪を求刑します！"}
  - {id: L1018, who: bisco, text: "おい！森の魔女殿はまだ生きてるんだぞ。"}
  - {id: L1019, who: bisco, text: "これじゃあ、気に食わない相手を貶めるためのただの茶番じゃないか！"}
  - {id: L1020, who: nezaria-staff, text: "それでは、麗しき魔女の皆々様。この提案にご採決を！"}
  - {id: L1021, who: bisco, text: "こ、このままではメタリカが……！百騎兵は倒れたままだし……。"}
  - {id: L1022, who: bisco, text: "くそ！何か手は……！！", cut: ["13:12.04", "13:14.88"]}
  # --- A30 毒沼の乱入 ---
  - {id: L1023, who: berda, text: "じ、地震……？", note: （画面が激しく揺れる）, cut: ["13:19.41", "13:22.51"]}
