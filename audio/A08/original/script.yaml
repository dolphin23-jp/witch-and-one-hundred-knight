# 魔女の噂話（L234〜L240）は後の夜会の伏線なので縮めて残す（マーリカ・リリー・パープルピール・ネザリア。リアクションの L233・L236・L240 は削る）
scene: A08
source: {part: 18, start: "00:00", vocals: "声とBGMの分離/パート18/パート18_声.mp3"}
lines:
  - {id: L217, who: metallica, text: "キヒヒ！よくやった、百騎兵！珍品探しのついでとはいえ上出来だぞ！", note: （砂食みを倒し現れたピラーを開花。メタリカが転移してくる）}
  - {id: L218, who: metallica, text: "なかなかに、上物な沼じゃないか。どうだ？オマエにこの良さがわかるか？"}
  - {id: L219, who: luckiny, text: "す、すごい……！魔女だ！本物の魔女様だ！"}
  - {id: L220, who: luckiny, text: "（そ、それにしても……う、げぇぇ……。はぁぁ……す、凄い瘴気だ……！）"}
  - {id: L221, who: luckiny, text: "お、お願いです、魔女様……！"}
  - {id: L222, who: luckiny, text: "ボクを弟子にしてください！！"}
  - {id: L223, who: metallica, text: "あん？", cut: ["01:11.45", "01:12.25"]}
  - {id: L224, who: tito, text: "あの砂食みを倒してくださったそうで、本当にありがとうございます。", note: （家の前、メタリカも百騎兵とともにいる）}
  - {id: L225, who: tito, text: "我が子……ラナと村をお救いくださったのが、魔女様だったとは。"}
  - {id: L226, who: tito, text: "偉大なる沼の魔女様と従者様に心よりの感謝を……。"}
  - {id: L227, who: metallica, text: "ふん！ピラーのついでだ。大したことではない。"}
  - {id: L228, who: metallica, text: "沼はこの村の真下に広がっているしな。体調もすこぶる良好だ。"}
  - {id: L229, who: luckiny, text: "それはよかったです！では、早速ですが魔女様！弟子にしてください！"}
  - {id: L230, who: metallica, text: "あん？何が“では早速”だ？お前に構っている暇はない。"}
  - {id: L231, who: metallica, text: "ワタシは忙しいんだ。これから、ヴァルプルギスの夜会の準備があるからな。"}
  - {id: L232, who: luckiny, text: "ヴァ、ヴァルプルギスの！？スゴイ！本当に夜会って開かれてるんだ！"}
  - {id: L233, who: metallica, text: "あん？", use: false}
  - {id: L234, who: luckiny, text: "で、では森の賢者と呼ばれる魔女マーリカ様はご存知ですか？なんでも素晴らしい人格者だとか！"}
  - {id: L235, who: metallica, text: "キヒヒ、何が賢者マーリカ様だ。あんな奴、ただのゲロクソの性悪魔女だ。", cut: ["02:57.70", "03:06.40"]}
  - {id: L236, who: luckiny, text: "へえ！性悪！！意外と腹黒だったってことですか！？驚きです！！"}   # 2026-11-01 の見直しで戻した
  - {id: L237, who: luckiny, text: "じゃあ、薄氷のリリーは？噂通り氷のようにクールなんですか？魔女会の人気投票ナンバー１なんですか？"}
  - {id: L238, who: luckiny, text: "砂塵の魔女、パープルピールはすごく腕っ節が強いって本当ですか？魔法も使わず、素手で壁に穴をあけるとか！"}
  - {id: L239, who: luckiny, text: "あ、あと霧の魔女ネザリアってすごい無口で全然喋らないらしいですけど、議長なんですよね？"}
  - {id: L240, who: luckiny, text: "議長なのに無口って……いったいどうやって司会とかしてるんですか？全部ジェスチャーとかでやるのかなぁ……。"}   # 2026-11-01 の見直しで戻した
  - {id: L241, who: metallica, text: "お前……そんな三流魔女どもに興味があるのか？"}
  - {id: L242, who: luckiny, text: "そ！そんなことはありません！沼の魔女様が一番です！"}
  - {id: L243, who: luckiny, text: "命の恩人であるメタリカ様の弟子になりたいんです"}
  - {id: L244, who: metallica, text: "何度も言わせるな。ダメだダメだ！さっさと諦めろ。"}
  - {id: L245, who: tito, text: "よしなさい、ラナ！魔女様が困ってらっしゃるわ。"}
  - {id: L246, who: luckiny, text: "あ、諦めません！何でもしますから！どうか弟子にしてください！"}
  - {id: L247, who: metallica, text: "だから言ってるだろうが！お前にかまっている暇などない！"}
  - {id: L248, who: metallica, text: "さっさと“スズの音草”を手に入れてだな……。"}
  - {id: L249, who: luckiny, text: "そうだ！“スズの音草”は、ボクが探しておきます！"}
  - {id: L250, who: metallica, text: "なに？“スズの音草”があるのか？"}
  - {id: L251, who: tito, text: "ラナ！軽はずみなことを言ってはいけません！"}
  - {id: L252, who: metallica, text: "あん？どういうことだ？説明しろ。"}
  - {id: L253, who: tito, text: "申し訳ありません。“スズの音草”とは人々の感情に反応する不思議な草のことです。"}
  - {id: L254, who: tito, text: "昔はこの辺りに生えていたらしいのですが、今ではもう……。"}
  - {id: L255, who: tito, text: "……おそらく、砂食みのせいで、村が恐怖で満ちたせいです。"}
  - {id: L256, who: tito, text: "“スズの音草”は“種”から数時間で成長するらしいのですが、恐怖の感情を感じると一瞬にして枯れてしまうそうなんです。"}
  - {id: L257, who: metallica, text: "あん？ならば、砂食みがいなくなった今、すぐにでも生えるということじゃないのか？"}
  - {id: L258, who: tito, text: "残念ですが、砂食みは１匹ではありません。"}
  - {id: L259, who: tito, text: "大昔に、どこぞの魔女様がこのあたりの砂食みを根こそぎ退治してくれたとききましたが……。"}   # 2026-11-01 の見直しで戻した
  - {id: L260, who: tito, text: "今のように数が増えては、もうそれも困難でしょう。"}   # 2026-11-01 の見直しで戻した
  - {id: L261, who: tito, text: "蔓延する恐怖を完全に取り払わなければ、“スズの音草”が育つことはありません。しかし、恐怖を取り払う方法はないのです。"}
  - {id: L262, who: luckiny, text: "そんな！何か、方法はあるはずだよ！"}
  - {id: L263, who: luckiny, text: "お願いです、魔女様！必ず、“スズの音草”は探しておきますので、弟子にしてください！"}
  - {id: L264, who: luckiny, text: "偉大なる、沼の魔女様！お願いします！"}
  - {id: L265, who: metallica, text: "いいだろう。明日もう一度来たときに、もし、“スズの音草”を見つけていたら考えてやらんでもない。", note: （メタリカ「……。」の間のあと）}
  - {id: L266, who: metallica, text: "だが、とにかく今日はダメだ。少し、用事ができたからな。"}
  - {id: L267, who: luckiny, text: "ほ、本当ですか！ありがとうございます！"}
  - {id: L268, who: luckiny, text: "“スズの音草”は、必ず探しておきます！"}
  - {id: L269, who: metallica, text: "では帰るぞ、百騎兵。犬コロたちの様子が気になる。"}
