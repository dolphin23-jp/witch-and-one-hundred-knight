# A13（夜会編の回2の1つ目）の台詞 L344〜L385。原作音源パート18 の 22:30〜29:26（D-045）
# 原作テキストは Drive「mj100 5-6」の「テッタラにおもむき問題があれば排除しておくんだ」（L343）の後（百騎兵、砂漠の集落へ）〜
#   「もう、黄昏までさほど時間はないぞ！キリキリ進め！！」「ボクが魔女様の弟子に……！」。場面の分け方は Living Spec「夜会編 場面の選別（案）」（D-064）。
#   A13 テッタラ・弟子入りと白夜月（選別 8・9・10）: L344〜L385
# use: false は選別で削った台詞（切り出しは位置合わせのためにすべて行い、シーンでは使わない）。
#   8 は「沼の解放によって魔力が上がって…」を削る（選別表）。9・10 は残す（ほぼ全部）。
# メタリカの「……。」（声のない間）は台詞にしない（L370 の後、L372 の後の黙り）。
# cut（2026-11-01）: tools/refine_cuts.py（短い範囲を脚本の文を手がかりに書き起こし直す）の提案と、語の時刻・声の音量から手で決めた範囲。
#   L344・L345 は、Whisper が「ご視聴ありがとうございました」の幻聴で 23:47〜24:00 をまとめてしまったので、声の音量から手で決めた。
#   L369「……ほう？」は短く、書き起こしに出ないので音量から。L355・L367 は語の時刻から前後を詰めた。
#   確信が持てず、ユーザーに聞いてほしい台詞: L344（頭の「あん？」が入っているか）、L345、L369、L381（「ラ、」の頭）
# テキストの「ワタシ」「オマエ」の表記は原作テキストのまま
scene: A13
source: {part: 18, start: "22:30", vocals: "声とBGMの分離/パート18/パート18_声.mp3"}
lines:
  # --- 8 テッタラ・幻影が見える ---
  - {id: L344, who: metallica, text: "あん？あいつじゃないか。何をしているんだ？", note: （百騎兵、砂漠の集落へ。テッタラ村にルッキーニィがいる。メタリカは通信の声）, cut: ["23:48.30", "23:52.45"]}
  - {id: L345, who: luckiny, text: "あっ……あなたは……えっと、魔女様の……。", cut: ["23:55.80", "24:01.05"]}
  - {id: L346, who: luckiny, text: "あの……ま、魔女様は……ご一緒じゃないんですか？"}
  - {id: L347, who: metallica, text: "キヒヒ！ワタシならここにいるぞ。といっても、幻影じゃそいつにはみえんか。", note: （メタリカの幻影が出てくる）}
  - {id: L348, who: luckiny, text: "あっ！魔女様！！", cut: ["24:21.77", "24:23.40"]}
  - {id: L349, who: metallica, text: "あん？お前、このワタシの幻影が見えるのか？", cut: ["24:25.65", "24:30.75"]}
  - {id: L350, who: luckiny, text: "も、もちろんです！しっかりと魔女様がみえます！！"}
  - {id: L351, who: metallica, text: "ビスコといい、こいつといい一体どうなっているんだ……。", note: （A11 でビスコにも幻影が見えた。伏線）}
  - {id: L352, who: metallica, text: "もしかすると沼の解放によって、ワタシの魔力が上がっているのか……？いや、しかし……うーむ。", use: false}
  # --- 9 スズの音草・弟子入り ---
  - {id: L353, who: luckiny, text: "魔女様！お約束の、“スズの音草”をお持ちしました！"}
  - {id: L354, who: metallica, text: "おお！よくやったぞ！！羊飼い！"}
  - {id: L355, who: metallica, text: "キヒヒ！これで指定の珍品３つ！全てが揃ったぞ！", cut: ["25:10.45", "25:15.75"]}
  - {id: L356, who: metallica, text: "それにしても、よく咲いたな。お前の母親が、村人の恐怖がどうとかいってなかったか？"}
  - {id: L357, who: luckiny, text: "はい！でも、知恵を絞って咲かせる方法を思いついたんです！"}
  - {id: L358, who: luckiny, text: "魔女ドクトリンにもあるんですよね！？森羅万象の探求こそが魔女が魔女たりえるゆえんである！と！"}
  - {id: L359, who: metallica, text: "ほう、よく知っているな。お前なかなか見込みがあるぞ。"}
  - {id: L360, who: luckiny, text: "あの、それで……魔女様……。弟子入りのお話なんですけど……。", cut: ["25:49.52", "25:56.65"]}
  - {id: L361, who: metallica, text: "そうだったな……。まあ、ワタシは弟子はとらない主義だが……特別に許可しようじゃないか！"}
  - {id: L362, who: metallica, text: "お前の熱意と働きに免じて、沼の魔女メタリカの一番弟子にしてやる！"}
  - {id: L363, who: luckiny, text: "ほ、本当ですか！ありがとうございます！！！死ぬ気でがんばります！"}
  - {id: L364, who: metallica, text: "キヒヒ、安心しろ。死んでも蘇らせてやるさ。傀儡としてだがな！", cut: ["26:25.52", "26:32.50"]}
  - {id: L365, who: metallica, text: "ワタシの修行は厳しいぞ！当然住み込みで、雑用から家事全般がまずはお前の仕事だ。"}
  - {id: L366, who: metallica, text: "それと、母親や村の連中に別れをいっておきな。"}
  - {id: L367, who: metallica, text: "金輪際、二度と会えないかもしれないのだからな！キヒヒ！", cut: ["26:48.70", "26:54.52"]}
  - {id: L368, who: luckiny, text: "ええ、それは大丈夫です。もう別れはすませてきました。"}
  - {id: L369, who: metallica, text: "……ほう？", cut: ["27:04.15", "27:04.95"]}
  - {id: L370, who: luckiny, text: "母さんには愛想つかされ、村からも追放されちゃいました……。えへへ。", note: （メタリカは黙る）, cut: ["27:07.46", "27:14.30"]}
  - {id: L371, who: luckiny, text: "まあ、村から追放されたのは不注意で、砂食みを村に近づけちゃったからなんですけど……。"}
  - {id: L372, who: luckiny, text: "村は次の砂食みを恐れて完全に外界とのつながりを絶つようです。……もう、思い残すことはありません。"}
  - {id: L373, who: metallica, text: "いいだろう！弟子にしたからには、オスだろうがメスだろうがお前を一人前の魔女にしてやろう！！"}
  - {id: L374, who: metallica, text: "なにせ、ワタシは、大魔女だからな！"}
  - {id: L375, who: luckiny, text: "ボクが魔女様の弟子に……！憧れの、魔女に……！", cut: ["27:56.98", "28:02.55"]}
  # --- 10 白夜月・アズ・ブロッケン山へ ---
  - {id: L376, who: metallica, text: "さあ、ゆっくりしている暇はないぞ。"}
  - {id: L377, who: metallica, text: "夜会の開かれる場所、アズ・ブロッケン山の山頂へ向かう！"}
  - {id: L378, who: metallica, text: "キヒヒ、みろよ！満月の白夜月だ！", note: （夕方の空に白い満月）, cut: ["28:15.45", "28:20.45"]}
  - {id: L379, who: metallica, text: "まさに、ヴァルプルギスの夜会を開くには相応しい日じゃないか！"}
  - {id: L380, who: metallica, text: "……ん？……そういえば、お前何て名前だっけ？"}
  - {id: L381, who: luckiny, text: "ラ、ラナ・ニア・ルッキーニィです！ルッキーニィと呼んでください！", cut: ["28:37.37", "28:42.10"]}
  - {id: L382, who: metallica, text: "いいだろう！では、ルッキーニィはここでワタシが来るのを待て。"}
  - {id: L383, who: metallica, text: "百騎兵、お前は先にこの砂漠から、アズ・ブロッケン山におもむき、ピラーを咲かせておけ。"}
  - {id: L384, who: metallica, text: "もう、黄昏までさほど時間はないぞ！キリキリ進め！！"}
  - {id: L385, who: luckiny, text: "ボクが魔女様の弟子に……！憧れの、魔女に……！", note: （百騎兵が去った後、ひとりで。L375 と同じ文）, cut: ["29:12.37", "29:17.90"]}
# 次の台詞（L386〜）は A14（アズ・ブロッケン山の行き止まり。パート19 の 01:02 から）。audio/A14/original/script.yaml
