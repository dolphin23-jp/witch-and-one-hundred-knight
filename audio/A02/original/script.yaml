scene: A02
source: {part: 17, start: "00:05", vocals: "声とBGMの分離/パート17/パート17_声.mp3"}
lines:
  - {id: L94, who: bisco, text: "百騎兵！“スズの音草”の場所がわかったぞ。テッタラ砂漠の方だそうだ。", note: （ビスコが魔女邸の方から走ってきた）, cut: ["00:22.45", "00:31.14"]}
  - {id: L95, who: bisco, text: "ピラーの破壊がまだだから、壊しながら探して来いだってさ。まったく、人使いの荒いヤツだ。"}
  - {id: L96, who: bisco, text: "今回も探し物の名前は手紙に書き付けてあるから、必要なら見せながら探してくれ。", note: （『探し物メモ』を手に入れた）, cut: [null, "00:47.16"]}
  - {id: L97, who: bisco, text: "あ、おい、百騎兵！", cut: ["00:50.85", null]}
  - {id: L98, who: bisco, text: "私の方の、”ヒゲが１３本あるネコ”はヴァレンティーヌ領にあるみたいだ。お互い、頑張って見つけような。", note: （百騎兵、頷く）}
  - {id: L99, who: bisco, text: "そ、そうだな。頑張るぞ、うん。", cut: ["01:09.40", "01:12.75"]}
  - {id: L100, who: bisco, text: "い、いや、ほら！メタリカの奴、ずっと外の世界に憧れてたみたいだろ？"}
  - {id: L101, who: bisco, text: "ヴァルプルギスの夜会に行くのも夢みたいだしさ。"}
  - {id: L102, who: bisco, text: "そ、それに！夜会に行けば私に呪いをかけた魔女のこともわかるかもしれないし。"}
  - {id: L103, who: bisco, text: "私も頑張らなくちゃいけないしな。だから……。"}
  - {id: L104, who: arlecchino, text: "ワタクシはマーリカ様の森に向かうことになりました。"}
  - {id: L105, who: arlecchino, text: "“尾の先がだるいニワトリ”はのんびり……いえ、早急に見つけて参ります。"}
  - {id: L106, who: bisco, text: "あ、ああ。お互い頑張ろうな！"}
# 次の台詞（L107〜）はメタリカの自室（A03）。
