# A01 魔女邸・居間（朝）の台詞 L01〜L27（Living Spec「脚本 A01 第3稿（原作台詞）」の順、D-045）
# 原作音源: パート16（Revival）14:08 から。切り出しは tools/extract_lines.py
scene: A01
source: {part: 16, start: "14:08"}
lines:
  - {id: L01, who: metallica, text: おい、見ろ！ヴァルプルギスの夜会の招待状だぞ？}
  - {id: L02, who: metallica, text: キヒヒ！オマエは、この招待状の意味、まったく理解していないようだな。}
  - {id: L03, who: metallica, text: よかろう！ワタシがこの招待状の持つ意味を無知なるお前に教えてやる！}
  - {id: L04, who: metallica, text: ヴァルプルギスの夜会に招待されるのは一流の魔女だけだ。}
  - {id: L05, who: metallica, text: つまりこの招待状は、沼の魔女が、一流の魔女、ひいては大魔女だという公的な証なんだよ！}
  - {id: L06, who: metallica, text: あん？　なんだ、犬コロ。お前、また招待状が見たくなったのか？}
  - {id: L07, who: bisco, text: いい加減、私のことを犬コロと呼ぶな！私にはビスコールという名前があるんだ。}
  - {id: L08, who: bisco, text: それに、招待状はもう何度も見せてもらったよ。……嬉しいのはわかるが、お前、昨日からそればっかりだぞ。}
  - {id: L09, who: metallica, text: う、嬉しいだと！　何を言う！ワタシの実力を考えれば当然の結果だ。この程度で浮かれるものか！}
  - {id: L10, who: bisco, text: しかし驚きだよ。お前が、ヴァルプルギスの夜会に呼ばれる程の魔女だったとは。}
  - {id: L11, who: arlecchino, text: まあ、招待状が届いたのは、今回が初めてにございますが、はい。}
  - {id: L12, who: arlecchino, text: 領地拡大を急がれていたのも、まさにこの日の為にございましょう。}
  - {id: L13, who: arlecchino, text: ようやくリカ様の悲願が成就されたということでございます。はい。}
  - {id: L14, who: metallica, text: ワタシのことは、メタリカと呼べ！それに、憶測で勝手なことを言うな！}
  - {id: L15, who: metallica, text: 招待状なんか無くても、沼さえ広がれば、いつでもこちらから出向いてやったのだ！}
  - {id: L16, who: metallica, text: いや待て……。もしかすると今までも招待状は届けられていたかもしれん……。}
  - {id: L17, who: metallica, text: 使いの奴が沼の瘴気にやられ、届けられなかっただけだな。}
  - {id: L18, who: metallica, text: フム……、それは考えものだな……。沼の瘴気から守る、何か護符のようなものでも作るか……？}
  - {id: L19, who: metallica, text: それにしても、犬コロの分際でよくヴァルプルギスの夜会の名を知っていたな。意外だったぞ。}
  - {id: L20, who: bisco, text: ……私の先生が王宮付きの魔女だったからな。}
  - {id: L21, who: bisco, text: 夜会へ招待されることがどれほどの名誉かくらいは知っているさ。}
  - {id: L22, who: bisco, text: ……孤独を常とする魔女達が年に一度会し、魔女の決め事をするんだろ？}
  - {id: L23, who: metallica, text: そうだ。大魔女ウルカが創設した、歴史ある魔女の集会だ。}
  - {id: L24, who: bisco, text: へえ……。お前でも、そういうことに敬意を払うんだな。}
  - {id: L25, who: metallica, text: 敬意？キヒヒ！、そんなもの誰が払うか！ワタシは利用させてもらうだけだ。}
  - {id: L26, who: bisco, text: 利用って……？何をするつもりなんだ？}
  - {id: L27, who: metallica, text: 心配するな。あいつらが忘れている当然にして重要なことを提案するまでだ}
# 次の台詞（A01b の L28「見よ！この美しく素晴らしい沼を！」）は切り出さない。L27 の終わりの目印にだけ使う。
