# 羊飼いの獣人 = ルッキーニィ（名乗るのは A06）。商人から水を奪う場面（3）は声がない
# cut（2026-10-30）: L123 は 08:04（パート全体の書き起こしの 05:28 は誤り。前の 08:01〜08:03 は百騎兵の声）、L124 は呻きから「あなたは」まで（08:16 の声は百騎兵）
scene: A04
source: {part: 17, start: "03:10", vocals: "声とBGMの分離/パート17/パート17_声.mp3"}
lines:
  - {id: L113, who: metallica, text: "ふーん。これが砂漠というものか。", note: （百騎兵、テッタラ砂漠へ入る。メタリカから通信）}
  - {id: L114, who: metallica, text: "砂漠とはよく言ったものだ……砂ばっかりでなんと殺風景な……。つまらんな。"}
  - {id: L115, who: metallica, text: "あん？どうかしたか？", use: false, note: （遠くから角笛の音が聞こえたような気がした）}
  - {id: L116, who: metallica, text: "なんだよ？砂漠を知らんのか？", use: false}
  - {id: L117, who: metallica, text: "仕方がない。教えてやるからありがたく拝聴しろ！", use: false}
  - {id: L118, who: metallica, text: "いいか。ここは雨のほとんど降らん乾ききった砂と岩石の世界だ。沼のひとつもないつまらんところだ。", use: false}
  - {id: L119, who: metallica, text: "昼は灼熱、夜は極寒！生きとし生けるものにとっての死の世界だ。"}
  - {id: L120, who: metallica, text: "並の奴じゃあ、この砂漠の横断は不可能だろうな。", use: false}
  - {id: L121, who: metallica, text: "まあ、オマエの場合は頭の炎さえ消えなけりゃ、水も食料もいらないからな。"}
  - {id: L122, who: metallica, text: "いつもと何も変わらんさ。"}
  - {id: L123, who: metallica, text: "なんだ、あいつ？行き倒れか……？", note: （砂漠探索中、何かに気づいたメタリカから通信）, cut: ["08:04.05", "08:06.25"]}
  - {id: L124, who: luckiny, text: "う……、う……。あ……、あなたは……？", cut: ["08:20.45", "08:27.10"]}
  - {id: L125, who: metallica, text: "あん？息はあるのか。"}
  - {id: L126, who: metallica, text: "……まあどっちでもいいけど……。ん、待てよ。"}
  - {id: L127, who: metallica, text: "おい、百騎兵。そいつに“スズの音草”のありかを聞いてみろ。"}
  - {id: L128, who: luckiny, text: "“スズの音草”……？そ、それな……ら……。", note: （百騎兵、メモを見せる）}
  - {id: L129, who: metallica, text: "……あん？知ってるのか？どこにあるか答えさせろ"}
  - {id: L130, who: luckiny, text: "み、水を……。"}
  - {id: L131, who: metallica, text: "チッ！……仕方ない。他に手掛かりもないしな。介抱してやれ、百騎兵。"}
  - {id: L132, who: luckiny, text: "あ、ありがとうございます……！", note: （商人から奪った水瓶を渡し、水を飲ませる）}
  - {id: L133, who: luckiny, text: "はぁはぁ……。ありがとうございます。"}
  - {id: L134, who: luckiny, text: "あなたのお陰で助かりました……。"}
  - {id: L135, who: luckiny, text: "い、いけない……ここにいては……。砂食みに、気づかれます……。"}
  - {id: L136, who: luckiny, text: "たくさんいた砂羊がみんな食べられてしまいました……。"}
  - {id: L137, who: metallica, text: "……あん？砂食み？このあたりに生息している魔獣の類か？"}
  - {id: L138, who: luckiny, text: "こ、ここは危険です……。お礼もしたいので、とにかく一度村にいらしてください。"}
  - {id: L139, who: luckiny, text: "テッタラ村には……。村に行くには一族しか知らない抜け道をつかう必要がありますので一緒に行きましょう。"}
  - {id: L140, who: metallica, text: "……こんな砂漠に、村が？面倒だが、案外“スズの音草”があったりするかもな。"}
  - {id: L141, who: luckiny, text: "さあ、こっちです！はぐれた時は、角笛の音をたよりに来てください。"}
  - {id: L142, who: luckiny, text: "この音です。さあ、砂食みに気づかれる前に急いで！", note: （角笛の音）}
