note: 原作の M01（魔女邸）を、解析の下書き（draft.yaml）から Claude がピアノに編曲したもの（D-078）。旋律は draft.yaml の推定のまま、明らかなオクターブの取り違え3か所（17・23・24小節）だけ直した。和音は、原曲と編曲のクロマの相関が低かった所を、原曲のクロマと低音を見て直した（B の「Gsus4」→ G の上の C・D・G、ほか。D♭maj7 の低音は
  G とも推定されたが、中の音域に G がないので D♭ のまま）。旋律の推定が抜けた所（27・28・31小節など）は新しい旋律を足さず、右手で和音を置いた。低音は和音の根音。各小節の前半は、推定の低音（bass_hint）が和音の音なら転回形にする（後半の推定は打楽器でずれるので使わない）。
