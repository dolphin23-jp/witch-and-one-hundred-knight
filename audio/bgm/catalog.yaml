# BGM の一覧（名前つき）。docs/audio_catalog.md に読みやすい表がある
note: BGM の一覧（2026-11-01、D-068）。サウンドトラックはないので、プレイ録画から声を分けた残り（パート16〜21）を解析して曲に分けた。クロマ（音の高さの並び）の似かたで同じ曲をまとめたので、違う曲が1つにまとまったり、同じ曲が2つに分かれたりしていることがある。name は仮の名前（ユーザーが付け直してよい）。file は試聴用の約45秒（効果音の少ない所から切り出し、音量をそろえた）。場面で使うときは、選んだ曲からループを作って
  audio/bgm/ に置き、シーンの sound.yaml に書く。plays はその曲が流れていたパートと時刻。
