source: {part: 17, start: "16:43", vocals: "声とBGMの分離/パート17/パート17_声.mp3"}
lines:
  - {id: L176, who: luckiny, text: "ようこそ我が家へ。あっ、名前をまだ言ってませんでしたよね。ラナ・ニア・ルッキーニィといいます。"}
  - {id: L177, who: luckiny, text: "是非、ルッキーニィと呼んでください。"}
  - {id: L178, who: villager-a, text: "テ、ティトさん！今ここに旅人がいるだろう！", note: （家の外から獣人たちの騒がしい声が聞こえてくる）}
  - {id: L179, who: villager-a, text: "そいつ、砂漠から来たんじゃないのかい？"}
  - {id: L180, who: tito, text: "え、ええっ！？そ、そうなんですか！？"}
  - {id: L181, who: villager-b, text: "近くで砂食みを見たヤツがいるんだ！恐らくこの村は見つかっちまってる！"}
  - {id: L182, who: villager-a, text: "すぐに村も襲われるかもしれないぞ！"}
  - {id: L183, who: villager-c, text: "あんたのところのラナちゃん！とんでもないものを連れてきてくれたね！"}
  - {id: L184, who: villager-a, text: "なんの為に、こんなへんぴな土地に住んでいると思ってんだ！"}
  - {id: L185, who: villager-c, text: "まったく、あんたの旦那といい……！！疫病神もいいところだよ！！"}
  - {id: L186, who: tito, text: "ラ、ラナ？どうなっているの？母さんに説明しなさい。"}
  - {id: L187, who: luckiny, text: "そ……、それは……！"}
  - {id: L188, who: villager-d, text: "す、砂食みだ！砂食みが出たぞ！！！逃げろーーーーっ！！！！！"}
  - {id: L189, who: villager-d, text: "うわぁあぁあぁあぁあ！！！！"}
  - {id: L190, who: tito, text: "砂食みが……！？こうしてはいられない……！"}
  - {id: L191, who: tito, text: "お母さん、行かなきゃならないわ。ラナは旅人さんと隠れてなさい！"}
  - {id: L192, who: luckiny, text: "そんな！！母さん……！！！"}
  - {id: L193, who: tito, text: "大丈夫。あなたを死なせはしないわ。絶対に……！"}
  - {id: L194, who: tito, text: "じゃあね、ラナ。いつまでも元気でいるのよ……！"}
  - {id: L195, who: luckiny, text: "待って……待って、母さん……。"}
  - {id: L196, who: tito, text: "さあこっちよ、砂食み！！砂漠にお帰りなさい！"}
  - {id: L197, who: tito, text: "さあ、いらっしゃい！！あなたの餌はここよ！"}
  - {id: L198, who: metallica, text: "……去ったのか。", use: false, note: 書き起こしから（原作テキストにない）}
  - {id: L199, who: metallica, text: "まったく、スズの音草の話を聞こうとするたびに何かと邪魔が入るの。", use: false, note: 書き起こしから}
  - {id: L200, who: metallica, text: "おい百騎兵。とりあえずあの砂食みってやつをなんとかしないと話にならんかもしれんぞ。", note: 書き起こしから}
  - {id: L201, who: metallica, text: "勘だよ。勘。この辺りにマナの動く気配を感じるからな。", use: false, note: 書き起こしから}
  - {id: L202, who: metallica, text: "ピラーのこともある。もう少しこの村を調べてみろ。何かあるのかもしれん。", use: false, note: 書き起こしから}
  - {id: L203, who: tito, text: "ここは危ないわ。さあ、あなたもラナと家の中に入っていてください。", use: false, note: 書き起こしから。話者は推定（ティトが戻ってくる？）}
  - {id: L204, who: tito, text: "私は大丈夫です。こう見えても逃げ足は早いんですから。さあ早く。", note: 書き起こしから。話者は推定。ティトが無事に戻ったことを見せるので残す（A08 でティトが礼を言うため）}
  - {id: L205, who: tito, text: "大丈夫、大丈夫。", use: false, note: 書き起こしから}
