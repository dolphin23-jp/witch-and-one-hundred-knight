# id と name は場面で指定するときの呼び名（name はユーザーが付け直してよい）。walk/run のまとめの足音（E12・E13・E14）は、今は tools/footsteps.py の1歩ずつの足音に置き換えた。
# すべてモノラル 48kHz の Opus。シーンでの置き場所は episodes/<話>/scenes/<シーン>/sound.yaml。heard: ユーザーが聞いて確かめたら true。
