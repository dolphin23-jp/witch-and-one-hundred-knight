# A05 砂食みと村（場面の選別 5〜7、D-059）。原作音源パート17 の 11:08〜16:40
scene: A05
source: {part: 17, start: "11:08", vocals: "声とBGMの分離/パート17/パート17_声.mp3"}
lines:
  - {id: L143, who: luckiny, text: "こっちです！"}
  - {id: L144, who: luckiny, text: "くっ……。"}
  - {id: L145, who: metallica, text: "あん？そいつら、何かに怯えているのか？"}
  - {id: L146, who: metallica, text: "おい、まて！オマエの下に、何かいるぞ……。"}
  - {id: L147, who: luckiny, text: "す、砂食み！！", note: （砂食みが現れるが百騎兵たちには気付かず行ってしまう）}
  - {id: L148, who: metallica, text: "キヒヒ、なるほど。今のが砂食みってやつか。思っていたよりも強そうだな……"}
  - {id: L149, who: metallica, text: "砂漠の獣を糧にしているようだが並みのチカラでは太刀打ちできまい。"}
  - {id: L150, who: metallica, text: "それにしてもオマエ、見事に無視されたな。"}
  - {id: L151, who: metallica, text: "キヒヒ、魔法生物は食いでがないんだとよ。"}
  - {id: L152, who: luckiny, text: "よ、よかった……。た、助かりましたね。", use: false}
  - {id: L153, who: luckiny, text: "さあ、もう少しですので先を急ぎましょう。", use: false}
  - {id: L154, who: luckiny, text: "お疲れ様でした！なんとか、たどり着きましたね。"}
  - {id: L155, who: luckiny, text: "助けて頂いたお礼にご馳走しますので、家に来てください。"}
  - {id: L156, who: luckiny, text: "家は、村のはずれにありますので。先に戻って、準備しておきますね。", use: false}
  - {id: L157, who: metallica, text: "ふーん。ここがあの獣人の村か。", use: false, note: （案内で村にたどり着く）}
  - {id: L158, who: metallica, text: "あん？その付近にピラーの存在を感じるぞ……。"}
  - {id: L159, who: metallica, text: "だが、位置がよくわからんな……？"}
  - {id: L160, who: metallica, text: "姿を隠しているにしても、位置がわからんというのは、どういうことだ？", use: false}
  - {id: L161, who: metallica, text: "……まあ、いいだろう、百騎兵。ちょっと村を調べてみろ。", use: false}
  - {id: L162, who: tito, text: "あら、あなたがラナを助けてくれた方ですね！感謝の言葉もありません……。", note: （家に案内される）}
  - {id: L163, who: tito, text: "魔女になると言って、３日前に出ていったきりで、心配してたんです。"}
  - {id: L164, who: tito, text: "何か、お礼をさせて頂きたいのですが、今は、砂羊の出荷が全て終わった時期でして村には何もないのです……。"}
  - {id: L165, who: tito, text: "それに、何かお手伝いしようにも私たちは“星を読む”ことしかできないもので……。"}
  - {id: L166, who: tito, text: "せめてものお礼です。うちでお食事でもしていってください。この村の名物料理をご馳走しますわ。", use: false}
  - {id: L167, who: tito, text: "あっ、ちょっと待ってくださいね。ラナを呼びますから。", use: false}
  - {id: L168, who: metallica, text: "あん？こいつら、もしかして“星読み”か。"}
  - {id: L169, who: metallica, text: "……まあ、オマエは知らんだろうから教えてやる。", use: false}
  - {id: L170, who: metallica, text: "星読みと言うのは星の位置や動きを見て方角や吉凶を知る、占い師だ。", use: false}
  - {id: L171, who: metallica, text: "大平原やこういう砂漠だと、道しるべがなく方角がわからなくなるから遭難しやすい。", use: false}
  - {id: L172, who: metallica, text: "だから“星読み”が占うことで方角を知る必要があるんだ。", use: false}
  - {id: L173, who: metallica, text: "……だが、その“星読み”自身が道に迷って行き倒れているんじゃ、話にならん！"}
  - {id: L174, who: metallica, text: "高い能力を持つ“星読み”は、時として人の運命を言い当てるとも言うが、さっきのあいつは、それとは真逆だな。", use: false}
  - {id: L175, who: metallica, text: "さあ、さっさと例の手紙を見せて“スズの音草”のありかを……。", use: false}
