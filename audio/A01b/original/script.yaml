# A01b 沼のほとりの森（朝）の台詞 L28〜L93（Living Spec「脚本 A01 第3稿（原作台詞）」の順、D-045）
# 番号は A01（L01〜L27）からの通し。原作音源: パート16（Revival）18:05 から。
# 声は分離済みのもの（Drive「声とBGMの分離/パート16/パート16_声.mp3」）。切り出しは tools/extract_lines.py --vocals
# cut: [開始, 終了] は手で決めた範囲（声の頭と終わり、パートの中の時刻）。書き起こしの時刻がずれて自動で決められない台詞に使う。
# 心の声（inner: true）も原作では声が付いている。「……。」だけの台詞は文字がないので、前後の台詞の間の声を当てる。
scene: A01b
source: {part: 16, start: "18:05.3", vocals: "声とBGMの分離/パート16/パート16_声.mp3"}
lines:
  - {id: L28, who: metallica, text: "見よ！この美しく素晴らしい沼を！"}
  - {id: L29, who: metallica, text: "沼こそが、世界！世界のすべては沼で満たされるべきなのだ！"}
  - {id: L30, who: metallica, text: "この重大にして、素晴らしき提案を夜会で訴えずに何が沼の魔女だ！"}
  - {id: L31, who: metallica, text: "それに、世間の連中が大事に奉っているピラー・オブ・テンペランス！"}
  - {id: L32, who: metallica, text: "それが魔力満ちたる”沼”を封じていたという歴然たる事実！"}
  - {id: L33, who: bisco, text: "ピラーが沼を封じている……？"}
  - {id: L34, who: metallica, text: "キヒヒ、そうだ。それこそ、まさに沼の魔女が、最も優れた魔女であるという証ではないか。"}
  - {id: L35, who: metallica, text: "つまり、全ての魔女も領民共も、ワタシにひれ伏すべきなのだ！"}
  - {id: L36, who: metallica, text: "理解できたか、バカ犬が。もっと事実を考察するんだな。"}
  - {id: L37, who: bisco, text: "くっ……！勝手なことを……。"}
  - {id: L38, who: arlecchino, text: "申し訳ございません、ビスコ様。大魔女となり、沼を世界に広げるのはリカ様の悲願。"}
  - {id: L39, who: arlecchino, text: "夜会への参加はその一歩ゆえ調子に乗って……いえ、大変お喜びなのです。"}
  - {id: L40, who: arlecchino, text: "リカ様のお気持ち、どうかお察しくださいませ。"}
  - {id: L41, who: bisco, text: "しかし、わざわざ提案なんてしなくても、沼ぐらい魔力で広げられそうだが？"}
  - {id: L42, who: metallica, text: "はぁ……。お前は本当にバカだな。それが出来たらとっくにやってる。"}
  - {id: L43, who: metallica, text: "いくらワタシの魔力が強力無比でも、完全なる無から、新たに”沼”を作り広げることなど、できるはずあるまい。", cut: ["20:03.94", null], note: "頭の効果音（場面の中で何度も出る同じ音。声ではない）を外す（20:03.72、-44dB）"}
  - {id: L44, who: metallica, text: "……”沼”は、ピラーに封じられていた。そして、そのピラーは百騎兵にしか咲かせられん。"}
  - {id: L45, who: metallica, text: "だから、百騎兵が来るまで、ワタシは外に出られなかったんだよ。わかったか？"}
  - {id: L46, who: bisco, text: "……外に出られない……か。そいつは寂しかったろうな……。"}
  - {id: L47, who: metallica, text: "あん？　……寂しいだと？バカを言うな。ワタシには大勢の友がいる！"}
  - {id: L48, who: metallica, text: "知識という名の盟友がな！！その為の書物だ！"}
  - {id: L49, who: arlecchino, text: "魔術書に学術書、ベストセラーからゴシップ誌までアルレッキーノが入手してきたものはあらかた読破しているのです！"}
  - {id: L50, who: arlecchino, text: "その数、およそ300万冊にございます。一日100冊はお読みになっておりましたゆえ。"}
  - {id: L51, who: metallica, text: "外には出られずとも、あらゆることは問題なく把握している。"}
  - {id: L52, who: bisco, text: "本で、か……。", cut: [null, "21:20.44"], note: "語尾の「か……」（21:20.18〜21:20.44、-36dB）が小さく、自動では切れていた"}
  - {id: L53, who: bisco, text: "（……きっと外の世界に憧れていたんだろうな。）", inner: true}
  - {id: L54, who: bisco, text: "ところで、わざわざ持ってきてもらわなくても魔法で本は作れないのか？"}
  - {id: L55, who: metallica, text: "はぁ……。お前は本当に何もわかっていないな。"}
  - {id: L56, who: metallica, text: "魔法で本を作ったからといって、中身がなければどうしようもあるまい。"}
  - {id: L57, who: metallica, text: "お前、まさか、画材道具が揃えば上手い絵が描けると思ってるのか？"}
  - {id: L58, who: metallica, text: "楽器がそこにあれば、素晴らしい音楽が奏でられるとでも思ってるのか？"}
  - {id: L59, who: metallica, text: "お前、日記帳を買っただけで満足して全然書かないタイプだろ？"}
  - {id: L60, who: bisco, text: "う、うるさいな！余計なこと言って悪かったよ！", cut: ["22:11.68", null], note: "頭の効果音（場面の中で何度も出る同じ音。声ではない）を外す（22:10.80、-33dB）"}
  - {id: L61, who: arlecchino, text: "ところでリカ様、こちらの招待状には持参すべき品が書かれておりますが？"}
  - {id: L62, who: metallica, text: "メタリカだ！……持参するって何をやだ？"}
  - {id: L63, who: arlecchino, text: "”尾の先がだるいニワトリ”、”ヒゲが13本あるネコ”、そして……"}
  - {id: L64, who: arlecchino, text: "満月の夜に音を出す”スズの音草”の3品にございます。"}
  - {id: L65, who: arlecchino, text: "それらを持参の上、テッタラ砂漠の先にあるアズ・ブロッケン山、山頂に集合とのことです。"}
  - {id: L66, who: arlecchino, text: "どれも、聞いたことのない珍しいお品、”珍品”ばかりでございますね。"}
  - {id: L67, who: bisco, text: "それで、期限はいつなんだ？", cut: ["23:07.08", null], note: "頭の効果音（場面の中で何度も出る同じ音。声ではない）を外す（23:06.72、-33dB）"}
  - {id: L68, who: metallica, text: "そんなもの、”全ての品が揃った時”に決まっているだろう。魔女とはそういうものだ。"}
  - {id: L69, who: arlecchino, text: "そんなことはございません。招待状には魔女の暦で毒蜘蛛の日の黄昏と……"}
  - {id: L70, who: arlecchino, text: "すなわち、明日が期限でございますね。はい。"}
  - {id: L71, who: metallica, text: "……あん？明日だと！？"}
  - {id: L72, who: metallica, text: "ふん……。”珍品”のありかは今すぐ探しだす！ワタシのダウジング・ペンデュラムにかかれば造作もないことよ。"}
  - {id: L73, who: metallica, text: "わかり次第、取りに行くだけだ！必ず三品集めるぞ！"}
  - {id: L74, who: arlecchino, text: "では、ワタクシは”尾の先がだるいニワトリ”を取りに行きましょう。"}
  - {id: L75, who: arlecchino, text: "ただ、ワタクシと百騎兵様だけでは時間を考慮すると少々心もとなく思えますが……。"}
  - {id: L76, who: bisco, text: "……。"}
  - {id: L77, who: bisco, text: "仕方ないな……。私も手伝うよ。"}
  - {id: L78, who: metallica, text: "……。"}
  - {id: L79, who: bisco, text: "どうした、メタリカ？"}
  - {id: L80, who: metallica, text: "ふん……。", cut: ["24:29.33", "24:29.52"], note: "24:29 の0.2秒の声（音の高さがあり効果音ではない。L72 の頭の「ふん」とほぼ同じ長さ）。Whisper は文字にしない"}
  - {id: L81, who: metallica, text: "まあ、いいだろう。犬コロにとっても無関係な話ではないからな。", cut: ["24:32.16", null], note: "Whisper が「まあ」の時刻を L79 の直後に置くので、頭を声の区間に合わせた"}
  - {id: L82, who: arlecchino, text: "なるほど。ご高名な魔女様が一堂に会する夜会です。どなたかご存知かもしれないということですね。"}
  - {id: L83, who: bisco, text: "うん？　どういうことだ？"}
  - {id: L84, who: metallica, text: "ニブい奴だな。お前の犬鼻は飾りか？", cut: ["24:55.30", null], note: "頭の効果音（場面の中で何度も出る同じ音。声ではない）を外す（24:54.94、-31dB）"}
  - {id: L85, who: metallica, text: "夜会に行けば、お前に呪いをかけた魔女も見つかるかもしれんだろ。"}
  - {id: L86, who: bisco, text: "……！？"}
  - {id: L87, who: arlecchino, text: "もしかしたら、ビスコ様の呪いを解くことが出来る方もいらっしゃるかもしれませんね。"}
  - {id: L88, who: metallica, text: "そういうことだ。"}
  - {id: L89, who: bisco, text: "（メタリカ……。）", inner: true}
  - {id: L90, who: metallica, text: "それじゃあ、百騎兵。オマエは、ピラーを制圧しながら満月の夜に音を出す”スズの音草”を探せ。"}
  - {id: L91, who: arlecchino, text: "まさか、チームプレイとは……。ワタクシ、初めてで少し緊張してしまいそうです。はい。"}
  - {id: L92, who: metallica, text: "キヒヒ！なんだか面白くなってきたじゃないか。"}
  - {id: L93, who: metallica, text: "では、これよりダウジング術を開始する！！", cut: ["25:49.60", null], note: "頭の効果音（場面の中で何度も出る同じ音。声ではない）を外す（25:49.08〜25:49.56、-44dB）"}
# 次の台詞はパート17（第5章）にあるので、next_line はない。
