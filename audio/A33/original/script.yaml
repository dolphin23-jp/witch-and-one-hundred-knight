# 7章前半（A33〜A40、7-01 魔女会報〜7-14 北西のピラーへ）の台詞 L1146〜L1474。原作音源パート24（全部）とパート25（全部）（D-045）
# 原作テキストは Drive「Mj100 7-8」の頭（「上から……2階から何か大きな音が」）〜「一通りのピラーもあわせて片付けて来い」。
#   その次（綿蛍の谷の墓地、7-15）からはパート26 以降の録画が要る（2026-11-06 時点で Drive にない）。
#   場面の分け方と残す・削るは Living Spec「7章 準備（案）」の表（長さは表のとおり＝約31分の案。6章後半と同じ扱い、ユーザーの確認待ち）。
#   A33 居間（7-01〜7-02 と章の題）、A34 チンクエの森とゴミ山（7-03〜7-06。7-03 は森の入口に移した）、A35 森と沼地のピラー（7-07〜7-08）、A36 ゴミ山（7-09）、
#   A37 魔女邸のバスルーム（7-10）、A38 ゴミ山の外れの森（7-11）、A39 バスルーム（7-12）、A40 チンクエの森の道（7-13〜7-14）
# use: false は選別で削った台詞（切り出しは位置合わせのためにすべて行い、シーンでは使わない）。前ふり・受けの台詞は残す側に倒した（docs/previs_checklist.md 2）。
# revival: true は原作テキストになく、Revival の音声だけにある台詞（文字は書き起こしから起こした。聞いて確かめる）。
# 話し手: mitten＝ミトン（名乗る前の「ブリダンゴ姫」も mitten）、narrator＝章の題の読み上げ。7-12「結局そこか……」はビスコに付け替え（準備（案）の推定。削る側）。
# 音声はパート24・25 の声（Drive「声とBGMの分離/パート24・25/」）をつないだもの。cut の時刻は、つないだ音声の中の位置（パート25 の時刻 ＋ 1494.20秒。つないだ音声は 3058.32秒）。
scene: A33
source: {parts: [24, 25], offset_part25: 1494.20,
         vocals: "声とBGMの分離/パート24/パート24_声.mp3 ＋ 声とBGMの分離/パート25/パート25_声.mp3"}
lines:
  # --- 7-01 魔女邸・魔女会報とマーニィの旅立ち（A33 居間） ---
  - {id: L1146, who: luckiny, text: "うわ！？う、上から……2階から何か大きな音がしましたよ！", cut: ["00:06.41", "00:10.65"]}
  - {id: L1147, who: arlecchino, text: "おそらくリカ様へのお届け物でしょう。はい。"}
  - {id: L1148, who: bisco, text: "またあの鳥の手紙か？今度は何だ？"}
  - {id: L1149, who: metallica, text: "キヒヒ！来たぞ来たぞ！”魔女会報”だ！", cut: ["00:24.88", "00:28.97"]}
  - {id: L1150, who: luckiny, text: "”魔女会報”！？魔女にしか送られてこない、あの！"}
  - {id: L1151, who: metallica, text: "キヒヒ！とうとうワタシの名を世に轟かす日が来たようだなあ。", cut: ["00:38.21", "00:44.25"]}
  - {id: L1152, who: metallica, text: "それにしても……。ビスコのやつめ", use: false}
  - {id: L1153, who: metallica, text: "本来、ワタシが夜会で提案したかったのは”沼を世界中に押し広げる”ことだったというのに、よけいなことしやがって……。", use: false}
  - {id: L1154, who: metallica, text: "それに、今までワタシを魔女と認めていなかったとは！魔女会もたかが知れているというものだ。", use: false}
  - {id: L1155, who: metallica, text: "キヒヒ！こうなったら、自らのチカラでさらなる沼の拡張を行い、沼の魔女の名を歴史に刻んでやる！"}
  - {id: L1156, who: bisco, text: "なんだか、あいつ楽しそうだな。"}
  - {id: L1157, who: arlecchino, text: "魔女会報が届くのは正式な魔女様だけですから。はい。", cut: ["01:27.15", "01:32.05"]}
  - {id: L1158, who: arlecchino, text: "魔女として認めて頂いたことを実感されたのでしょう。", use: false}
  - {id: L1159, who: luckiny, text: "よかったですね、魔女様。ボクも嬉しいです！", cut: ["01:39.94", "01:44.25"]}
  - {id: L1160, who: bisco, text: "(すっかりそれどころではなかったがあの夜会にいたのだろうか)", cut: ["01:45.00", "01:52.10"], hear: 範囲を手で決めた（区切った書き起こしの語の時刻。聞いて確かめる）}
  - {id: L1161, who: bisco, text: "(私に呪いをかけた魔女が……。)", cut: ["01:53.30", "01:55.80"], hear: 範囲を手で決めた（区切った書き起こしの語の時刻。聞いて確かめる）}
  - {id: L1162, who: luckiny, text: "あれ？そういえばマーニィさんはどうしたんですか？"}
  - {id: L1163, who: arlecchino, text: "マーニィ様ならあの日の昼には旅に出られました。はい。"}
  - {id: L1164, who: arlecchino, text: "”リカちゃんは元気になったし、私がいなくても大丈夫でしょ。バイバーイ。”", use: false}
  - {id: L1165, who: arlecchino, text: "と、お別れの挨拶もそこそこに。", use: false}
  - {id: L1166, who: luckiny, text: "なんていうか……自由な人ですね。"}
  - {id: L1167, who: arlecchino, text: "自称旅人でございますゆえ。はい。"}
  - {id: L1168, who: bisco, text: "まったく。もうちょっとゆっくりしていけばいいのに。", cut: ["02:36.00", "02:40.20"], hear: 範囲を手で決めた（区切った書き起こしの語の時刻。聞いて確かめる）}
  # --- 7-02 臭いと来訪・依頼・「無駄」（A33 居間） ---
  - {id: L1169, who: bisco, text: "ん……？んんっ！！！", hear: 書き起こしに出ない（もとの切り出しのまま。聞いて確かめる）}
  - {id: L1170, who: bisco, text: "な、なんだ、この臭い……？外からか？", cut: ["02:49.51", "02:53.17"]}
  - {id: L1171, who: luckiny, text: "ここにお客さんなんて珍しいですね……。", cut: ["02:57.39", "03:00.79"]}
  - {id: L1172, who: luckiny, text: "うわぁ！？でっかい虫！！！", cut: ["03:03.45", "03:05.91"]}
  - {id: L1173, who: bisco, text: "こ、この臭いの正体……か！うっ……。もう、だめ……", cut: ["03:09.38", "03:14.98"]}
  - {id: L1174, who: luckiny, text: "あぁ！？ビスコさん！しっかりしてください！！"}
  - {id: L1175, who: arlecchino, text: "さすが犬鼻。嗅覚が強いことが仇となり、刺激に耐えられなかったのでしょう。"}
  - {id: L1176, who: luckiny, text: "アルレッキーノさん、冷静に説明しないでください。"}
  - {id: L1177, who: mitten, text: "こ、ここが魔女様の家でちか？"}
  - {id: L1178, who: luckiny, text: "うわ！？立ちあがった！！！"}
  - {id: L1179, who: arlecchino, text: "間違いなくここは、魔女様の家にございます。はい。"}
  - {id: L1180, who: mitten, text: "よかったでち！……でもなんか、イメージしてたのと違うでちね。"}
  - {id: L1181, who: mitten, text: "魔女様はどこでち？お願いしたいことがあるんでち。"}
  - {id: L1182, who: arlecchino, text: "なんと！リカ様に依頼でございますか！お待ちくださいませ。ただいまリカ様をーー"}
  - {id: L1183, who: metallica, text: "ふむ、依頼と聞こえたが！", cut: ["04:21.64", "04:23.81"]}
  - {id: L1184, who: metallica, text: "……あん？なんだこいつは？", cut: ["04:25.91", "04:29.25"]}
  - {id: L1185, who: metallica, text: "デカいブリダンゴだな！"}
  - {id: L1186, who: arlecchino, text: "リカ様に依頼に来られたお客様にございます。"}
  - {id: L1187, who: metallica, text: "メタリカだ。"}
  - {id: L1188, who: arlecchino, text: "このお姿から察するに、この辺りで有名な通称”ブリダンゴ姫”かと。"}
  - {id: L1189, who: mitten, text: "えへへ！姫だなんて照れちゃうでち。", use: false}
  - {id: L1190, who: luckiny, text: "ブリダンゴ……？初めて見ました……。"}
  - {id: L1191, who: luckiny, text: "立つし、喋るし。もしかして虫じゃなくて、妖精の仲間とかですか？"}
  - {id: L1192, who: metallica, text: "キヒヒ！妖精だと！？ブリダンゴが？", cut: ["05:13.90", "05:16.47"]}
  - {id: L1193, who: mitten, text: "ち、違うでち！妖精なんかと一緒にしないでほしいでち！！！失礼なヤツでち！"}
  - {id: L1194, who: luckiny, text: "えぇ！？妖精よりブリダンゴのほうが上なんですか？"}
  - {id: L1195, who: arlecchino, text: "一般的には違います。はい。しかしこの方は誇りをお持ちなのかと……"}
  - {id: L1196, who: arlecchino, text: "ブリダンゴであることに。"}
  - {id: L1197, who: metallica, text: "……。一応、内容だけでも聞こうか。"}
  - {id: L1198, who: mitten, text: "あたち……。王子様をオウエンしたいんでち！", cut: ["05:51.99", "05:56.09"]}
  - {id: L1199, who: metallica, text: "あん？王子？応援？お前、意味わかってるのか？", cut: ["05:59.50", "06:05.86"]}
  - {id: L1200, who: mitten, text: "わ、わかってるでち！あたち、王子様が大好きなんでち！"}
  - {id: L1201, who: luckiny, text: "大好きって……！その……王子様に恋心……ってことですか？", cut: ["06:15.66", "06:24.96"]}
  - {id: L1202, who: arlecchino, text: "ちなみに現アマタイア国王にご子息はおりません。つまり本物の王子ではないかと。"}
  - {id: L1203, who: metallica, text: "はぁ……。わかったわかった。大好きな王子を応援したいんだな。"}
  - {id: L1204, who: metallica, text: "だったら土にでも潜ってろ。それがお前にできる唯一の応援だ。"}
  - {id: L1205, who: mitten, text: "んあ？そんなことしたら王子様に会えないでちよ？", use: false}
  - {id: L1206, who: metallica, text: "そうだな。そのまま王子のことは忘れろ。これで一件落着だ。", use: false}
  - {id: L1207, who: mitten, text: "どこがでちか！！！あたちはオウエンしたいんでち！！！", use: false}
  - {id: L1208, who: metallica, text: "何をしても無駄だと言っているんだ。わかったら、さっさと帰れ。"}
  - {id: L1209, who: mitten, text: "どうして無駄なんでちか！？全然わからないでち！"}
  - {id: L1210, who: metallica, text: "お前、自分自身のことを何もわかってないようだな……"}
  - {id: L1211, who: metallica, text: "これ以上話しても時間の無駄だ！ブリダンゴらしくゴミ溜めの巣穴にでも帰れ！"}
  - {id: L1212, who: mitten, text: "ブ、ブリダンゴをバカにするなんて許せないでち！失礼でち！"}
  - {id: L1213, who: mitten, text: "もうお前なんかに頼まないでち！こんなところに来て損したでち！！！"}
  - {id: L1214, who: metallica, text: "まったく。あんな奴に関わって、初めての依頼を無駄にしてたまるか……。"}
  - {id: L1215, who: arlecchino, text: "しかしリカ様、魔女ドクトリンには次の一節がございます。"}
  - {id: L1216, who: arlecchino, text: "魔女たる者は、どんな頼みごとも断るべからず。断るは安し、引き受けるは難し。", cut: ["08:11.84", "08:19.78"]}
  - {id: L1217, who: metallica, text: "そんなことは知っている！だからちゃんと教えてやっただろう。"}
  - {id: L1218, who: metallica, text: "何をしても無駄だとな。"}
  - {id: L1219, who: luckiny, text: "無駄、ですか……。", cut: ["08:32.85", "08:35.47"]}
  - {id: L1220, who: luckiny, text: "ブリダンゴが王子に恋だなんて、確かに変だと思いますけど……。"}
  - {id: L1221, who: luckiny, text: "でも、ちゃんとやれば何か、できることだってあるかもしれないじゃないですか。", cut: ["08:45.93", "08:52.05"]}
  - {id: L1222, who: metallica, text: "……あん？", cut: ["08:54.95", "08:56.00"], hear: 範囲を手で決めた（区切った書き起こしの語の時刻。聞いて確かめる）}
  - {id: L1223, who: luckiny, text: "い、いえ……その……。", cut: ["08:59.30", "09:01.30"], hear: 範囲を手で決めた（区切った書き起こしの語の時刻。聞いて確かめる）}
  - {id: L1224, who: metallica, text: "はぁ……。お前もわかってないのか……。よしわかった。", cut: ["09:01.95", "09:10.40"], hear: 範囲を手で決めた（区切った書き起こしの語の時刻。聞いて確かめる）}
  - {id: L1225, who: metallica, text: "ルッキーニィ、それから百騎兵。お前たち、あのブリダンゴを調べてこい。"}
  - {id: L1226, who: metallica, text: "本当に、土に潜る以上の応援があるというなら、それをワタシが叶えてやる。"}
  - {id: L1227, who: luckiny, text: "本当ですか！？どんな願いでもですか？", cut: ["09:28.80", "09:31.90"], hear: 範囲を手で決めた（区切った書き起こしの語の時刻。聞いて確かめる）}
  - {id: L1228, who: metallica, text: "あぁ。いいだろう。見つけられたらだがな。", cut: ["09:34.31", "09:37.88"]}
  - {id: L1229, who: luckiny, text: "それじゃあ、ブリダンゴ姫のところへ行ってきます！", cut: ["09:40.58", "09:43.70"]}
  - {id: L1230, who: metallica, text: "ピラーを咲かせることも忘れるなよ、百騎兵！"}
  - {id: L1231, who: narrator, text: "第3幕 第7章 魔女と虫姫", note: "（Revival の音声だけ。章の題の読み上げ（書き起こし 09:43〜10:01）。題字の画に重ねる案）", revival: true, cut: ["09:58.04", "10:03.32"]}
  - {id: L1232, who: metallica, text: "どうした？土に潜る以上の応援は見つかったか？", note: "（Revival の音声だけ（百騎兵が話しかけたときの会話。書き起こし 10:01〜））", use: false, revival: true}
  - {id: L1233, who: metallica, text: "まあ、ないだろうけどな。あのブリダンゴにはそれがお似合いだ。", note: "（Revival の音声だけ）", use: false, revival: true}
  - {id: L1234, who: bisco, text: "おいメタリカ、おまえいくらなんでもそれは酷いんじゃないか？", note: "（Revival の音声だけ）", use: false, revival: true}
  - {id: L1235, who: metallica, text: "出会った瞬間気絶して、まともに姿形も見ていないくせに……。", note: "（Revival の音声だけ（話し手は推定））", use: false, revival: true}
  - {id: L1236, who: bisco, text: "うるさいなあ、仕方がないだろ……。", note: "（Revival の音声だけ（話し手は推定））", use: false, revival: true}
  - {id: L1237, who: bisco, text: "やめてくれ……。目の前が暗くなってくる……。", note: "（Revival の音声だけ）", use: false, revival: true}
  - {id: L1238, who: metallica, text: "それより百騎兵、お前は弟子の手伝いもいいが、本業を忘れるなよ。", note: "（Revival の音声だけ）", use: false, revival: true}
  # --- 7-03 出発前のルッキーニィの本音（A34 の頭。紅嵐街道からチンクエの森へ入る所に移した） ---
  - {id: L1239, who: luckiny, text: "あ、百騎兵さん！こっちです。", cut: ["11:35.56", "11:37.29"]}
  - {id: L1240, who: luckiny, text: "ブリダンゴ姫の居場所がわかりました。紅嵐街道沿いの森……”チンクエ”にあるゴミ山だそうです。"}
  - {id: L1241, who: luckiny, text: "あの……。", cut: ["11:46.86", "11:47.88"]}
  - {id: L1242, who: luckiny, text: "ボクだって、王子とブリダンゴがその……結婚とかできるとまでは思っていないです……。", use: false}
  - {id: L1243, who: luckiny, text: "……ただ、望みが高すぎるからって、無駄ってことにはならないと思うんです。魔女様にはああ言われましたけど……。"}
  - {id: L1244, who: luckiny, text: "それじゃあ、百騎兵さん。ボクは先に行ってるんで、準備が出来たら追ってきてください。", cut: ["12:11.10", "12:17.16"]}
  # --- 7-04 ゴミ山・ミトンの名乗りと特訓の始まり（A34 チンクエのゴミ山） ---
  - {id: L1245, who: luckiny, text: "あ、百騎兵さん！こっちです。", note: "（7-03 と同じ文の2回目）", use: false}
  - {id: L1246, who: luckiny, text: "いましたね。だけど……ゴミ山で何をしてるんでしょうか？", cut: ["13:49.30", "13:53.47"]}
  - {id: L1247, who: luckiny, text: "ゴ、ゴミを食べた！？"}
  - {id: L1248, who: mitten, text: "だ、誰でちか！？まさか、王子様！？", cut: ["14:09.02", "14:12.09"]}
  - {id: L1249, who: mitten, text: "んあ？魔女の所にいた……。な、何の用でちか！", cut: ["14:17.83", "14:22.07"]}
  - {id: L1250, who: luckiny, text: "ボクはルッキーニィ。こっちは百騎兵さん。"}
  - {id: L1251, who: luckiny, text: "ここへは、ええと……。何か応援の方法を、一緒に考えられないかと思って来たんですけど……。"}
  - {id: L1252, who: mitten, text: "本当でちか！依頼を受けてくれるんでちね！"}
  - {id: L1253, who: luckiny, text: "い、いや……。そういうわけでもないんですけど……。"}
  - {id: L1254, who: mitten, text: "よろしくでち！あたちはミトンでち！大好きなのは王子様でち……えへへ。", cut: ["14:53.38", "14:59.91"]}
  - {id: L1255, who: luckiny, text: "それはわかりました……。それで、王子様とはどうやって知り合ったんですか？"}
  - {id: L1256, who: mitten, text: "王子様は馬車に乗ってきたでち。運命の出会いでち。", cut: ["15:10.55", "15:15.30"], hear: 範囲を手で決めた（区切った書き起こしの語の時刻。聞いて確かめる）}
  - {id: L1257, who: luckiny, text: "う、うん……。", cut: ["15:17.90", "15:19.50"], hear: 範囲を手で決めた（「うん」の語の時刻。前の「う、」が入っているか聞いて確かめる）}
  - {id: L1258, who: luckiny, text: "(本物の王子ではないとして、貴族の息子か何かな……。なんだか、話がよく見えないな……)", use: false}
  - {id: L1259, who: luckiny, text: "(どっちにしても、分不相応って線はかわらずか……)", use: false}
  - {id: L1260, who: mitten, text: "早く王子様をオウエンしたいでち！さあ、どうすればいいでちか？さあさあ、言うでち！"}
  - {id: L1261, who: luckiny, text: "どうって……。キミは何か知らないんですか？王子様が喜びそうなこととか……"}
  - {id: L1262, who: mitten, text: "うぅ〜……。む、難しいことはわからないでち……。", cut: ["15:59.06", "16:01.98"]}
  - {id: L1263, who: luckiny, text: "なっ！？またゴミを食べて！", cut: ["16:09.34", "16:10.99"]}
  - {id: L1264, who: mitten, text: "もぐもぐ……。おいちいでちよ。食べたいでちか？"}
  - {id: L1265, who: luckiny, text: "い、いりませんよ！", cut: ["16:20.02", "16:21.31"]}
  - {id: L1266, who: luckiny, text: "……というか、そんなところ王子様に見られたら嫌われますよ！"}
  - {id: L1267, who: mitten, text: "は、はわわ……。しょ、食事をしたら王子様に嫌われるんでちか！？", cut: ["16:30.47", "16:36.03"]}
  - {id: L1268, who: luckiny, text: "そうじゃなくて！ダメなのは拾い食いの方ですよ。しかもゴミなんて！"}
  - {id: L1269, who: mitten, text: "そ、そうだったんでちか……。ガマンしないとダメでちね……。もぐもぐ……。"}
  - {id: L1270, who: mitten, text: "わ！つ、つい……！ガマンするでち！もぐもぐ……。"}
  - {id: L1271, who: mitten, text: "ご、ごめんでち……！でも自分ではどうすることもできないでち……！"}
  - {id: L1272, who: luckiny, text: "これはもう……、特訓するしかないですね！！"}
  - {id: L1273, who: mitten, text: "と、特訓でちか！？いったい何をするんでち！？"}
  - {id: L1274, who: luckiny, text: "まずは無意識にゴミを食べるのをやめないといけませんね。ちゃんとした食事をとりましょう。"}
  - {id: L1275, who: luckiny, text: "まかせてください。ボクが側についていて、その癖が治るように手伝いますから。"}
  - {id: L1276, who: luckiny, text: "でも、それだけじゃ心細いので、百騎兵さんにお願いがあります。"}
  - {id: L1277, who: luckiny, text: "”ずっしりの実”を探してきてもらっていいですか？"}
  - {id: L1278, who: luckiny, text: "拾い食いの癖と空腹感がなくなれば、もうゴミは食べないと思うんです。"}
  - {id: L1279, who: luckiny, text: "お願いします、百騎兵さん！"}
  - {id: L1280, who: luckiny, text: "では、お願いします！", use: false}
  - {id: L1281, who: luckiny, text: "お礼と言っては何なんですけど、後でボクの得意料理をご馳走しますから。"}   # 7-05 の「お約束したボクの得意料理」の前ふりなので戻した（準備（案）の「お礼の約束」を削るから外す。2026-11-06）
  - {id: L1282, who: luckiny, text: "”ずっしりの実”っていうのは通称なんですが、この辺りにある”かなきり穂”から稀に落ちる”実”のことなんです。"}
  - {id: L1283, who: luckiny, text: "たぶん、この近辺で採集していればみつかると思うのですが……。", use: false}
  - {id: L1284, who: luckiny, text: "ボクはここでミトンさんが拾い食いしないように見張ってますから、よろしくお願いします。", use: false}
  - {id: L1285, who: luckiny, text: "(王子様に恋なんて、分不相応かもしれない……)", cut: ["18:58.91", "19:03.59"]}
  - {id: L1286, who: luckiny, text: "(でも、諦めなければ何か見つかるかもしれないんだ……)"}
  - {id: L1287, who: luckiny, text: "(ボクだって……)"}
  # --- 7-05 ずっしりの実・得意料理・満腹（A34。探す所は台詞なしの見せ場） ---
  - {id: L1288, who: luckiny, text: "どうですか？”ずっしりの実”は見つかりそうですか？", use: false}
  - {id: L1289, who: luckiny, text: "こちらもがんばりますので……。", use: false}
  - {id: L1290, who: luckiny, text: "ああっ！？目を離した隙に！", use: false}
  - {id: L1291, who: mitten, text: "ご、ごめんでち。つい……。", use: false}
  - {id: L1292, who: luckiny, text: "まったくもう！すみません、百騎兵さん。”ずっしりの実”を早くお願いします。", use: false}
  - {id: L1293, who: luckiny, text: "茂みの中を採集していればみつかると思います。", use: false}
  - {id: L1294, who: luckiny, text: "ボクはここでミトンさんが拾い食いしないように見張ってますからよろしくお願いします。", use: false}
  - {id: L1295, who: luckiny, text: "これは”ずっしりの実”！ありがとうございます！"}
  - {id: L1296, who: luckiny, text: "では、これがお約束したボクの得意料理です"}
  - {id: L1297, who: luckiny, text: "実は、お腹がすいたときにいつでも食べれるように、持ち歩いているんです。"}
  - {id: L1298, who: luckiny, text: "まだ、砂羊の放牧をしていたときの感覚が抜けなくて、ちょっと困っているんですけどね。"}
  - {id: L1299, who: luckiny, text: "さあ、ミトンさん！これを食べてみてください。"}
  - {id: L1300, who: mitten, text: "ほあ！これを食べれば、お腹が満腹になるでちね！"}
  - {id: L1301, who: mitten, text: "んあ！？お、お腹いっぱいでち！もう拾い食いはしないでち！", cut: ["21:31.30", "21:35.18"]}
  # --- 7-06 臭いの指摘・香水の計画・メタリカの念押し（A34） ---
  - {id: L1302, who: mitten, text: "これでもう王子様に嫌われないでちか？"}
  - {id: L1303, who: luckiny, text: "まだですね。次は、その臭いをなんとかしないと……", cut: ["21:44.30", "21:50.48"]}
  - {id: L1304, who: mitten, text: "臭いでち？何の臭いでち？", cut: ["21:52.60", "21:55.62"]}
  - {id: L1305, who: luckiny, text: "う〜ん……。……ミトンさん、あなたが臭うんです", cut: ["21:59.97", "22:06.17"]}
  - {id: L1306, who: mitten, text: "んあ！あたち……臭かったでちか！", cut: ["22:09.90", "22:13.36"]}
  - {id: L1307, who: luckiny, text: "はい……正直すごい臭いです……。お風呂には……入っているわけないですよね……。", cut: ["22:17.57", "22:27.17"]}
  - {id: L1308, who: mitten, text: "自慢じゃないでちが、お風呂なんてここにはないでち！"}
  - {id: L1309, who: luckiny, text: "それは、そうですよね……。だって、外ですしね……。", cut: ["22:37.65", "22:43.37"]}
  - {id: L1310, who: mitten, text: "なんか、いったでちか？"}
  - {id: L1311, who: luckiny, text: "い、いえ！それでは、応急措置ですが香水にしましょう。臭いに負けない香りをつけるんです。"}
  - {id: L1312, who: luckiny, text: "最強の香水と言われる”アロマニの香水”なら、ミトンさんの臭いにも勝てるはず……です！"}
  - {id: L1313, who: luckiny, text: "”アロマニの香水”は、アロマニ・ジェルっていう、魔獣の”キモ”を潰して作るんです。", use: false}
  - {id: L1314, who: luckiny, text: "百騎兵さん、アロマニ・ジェルからその”キモ”を取ってきてくれませんか？", cut: ["23:17.62", "23:22.76"]}
  - {id: L1315, who: luckiny, text: "では、お願いします！", use: false}
  - {id: L1316, who: luckiny, text: "お礼と言っては何なんですけど、ボクの非常食を差し上げますから", use: false}
  - {id: L1317, who: luckiny, text: "それでは、この近くに生息しているアロマニ・ジェルから、”アロマニのキモ”を取ってきてください。", use: false}
  - {id: L1318, who: luckiny, text: "そんなに、強い魔獣じゃなかったはずですが……。一応、用心はしてくださいね。", use: false}
  - {id: L1319, who: metallica, text: "おい、百騎兵。ワタシは、今回お前たちのしていることに口はださない。", note: "（千里眼越しの声（7章 準備（案）））"}
  - {id: L1320, who: metallica, text: "ただ、オマエにはピラーを咲かせる役目があるってことを忘れるなよ。"}
  - {id: L1321, who: metallica, text: "まぁ、それさえ覚えているなら好きにするがいいさ。"}
  - {id: L1322, who: luckiny, text: "あ、百騎兵さん。どうですか、アロマニ・ジェルは見つかりそうですか？", use: false}
  - {id: L1323, who: luckiny, text: "ま、まだみたいですね。ボクも準備をしておきますので、よろしくお願いします。", use: false}
  # --- 7-07 森・アルレッキーノのフィールドワーク（A35 森と沼地のピラー。パート25 の頭から） ---
  - {id: L1324, who: arlecchino, text: "おや、百騎兵様。遠路はるばるこんなところまでご苦労でございます", cut: ["25:05.47", "25:11.21"]}
  - {id: L1325, who: arlecchino, text: "ワタクシでございますか？　ワタクシは現在、定例のフィールドワークの真っ最中でございます", cut: ["25:17.27", "25:23.07"]}
  - {id: L1326, who: arlecchino, text: "いやはや、このあたりはマーリカ様の森とは植生が異なっており、なかなかに面白うございます", use: false}
  - {id: L1327, who: arlecchino, text: "それでは、ワタクシはこれにて失礼します。さっきから、背後にいやな視線を感じておりますれば"}
  - {id: L1328, who: arlecchino, text: "百騎兵様も、お気をつけてくださいませ", use: false}
  - {id: L1329, who: metallica, text: "ちっ、アルレッキーノのやつ、ワタシに内緒でこんなところまできていたのか", use: false}
  - {id: L1330, who: metallica, text: "……ここは、沼からかなり距離があるぞ！"}
  - {id: L1331, who: metallica, text: "フィールドワークといえば、何でもゆるされると思っているフシがあるな、あいつ", use: false}
  - {id: L1332, who: metallica, text: "主人を差し置いて、まったく、けしからん……", use: false}
  - {id: L1333, who: metallica, text: "……あん？この感じ……", cut: ["26:23.59", "26:29.91"]}
  # --- 7-08 沼地のピラー・アロマニ・ジェル戦（A35） ---
  - {id: L1334, who: metallica, text: "キヒヒ、百騎兵！どうやら、ここにはピラーがあるようだぞ！偶然か……それとも", cut: ["26:41.75", "26:50.53"]}
  - {id: L1335, who: metallica, text: "そして、オマエが探している”アロマニ・ジェル”ってのが守護者ってわけか"}
  - {id: L1336, who: metallica, text: "これは、さすがにちょっと、出来すぎてやしないか？"}
  - {id: L1337, who: metallica, text: "キヒヒ、まあつまらん検証はいらん", cut: ["27:05.89", "27:08.21"]}
  - {id: L1338, who: metallica, text: "ピラーがあるとなれば話は別だぞ！全力でこいつを叩き潰せ！そして、ピラーを咲かせるんだ！"}
  - {id: L1339, who: metallica, text: "ふむ、あいかわらず沼はすばらしい！鼻腔をくすぐるこの香り！たまらん！", note: "（ピラーが開いた後）", cut: ["30:06.47", "30:13.15"]}
  - {id: L1340, who: metallica, text: "なにを、ぼやっとしているんだ？オマエは、そいつからキモを抜き取って持ち帰るんじゃなかったのか？"}
  - {id: L1341, who: metallica, text: "なかなかにいい場所だ。ワタシは少しここで昼寝でもしていくからオマエは好きにしな"}
  - {id: L1342, who: metallica, text: "あいつらが待っているんだろ？"}
  # --- 7-09 香水の失敗・風呂へ（A36 チンクエのゴミ山） ---
  - {id: L1343, who: luckiny, text: "あ、ありがとうございます！これで”アロマニの香水”が作れます"}
  - {id: L1344, who: luckiny, text: "では、お約束の非常食です", use: false}
  - {id: L1345, who: luckiny, text: "羊飼いをやっていたときの、非常食なんですが、今は、三食付きの住み込みですしその心配はありませんもんね", use: false}
  - {id: L1346, who: luckiny, text: "味はあまり保証できませんが栄養は満点ですので、疲れたときにでも飲んでみてください", use: false}
  - {id: L1347, who: luckiny, text: "では、さっそく”アロマニの香水”を作ります"}
  - {id: L1348, who: luckiny, text: "ふぅ……完成しました！それじゃあ、ミトンさん。これをつけてみてください", cut: ["32:06.43", "32:14.33"]}
  - {id: L1349, who: mitten, text: "んぁ！やめるでち、わかったでち！自分でやるでち！", cut: ["32:23.27", "32:26.97"]}
  - {id: L1350, who: mitten, text: "こ、これでいい匂いになるんでちね！", cut: ["32:30.80", "32:33.23"]}
  - {id: L1351, who: mitten, text: "ど、どうでちか？いい匂いになったでちか？"}
  - {id: L1352, who: luckiny, text: "くんくん……", cut: ["32:46.30", "32:47.90"], hear: 範囲を手で決めた（鼻をかぐ音。声の大きさの山。聞いて確かめる）}
  - {id: L1353, who: luckiny, text: "うぐっ……くえっ！ダ、ダメです……。まだヒドイ臭いです！", cut: ["32:52.34", "32:58.40"]}
  - {id: L1354, who: mitten, text: "これかけたら、いい匂いになるっていったじゃないでちか！"}
  - {id: L1355, who: luckiny, text: "やっぱり、ちゃんと体を洗うしかないみたいですね……"}
  - {id: L1356, who: luckiny, text: "し、仕方ない。魔女邸のお風呂を使わせてもらうしかない、ですね"}
  - {id: L1357, who: mitten, text: "あそこまで行くんでちか？すぐに帰ってこられるでちか？"}
  - {id: L1358, who: luckiny, text: "お風呂だけだから、そんなに時間はかからないと思うけど……"}
  - {id: L1359, who: luckiny, text: "何か用事があるんですか？"}
  - {id: L1360, who: mitten, text: "もしかしたら王子様が通りかかるかもしれないでち……"}
  - {id: L1361, who: mitten, text: "前にも、ちょっとご飯を探しにいった間に王子様が通りすぎたことがあるでち……"}
  - {id: L1362, who: luckiny, text: "大丈夫です。心配しなくても、今日は来ないですよ！"}
  - {id: L1363, who: luckiny, text: "それに……そんな臭い体じゃ、会っても嫌われるだけですよ！"}
  - {id: L1364, who: mitten, text: "う……！わ、わかったでち……。お風呂に入りにいくでち……", cut: ["34:12.94", "34:19.58"]}
  - {id: L1365, who: luckiny, text: "よし、決まりですね。それじゃあ、急いでいって戻ってきましょう"}
  # --- 7-10 魔女邸バスルーム・入浴騒動（A37 バスルーム） ---
  - {id: L1366, who: mitten, text: "これがお風呂でちか！早速、入るでち"}
  - {id: L1367, who: luckiny, text: "あ……、じゃあボク外に出てるから！ちゃんと自分で洗ってくださいね", cut: ["34:41.71", "34:46.65"]}
  - {id: L1368, who: luckiny, text: "うわ……！ちょっと……何が起きてるんですか！？"}
  - {id: L1369, who: metallica, text: "あん？なんだ、これは！？お前たち！ワタシの風呂で何をしている！"}
  - {id: L1370, who: luckiny, text: "ま、魔女様！これはですね……", cut: ["35:16.12", "35:21.26"]}
  - {id: L1371, who: mitten, text: "あ、熱いでち！目にしみるでち！もう無理でちーー！！", cut: ["35:25.68", "35:29.49"]}
  - {id: L1372, who: metallica, text: "ブ、ブリダンゴを風呂に入れただと！？妖精ならいざ知らず、こんな虫を！"}
  - {id: L1373, who: mitten, text: "妖精なんかと比べないでほしいでち！あたちはブリダンゴでち！"}
  - {id: L1374, who: metallica, text: "そんなことはどうでもいい！！"}
  - {id: L1375, who: metallica, text: "今すぐ出ていかないと、お仕置きだぞ！", cut: ["35:53.69", "35:57.05"]}
  - {id: L1376, who: luckiny, text: "すすすみません！！！今すぐ出ていきます！！", cut: ["36:00.70", "36:03.64"]}
  # --- 7-11 森・飛ぶ特訓と喧嘩（A38 チンクエのゴミ山の外れ） ---
  - {id: L1377, who: luckiny, text: "魔女様、怒ってたなぁ……。あとでちゃんと謝らないと……"}
  - {id: L1378, who: mitten, text: "今日は王子様通らなかったみたいでち。よかったでち！"}
  - {id: L1379, who: mitten, text: "そういえば、……あたちの臭いはどうなんでちか？", use: false}
  - {id: L1380, who: luckiny, text: "そうでした……。くんくん……", use: false}
  - {id: L1381, who: luckiny, text: "うん！かなりよくなっていると思いますよ", use: false}
  - {id: L1382, who: luckiny, text: "このくらいの臭いなら香水でカバーできそうです", use: false}
  - {id: L1383, who: mitten, text: "よかったでち！やったでち！これなら王子様にも嫌われないでちか？"}
  - {id: L1384, who: luckiny, text: "そうですね……。あとは……", cut: ["36:59.58", "37:02.74"]}
  - {id: L1385, who: luckiny, text: "6本足で這うのはちょっとやめられませんか？キミは自分で立ち上がれるんですし"}
  - {id: L1386, who: mitten, text: "6本足だと嫌われるんでちか？どうしてでちか！？", use: false}
  - {id: L1387, who: luckiny, text: "それは……。王子様は人間なんですよね？", use: false}
  - {id: L1388, who: luckiny, text: "だったら2本足だし、できれば、近い方がいいかなって……", use: false}
  - {id: L1389, who: mitten, text: "そうでちか……。飛ぶのはダメでちか？", cut: ["37:38.08", "37:40.60"]}
  - {id: L1390, who: luckiny, text: "と、飛べるの！？", cut: ["37:42.87", "37:44.64"]}
  - {id: L1391, who: mitten, text: "飛べるでち！ほら！", cut: ["37:47.61", "37:49.97"]}
  - {id: L1392, who: mitten, text: "はぁ、はぁ……。ど、どうでちか……？", cut: ["37:58.13", "38:01.47"]}
  - {id: L1393, who: luckiny, text: "うーん……。で、でも這うよりはいいかもしれませんね"}
  - {id: L1394, who: luckiny, text: "でも、もう少しだけ速く飛べませんか？それじゃあ、王子様が待ちくたびれますよ"}
  - {id: L1395, who: mitten, text: "は、早く、でちか……！やってみるでち……！", cut: ["38:19.51", "38:23.03"]}
  - {id: L1396, who: mitten, text: "はぁ、はぁ……！疲れたでち……！もう、ダメでち……！", cut: ["38:31.92", "38:35.30"]}
  - {id: L1397, who: luckiny, text: "ええ？こ、これだけですか？この程度じゃ、話になりませんよ……"}
  - {id: L1398, who: luckiny, text: "これは猛特訓が必要ですね。頑張りましょう！"}
  - {id: L1399, who: mitten, text: "ムリでち……", cut: ["38:57.15", "38:58.70"], hear: 範囲を手で決めた（区切った書き起こしの語の時刻。聞いて確かめる）}
  - {id: L1400, who: luckiny, text: "え？", cut: ["39:00.85", "39:01.60"], hear: 範囲を手で決めた（区切った書き起こしの語の時刻。聞いて確かめる）}
  - {id: L1401, who: mitten, text: "これ以上速くなんてムリでち！飛ぶのはすごく大変なんでち！"}
  - {id: L1402, who: luckiny, text: "今はそうかもしれないけど、頑張ればきっと……"}
  - {id: L1403, who: mitten, text: "空を飛ぶこともできないような人に、偉そうなことは言われたくないでち！"}
  - {id: L1404, who: mitten, text: "できないことはできないでち！悔しかったら飛んでみろでち！"}
  - {id: L1405, who: luckiny, text: "な、なんですか……！せっかく特訓してあげてるのに……！"}
  - {id: L1406, who: mitten, text: "誰も特訓なんて頼んでなんかないでち！"}
  - {id: L1407, who: mitten, text: "こんなのなら自分でやったほうがましでち！"}
  - {id: L1408, who: luckiny, text: "そうですか……。よくわかりました……", cut: ["39:51.85", "39:56.21"]}
  - {id: L1409, who: luckiny, text: "じゃあ、もう知りませんよ！勝手に、陰から応援すればいいじゃないですか"}
  - {id: L1410, who: mitten, text: "さ、最初からそうするつもりだったでち！余計なお世話でち！", cut: ["40:08.19", "40:11.96"]}
  - {id: L1411, who: luckiny, text: "本当に帰りますよ！謝るなら今ですよ！"}
  - {id: L1412, who: mitten, text: "うるさいでち！早く帰れでち！"}
  - {id: L1413, who: luckiny, text: "……っ！"}
  # --- 7-12 数日後の魔女邸・消えない臭い・ルッキーニィ不在（A39 バスルーム） ---
  - {id: L1414, who: metallica, text: "おのれっ！！この風呂はどうなってるんだ！"}
  - {id: L1415, who: metallica, text: "あれから何日経ったと思ってる！な、なんで、いつまでも風呂の臭いがとれんのだ……"}
  - {id: L1416, who: arlecchino, text: "申し訳ございません。ワタクシ、毎日ごしごしとお掃除をしているのですが、なかなかにガンコな汚れゆえ"}
  - {id: L1417, who: arlecchino, text: "さすがは、ブリダンゴ姫といったところでございます"}
  - {id: L1418, who: arlecchino, text: "まあ、もとよりそれほど綺麗な状態とはいえませんでしたのでそこまでお気になさらなくても……", use: false}
  - {id: L1419, who: metallica, text: "ふざけたことを言っている暇があったら掃除を続けろ！！", use: false}
  - {id: L1420, who: bisco, text: "おい、この臭い……魔法でなんとかならないのか？食事どころじゃないぞ……", cut: ["42:00.75", "42:07.29"]}
  - {id: L1421, who: metallica, text: "魔法なら何度も試したさ。お前が、泡吹いて気絶している間にな！"}
  - {id: L1422, who: bisco, text: "し、しょうがないだろう……！犬の鼻になってからにおいの強いものは苦手なんだ"}
  - {id: L1423, who: metallica, text: "キヒヒ、先日の異空間ではその犬っ鼻を百騎兵に自慢していたじゃないか", cut: ["42:25.97", "42:32.59"]}
  - {id: L1424, who: bisco, text: "なっ！！おまえ見ていたのか？"}
  - {id: L1425, who: metallica, text: "ちょっとだけな。キヒヒ", cut: ["42:38.30", "42:41.60"], hear: 範囲を手で決めた（区切った書き起こしの語の時刻。聞いて確かめる）}
  - {id: L1426, who: bisco, text: "くっ……覗き見とは！おとなしく引きこもっていると思ったらなんてヤツだ"}
  - {id: L1427, who: bisco, text: "……し、しかしこの臭い……くっ……", use: false}
  - {id: L1428, who: metallica, text: "稀にみる、しつこさだな。何度臭いを消しても、また臭ってくるのだ……", use: false}
  - {id: L1429, who: metallica, text: "さすがはブリダンゴ姫といったところか", use: false}
  - {id: L1430, who: bisco, text: "結局そこか……", note: "（テキストではメタリカ。自分へのツッコミとして不自然なのでビスコ（7章 準備（案）の推定））", use: false}
  - {id: L1431, who: metallica, text: "ところで、ルッキーニィがいないが、どうしたんだ？出かけているのか？"}
  - {id: L1432, who: arlecchino, text: "先ほど、お食事を持って出かけられました"}
  - {id: L1433, who: metallica, text: "出かけたって、どこへ？"}
  - {id: L1434, who: arlecchino, text: "存じあげませんが……。反抗的なお年頃なのかもしれません。はい"}
  - {id: L1435, who: bisco, text: "大丈夫なのか、メタリカ？あいつ、最近元気がなかったが……"}
  - {id: L1436, who: metallica, text: "はぁ……。まったく……", cut: ["43:50.68", "43:53.78"]}
  - {id: L1437, who: metallica, text: "百騎兵、ルッキーニィを捜してこい。オマエなら居場所がわかるだろ？", cut: ["43:55.86", "44:00.90"]}
  - {id: L1438, who: arlecchino, text: "おや、百騎兵様。お帰りなさいませ", use: false}
  - {id: L1439, who: arlecchino, text: "ワタクシですか？ワタクシは現在、風呂掃除を行っております", use: false}
  - {id: L1440, who: arlecchino, text: "ですが、おわかりかと存じますが、ここに染み付いたにおいはなかなか取れません", use: false}
  - {id: L1441, who: arlecchino, text: "ブリダンゴ姫のミトン様、おそろしいお方です", use: false}
  - {id: L1442, who: arlecchino, text: "これはもはや掃除をするよりも風呂場ごと建て替えた方が早いかもしれませんがここが、がんばりどころでございます", use: false}
  - {id: L1443, who: arlecchino, text: "百騎兵様も不毛な任務を……いえすばらしきお役目を賜っているかと存じますが、お励みくださいませ", use: false}
  # --- 7-13 森・陰の見守りとハインツの馬車（A40 チンクエの森の道） ---
  - {id: L1444, who: luckiny, text: "え？百騎兵さん……！", cut: ["46:07.82", "46:09.74"]}
  - {id: L1445, who: luckiny, text: "何をしてるのかって？その……", cut: ["46:11.07", "46:15.21"]}
  - {id: L1446, who: luckiny, text: "あ……！し、静かにしないと……", cut: ["46:16.93", "46:20.11"]}
  - {id: L1447, who: mitten, text: "ん……。んん……", cut: ["46:30.75", "46:32.65"], hear: 範囲を手で決めた（声の大きさの山。書き起こしは出ない。聞いて確かめる）}
  - {id: L1448, who: mitten, text: "んぁ……。おなか……へったでち……", cut: ["46:37.41", "46:41.83"]}
  - {id: L1449, who: mitten, text: "あのお腹がいっぱいになる”実”がまた食べたいでち……"}
  - {id: L1450, who: mitten, text: "……！？あったでち！これはゴミじゃないでち！"}
  - {id: L1451, who: mitten, text: "もぐもぐ！今日もおいしいでち！"}
  - {id: L1452, who: mitten, text: "……？でも、どうして置いてあるんでち？", cut: ["47:12.17", "47:15.13"]}
  - {id: L1453, who: mitten, text: "まぁ、いいでち。ラッキーでち"}
  - {id: L1454, who: mitten, text: "くんくん……。臭くないでちか……？自分じゃよくわからないでち", use: false}
  - {id: L1455, who: mitten, text: "じゃあ、もう一度練習でち！", cut: ["47:29.85", "47:32.66"]}
  - {id: L1456, who: luckiny, text: "ミトンさん……。頑張ってください……！"}
  - {id: L1457, who: luckiny, text: "うん？……馬車の音？", hear: 書き起こしに出ない（もとの切り出しのまま。聞いて確かめる）}
  - {id: L1458, who: mitten, text: "……！？この音は！でち！", cut: ["47:55.18", "47:57.28"]}
  - {id: L1459, who: luckiny, text: "あ、あの人……ハインツだ！"}
  - {id: L1460, who: luckiny, text: "知らないんですか？超有名人ですよ！ハインツ・フォン・フラウゼ！"}
  - {id: L1461, who: luckiny, text: "教皇のご子息で見ての通りの美形。女性にモテモテなんですよ"}
  - {id: L1462, who: luckiny, text: "世間では王子様なんて呼ばれて……。あれ？王子様って、まさか……！", cut: ["48:43.00", "48:51.30"], hear: 範囲を手で決めた（区切った書き起こしの語の時刻。聞いて確かめる）}
  - {id: L1463, who: luckiny, text: "行っちゃった……。何の用だったんだろう……？"}
  - {id: L1464, who: mitten, text: "あぁ……王子様をみちゃったでち……。でへへ", cut: ["49:08.05", "49:13.19"]}
  - {id: L1465, who: luckiny, text: "はぁ……王子様がハインツなんて貴族の息子どころじゃないですよ。本当に高嶺の花じゃないですか……"}
  - {id: L1466, who: luckiny, text: "直接会うなんて、絶対に無理です……"}
  - {id: L1467, who: luckiny, text: "……そうだ。手紙なら、あるいは", cut: ["49:40.15", "49:43.19"]}
  - {id: L1468, who: luckiny, text: "うんうん、それなら代わりにボクが渡すこともできるし"}
  - {id: L1469, who: luckiny, text: "そうだ、そうしよう……"}
  # --- 7-14 メタリカ・北西のピラーへ（A40。千里眼越しの声） ---
  - {id: L1470, who: metallica, text: "キヒヒ、百騎兵！お遊びはここまでだ", cut: ["50:09.70", "50:14.20"]}
  - {id: L1471, who: metallica, text: "ブリダンゴにかまうのもいいが本来の仕事に戻るときだぞ"}
  - {id: L1472, who: metallica, text: "ワタシのダウジング・ペンデュラムによるとピラーはここから北西の方角にあるようだ"}
  - {id: L1473, who: metallica, text: "まぁ、細かい場所まではさすがにわからんがな", use: false}
  - {id: L1474, who: metallica, text: "キヒヒ、そのあたりはまだ、手をつけていない場所だ。一通りのピラーもあわせて片付けて来い"}
