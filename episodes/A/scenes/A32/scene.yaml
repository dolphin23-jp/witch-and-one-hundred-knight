title: 採決
status: 動きの設計と下絵（2026-11-05、Claude。Living Spec「A32 動きの設計（案）」。D-062 の 3D の段階）
approach: D-060・D-062。準備（案）の表の A32（感情の山。台詞はほぼ全部）。巨大メタリカ「ニワトリがあと1回鳴く前に…皆殺しにしてやるぞ！」→ ビスコがニワトリに跳びついて捕まえる「私が手を離すまでニワトリは鳴かない。夜会は終わらない！」→ 議長に「メタリカを、正式な魔女として認めてほしいんだ！」→ メタリカとの言い合い（「お前だって、そんなことで気が済むのか！」）→ 採決。ビスコが剣のつかで床を打つ（賛成1）、パープルピールの反対、ラビィが杖を打ち鳴らす（「こいつ面白れーじゃん」）、巨大メタリカ「ビスコっ！！！」→
  可決「メタリカを沼の魔女と認めます！」→ 帽子のつばで目元を隠す巨大メタリカ（D-016、本音で静かになる）→ 「おめでとう……と言ってもいいのかしら」、帽子の上の白ネズミ「チュー！」。破れた壁から朝の空へ引いて、6章の終わり。A31 からそのまま続く。
