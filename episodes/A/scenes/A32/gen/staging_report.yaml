        Berda, the lye witch, as in her reference sheet, standing, on the right of the frame, with the back to the camera; the Hundred Knight (small, waist-high: big round silver-and-blue helmet with a
        gold crown piece and a pale blue flame plume, black face with orange eyes, oversized blue-and-silver gauntlets, holding its sword), standing, on the right of the frame, in profile, turned toward
        screen right, small in the background. No other people. Low angle looking up; the sky fills the upper part of the frame. Behind: dark wood panelled round walls with tall arched windows full of stars
        between heavy purple-red curtains. Night inside the round council chamber at the top of a gothic witch tower: warm golden light from the glowing planets of a huge orrery hanging over a round table,
        dark wood panelled walls, tall windows full of stars between purple-red curtains.'
