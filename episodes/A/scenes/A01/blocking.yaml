# A01 居間の立ち位置とカメラ割り（演出ノート P-04）。生成の前にここを決め、tools/blocking.py で確かめる。
# 座標は world/living-room-layout.yaml（x: 西0→東8、y: 奥（北）0→手前（南）7、m）。
# cam: [x, y, 高さ]。look: 見る点 [x, y] か人物名。lens: mm（24 広角、35 標準、50 やや望遠、85 望遠）
# gaze: その画での目線（人物: 見る相手の名前 か [x, y]）。frame: 画の大きさ（引き・全身・膝上・胸上・寄り・大寄り・インサート）
scene: A01
layout: world/living-room-layout.yaml

places:
  bisco: [4.6, 0.8]          # ソファの中ほど（人形の右）。ずっとここ
  hk: [3.05, 2.45]           # 百騎兵。テーブルの左（西）の低い椅子。東を向く
  a_east: [5.35, 2.5]        # アルレッキーノ。テーブルの右（東）に立つ（〜019a）
  a_south: [4.0, 3.55]       # アルレッキーノ。テーブルの手前でメタリカのカップに注ぐ（020〜）
  m_top: [0.7, 0.9]          # メタリカ。階段の上
  m_stairs: [0.7, 3.0]       # 階段の途中
  m_stride: [1.7, 4.3]       # 着地してテーブルへ向かう途中
  m_table: [2.45, 3.15]      # 百騎兵の横（左手前）。床の本の山に片足をかける
  m_lean: [3.75, 1.45]       # テーブルの左奥から、ソファのビスコへ身を乗り出す（012a〜013a）
  m_window: [2.0, 0.6]       # 丸窓の前
  m_jab: [3.25, 3.8]         # アルレッキーノの鼻先
  m_mid: [2.5, 1.5]          # 丸窓とテーブルの間
  m_arm: [3.15, 0.75]        # ソファの左の肘掛け
  m_seat: [3.45, 0.8]        # ソファの左の座面（ブーツはテーブルへ）
  m_door: [6.3, 6.3]         # 玄関の手前

# 区間ごとの位置（カットで上書きできる）。null は画面の外・その場にいない
beats:
  morning:  {bisco: bisco, hundred-knight: hk, arlecchino: a_east, metallica: null}
  arrive:   {bisco: bisco, hundred-knight: hk, arlecchino: a_east, metallica: m_table}
  lean:     {bisco: bisco, hundred-knight: hk, arlecchino: a_east, metallica: m_lean}
  window:   {bisco: bisco, hundred-knight: hk, arlecchino: a_east, metallica: m_window}
  tea:      {bisco: bisco, hundred-knight: hk, arlecchino: a_south, metallica: m_window}
  jab:      {bisco: bisco, hundred-knight: hk, arlecchino: a_south, metallica: m_jab}
  think:    {bisco: bisco, hundred-knight: hk, arlecchino: a_south, metallica: m_mid}
  sofa:     {bisco: bisco, hundred-knight: hk, arlecchino: a_south, metallica: m_arm}
  lounge:   {bisco: bisco, hundred-knight: hk, arlecchino: a_south, metallica: m_seat}

# 会話の軸。同じ区間ではカメラを線の同じ側に置く（side は、その側にある点）
axes:
  - {name: ① メタリカ↔百騎兵, cuts: [A01-005c, A01-010b], a: metallica, b: hundred-knight, side: [4.0, 3.5]}
  - {name: ③ メタリカ↔ビスコ, cuts: [A01-011, A01-017b], a: metallica, b: bisco, side: [4.2, 4.0]}
  - {name: ③ メタリカ↔アルレッキーノ, cuts: [A01-024, A01-026], a: metallica, b: arlecchino, side: [3.6, 6.0]}
  - {name: ④ メタリカ↔ビスコ（ソファ）, cuts: [A01-032, A01-039], a: metallica, b: bisco, side: [4.0, 4.0]}

