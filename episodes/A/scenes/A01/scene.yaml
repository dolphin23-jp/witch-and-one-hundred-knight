layout:
  - 居間の中央に長いテーブル。画面奥に窓（朝の光と沼）、画面左に階段、画面右に食器棚
  - 手前の席にビスコ、テーブルの右端に百騎兵。アルレッキーノは食器棚とテーブルの間を行き来する
  - メタリカはテーブルの周りを歩き回り、途中で窓辺へ行き、A01-033 でテーブルの左端に座る
  - 切り返しの軸はメタリカとビスコを結ぶ線。メタリカが歩き回る間は動きに合わせて軸を移す
  - 百騎兵のカットは百騎兵の目の高さにカメラを置く（案）

