      - 遠くの山並み（北東）
      staging: 'In frame (exactly 11 people, from left to right): Purple Peel, the dust witch, as in her reference sheet, standing, in the center of the frame, facing the camera; the Hundred Knight (small,
        about waist-high to an adult: big round silver-and-blue helmet with a gold crown piece and a pale blue flame plume on top, black face with orange eyes, oversized blue-and-silver gauntlets with black
        claws, beige shorts, brown shoes, a sword in his right hand), standing, in the center of the frame, in profile, turned toward screen right; Lily (Liliane), the thin-ice witch, as in her reference
        sheet, standing, in the center of the frame, facing the camera; Bisco (a dog-eared knight girl, as in her reference sheet), standing, in the center of the frame, seen from behind at an angle, turned
        toward screen right; Metallica (the orange-haired witch: huge dark purple witch hat with a red jewel emblem and a rainbow-colored flame at its bent tip, very long orange hair ending in two long
        braids tied with green rings, black top with a red ribbon, baggy dark purple pants with gold concentric circles, curled-toe boots), standing, in the center of the frame, in three-quarter view, turned
        toward screen left; Luckiny (a small goat-like beastfolk: two tall ridged horns, short light ash-brown hair, a red hood and short red cape with white fur trim, green furry goat legs with dark hooves,
        a green fluffy tail, a long brass horn-trumpet on a wooden staff), standing, in the center of the frame, in profile, turned toward screen right; Arlecchino (the tall puppet butler, as in his reference
        sheet), standing, in the center of the frame, in profile, turned toward screen left; Rabi (Rabil Lalla La), the flame witch, as in her reference sheet, standing, in the center of the frame, facing
        the camera; Usamaru, Rabi''s floating rabbit doll, as in its reference sheet, standing, in the center of the frame, facing the camera; Teressa, the apprentice witch, as in her reference sheet, standing,
        in the center of the frame, in three-quarter view, turned toward screen left; Berda, the lye witch, as in her reference sheet, standing, on the right of the frame, in three-quarter view, turned
        toward screen left. No other people. High angle looking down. Behind: the round summit plateau at night under a deep blue starry sky and a bright full moon, the dark tower of piled logs with white
        masks in the center, golden dry grass silvered by moonlight. Late afternoon on a high desert mountain: the low sun in the west, warm golden light on the rock spires and wooden walkways, long shadows,
        the vast desert below in a soft haze.'
    end:
