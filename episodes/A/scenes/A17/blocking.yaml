# A17 偽の招待状・見習い魔女の夜会（夜会編 回2 の最後、選別の 16・17）。D-058、D-060、D-062「3D を全編先に」。Claude の案（2026-11-01）
# Living Spec「A17 動きの設計（案）」（28カット・約5分16秒）。ユーザー指示「回2を始めて良い」（2026-11-01）
# 場所は world/az-brocken-layout.yaml の山頂の峰（z 26）。中央に木の像（[62, −1]）、その南に樽（[62, 2.2]）。夜（night_mtn、東の空に白夜月）。
#   夜会の魔女たちは北の縁に光とともに降りてくる（パープルピール・リリーは北西、ラヴィとウサギ人形・ベルダは北東、テレッサは東）。少し浮いている（z 26.6）。
#   話し手: 原作テキストの「浅黒い魔女」＝パープルピール、「知的な魔女」＝リリー（推定）、「おとなしそうな魔女」＝ベルダ。山頂の「テレッサ」の一部はウサギ人形とラヴィ（audio/A14/original/script.yaml）。
#   見習い魔女たち（4人）は南東から歩いてきて、樽のまわりの輪（半径 1.05m）で踊る。メタリカは 018 で樽の西（m_back）へ下がり、022 からそこでひざをつく。
# 漫符（002 のびっくり、008 の「？」、015 の怒りマーク、026〜028 の涙）は合成（D-027）。下絵では描かない
