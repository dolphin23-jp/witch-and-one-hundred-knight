approach: >-
  D-060・D-062。夜会編 回2 の最後（選別の 16・17）。踊るメタリカの前に夜会の魔女たちが現れ、ダンスを笑い、招待状が偽物だったと明かして消える。
  ビスコは呪いの気配を感じる（伏線）。そこへ見習い魔女たちが来て、同じワルギスのダンスを踊り始める（A16 の「お遊戯」の回収）。
  メタリカはひざをついて泣き崩れ、夜空に魔女たちの高笑いが響いて終わる（感情の山）。
