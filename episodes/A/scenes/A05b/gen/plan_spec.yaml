  DUSK: *dusk
  NIGHT_IN: "Night inside the house: warm orange light from oil lamps and the small hearth fire, deep soft shadows in the corners."
  NIGHT_WIN: "Night inside the house: warm orange light from a small oil lamp by the window, cool blue starlight coming in through the window."
  HEIGHTS_LH: "Heights: Luckiny 1.4 m; the Hundred Knight 0.9 m (small, only about waist-high to an adult)."
  HEIGHTS_H: "Heights: the Hundred Knight 0.9 m (small, only about waist-high to an adult)."
  HEIGHTS_HT: "Heights: the Hundred Knight 0.9 m (small, only about waist-high to an adult); Tito 1.5 m."
  KEEP: "Keep each character's design, colors and proportions identical to their character reference images."
  STYLE: "2D TV anime style, clean line art, cel shading, rich but soft colors, 16:9. No text, no captions, no speech bubbles, no manga symbols (no anger marks, sweat drops or question marks)."
  COMP: >-
    Composition: image {n} is a rough 3D layout render with simple jointed mannequin figures and plain box shapes; follow its camera angle, framing and the
    positions, poses and facing of the characters. Redraw every plain shape as the real rock, building, well or furniture described, in the same place and
    size; do not draw the mannequins, their flat colors or their simple faces. Pale yellow spheres are small oil lamps; ignore small grey floating dots.
  BG: "Background: {imgs} only {verb} what this place looks like (buildings, materials, colors); do not copy {its} viewpoint or framing."
  FIRST: "Image {n} is the first frame of the same shot (made first): keep its background rendering, light and the way the characters are drawn."
