prompts:
  A05b-013: "Red sunset light. The camera follows low from behind as Luckiny and the Hundred Knight walk through a narrow gap between two tall red rocks, Luckiny ahead. She talks from the start; at about 2.2 seconds she glances back over her shoulder with a tired, relieved smile, then faces forward again. As they pass through the gap, the camera cranes up high and back over the rocks in one smooth move, revealing the whole small village in the sandy valley below in the sunset light; the two become tiny figures walking toward it."
  A05b-014: "Late sunset light just inside the village gate. The camera moves backward in front of the two at a low height: Luckiny walks backward ahead of the Hundred Knight in a deep polite bow as she invites it to her house (1 to 3.4 seconds). At about 4 seconds she stops and the Hundred Knight stops too. From about 5.4 seconds she explains with an open hand gesture where her house is, while the camera slowly pushes in on her; at about 9 seconds she bows once more, then turns around and runs off down the lane toward a house at the far edge of the village. The camera pans to follow her running away until she is small in the distance; the Hundred Knight is left behind off screen."
  A05b-015: "Dusk, backlit by low warm sunlight from the west. A low camera with an old round stone well large in the foreground on the left. Just right of the well, the Hundred Knight walks from left to right, stops abruptly at about 1.5 seconds as if hearing a voice in its head, and turns to look back toward the well. Then the camera slowly rises and moves in over the well, looking down into its dark open mouth; deep at the bottom a faint round green glow appears."
  A05b-016: "Night. The camera starts outside the open door of a small house, behind the Hundred Knight as it walks toward the door; inside, in the warm lamplight, Luckiny stands near a curtained doorway at the back and beckons with one hand. At about 1.8 seconds she turns and runs through the curtain into the back room. The camera follows the Hundred Knight in through the doorway. After a short pause, Tito hurries out through the curtain (about 5.3 seconds), comes straight to the Hundred Knight, kneels in front of it and takes its gauntlet in both hands (about 7.3 seconds), speaking gratefully. The camera pans with her and settles slightly above and behind the Hundred Knight, looking over its shoulder at her face and her hands holding its gauntlet."
  A05b-017: "Night inside the house, warm lamplight. A close shot of Tito kneeling and holding the Hundred Knight's gauntlet in both hands; the Hundred Knight's shoulder is a blurred shape at the edge of the frame. At about 1.6 seconds she lets go of its hand and smiles with worry as she speaks. The camera very slowly pushes in on her face."
  A05b-018: "Night inside the house, warm lamplight. Tito gets up from kneeling (about 0.8 seconds) and, gesturing at the bare room with one open hand as she apologizes, walks away from the camera across the room, around the table, toward the small window on the back wall; her back is to the camera for most of the line. The camera moves sideways along the wall to the west as she goes. The Hundred Knight stands near the door in the foreground at first and turns its head to follow her. She stops at the window at the end."
  A05b-019: "Night, Tito at the small window, seen over her shoulder. She looks up at the starry sky through the window, then turns back and smiles apologetically as she speaks. At about 6.3 seconds, with a small gasp, she covers her mouth with one hand as she remembers something, then hurries past the bed to the curtained doorway at the back and goes through it (about 9.9 seconds); the camera follows her, then tilts up to the small window and ends on the starry night sky through it."
  A05b-020: "Night inside the house, warm lamplight and cool blue starlight from the window. A low camera near the shelf by the window: across the room, beyond the table, the Hundred Knight, alone, turns its head toward the window (about 0.9 seconds). At about 1.3 seconds it starts walking across the room toward the shelf; it passes close by the camera at about 3.5 seconds as the camera circles around it, ending looking over its shoulder. It stops at the shelf at about 5 seconds and from about 5.6 seconds looks up at the rolled star charts and a brass astrolabe on it, the starry sky in the small window beyond."
  A05b-021: "Night outside. A close shot of the small lit window of Tito's house. The camera pulls away from the window and cranes up high in one slow continuous move, circling around the north side of the house, until the whole small village in the valley is seen from high above, with a few warm lit windows below; at the very end the camera tilts up into a deep blue night sky full of stars."

