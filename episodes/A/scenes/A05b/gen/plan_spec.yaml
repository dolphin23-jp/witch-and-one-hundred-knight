prompts:
  A05b-013: "Red sunset light. The camera follows low from behind as Luckiny and the Hundred Knight walk through a narrow gap between two tall red rocks, Luckiny ahead. At about 2.5 seconds Luckiny glances back over her shoulder and speaks with a tired, relieved smile. As they pass through the gap, the camera cranes up high and back over the rocks in one smooth move, revealing the whole small village in the sandy valley below, glowing in the sunset; the two become small figures walking toward it."
  A05b-014: "Late sunset light on a sandy village path between houses. The camera moves backward in front of the two at a low height: Luckiny walks backward ahead of the Hundred Knight, bowing politely again and again as she invites it to her house. At about 4 seconds she stops and the Hundred Knight stops too. At about 5.4 seconds she points with one hand toward a house at the far east edge of the village, talking, while the camera slowly pushes in on her; at about 9 seconds she bows once more, then turns around and runs off toward that house. The camera pans to follow her running away; the Hundred Knight stands still, watching her go."
  A05b-015: "Dusk, backlit by the low western sun. A low camera with an old round stone well large in the foreground. Behind the well, the Hundred Knight walks past from left to right, stops abruptly at about 1.5 seconds as if hearing a voice in its head, and turns to look back toward the well. Then the camera slowly rises and pushes in on the dark open mouth of the well; deep at the bottom a faint green glow appears."
  A05b-016: "Night. The camera starts outside the open door of a small house, behind the Hundred Knight as it walks toward the door; inside, in the warm lamplight, Luckiny stands near a curtained doorway at the back and beckons with one hand. At about 1.8 seconds she turns and runs through the curtain into the back room. The camera follows the Hundred Knight in through the doorway. After a short pause, Tito hurries out through the curtain (about 4.7 seconds), comes straight to the Hundred Knight, kneels in front of it and takes its gauntlet in both hands (about 7.3 seconds), speaking gratefully. The camera pans with her and settles slightly above and behind the Hundred Knight, looking over its shoulder at her face and her hands holding its gauntlet."
  A05b-017: "Night inside the house, warm lamplight. A close shot of Tito kneeling and holding the Hundred Knight's gauntlet in both hands; the Hundred Knight's shoulder is at the edge of the frame. At about 1.6 seconds she lets go of its hand and smiles with worry as she speaks. The camera very slowly pushes in on her face."
  A05b-018: "Night inside the house, warm lamplight. Tito gets up from kneeling and, gesturing at the bare room with one open hand as she apologizes, walks across the room around the table toward the small window; the camera trucks sideways along the wall with her, keeping her whole body in frame. The Hundred Knight stands near the door and turns its head to follow her. She stops at the window at the end."
  A05b-019: "Night, Tito at the small window, seen over her shoulder. She looks up at the starry sky through the window, then turns back and smiles apologetically as she speaks. At about 7.8 seconds she suddenly covers her mouth with one hand as she remembers something, then hurries across the room past the bed to the curtained doorway at the back and goes through it; the camera pulls back and pans to follow her, and holds on the doorway as she disappears behind the curtain."
  A05b-020: "Night inside the house, warm lamplight and cool blue starlight from the window. A low camera near the shelf by the window: the Hundred Knight, alone in the room, turns its head toward the window, then walks across the room to the shelf; the camera circles around it as it passes and ends looking over its shoulder. It stops at the shelf and looks up at the rolled star charts and a brass astrolabe on it, the starry sky in the small window beyond."
  A05b-021: "Night outside. A close shot of the small lit window of Tito's house. The camera pulls away from the window and cranes up high in one slow continuous move, circling around the north side of the house, until the whole small village in the valley is seen from high above under a sky full of stars, with a few warm lit windows below; at the very end the camera tilts up into the starry sky."
