tail: >-
  2D TV anime style, clean line art, cel shading, rich but soft colors, dynamic anime camera work. Keep every character's design, colors and proportions
  identical to the first frame and the reference sheets. The Hundred Knight is small (about waist-high to an adult), has no mouth and never speaks; its face
  is black with only two glowing orange eyes. No one else appears. No text, no captions, no speech bubbles, no manga symbols (no anger marks, sweat drops
  or question marks).
