shot: 倒れるテレッサ・ベルダ
acting: 膝立ちのテレッサは、ベルダへ伸ばしていた右手を力なく落とし（0〜0.8 秒）、「し、」の後の間で落ちた手を見下ろす。「死に……」で顔を上げ、「い、いやです……」で小さく首を振る。「ベルダ様……」でもう一度ベルダを見上げて手を伸ばすが、返事はない。「た、た…」で体が揺れて沈み、「助けて……」で沈んだまま顔だけもう一度ベルダへ上げる。最後の「助けて……。」で手・肩・頭の順に沼へ崩れ、声が消えるのと一緒に沼にあごをつけ、目を開けたまま動かなくなる（12.75
  秒）。ベルダは背けていた顔を、倒れたテレッサへゆっくり向けて見下ろし（「……なんということ」、13.5〜14.3 秒）、声の強い所で右手を口へ当てて小さく身を引き（「……！」、14.45 秒）、悲しい目で止まる
dialogue:
- L1045「し、死に……。い、いやです……ベルダ様……た、助けて……助けて……。」
- L1046「……なんということ……！」
sound: null
notes: 2026-11-13 組み直し（案A）。前は 12.7 秒かけてテレッサからベルダへ流れる1本のパンで、テレッサは 4.5 秒で画の外へ出て倒れる所が映らず、5〜12.7 秒は立っているだけのベルダの全身だった。テレッサの顔の長回し（倒れて止まるまで、0〜13.0）と、倒れた目の高さからベルダを見上げる画（13.0〜、021b）に分けた。月は 021 だけ hide_props で消した（021a
  の頭の約 0.7 秒、左の空に大きく出て手より目立つため。020・022 には映らない）。tc・sec は時間の表（164.4・16.9）。2026-11-13 判定の直し（案A13）。ベルダの口を押さえる手が、話す身ぶり（声の大きさで右腕が上下する）でコマごとに顔の前とつばの横を行き来していたので、gaze で右へ向いた顔の口の前に手が来る形（cover に r_arm [35, 35, -20]・r_el
  135）にし、walk 0.96（止まっているので足は動かない）で身ぶりを止めた。倒れの着地を 12.3→12.75 秒（最後の「…けて」が消えるのと同時）、021a→021b の切り替えを 13.0→13.5 秒に遅らせ、動かなくなった顔を約 0.75 秒見せる（L1046 の頭の弱い「……」はこの顔の上に流れる）。「助けて」で手を上げる所は寄りの画の外になるので、顔を上げるだけにした。022
  以降のベルダの cover も同じ形にそろえる必要がある
