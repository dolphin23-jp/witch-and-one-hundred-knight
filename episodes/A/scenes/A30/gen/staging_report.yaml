      staging: 'In frame (exactly 9 people, from left to right): Rubens, the pumpkin witch, as in her reference sheet (rubens_sheet_01): long straight yellow hair covering one eye, an orange frilled headdress,
        stitch scars, a dark green puffed-sleeve dress with orange lacing and frills, bandaged arms and legs, a brown satchel on her back, holding a big green book, standing, on the left of the frame, with
        the back to the camera; Nezaria, the fog witch and chairwoman, as in her reference sheet (nezaria_sheet_01): a very large white witch hat with a lavender underside and a gold ring around it, very
        long straight lavender hair, sleepy half-closed eyes, a white dress with black frills and a gold medallion, holding a tall silver staff with a large ribbed gold head (the talking staff), a tiny
        white mouse sitting on her hat brim, standing, in the center of the frame, facing the camera; Berda, the lye witch, as in her reference sheet, standing, in the center of the frame, with the back
        to the camera; Teressa, the apprentice witch, as in her reference sheet (after A30-005: teressa-swamp_sheet_01, drenched in the swamp), standing, in the center of the frame, in profile, turned toward
        screen right; Lily (Liliane), the thin-ice witch, as in her reference sheet, standing, in the center of the frame, facing the camera; Bisco (short black bob hair with two gold hair ornaments, blue
        eyes, silver shoulder and chest armor over a navy uniform with gold trim, brown belt, a fluffy black-and-white tail, silver armored boots), standing, on the right of the frame, seen from behind
        at an angle, turned toward screen left; Purple Peel, the dust witch, as in her reference sheet, standing, on the right of the frame, facing the camera; Rabi (Rabil Lalla La), the flame witch, as
        in her reference sheet, standing, on the right of the frame, in three-quarter view, turned toward screen left; Usamaru, Rabi''s floating rabbit doll, as in its reference sheet, standing, at the
        far right of the frame, with the back to the camera. No other people. Behind: dark wood panelled round walls with tall arched windows full of stars between heavy purple-red curtains. Night inside
        the round council chamber at the top of a gothic witch tower: warm golden light from the glowing planets of a huge orrery hanging over a round table, dark wood panelled walls, tall windows full
        of stars between purple-red curtains.'
