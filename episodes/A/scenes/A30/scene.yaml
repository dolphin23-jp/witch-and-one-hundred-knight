id: A30
episode: A
title: 毒沼の乱入
status: 動きの設計と下絵（2026-11-05、Claude。Living Spec「A30 動きの設計（案）」。D-062 の 3D の段階）
approach: D-060・D-062。準備（案）の表の A30（核）。地震、メタリカの声「何が伝統だ！」「ありったけの沼をプレゼントしてやる！」。夜光列車が北の壁を破って毒沼を運び込み、文句を言いながら逃げる（最大の見せ場。原作は画面が暗くなる所を、塔の外の列車と突入の閃光で見せる）。テレッサが沼を頭から浴びて倒れる。沼の中からメタリカが現れる（A08-002 の「沼から出る」の繰り返し）。名乗り、ビスコの吹き出し笑い。パープルピールとリリーの作戦の相談は縮める。「目覚めろっ！百騎兵！！！」「初めての共同作業」、小瓶を飲み干して巨大化（沼の噴き上げの中から立ち上がる）。A29
  からそのまま続く。
