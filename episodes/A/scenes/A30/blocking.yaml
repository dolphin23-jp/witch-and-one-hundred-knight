# A30 毒沼の乱入（6章後半 回3 の核）。D-058、D-060、D-062「3D を全編先に」。Claude の案（2026-11-05）
# Living Spec「A30 動きの設計（案）」。準備（案）の表の A30。台詞は audio/A28/original（L1023〜L1080）。
# 場所は world/council-room-layout.yaml。006 から壊れた後（光 council_ruin。only_lit で北〜北東の壁が破れ、天井が抜け、円卓は消え、椅子は倒れ、床は毒沼）。
# 夜光列車は塔の外の空（北）から北の壁を破って入る。原作で画面が暗くなる所は、005 の終わりの白い閃光と 006 の頭の閃光で見せる。
# テレッサは 006 で沼の波にのまれて倒れ、013 から沼を浴びた人形（teressa-swamp、設定画 teressa-swamp_sheet_01）。
# 巨大メタリカ（metallica-giant、背 13m、設定画 metallica-giant_sheet_01）は 038 で床の下からせり上がる（z −14 → 0）。小さいメタリカは沼の噴き上げの中へ沈める。
# このファイルは作業用の補助（Claude のスクリプト）で書いた。直すときはこのファイルを直してよい。
