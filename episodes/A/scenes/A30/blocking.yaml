      - {t: 1.0, face: 312, turn: 0.5, pose: {base: point, walk: 0.96, lean: 8, twist: -8, head: [-4, -6, 0], r_arm: [94, 0, -16], r_el: 0, l_arm: [8, 20, 0], l_el: 20}, blend: 0.6, expr: angry}
      # 句1「ワタシを騙してくれた礼だ！」(1.1〜3.1): 指を突きつけたまま、約2.1 の切れ目で体をリューベンス（約300）へ。「礼だ！」で前へ突き出す。腕はレンズから外し（画面の左）、顔の前を通さない
      - {t: 1.85, pose: {base: point, walk: 0.96, lean: 10, twist: -8, head: [-2, -6, 0], r_arm: [97, 0, -16], r_el: 0, l_arm: [8, 20, 0], l_el: 20}, blend: 0.5}
      - {t: 2.35, face: 300, turn: 0.35, pose: {base: point, walk: 0.96, lean: 7, twist: -6, head: [-8, 4, 0], r_arm: [92, 0, -8], r_el: 12, l_arm: [8, 22, 0], l_el: 20}, blend: 0.35}
      - {t: 2.75, pose: {base: point, walk: 0.96, lean: 15, twist: -9, head: [-3, 4, 0], r_arm: [94, 0, -8], r_el: 0, l_arm: [8, 26, 0], l_el: 25}, blend: 0.18, pease: in}
      - {t: 3.1, pose: {base: point, walk: 0.96, lean: 14, twist: -9, head: [-3, 4, 0], r_arm: [95, 0, -8], r_el: 0, l_arm: [8, 26, 0], l_el: 25}, blend: 0.3}
      # 無音 (3.15〜3.65): 指を下ろし、両腕を開いて手のひらを返す（沼を見せびらかす）。ベルダ（約272）へ
      - {t: 3.65, face: 274, turn: 0.45, pose: {base: stand, walk: 0.96, lean: -6, head: [-8, 0, 0], r_arm: [42, 48, -28], l_arm: [42, 48, -28], r_el: 35, l_el: 35}, blend: 0.45, expr: grin}
      # 句2「存分に／沼の魅力を味わうがいい！」(3.7〜5.95): 開いた両手のひらで足もとの沼をゆっくり払うように、手を下へ・外へ広げ（3.65〜4.85）、倒れたテレッサ（約235）へ体を回して見下ろす
      - {t: 4.85, pose: {base: stand, walk: 0.96, lean: 6, head: [4, 0, 0], r_arm: [24, 52, -12], l_arm: [24, 52, -12], r_el: 18, l_el: 18}, blend: 1.05}
      - {t: 5.45, face: 240, turn: 0.55, pose: {base: stand, walk: 0.96, lean: 12, head: [8, 0, 0], r_arm: [22, 42, -10], l_arm: [62, 42, -22], r_el: 25, l_el: 18}, blend: 0.55}
      - {t: 5.95, pose: {base: stand, walk: 0.96, lean: 13, head: [9, 0, 0], r_arm: [22, 44, -10], l_arm: [64, 44, -22], r_el: 25, l_el: 18}, blend: 0.4}
      # 無音 (5.95〜6.3): 腕を引いて小さく沈む（予備動作）
      - {t: 6.3, pose: {base: stand, walk: 0.96, drop: 0.1, lean: 16, head: [4, 0, 0], r_arm: [8, 26, 12], l_arm: [8, 26, 12], r_el: 80, l_el: 80}, blend: 0.33, expr: shout}
      # 「死ぬほど」(6.3〜7.2): カメラ（約287）へ向き直り、前のめりに凄む
      - {t: 6.8, face: 287, turn: 0.45, pose: {base: stand, walk: 0.96, drop: 0.08, lean: 18, head: [-4, 0, 0], r_arm: [10, 28, 12], l_arm: [10, 28, 12], r_el: 85, l_el: 85}, blend: 0.45}
      - {t: 7.3, pose: {base: stand, walk: 0.96, drop: 0.1, lean: 19, head: [-6, 0, 0], r_arm: [8, 28, 12], l_arm: [8, 28, 12], r_el: 88, l_el: 88}, blend: 0.4}
      # 「もってきたからな！！」(7.3〜8.15): 両腕を振り上げて V に広げる（決めは台詞の上）。叫ぶ間は顔をカメラへ向けたまま（あごは少しだけ上げる）
      - {t: 7.68, pose: {base: stand, walk: 0.96, lean: -9, head: [-12, 0, 0], r_arm: [14, 126, 0], l_arm: [14, 126, 0], r_el: 10, l_el: 10}, blend: 0.36, pease: out}
      - {t: 8.15, pose: {base: stand, walk: 0.96, lean: -10, head: [-13, 0, 0], r_arm: [14, 127, 0], l_arm: [14, 127, 0], r_el: 10, l_el: 10}, blend: 0.4}
      # 8.2〜: 叫び終えて得意顔（grin）。あごを上げてのけぞり → あごを少し下ろし、低いカメラ（巻き込まれた魔女たちの目の高さ）を見下ろして止める。V の両拳は画の中に収める
      - {t: 8.2, expr: grin}
      - {t: 8.6, pose: {base: stand, lean: -12, head: [-20, 0, 0], r_arm: [14, 127, 0], l_arm: [14, 127, 0], r_el: 12, l_el: 12}, blend: 0.4}
      - {t: 9.3, pose: {base: stand, lean: -9, head: [-8, 0, 0], r_arm: [14, 123, 0], l_arm: [14, 123, 0], r_el: 16, l_el: 16}, blend: 0.7}
    cam_keys:
    # 沼の面に近い低い所（0.45m・26mm・全身）。足もとの碧の沼と、その向こうのパープルピール・ラビィとウサ丸（リリーは画面の左の端の瓦礫の陰）
    - {t: 0.0, cam: [45.7, 49.82, 0.45], look: metallica, look_h: 0.95, lens: 26, frame: 全身}
    - {t: 3.6, cam: [45.72, 49.825, 0.45], look: metallica, look_h: 0.95, lens: 26}
    # 句2 (3.6〜5.95): ごく遅い寄り（約0.2m）。6.0 からの押し込みへつなぐ
    - {t: 5.95, cam: [45.92, 49.875, 0.455], look: metallica, look_h: 1.0, lens: 27.2}
    # 6.0〜8.2: 台車で押し込み（始めから合わせて約0.75m）、35mm の低い寄りへ（宣言した軸の側のまま）。振り上げた V の両拳が画の中に収まる所で止める
    - {t: 8.2, cam: [46.42, 50.01, 0.6], look: metallica, look_h: 1.12, lens: 35, frame: 腰上, ease: inout}
    - {t: 9.3, cam: [46.47, 50.02, 0.6], look: metallica, look_h: 1.12, lens: 35}
    shake: [{t: [7.25, 8.1], amp: 0.7}]
    # 「もってきたからな！！」で、メタリカの後ろ（画面の左、パープルピールの左）の沼から碧の噴き上げ（016 と同じ mist）。ラビィの前はふさがない。
    # 終わりをカットの外（11.5）に置くのは、mist の強さが範囲の 1/3 で最大になり、半ばで跳ねるため（9.3 で範囲のちょうど半ば）
    # 2本の mist を半段ずらして重ね、球の間を埋めて切れ目のない柱にする（1本の h 4.2・r 0.6 では、離れた球を積んだ形に見えた）
    fx:
    - {kind: mist, t: [7.1, 11.5], at: [52.0, 49.65], r: 0.6, h: 3.6, color: [40, 190, 140], alpha: 0.4}
    - {kind: mist, t: [7.15, 11.5], at: [52.05, 49.6], r: 0.5, h: 3.1, z: 0.35, color: [40, 190, 140], alpha: 0.4}
    # 瘴気の泡はメタリカより後ろ（東の魔女たちの側）だけに。カメラと顔の間を通さない
    ambient: {at: [54.2, 51.2, 1.6], box: [8.5, 10.0, 4.0]}
    act: {start: 腕を広げたメタリカが、議会の魔女たちを順に指さす, do: （「ワタシを騙してくれた礼だ！存分に沼の魅力を味わうがいい！死ぬほどもってきたからな！！」）, end: 両腕を広げて得意顔のメタリカ}
    camera: メタリカの西の沼の面に近い低い所（0.45m、宣言した軸の側）から全身をあおり、背景にパープルピール・ラビィとウサ丸。句2 でごく遅く寄り、「死ぬほど」から台車で押し込み、決めの「もってきたからな！！」で低い寄り（揺れ）
    kind: M
