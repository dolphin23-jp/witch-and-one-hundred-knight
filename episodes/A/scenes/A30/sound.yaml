# BGM: 原作では M41 が地震とメタリカの声の間も続く。下絵では地震（001 の頭）で M41 をぷつりと止め（溜め、docs/previs_checklist.md 6）、
#   夜光列車が塔の外を駆ける 005 から M42「毒沼の乱入」（新しく分けた曲。約63.5秒のループ）。A31 の霧まで続く。
# 床が毒沼になってから（006〜）は沼の泡の音を小さくずっと（E42）
