title: 魔女邸・閉じこもるメタリカとマーニィ（翌朝）
status: 動きの設計と下絵（2026-11-02、Claude。Living Spec「A18 動きの設計（案）」。D-062 の 3D の段階）
approach: >-
  D-060・D-062。6章後半 回1 の最初（Living Spec「6章後半 準備（案）」の A18、表のとおり約27分、2026-11-02 ユーザー判断）。
  偽の招待状の翌朝。部屋に閉じこもったメタリカの扉の前に冷めた食事。扉の下から緑の光と煮える音が漏れる（A30 の毒沼の逆襲の伏線、ユーザー判断「匂わせる」）。
  居間ではビスコの呪いの話、マーリカを頼る案、章の題（Revival の読み上げ）、マーニィの窓破りの登場。百騎兵はマーニィと森の庭園へ。
