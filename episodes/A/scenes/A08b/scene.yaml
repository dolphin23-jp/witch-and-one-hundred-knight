time: 夜明け

sections:
- {name: 夜明けと礼, cuts: [A08b-008, A08b-011], note: 夜明けの村。ティトの礼、ふんぞり返るメタリカ}
- {name: 弟子入りと夜会, cuts: [A08b-012, A08b-022], note: 割り込むルッキーニィ、そっぽを向くメタリカ、まわりを回って質問攻め（見せ場）、顔を近づけるメタリカ}
- {name: 押し問答, cuts: [A08b-023, A08b-027], note: ティトが止めに入る。「ボクが探しておきます」「なに？」}
- {name: スズの音草, cuts: [A08b-028, A08b-033], note: ティトの説明。村の外の砂地、芽吹いて枯れる草（イメージ）、恐怖は取り払えない}
- {name: 約束と別れ, cuts: [A08b-034, A08b-039], note: 必死に頼むルッキーニィ、条件を出すメタリカ、跳び上がって喜ぶ、帰っていく二人（見せ場）}

