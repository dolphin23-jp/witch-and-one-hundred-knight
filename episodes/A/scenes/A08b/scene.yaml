# シーンの共通設定。カットごとの内容は shots/ に1カット1ファイル。
id: A08b
episode: A
title: ピラーと弟子入り（後半、夜明けの村・ティトの家の前）
status: 動きの設計と下絵（2026-10-31、Claude。Living Spec「A08 動きの設計（案）」。D-062 の 3D の段階）
approach: >-
  D-060・D-062。翌朝のティトの家の前。ティトの礼、弟子入りの押し問答、魔女の噂話（夜会の魔女たちの伏線）、スズの音草の説明、約束と別れ。
  会話が長い（声だけで約4分）ので、立ち位置を動かし（ルッキーニィがメタリカのまわりを回る）、カメラの向き・高さ・レンズを散らす。
  031 はスズの音草のイメージ（芽吹いて枯れる）。039 は大きく引いて上がり、砂漠編を締める。カットの番号は A08 の続き。
source: 原作テキスト、原作音源パート18 の 01:20〜08:45、「砂漠編 台詞と画（構想）」の A08 006〜018
