# A22 の BGM・効果音の置き場所（D-068、2026-11-02）。tools/previs_reel.py が通しの下絵に重ねる。書き方は previs_reel.py の sound_items()。
# 音量は台詞を 1.0 とした大きさ（素材の大きさをならしてから掛ける）。BGM 0.28、環境音 0.07〜0.15、効果音 0.3〜0.8
scene: A22
bgm:
  # 原作どおり（パート20 の 18:38〜25:18）: 頭は無音（18:38〜18:59）→ M10 メタリカの話（18:59〜）→ M05 と M14 が交互、M18 の短いつなぎが2回
  # 原作の切れ目を台詞の位置からこの場面の秒に直し、台詞の途中で替わらないよう少しずらした
  - {src: audio/bgm/catalog/M10.ogg, cut: A22-001, t: 16.0, until: {cut: A22-002b, t: 7.4}, loop: true, fade_in: 1.5, fade_out: 1.2, volume: 0.28}
  # 切符と分かってから（「夜会へ行けるってことか？」の前）
  - {src: audio/bgm/catalog/M05.ogg, cut: A22-002b, t: 7.2, until: {cut: A22-004, t: 7.0}, loop: true, fade_in: 1.0, fade_out: 1.0, volume: 0.28}
  # 「返事はありませんでした……」の後のため息
  - {src: audio/bgm/catalog/M18.ogg, cut: A22-004, t: 6.8, until: {cut: A22-005, t: 12.6}, loop: true, fade_in: 0.8, fade_out: 0.8, volume: 0.28}
  - {src: audio/bgm/catalog/M14.ogg, cut: A22-005, t: 12.4, until: {cut: A22-006, t: 7.0}, loop: true, fade_in: 0.8, fade_out: 0.8, volume: 0.28}
  # 「恨みに恨んでいる」から
  - {src: audio/bgm/catalog/M05.ogg, cut: A22-006, t: 6.8, until: {cut: A22-007b, t: 6.6}, loop: true, fade_in: 0.8, fade_out: 0.8, volume: 0.28}
  # 「メタリカじゃあるまいし」から
  - {src: audio/bgm/catalog/M14.ogg, cut: A22-007b, t: 6.0, until: {cut: A22-008, t: 6.4}, loop: true, fade_in: 0.8, fade_out: 0.8, volume: 0.28}
  # 「正式に夜会に呼んでもらえる」の前から
  - {src: audio/bgm/catalog/M05.ogg, cut: A22-008, t: 6.2, until: {cut: A22-009, t: 8.0}, loop: true, fade_in: 0.8, fade_out: 1.0, volume: 0.28}
  # 009 ビスコが目を伏せる伏線の寄り（「やってみればもしかしたら……」）
  - {src: audio/bgm/catalog/M18.ogg, cut: A22-009, t: 7.8, until: {cut: A22-009, t: 16.8}, loop: true, fade_in: 1.0, fade_out: 1.0, volume: 0.28}
  - {src: audio/bgm/catalog/M14.ogg, cut: A22-009, t: 16.4, until: {cut: A22-010, t: 7.4}, loop: true, fade_in: 0.8, fade_out: 0.8, volume: 0.28}
  # 「そりゃあ、百騎兵ちゃんでしょ」から
  - {src: audio/bgm/catalog/M05.ogg, cut: A22-010, t: 7.2, until: {cut: A22-010b, t: 5.6}, loop: true, fade_in: 0.8, fade_out: 0.8, volume: 0.28}
  # 「すごく行きたそうな顔してるわよ。でも」から
  - {src: audio/bgm/catalog/M14.ogg, cut: A22-010b, t: 5.4, until: {cut: A22-011b, t: 7.2}, loop: true, fade_in: 0.8, fade_out: 0.8, volume: 0.28}
  # 「ヘッカヘンネの隠し森にあった駅よ？」から、百騎兵を見送って終わり
  - {src: audio/bgm/catalog/M05.ogg, cut: A22-011b, t: 7.0, until: {cut: A22-011b, t: 24.0}, loop: true, fade_in: 0.8, fade_out: 2.5, volume: 0.28}
