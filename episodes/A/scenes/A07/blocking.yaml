    bg: well_up
    light_en: "Night: looking up from inside the deep stone well, the round rim far above against a deep blue starry sky with a bright moon."
    act: {start: 夜の村。井戸の口の上から、こちらへ歩いてくる百騎兵, do: 百騎兵が井戸の縁まで来る。カメラがそのまま井戸の中へ沈み、見上げる形になる。縁に上った百騎兵がのぞき込む（月を背に）, end: 井戸の縁から見下ろす百騎兵の顔と、その上の月, sync: L206「おい……その井戸……臭うぞ。」は 2.6秒から（2026-11-01 の見直しで、地上を歩いてくる所を足した）}
    camera: 井戸の口の上から歩いてくる百騎兵 → カメラが井戸の中へ沈みながら見上げる（井戸の縁と百騎兵の顔、その上に月）
