# A07 井戸と地下空洞・砂食みとの戦い（D-058、D-060、D-062「3D を全編先に」）。Claude の案（2026-10-31）
# 「砂漠編 台詞と画（構想）」の A07（001〜008 は台詞、009〜018 は台詞なしの戦い）。ユーザー承認: 3D の段階を進める「OKです。進んでください」（2026-10-31）
# 場所は world/underground-cavern-layout.yaml（x: 西0→東60、y: 北0→南60、m）。高さ z: 空洞の床 0、村の地面 30（井戸の口）
#   井戸は (30, 30) の真上（筒は z 14〜30、内側の半径 0.65）。空洞は中心 (30, 30)、天井 14m。北の壁の横穴 (30, 13) から砂食みが出る。ピラーは床の北西寄り (23.5, 21.5)
# 人物の keys の z は床からの高さ（地上の百騎兵は z 30）。カメラの cam は [x, y, 高さ]
# 姿勢に ready（剣を構える）・slash（斬る）を足した。効果に eyes（闇で光る目）・spark（火花）・light（だんだん強くなる光）を足した
# 016 の「一瞬のスロー」は、下絵ではキーの動きそのものを遅くして入れた（2026-11-01 の見直し）
# 2026-11-01 の見直し（ユーザー）: ピラーは守護者（砂食み）を倒すまで隠れていて見えない（D-070）。005〜017 は hide_props で隠し、018 で床からせり上がって現れる（reveal）。
#   戦い（009〜017）を組み直した: 跳び上がって襲いかかる → 跳んでかわす → 側面を斬る → 潜る → 足元から突き上げ、宙へ → 天井を蹴って空中の砂食みの目に突き立てる → 着地・崩れ落ちる。寄りの 013b・015b を足した
#   姿勢 nod（うなずく）・tumble（宙返り）・flip（天井に逆さ）・dive（頭から突っ込む）、カメラの roll（画面の傾き）を足した
# 砂食みは体が頭の通った道をたどる。008 から先は after: <前のカット> で前のカットの続きの形から始める（2026-10-31 の見直し）
scene: A07
layout: world/underground-cavern-layout.yaml
map_ymax: 60
lighting: cave
hide_props: [crystal_1]   # ピラーは守護者を倒すまで見えない（D-070）。018 だけ hide_props: [] と reveal

places:
  rim:      [30.0, 30.75]  # 井戸の縁の上（石の縁の上 z 30.8）
  well:     [30.0, 30.0]
  land:     [30.0, 30.0]   # 空洞の床（光の円の中）
  dodge:    [32.4, 31.0]   # 010 跳んでかわした先
  slash:    [31.2, 31.4]   # 011 踏み込んで斬る所（横を通る胴に届く）
  hk_back:  [32.3, 31.0]   # 011 斬って跳び退いた所（012〜014 この真下から突き上げ）
  ceil:     [32.0, 30.7]   # 015 天井に逆さに着地（天井の高さ 13.9）
  hk_end:   [33.8, 34.8]   # 017・018 着地した百騎兵
  tunnel:   [30.0, 13.0]
  pillar:   [23.5, 21.5]

start:
  hundred-knight: {at: [30.0, 33.0], face: 0}

cuts:
