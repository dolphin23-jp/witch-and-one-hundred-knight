# A07 の BGM・効果音の置き場所（D-068、2026-11-01 の見直し）。tools/previs_reel.py が通しの下絵に重ねる。書き方は previs_reel.py の sound_items()。
# 音量（volume）は台詞を 1.0 とした大きさ（素材の大きさをならしてから掛ける）。BGM 0.28、環境音 0.07〜0.2、足音は自動、効果音 0.3〜0.9
# 戦い（009〜017）は台詞がないので効果音が主役。素材は audio/sfx/index.yaml（E23〜E41 を A07 のために足した。CC0 と自作）
# rate: 生き物の声を低く遅くして大きく聞かせる。井戸に落ちた所（004 の 3.5秒）から後は、効果音に地下の響きを付ける（echo）
scene: A07
echo: {from: {cut: A07-004, t: 3.5}, kind: cave}
bgm:
  # 原作どおり（docs/audio_catalog.md）。M07 獣人の村: 001〜004（A06-015 から続く。ゲームの 22:10〜22:58）。跳んだ所で切る
  - {src: audio/bgm/p17-1_village_loop.ogg, cut: A07-001, t: 0.0, until: {cut: A07-004, t: 3.4}, from: 14.0, loop: true, fade_in: 0.8, fade_out: 0.8, volume: 0.28}
  # M37 地下空洞に降りた所の短い曲: 005〜007 の壁が破れる所まで（ゲームの 22:58〜23:19）
  - {src: audio/bgm/catalog/M37.ogg, cut: A07-005, t: 0.0, until: {cut: A07-007, t: 1.3}, fade_in: 0.3, fade_out: 0.4, volume: 0.28}
  # M20 地下空洞（戦いの曲）: 007 の壁が破れる所から（ゲームの 23:19〜24:52）。013b の溜めで一瞬止め、014 の突き上げで戻す（Claude の案）
  - {src: audio/bgm/M20_loop.ogg, cut: A07-007, t: 1.3, until: {cut: A07-013b, t: 0.9}, loop: true, fade_in: 0.3, fade_out: 0.6, volume: 0.28}
  - {src: audio/bgm/M20_loop.ogg, cut: A07-014, t: 0.0, until: {cut: A07-018, t: 7.0}, from: 40.0, loop: true, fade_out: 1.5, volume: 0.28}
