  - {src: audio/sfx/metal_clank.ogg, cut: A07-004, t: 2.9, volume: 0.22}   # しゃがむ（鎧）
  - {src: audio/sfx/whoosh_long.ogg, cut: A07-004, t: 3.3, volume: 0.5}    # 井戸へ落ちる
