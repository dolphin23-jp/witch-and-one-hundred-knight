# シーンの共通設定。カットごとの内容は shots/ に1カット1ファイル。
id: A40
episode: A
title: 陰の見守りと王子様
status: 動きの設計と下絵（2026-11-06、Claude。Living Spec「A40 動きの設計（案）」。D-062 の 3D の段階）
approach: D-060・D-062。準備（案）の表の 7-13（残す）と 7-14（まとめる）。百騎兵が、ゴミ山の車輪の陰に隠れたルッキーニィを見つける（「し、静かにしないと……」）。目を覚ましたミトンが、木箱の上に置かれた実を見つけて食べ（「……？でも、どうして置いてあるんでち？」）、また飛ぶ練習を始める（「じゃあ、もう一度練習でち！」）。陰から「ミトンさん……。頑張ってください……！」。馬車の音に、ミトンと二人は街道の柵の陰へ。紺と金の豪華な馬車が止まり、窓からハインツが顔を出す（「教皇のご子息で見ての通りの美形。女性にモテモテなんですよ」「世間では王子様なんて呼ばれて……。あれ？王子様って、まさか……！」）。馬車が去り、「あぁ……王子様をみちゃったでち……。でへへ」。ルッキーニィは「……そうだ。手紙なら、あるいは」と思いつく。最後にメタリカ（千里眼越しの声）が北西のピラーへ向かわせる（移動は短いつなぎ）。くんくんの独り言（L1454）は削る。
source: 原作テキスト（Drive「Mj100 7-8」）、原作音源パート25 の 20:00〜25:30 ごろ
