title: 入浴騒動
status: 動きの設計と下絵（2026-11-06、Claude。Living Spec「A37 動きの設計（案）」。D-062 の 3D の段階）
approach: D-060・D-062。準備（案）の表の 7-10（魔女邸バスルーム・入浴騒動）。ミトンが浴槽に飛び込み（「これがお風呂でちか！早速、入るでち」）、ルッキーニィは顔をそむけて外へ。浴槽の沼の湯が泡立ち、湯気が噴き上がる。戻ったルッキーニィの後ろにメタリカ（「お前たち！ワタシの風呂で何をしている！」）。湯の中でもがくミトン（「あ、熱いでち！目にしみるでち！もう無理でちーー！！」）、妖精の言い合いの繰り返し、「今すぐ出ていかないと、お仕置きだぞ！」で、ルッキーニィがミトンを引っぱって逃げ出す。
source: 原作テキスト（Drive「Mj100 7-8」）、原作音源パート25 の 10:00〜12:00 ごろ
