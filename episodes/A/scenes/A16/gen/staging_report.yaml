        wooden staff), standing, in the center of the frame, seen from behind at an angle, turned toward screen right. No other people. High angle looking down. Behind: a round plateau on the mountain summit
        paved with weathered stones carved with spiral circles, tufts of golden dry grass, an old wooden fence at the cliff edge, a tall dark tower of piled black logs with white heart-shaped masks in the
        center, the dusk sky. Late afternoon on a high desert mountain: the low sun in the west, warm golden light on the rock spires and wooden walkways, long shadows, the vast desert below in a soft haze.'
