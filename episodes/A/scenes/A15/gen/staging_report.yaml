        view, turned toward screen right. No other people. High angle looking down. Behind: the round mountain-top plateau now flooded by a glowing teal-green poisonous swamp around a huge blooming pale-green
        flower pillar, misty fumes, the sunset sky. Late afternoon on a high desert mountain: the low sun in the west, warm golden light on the rock spires and wooden walkways, long shadows, the vast desert
