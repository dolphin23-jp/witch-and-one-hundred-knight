id: A36
episode: A
title: 香水の失敗とお風呂
status: 動きの設計と下絵（2026-11-06、Claude。Living Spec「A36 動きの設計（案）」。D-062 の 3D の段階）
approach: D-060・D-062。準備（案）の表の 7-09（香水の失敗・風呂へ）。百騎兵がアロマニのキモを持ち帰り、ルッキーニィが木箱の上で香水を作る（手早い台詞なしの間）。香水をかけてもらうのを嫌がって自分でかけるミトン（「んぁ！やめるでち、わかったでち！自分でやるでち！」）、ルッキーニィがかいで倒れかける（「うぐっ……くえっ！ダ、ダメです……。まだヒドイ臭いです！」）。魔女邸のお風呂を使うことになり、ミトンは「もしかしたら王子様が通りかかるかもしれないでち……」と街道の方を見る。「そんな臭い体じゃ、会っても嫌われるだけですよ！」で決まり、三人は街道へ向かう。
source: 原作テキスト（Drive「Mj100 7-8」）、原作音源パート25 の 5:30〜10:00 ごろ
