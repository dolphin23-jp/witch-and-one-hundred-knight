video_note: >-
  開始の画＋（必要なカットだけ終わりの画）＋設定画＋下絵（Blender、854x480、動きのキー入り）＋口パク参照（ルッキーニィの台詞で口が見えるカット）。最短4秒・整数秒。
  006 は fast と std（1秒3クレジット）を比べてから、残りの見せ場の作り方を決める（D-060）。生成音声は使わない（generate_audio=false）
tail: >-
  2D TV anime style, clean line art, cel shading, rich but soft colors, dynamic anime camera work. Keep every character's design, colors and proportions
  identical to the first frame and the reference sheets. Mid-afternoon desert light: the sun lower in the west-southwest, warm golden light, longer
  shadows, heat haze. The Hundred Knight has no mouth and never speaks; its face is black with only two glowing orange eyes. No one else appears.
  No text, no captions, no speech bubbles, no manga symbols (no anger marks, sweat drops or question marks).
