# A05 砂食み（砂漠、001〜012）の立ち位置・動き・カメラ（D-058、D-060「動きを先に決める」）。Claude の案（2026-10-30）
# Living Spec「A05 動きの設計（案）」タブの 001〜012（ユーザー承認: 進め方・006〜008 の見せ場を足す）。013〜020（村とティトの家）は A05b
# 場所は world/tettara-dunes-layout.yaml（x: 西0→東80、y: 北0→南60、m）。方位: 北 0・東 90・南 180・西 270
# 動きのキー（tools/motion.py の頭のコメント）:
#   keys:      人物の時刻ごとの位置・向き・高さ・姿勢（t はカットの頭からの秒）
#   cam_keys:  カメラの時刻ごとの位置（follow で人物・生き物を追う）・見る点・レンズ
#   shake:     カメラの揺れ（度）
#   creatures: 砂食み（体長 8m。z が負は砂の下で、浅い所は砂の上に影と盛り上がり）
#   fx:        砂の噴き上げ（plume）、波紋（ring）
#   extra_en / extra_en_end: 静止画の指示文に足す、人物以外に映るもの（砂食み・砂の噴き上げ）
# 確かめるのは python tools/staging.py episodes/A/scenes/A05（略図）と tools/previs.py --motion（0.5秒ごとのコマ）
scene: A05
layout: world/tettara-dunes-layout.yaml
map_ymax: 60

places:
  lk0:       [19.0, 33.6]   # 001 ルッキーニィ 走り始め（砂丘 dune_a の西のふもと）
  hk0:       [16.2, 34.3]   # 001 百騎兵
  lk_crest:  [27.6, 31.6]   # 砂丘の稜線（高さ約3m）
  hk_crest:  [26.8, 32.3]
  lk1:       [31.0, 31.6]   # 001 終わり（稜線を越えて東の斜面）
  hk1:       [29.6, 32.2]
  lk_stop:   [38.0, 32.4]   # 002〜005 ルッキーニィが止まって身を低くする（窪地）
  hk_stop:   [37.3, 33.1]   # 002〜012 百騎兵
  lk_flat:   [38.2, 32.2]   # 006〜 ルッキーニィが伏せる
  two:       [37.65, 32.75] # 二人の間
  rise:      [34.6, 37.4]   # 砂食みが飛び出す所（南西）
  dive:      [41.6, 27.8]   # 砂食みが潜る所（北東）
  far_ne:    [52.0, 19.0]   # 去っていく先（北東の大きな砂丘の方）

