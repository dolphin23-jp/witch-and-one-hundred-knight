title: 飛ぶ特訓と喧嘩
status: 動きの設計と下絵（2026-11-06、Claude。Living Spec「A38 動きの設計（案）」。D-062 の 3D の段階）
approach: D-060・D-062。準備（案）の表の 7-11（縮める）。夕方、風呂から戻った三人。6本足で這うのをやめられないかと言われ、ミトンが透けた羽根を初めて広げて飛ぶ（「飛べるでち！ほら！」。羽根は形見の伏線なので寄る）。遅い飛び方に「ええ？こ、これだけですか？」「猛特訓が必要ですね」、「空を飛ぶこともできないような人に、偉そうなことは言われたくないでち！」からの言い合い、「うるさいでち！早く帰れでち！」「……っ！」。走り去るルッキーニィを追いかけ、残るミトンを高い所から小さく（準備（案）のカメラの方針）。
source: 原作テキスト（Drive「Mj100 7-8」）、原作音源パート25 の 12:00〜16:30 ごろ
