# A38 の BGM・効果音の置き場所（D-068、2026-11-06）。tools/previs_reel.py が通しの下絵に重ねる。書き方は previs_reel.py の sound_items()。
# 音量は台詞を 1.0 とした大きさ（素材の大きさをならしてから掛ける）。BGM 0.24〜0.28、環境音 0.07〜0.15、効果音 0.3〜0.8。足音は自動（footsteps.yaml。床は石か砂の音）
# BGM は原作どおり（パート25）: M43「ブリダンゴ姫」が続く（11:19〜16:19）。喧嘩の終わり（023）で消える
scene: A38
bgm:
- src: audio/bgm/M43_loop.ogg
  cut: A38-001
  t: 0.0
  until: {cut: A38-023, t: 3.0}
  loop: true
  fade_in: 1.5
  fade_out: 3.0
  volume: 0.22
sfx:
- src: audio/sfx/forest_air_loop.ogg
  cut: A38-001
  t: 0.0
  until: {cut: A38-023, t: 6.0}
  loop: true
  fade_in: 2.0
  fade_out: 2.0
  volume: 0.09
- {src: audio/sfx/whoosh_long.ogg, cut: A38-005, t: 1.0, rate: 0.8, volume: 0.35}
- {src: audio/sfx/whoosh_long.ogg, cut: A38-009, t: 4.1, rate: 0.9, volume: 0.3}
- {src: audio/sfx/thud_land.ogg, cut: A38-010, t: 1.75, rate: 1.1, volume: 0.5}
- {src: audio/sfx/wind_gust.ogg, cut: A38-023, t: 0.5, rate: 0.8, volume: 0.25}
