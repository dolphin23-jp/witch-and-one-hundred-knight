id: A33
episode: A
title: 魔女会報とミトンの来訪
status: 動きの設計と下絵（2026-11-06、Claude。Living Spec「A33 動きの設計（案）」。D-062 の 3D の段階）
approach: D-060・D-062。準備（案）の表の 7-01（縮める）と 7-02（縮める）。魔女会報が届き（「キヒヒ！来たぞ来たぞ！”魔女会報”だ！」）、メタリカが「沼の魔女の名を歴史に刻んでやる！」と浮かれる。ビスコの独白「(私に呪いをかけた魔女が……。)」、マーニィの旅立ち（「自称旅人でございますゆえ」）。強い臭いとともに、大きな虫（ブリダンゴ姫＝ミトン）が這って入り、ビスコが気絶する（引き）。ミトンが立ち上がる（低い所から見上げる）。「王子様をオウエンしたいんでち！」に、メタリカは「何をしても無駄だ」「お前、自分自身のことを何もわかってないようだな……」（伏線。寄る）。ミトンが怒って帰った後、アルレッキーノの魔女ドクトリン、ルッキーニィの「でも、ちゃんとやれば何か、できることだってあるかもしれないじゃないですか」で、メタリカがルッキーニィと百騎兵に調べさせる。最後に章の題「第3幕
  第7章 魔女と虫姫」（Revival の読み上げ、題字は合成）。7-03（出発前のルッキーニィの本音）は、紅嵐街道からチンクエの森に入る所に移して A34 の頭にした（場所の資料に合わせる）。
