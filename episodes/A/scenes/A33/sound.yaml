# A33 の BGM・効果音の置き場所（D-068、2026-11-06）。tools/previs_reel.py が通しの下絵に重ねる。書き方は previs_reel.py の sound_items()。
# 音量は台詞を 1.0 とした大きさ（素材の大きさをならしてから掛ける）。BGM 0.24〜0.28、環境音 0.07〜0.15、効果音 0.3〜0.8。足音は自動（footsteps.yaml。床は石か砂の音）
# BGM は原作どおり（パート24、tools/bgm_split.py の曲分け）: M05「魔女邸の前・穏やか」（0:27〜3:24。M14 と交互に出るが同じ曲の節と見た）→ ミトンが入ってきてからは新しい曲 M43「ブリダンゴ姫」（3:24〜7:59、ループ約90.7秒）→ ミトンが帰った後は M05 に戻る（8:21〜10:04）→ 章の題に M21「場面の頭の短い曲」（10:04〜10:32）
scene: A33
bgm:
- src: audio/bgm/catalog/M05.ogg
  cut: A33-001
  t: 0.0
  until: {cut: A33-014, t: 1.0}
  loop: true
  fade_in: 1.5
  fade_out: 0.8
  volume: 0.24
- src: audio/bgm/M43_loop.ogg
