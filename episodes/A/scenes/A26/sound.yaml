# A26 の BGM・効果音の置き場所（D-068、2026-11-04）。tools/previs_reel.py が通しの下絵に重ねる。書き方は previs_reel.py の sound_items()。
# 音量は台詞を 1.0 とした大きさ（素材の大きさをならしてから掛ける）。BGM 0.28、環境音 0.07〜0.15、効果音 0.3〜0.8
scene: A26
bgm:
  # 原作どおり（パート22、2026-11-05 に曲を分けた。tools/bgm_split.py）: M38「夜光列車で魔女都へ」（7:58〜10:23。L879 の約19秒前から、魔女都が見えるまで）
  #   → M39「魔女都ヴァルプルギス」（10:23〜。L890「なんて美しい」から。A27 のテレッサの所まで続く。ループは約88.5秒で、試聴用の45秒はその半分）
  - {src: audio/bgm/catalog/M38.ogg, cut: A26-001, t: 0.0, until: {cut: A26-005, t: 1.0}, loop: true, fade_in: 1.0, fade_out: 1.2, volume: 0.28}
  - {src: audio/bgm/catalog/M39.ogg, cut: A26-005, t: 0.2, until: {cut: A26-015, t: 10.8}, loop: true, fade_in: 1.5, fade_out: 2.5, volume: 0.28}
sfx:
  # 足音は自動（footsteps.yaml）
  # 001〜003 異空間の門
  - {src: audio/sfx/rumble_low.ogg, cut: A26-001, t: 0.0, until: {cut: A26-003, t: 6.0}, loop: true, fade_in: 0.4, fade_out: 1.0, volume: 0.35}
  - {src: audio/sfx/thud_land.ogg, cut: A26-001, t: 2.4, rate: 1.3, volume: 0.3}
  - {src: audio/sfx/thud_land.ogg, cut: A26-001, t: 3.6, rate: 1.1, volume: 0.3}
  - {src: audio/sfx/monster_roar.ogg, cut: A26-003, t: 2.6, rate: 0.8, volume: 0.4}
  - {src: audio/sfx/magic_burst.ogg, cut: A26-003, t: 4.6, rate: 0.8, volume: 0.45}
  # 004・005 夜空
  - {src: audio/sfx/magic_shimmer.ogg, cut: A26-004, t: 0.0, volume: 0.45}
  - {src: audio/sfx/wind_gust.ogg, cut: A26-004, t: 1.0, volume: 0.35}
  - {src: audio/sfx/wind_night_loop.ogg, cut: A26-004, t: 0.0, until: {cut: A26-005, t: 10.0}, loop: true, fade_in: 1.0, fade_out: 1.5, volume: 0.15}
  # 006 駅に滑り込む
  - {src: audio/sfx/rumble_low.ogg, cut: A26-006, t: 0.0, until: {cut: A26-006, t: 5.4}, loop: true, fade_in: 0.3, fade_out: 1.0, volume: 0.35}
  - {src: audio/sfx/metal_clank.ogg, cut: A26-006, t: 4.6, rate: 0.8, volume: 0.3}
  # 013 塔の前に着く
  - {src: audio/sfx/rumble_low.ogg, cut: A26-013, t: 0.0, until: {cut: A26-013, t: 4.6}, loop: true, fade_in: 0.3, fade_out: 1.0, volume: 0.35}
  # 015 列車が去る
  - {src: audio/sfx/rumble_rise.ogg, cut: A26-015, t: 3.4, volume: 0.4}
  - {src: audio/sfx/wind_gust.ogg, cut: A26-015, t: 6.0, rate: 0.9, volume: 0.3}
