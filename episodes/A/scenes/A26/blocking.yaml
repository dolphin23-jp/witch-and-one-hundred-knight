# A26 列車に飛び乗る・魔女都（6章後半 回2）。D-058、D-060、D-062「3D を全編先に」。Claude の案（2026-11-04）
# Living Spec「A26 動きの設計（案）」。準備（案）の表の A26（走り出した列車にビスコが飛び乗る、「まるで宝石のようだ」の全景（見せ場）、
#   案内魔女の「七日七晩…今晩が最後」「冬のニワトリが三回鳴くまで」（A32 の仕掛け）。車中の合いの手 L882・L885〜L888・L893 と L900・L906 は削る）。
# 場所は world/witch-city-layout.yaml（x 西→東、y 北→南、m）。南の駅 (100, 170)（ホームは線路の西 (93, 168)、半径 5.4、高さ 0.6）から北へ大通りと線路、
#   北の端に塔の前の広場 (100, 70)、議事塔 (100, 40)。頭の3カット（異空間の門の前）は layout_extra で world/rift-void-layout.yaml を x +400 に置いた（門は x 520）。
# 夜光列車: 001〜003 は門を東へ抜ける。004 で都の夜空の裂け目から北へ飛び出し、006 で駅に北向きに止まる（ドームは (100, 168.6)）。013 で塔の前 (100, 92) に止まり、015 で夜空へ去る。
# 案内魔女の形は仮（設定画待ち）。
# 光: 異空間 void_gate、上空 city_sky、駅 city_night、塔の前 city_plaza。
