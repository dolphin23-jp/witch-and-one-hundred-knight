id: A26
episode: A
title: 列車に飛び乗る・魔女都
status: 動きの設計と下絵（2026-11-04、Claude。Living Spec「A26 動きの設計（案）」。D-062 の 3D の段階）
approach: >-
  D-060・D-062。6章後半 回2（準備（案）の表の A26）。光る門へ動き出した列車に、ビスコと百騎兵が駆けて飛び乗る（動き）。
  門の光を抜けると都の夜空。「まるで宝石のようだ」の全景（見せ場）。駅で案内魔女（「世界の裏側のような場所」「夜光列車でしかこれない」）、
  大通りの先の議事塔、「七日七晩…今晩が最後」「冬のニワトリが三回鳴くまで」（A32 の仕掛け）。列車が塔の前まで運び、去る。
  車中の合いの手 L882・L885〜L888・L893、L900（議事塔の由来）、L906（どう進んだら）は削る。
