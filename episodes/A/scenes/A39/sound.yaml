# A39 の BGM・効果音の置き場所（D-068、2026-11-06）。tools/previs_reel.py が通しの下絵に重ねる。書き方は previs_reel.py の sound_items()。
# 音量は台詞を 1.0 とした大きさ（素材の大きさをならしてから掛ける）。BGM 0.24〜0.28、環境音 0.07〜0.15、効果音 0.3〜0.8。足音は自動（footsteps.yaml。床は石か砂の音）
# BGM は原作どおり（パート25）: M03（16:19〜19:13。M19「ピラー」と同じくらい似る。A23 などで使った M03 にした）
scene: A39
bgm:
- src: audio/bgm/catalog/M03.ogg
  cut: A39-001
  t: 0.0
  until: {cut: A39-013, t: 11.9}
  loop: true
  fade_in: 1.5
  fade_out: 2.0
  volume: 0.22
sfx:
- {src: audio/sfx/cloth_swish.ogg, cut: A39-001, t: 0.6, rate: 1.3, volume: 0.25}
- {src: audio/sfx/cloth_swish.ogg, cut: A39-001, t: 1.8, rate: 1.2, volume: 0.25}
- {src: audio/sfx/door_open.ogg, cut: A39-004, t: 0.3, volume: 0.4}
- {src: audio/sfx/door_close.ogg, cut: A39-013, t: 11.1, volume: 0.4}
