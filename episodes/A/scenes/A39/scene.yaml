title: 消えない臭い
status: 動きの設計と下絵（2026-11-06、Claude。Living Spec「A39 動きの設計（案）」。D-062 の 3D の段階）
approach: D-060・D-062。準備（案）の表の 7-12（縮める）。数日後のバスルーム。アルレッキーノが浴槽を磨き続け、メタリカがいら立つ（「あれから何日経ったと思ってる！な、なんで、いつまでも風呂の臭いがとれんのだ……」）。鼻を押さえたビスコが来て言い合い、「キヒヒ、先日の異空間ではその犬っ鼻を百騎兵に自慢していたじゃないか」「なっ！！おまえ見ていたのか？」「ちょっとだけな。キヒヒ」。ルッキーニィが食事を持って出かけたと聞き（「反抗的なお年頃なのかもしれません。はい」「大丈夫なのか、メタリカ？あいつ、最近元気がなかったが……」）、メタリカが百騎兵に捜しに行かせる。百騎兵が話しかけた時のアルレッキーノの独白は削る。
source: 原作テキスト（Drive「Mj100 7-8」）、原作音源パート25 の 16:30〜20:00 ごろ
