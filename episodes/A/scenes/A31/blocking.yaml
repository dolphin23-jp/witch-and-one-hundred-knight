# A31 巨大メタリカとの戦い（6章後半 回3 の見せ場）。D-058、D-060、D-062「3D を全編先に」。Claude の案（2026-11-05）
# Living Spec「A31 動きの設計（案）」。準備（案）の表の A31。台詞は audio/A28/original（L1084〜L1099。戦いの掛け声 L1081〜L1083 は使わない）。
# 場所は world/council-room-layout.yaml の壊れた後（council_ruin → 018 から朝の council_dawn）。
# 戦い（001〜004、約20秒）: パープルピールの砂嵐（plume、砂の色）、リリーの氷（shards・light、氷の色）、百騎兵の剣（slash・spark）、巨大メタリカの雷（bolt）。
# 「踊れ」（008）の輪は、巨大メタリカのまわり（半径 6〜7m）を回る。ネザリアの霧は fx の fog。冬のニワトリはスケアコッコ（設定画 scarecocco_sheet_01）。
