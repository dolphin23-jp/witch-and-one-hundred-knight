      staging: 'In frame (exactly 10 people, from left to right): Bisco (short black bob hair with two gold hair ornaments, blue eyes, silver shoulder and chest armor over a navy uniform with gold trim,
        brown belt, a fluffy black-and-white tail, silver armored boots), standing, on the left of the frame, in profile, turned toward screen right; the Hundred Knight (small, waist-high: big round silver-and-blue
        helmet with a gold crown piece and a pale blue flame plume, black face with orange eyes, oversized blue-and-silver gauntlets, holding its sword), standing, in the center of the frame, in profile,
        turned toward screen right; Teressa drenched from head to toe in the glowing jade-green poison swamp water, as in her reference sheet (teressa-swamp_sheet_01): soaked drooping witch hat, dripping
        hair and clothes, eyes shut, standing, in the center of the frame, with the back to the camera; Usamaru, Rabi''s floating rabbit doll, as in its reference sheet, standing, in the center of the frame,
        in three-quarter view, turned toward screen right; Berda, the lye witch, as in her reference sheet, standing, on the right of the frame, in three-quarter view, turned toward screen right; Rabi (Rabil
        Lalla La), the flame witch, as in her reference sheet, standing, on the right of the frame, with the back to the camera; Rubens, the pumpkin witch, as in her reference sheet (rubens_sheet_01): long
        straight yellow hair covering one eye, an orange frilled headdress, stitch scars, a dark green puffed-sleeve dress with orange lacing and frills, bandaged arms and legs, a brown satchel on her back,
        holding a big green book, standing, on the right of the frame, in three-quarter view, turned toward screen right; Purple Peel, the dust witch, as in her reference sheet, standing, at the far right
        of the frame, seen from behind at an angle, turned toward screen left; giant Metallica, about 13 m tall, as in her reference sheet (metallica-giant_sheet_01): the same face, hat, hair and clothes
        as Metallica, a wild triumphant grin, jade-green swamp miasma rising around her feet, crackles of lightning around one raised hand, standing, at the far right of the frame, in three-quarter view,
        turned toward screen left; Nezaria, the fog witch and chairwoman, as in her reference sheet (nezaria_sheet_01): a very large white witch hat with a lavender underside and a gold ring around it,
        very long straight lavender hair, sleepy half-closed eyes, a white dress with black frills and a gold medallion, holding a tall silver staff with a large ribbed gold head (the talking staff), a
        tiny white mouse sitting on her hat brim, standing, at the far right of the frame, in three-quarter view, turned toward screen right. No other people. High angle looking down. Behind: dark wood
        panelled round walls with tall arched windows full of stars between heavy purple-red curtains. Night inside the round council chamber at the top of a gothic witch tower: warm golden light from the
        glowing planets of a huge orrery hanging over a round table, dark wood panelled walls, tall windows full of stars between purple-red curtains.'
