        witch, as in her reference sheet, standing, at the far right of the frame, in three-quarter view, turned toward screen left, small in the background. No other people. Low angle looking up; the sky
        fills the upper part of the frame. Behind: the wrecked round council chamber: a huge jagged hole torn through the far wall and the roof showing the night sky, cracked wooden floor flooded with glowing
        jade-green swamp water, toppled gothic chairs and rubble, fallen glowing planets of the orrery. Night inside the round council chamber at the top of a gothic witch tower: warm golden light from
        the glowing planets of a huge orrery hanging over a round table, dark wood panelled walls, tall windows full of stars between purple-red curtains.'
