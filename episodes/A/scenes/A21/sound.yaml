# A21 の BGM・効果音の置き場所（D-068、2026-11-02）。tools/previs_reel.py が通しの下絵に重ねる。書き方は previs_reel.py の sound_items()。
# 音量は台詞を 1.0 とした大きさ（素材の大きさをならしてから掛ける）。BGM 0.28、環境音 0.07〜0.15、効果音 0.3〜0.8
scene: A21
bgm:
  # 原作どおり（パート20 の 9:02〜11:17）: M21 場面の頭 → M30 魔女邸の前・短い曲（9:22〜9:50）→ M01 魔女邸（9:50〜10:25）→ M30（10:25〜10:40）→ M01（10:40〜）
  # 短い M30 の2回目（004 の一部）はカットの切れ目に合わせて 004 だけにした
  - {src: audio/bgm/catalog/M21.ogg, cut: A21-001, t: 0.0, until: {cut: A21-002, t: 2.0}, fade_in: 0.6, fade_out: 1.2, volume: 0.28}
  - {src: audio/bgm/catalog/M30.ogg, cut: A21-002, t: 1.5, until: {cut: A21-003, t: 0.0}, loop: true, fade_in: 1.0, fade_out: 1.0, volume: 0.28}
  - {src: audio/bgm/catalog/M01.ogg, cut: A21-003, t: 0.0, until: {cut: A21-004, t: 0.0}, loop: true, fade_in: 1.0, fade_out: 0.8, volume: 0.28}
  - {src: audio/bgm/catalog/M30.ogg, cut: A21-004, t: 0.0, until: {cut: A21-005, t: 6.0}, loop: true, fade_in: 0.6, fade_out: 1.0, volume: 0.28}
  - {src: audio/bgm/catalog/M01.ogg, cut: A21-005, t: 5.6, until: {cut: A21-005b, t: 11.9}, loop: true, fade_in: 1.0, fade_out: 2.0, volume: 0.28}
sfx:
  # 足音は自動（footsteps.yaml。マーニィは飛んでいるので無し）
  # 浴槽の沼の水が小さく泡立つ（ずっと小さく）
  - {src: audio/sfx/swamp_bubble_loop.ogg, cut: A21-001, t: 0.0, until: {cut: A21-005b, t: 11.9}, loop: true, rate: 1.15, fade_in: 1.0, fade_out: 1.5, volume: 0.06}
  # 002 カーテンの陰からマーニィ、ルッキーニィが跳び退く
  - {src: audio/sfx/cloth_swish.ogg, cut: A21-002, t: 15.8, volume: 0.35}
  - {src: audio/sfx/whoosh_fast.ogg, cut: A21-002, t: 16.0, rate: 1.4, volume: 0.22}
  - {src: audio/sfx/thud_land.ogg, cut: A21-002, t: 16.3, rate: 1.3, volume: 0.22}
  # 004 ルッキーニィが頭を下げて駆け出していく、扉
  - {src: audio/sfx/cloth_swish.ogg, cut: A21-004, t: 5.0, volume: 0.22}
  - {src: audio/sfx/door_open.ogg, cut: A21-004, t: 7.6, volume: 0.35}
  - {src: audio/sfx/door_close.ogg, cut: A21-004, t: 8.8, volume: 0.3}
  # 005b 紙切れを見せる
  - {src: audio/sfx/cloth_swish.ogg, cut: A21-005b, t: 6.4, rate: 1.5, volume: 0.2}
