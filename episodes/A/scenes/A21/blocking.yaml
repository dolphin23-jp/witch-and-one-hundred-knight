# A21 魔女邸・バスルーム（6章後半 回1）。D-058、D-060、D-062「3D を全編先に」。Claude の案（2026-11-02）
# Living Spec「A21 動きの設計（案）」。準備（案）の表の A19「バスルーム」（全部残す）。百騎兵が森から紙切れを持って戻った所に置く入れ替えの提案で A21 にした。
# 場所は world/witch-house-6b-extra.yaml のバスルーム（layout_extra。x 12〜18、y 6〜11）。北の壁の西寄り (13.0, 6.0) に扉。
#   浴槽は (15.6, 9.4)（x 14.3〜16.9、y 8.7〜10.1、高さ 0.7、沼の水が光る）。赤いカーテンは浴槽の奥（南の壁ぞい）と西（x 13.95）と東（x 17.3）。
# 浴槽の光る水にルッキーニィが指を伸ばしかけ、西のカーテンの陰からマーニィが現れて止まる（台詞なしの芝居を足した。L620 の前ふり）。
# ルッキーニィの性別は曖昧なまま（D-029）。L617「いえ！そういうことではなく……」は、顔をそむけて口ごもる芝居だけで、理由は見せない。
# 百騎兵は紙切れ（切符）を持っている（下絵では描かない）。
