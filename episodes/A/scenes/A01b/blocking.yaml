  bisco:     [8.3, 5.2]    # ビスコ。玄関の前、橋の北の端。ずっとここ
  hk:        [7.2, 5.05]   # 百騎兵。ビスコの左（西）、1.1m
  arle:      [9.6, 4.8]    # アルレッキーノ。最初の位置（デッキの東寄り）
  arle_near: [9.15, 5.35]  # ビスコの右隣（東、0.86m。耳打ち、011〜）
  arle_take: [8.6, 6.7]    # メタリカの手から招待状を抜き取った位置（035〜047）
  pillar:    [60.0, -2.0]  # 沼の彼方のピラー（東、方位 80° 前後）
  sky_e:     [40.0, 5.0]   # 東の沼の上の空（遠くを見る目線）
  sky_w:     [-30.0, 7.0]  # 西の沼の上の空
  dragonfly: [8.9, 5.9]    # 003 で百騎兵が目で追うトンボ

start:
