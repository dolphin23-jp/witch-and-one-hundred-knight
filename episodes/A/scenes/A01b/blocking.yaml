# A01b 魔女邸の前の立ち位置・向き・動きとカメラ割り（演出ノート P-01・P-03・P-04）。
# 場所は屋敷の目の前の土の広場（ユーザー指定 2026-09-27。D-053 の高台から変更）。位置関係はユーザーが用意した背景画像（refs/witch-house-front_bg_01・02）が基準。
# 背景はその2枚と設定画のパネルを使う。Claude は背景を作らない。ピラーは映さない。
# 生成の前にここを決め、python tools/staging.py episodes/A/scenes/A01b で確かめる（結果は gen/staging_report.md と図）。
#
# 座標は world/witch-house-front-layout.yaml（x: 西0→東20、y: 北＝屋敷0→南19、m）。方位: 北（屋敷）0・東90・南180・西270。
# start: 最初の位置（at）と体の向き（face）。face は 数値（方位）、人物名・場所名（そちらを向く）、"@人物名"（その人物を目で追い続ける）。
# cuts.<ID>:
#   frame: 画の大きさ。cam: [x, y, 高さ]。look: カメラが向く点（人物名・場所名・[x, y]）。lens: mm（24 広角・35・50 標準・85・135 望遠）
#   set:  カットの頭で置き直す（映っていない間に動いた分。映っている人を動かすと「飛び」として報告される）
#   move: カットの中で動く（to: 行き先、via: 経由点、face: 終わりの向き）。look_end / lens_end / gaze_end: 終わりのカメラと目線
#   gaze: 目線（人物名・場所名・[x, y]・方位）。only: 映す人物を限る（[] は人物なし。画面に入るのに外した人物は「隠れ」として報告される）
#   bg: 背景を名前で決める（layout の views）。insert: 別の場所のインサート
#   pose: 生成の指示文に入れる姿勢（英語）。act: 芝居（start 始めの姿勢／do 動き／end 終わりの姿勢／sync 声のどこに合わせるか。秒はカットの頭から）
#   camera: Animatic のカメラの動き（P-03）。kind: S 止め／K 止め＋カメラ移動／M 小さな動きの動画／A 見せ場（キーポーズの静止画を Wan でつなぐ）
scene: A01b
layout: world/witch-house-front-layout.yaml
map_ymax: 18.5   # 上から見た図は南を 18.5m で切る

# 基本の配置: メタリカは広場の中ほどで三人に向かって語りかけ、腕で沼を示す（沼を見て話すのは 010〜015 の決めポーズと、沼を見て顔をそらす呪いの話）。三人は橋を下りた所（広場の北の端）に並ぶ。
# カメラは軸の東側。メタリカの寄りは三人の側から撮り、後ろは広場と沼（用意画像 bg_02）。三人の寄りはメタリカの側から撮り、後ろは橋と屋敷（bg_01）
places:
  m_end:     [10, 10.7]    # メタリカ。広場の中ほど（演説の位置）
  m_front:   [10.3, 9.1]    # ビスコの正面（南、0.9m）。008 で詰め寄る
  m_shore_w: [8, 11.6]    # 広場の西寄り（向こうに西の沼）。016 で歩いてくる
  m_circle:  [9.7, 8.85]   # ビスコの左前（南西）。030 でビスコの前を回り込んで止まる
  m_peek:    [9.9, 8.7]    # ビスコの顔を覗き込む（0.64m）。031
  m_back:    [9.6, 9.1]    # ビスコの怒鳴り声に半歩下がった位置。034
  bisco:     [10.3, 8.2]    # ビスコ。橋を下りた所（広場の北の端）。ずっとここ
  hk:        [9.2, 8.5]    # 百騎兵。ビスコの左前（西へ1.1m、少し前。三人を横一列にしない）
  arle:      [11.8, 7.8]    # アルレッキーノ。最初の位置（ビスコの右後ろ、橋の右の街灯の横）
  arle_near: [11.15, 8.35]  # ビスコの右隣（東、0.86m。耳打ち、011〜）
  arle_take: [10.6, 9.7]    # メタリカの手から招待状を抜き取った位置（035〜047）
  pillar:    [60.0, -2.0]  # 沼の彼方のピラー（東、方位 80° 前後。画には映さない）
  sky_e:     [40.0, 5.0]   # 東の沼の上の空（遠くを見る目線）
  sky_w:     [-30.0, 7.0]  # 西の沼の上の空
  dragonfly: [10.9, 8.9]    # 003 で百騎兵が目で追うトンボ

start:
  metallica:      {at: m_end, face: "@bisco"}     # 三人に向かって語りかける（沼は腕で示す。A01-040a で扉を開け放った続き。招待状は右手。ユーザーの指摘 2026-09-27）
  bisco:          {at: bisco, face: "@metallica"}
  hundred-knight: {at: hk, face: "@metallica"}
  arlecchino:     {at: arle, face: "@metallica"}

# 会話の軸。同じ区間ではカメラを線の同じ側（東）に置く（side はその側の点）
axes:
  - {name: 演説〜取りなし メタリカ↔ビスコ, cuts: [A01b-001, A01b-015], a: metallica, b: bisco, side: [14, 9]}
  - {name: 講釈〜盟友 メタリカ↔ビスコ, cuts: [A01b-016, A01b-029], a: metallica, b: bisco, side: [14, 9]}
  - {name: 畳みかけ〜持参品 メタリカ↔ビスコ, cuts: [A01b-031, A01b-047], a: metallica, b: bisco, side: [14, 9]}
  - {name: 呪いの話 メタリカ↔ビスコ, cuts: [A01b-049, A01b-071], a: metallica, b: bisco, side: [14, 9]}

cuts:
