# A01b 魔女邸の前の立ち位置・向き・動きとカメラ割り（演出ノート P-01・P-03・P-04）。
# 場所は屋敷の目の前（ユーザー指定 2026-09-27。D-053 の高台から変更）。背景は設定画のパネルを使い、足りない向きはユーザーが用意する。
# 生成の前にここを決め、python tools/staging.py episodes/A/scenes/A01b で確かめる（結果は gen/staging_report.md と図）。
#
# 座標は world/witch-house-front-layout.yaml（x: 西0→東16、y: 北＝屋敷0→南＝森への小道14、m）。方位: 北（屋敷）0・東90・南（小道）180・西270。
# start: 最初の位置（at）と体の向き（face）。face は 数値（方位）、人物名・場所名（そちらを向く）、"@人物名"（その人物を目で追い続ける）。
# cuts.<ID>:
#   frame: 画の大きさ。cam: [x, y, 高さ]。look: カメラが向く点（人物名・場所名・[x, y]）。lens: mm（24 広角・35・50 標準・85・135 望遠）
#   set:  カットの頭で置き直す（映っていない間に動いた分。映っている人を動かすと「飛び」として報告される）
#   move: カットの中で動く（to: 行き先、via: 経由点、face: 終わりの向き）。look_end / lens_end / gaze_end: 終わりのカメラと目線
#   gaze: 目線（人物名・場所名・[x, y]・方位）。only: 映す人物を限る（[] は人物なし。画面に入るのに外した人物は「隠れ」として報告される）
#   bg: 背景を名前で決める（layout の views）。insert: 別の場所のインサート
#   pose: 生成の指示文に入れる姿勢（英語）。act: 芝居（start 始めの姿勢／do 動き／end 終わりの姿勢／sync 声のどこに合わせるか。秒はカットの頭から）
#   camera: Animatic のカメラの動き（P-03）。kind: S 止め／K 止め＋カメラ移動／M 小さな動きの動画／A 見せ場（キーポーズの静止画を Wan でつなぐ）
scene: A01b
layout: world/witch-house-front-layout.yaml
map_ymax: 11.5   # 上から見た図は南を 11.5m で切る

# 基本の配置: メタリカは橋の南の端（岸に下りる所）で東の沼に向かって演説する。三人は玄関の前のデッキに並ぶ。
# カメラは東（沼の上と岸の東）に置く。メタリカの後ろは西の沼と大きな枯れ木（設定画「枯れ木」）、ビスコの後ろは玄関（「エントランス・接写」）
places:
