status: 承認待ち（2026-10-30 作成。生成なし・クレジットなし）
section: >-
  A01b-014〜027「外に出られなかった」「『寂しかったろうな』と盟友」（約60秒、14カット）。順に作る（D-057）。
  動画が要るのは 016（A）・020（M）・021（A）・023（M）の4カット。ほかの10カット（014・015・017・018・019・022・024〜027）は K（静止画＋カメラの動き）で生成なし。
  あわせて、前の区間 001〜010 の残り（004・007 の作り直し、008 の扱い）もここで承認を取る。
decision: 'D-055（標準の作り方: 開始＋終わりの静止画＋設定画＋下絵＋口パク参照）、D-057（順に作る）'
credits_estimate: 120   # 静止画 3 ＋ 動画 72（014〜027）＋ 動画 45（004・007 の作り直し）。008 は別（下の案による）。残高 1,200 → 約 1,080
order: >-
  1. 静止画3枚を作る → Claude が点検 → 2. 動画を作る（静止画が点検で崩れていたら、その動画は作らずに報告）。
  前回まではユーザーの目視で合格を得てから動画に進んでいたが、承認の回数を減らすため、一つの OK で 1 と 2 を続けて行う案。最終判断は出来上がりのユーザーの目視。
  失敗しても自動では作り直さない。

