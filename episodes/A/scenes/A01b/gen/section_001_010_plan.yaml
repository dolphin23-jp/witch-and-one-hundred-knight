    prompt: 'Medium-long shot with a completely still camera. The three stand at the foot of the bridge, listening to Metallica off-screen. Bisco keeps a flat, half-lidded, fed-up look, her eyes fixed
      on Metallica off-screen. Arlecchino claps his big hands slowly and steadily, the clapping growing a little stronger around the middle of the shot, then settling. The Hundred Knight''s head follows
