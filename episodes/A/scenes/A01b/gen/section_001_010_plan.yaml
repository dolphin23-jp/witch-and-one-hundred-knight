status: 一部生成済み（2026-10-16。ユーザー承認「動画の作成に進んで良い」。静止画5枚＝5クレジット、動画は 003・009 の2本＝33クレジットを生成。004・007 の動画は生成サービス側で失敗（返金）、008 は開始の静止画がアップロード時に nsfw 判定でまだ作っていない。残高 627→589。下絵 004・007・008 は作成済み。一覧画像は gen/section_001_010/plan_overview.jpg）
section: A01b-001〜010「沼の演説」（約47秒、10カット）。動画が要るのは 001（M→試験2の D を採用済み）と 003（M）・004（A）・007（M）・008（A）・009（M）。002・005・006・010 は K/S（静止画＋カメラの動き）
decision: 'D-055（標準の作り方: 開始＋終わりの静止画＋設定画＋下絵＋口パク参照）'
credits_estimate: 101   # 静止画 5 ＋ 動画 96。残高 627 → 約 526
cuts:
  K/S（静止画＋カメラの動き。生成なし）: ['002', '005', '006', '010']
  動画（作成済み、試験2の D）: ['001']
  動画（新規）: ['003', '004', '007', '008', '009']
direction_note: >-
  004 の camera 欄は「右へ振る。指の先が画面右」だったが、blocking の計算（カメラは軸の東側。東＝ピラーの方は画面の左）と、ショットファイルの blocking.end（斜め前・画面左向き・目線 画面左）は
  どちらも画面の左。camera 欄の「右」は誤りと判断し、下絵と終わりの静止画は「画面の左へ振る・画面の左を指す」で作る。
common_tail: >-
  2D TV anime style, clean line art, cel shading, rich but soft colors. Keep every character's design, colors and proportions identical to the first frame and the character sheets.
  Early morning light, a thin mist over the swamp. No text, no captions, no speech bubbles, no manga symbols (no anger marks, sweat drops or question marks).
previs_tail: >-
  Follow video 1 for the camera movement, the positions of the figures and how they move; the shot must arrive at the given last frame. Video 1 uses plain colored placeholder mannequins: do not draw them or copy their look.
lipsync_tail: >-
  Metallica speaks the line in audio 1: sync her mouth movements to it.
stills:
  note: 開始と終わりの静止画のうち、足りない方を作る（GPT Image 2.5、2k、16:9、medium、1枚1クレジット）。003 は開始と同じ絵を終わりにも渡す（動かないカメラ・同じ立ち位置）。失敗しても自動では作り直さない
  credits_estimate: 5
  items:
  - id: end_004
    cut: A01b-004
    which: end
    credits: 1
    method: 編集（開始の静止画を元に。右腕を突き出して沼を指す）
    refs:
    - episodes/A/scenes/A01b/stills/rest/A01b-004_gpt-image-2.5_01.png
    - characters/metallica/views/metallica_side.png
    - characters/metallica/views/metallica_front.png
    output: episodes/A/scenes/A01b/stills/end/A01b-004_end_gpt-image-2.5_01.png
    prompt: 'Image 1 is the first frame of a shot. Draw the last frame of the same shot: the identical scene, background, framing, camera height, lighting, colors, outfit, hair and hat, but Metallica
      has twisted her body toward the left side of the picture and thrust her right arm (the arm on the left side of the picture) straight out toward the far swamp, pointing far into the distance with
      her index finger, in three-quarter view with her face turned toward screen left, looking where she points, mouth open as she shouts. She ends up in the right half of the frame (about three quarters of the way across), with open swamp to the left of her. No other people. Keep the
      character''s design, colors and proportions identical to image 1 and to the character sheets (images 2 and 3). 2D TV anime style, clean line art, cel shading, rich but soft colors, 16:9. No text,
      no captions, no speech bubbles, no manga symbols (no anger marks, sweat drops or question marks).'
  - id: start_007
    cut: A01b-007
    which: start
    credits: 1
    method: 編集（既存の静止画 rest/A01b-007 は終わりの姿勢＝振り返ってニヤリ、なので、それを「終わり」に使い、頭を沼へ向けた「開始」を作る）
    refs:
    - episodes/A/scenes/A01b/stills/rest/A01b-007_gpt-image-2.5_01.png
    - characters/metallica/views/metallica_face_front.png
    - characters/metallica/views/metallica_face_side.png
    output: episodes/A/scenes/A01b/stills/start/A01b-007_start_gpt-image-2.5_01.png
    prompt: 'Image 1 is the last frame of a shot. Draw the first frame of the same shot: the identical scene, background, framing, camera height, lighting, colors, outfit, hair, hat and body position,
      but Metallica''s head is turned toward the left side of the picture, her eyes looking far away toward the swamp where she just pointed, with a calm, proud, closed-mouth expression (no grin).
      Keep the character''s design, colors and proportions identical to image 1 and to the face references (images 2 and 3). 2D TV anime style, clean line art, cel shading, rich but soft colors, 16:9.
      No text, no captions, no speech bubbles, no manga symbols (no anger marks, sweat drops or question marks).'
  - id: cel_008_metallica
    cut: A01b-008
    which: end
    credits: 1
    method: セル（透明な背景）。ビスコ・百騎兵は 030 のセル（stills/end/cels/A01b-030_bisco.png・A01b-030_hundred-knight.png）を再利用（0クレジット）
    refs:
    - characters/metallica/views/metallica_side.png
    output: episodes/A/scenes/A01b/stills/end/cels008/A01b-008_metallica.png
    prompt: 'A single full-body character cel of Metallica (character reference: image 1), stopped with her chest thrust out and her chin raised, both hands on her hips, mouth open as she shouts
      triumphantly, in profile, turned toward the right side of the picture, looking toward the right side of the picture, seen from a slightly low angle. Height 1.6 m. Transparent background: no scenery,
      no ground, no floor shadow, no other characters, no text. Soft early-morning light. Keep the design, colors and proportions identical to the reference. 2D TV anime style, clean line art, cel shading,
      rich but soft colors, 16:9. No text, no captions, no speech bubbles, no manga symbols (no anger marks, sweat drops or question marks).'
  - id: end_008
    cut: A01b-008
    which: end
    credits: 1
    method: 重ねる→描き直す編集（セルを tools/composite.py で終わりの立ち位置に重ね、朝の光で描き直す）
    composite_cmd: python tools/composite.py episodes/A/scenes/A01b A01b-008 --which end --cels episodes/A/scenes/A01b/stills/end/cels008 --plate refs/witch-house-front_bg_01.png --out episodes/A/scenes/A01b/stills/end/A01b-008_end_composite.png
    refs:
    - episodes/A/scenes/A01b/stills/end/A01b-008_end_composite.png
    - characters/metallica/views/metallica_side.png
    - characters/hundred-knight/views/hundred-knight_front.png
    - characters/bisco/views/bisco_side.png
    output: episodes/A/scenes/A01b/stills/end/A01b-008_end_gpt-image-2.5_01.png
    prompt: 'Image 1 is a rough paste-up composite of one anime frame. Redraw it as a single coherent 2D TV anime frame (clean line art, cel shading, rich but soft colors, 16:9). Keep exactly: the camera
      angle and framing, every character''s position, size, pose, facing and expression, and which character is in front of which. Keep the background layout (the swamp with huge gnarled dead trees and
      the dirt clearing with red mushrooms, stumps and lamp posts, and at the right edge the witch''s house with its short wooden bridge). Change the time to early morning: a pale, clear morning sky
      with soft low sunlight and a thin mist over the swamp; the swamp still glows green; the lamps are unlit or faint. Relight the characters to match the scene, add natural contact shadows on the ground,
      and blend the edges. From left to right: Metallica in profile facing right with her chest out and hands on her hips (reference image 2), the small Hundred Knight facing the viewer just behind her
      (reference image 3), Bisco at the right in profile facing left (reference image 4). Keep each character''s design, colors and proportions identical to the reference images. Do not add or remove any
      character. No text, no manga symbols.'
  - id: start_009
    cut: A01b-009
    which: start
    credits: 1
    method: 編集（既存の静止画 try10/A01b-009 は指が鼻先に当たった姿勢＝「突く」の瞬間。それを「終わり」に使い、指を離した「開始」を作る）
    refs:
    - episodes/A/scenes/A01b/stills/try10/A01b-009_gpt-image-2.5_01.png
    - characters/bisco/views/bisco_face_front.png
    - characters/bisco/views/bisco_front.png
    - characters/metallica/views/metallica_back.png
    output: episodes/A/scenes/A01b/stills/start/A01b-009_start_gpt-image-2.5_01.png
    prompt: 'Image 1 is the last frame of a shot. Draw the first frame of the same shot: the identical scene, background, framing, camera height, lighting, colors, outfits and positions, but Metallica''s
      raised index finger is held a short distance (about 20 cm) in front of Bisco''s nose, not touching it, and Bisco stands upright without leaning back, looking up at Metallica with a flat, unimpressed
      expression. Keep each character''s design, colors and proportions identical to image 1 and to the character references (images 2 to 4). 2D TV anime style, clean line art, cel shading, rich but soft
      colors, 16:9. No text, no captions, no speech bubbles, no manga symbols (no anger marks, sweat drops or question marks).'
