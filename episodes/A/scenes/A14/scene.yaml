approach: >-
  D-060・D-062。夜会編 回2（選別の 11・12）。山の道の行き止まりで足止めされた百騎兵を、魔女邸のルッキーニィの星読みが救う。
  草むらから古の風紋が浮かび、移動補助用の戦術トーチカで谷を跳び越えて峰を登る（台詞なしの見せ場を足した）。
  ピラーの峰で守護者のからくり人形を倒し、日が沈む前にピラーを咲かせる。
