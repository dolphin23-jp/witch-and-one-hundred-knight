approach: D-060・D-062。6章後半 回3 の始め（準備（案）の表の A28）。議事塔の最上階の議会室で、テレッサに連れてこられたビスコが目覚める。円卓を囲む魔女たち（パープルピール・リリー・ラビィとウサギ人形・ベルダ・リューベンス）の宴。ラビィが「かかりそこなってるじゃんか！」（呪いの伏線）。ヴァレンティーヌの欠席のうわさは短く。入ってきた百騎兵をリューベンスが本に息を吹きかけて倒す。魔女たちがメタリカを笑い、ビスコ「これが…魔女の本性なのか」、ベルダ「あなたが噂の姫君ですか」「国王陛下もさぞやお嘆きのこと」。A27
  の門から暗転で入る。
