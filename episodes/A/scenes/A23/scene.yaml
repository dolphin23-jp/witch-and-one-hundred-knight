title: 隠し森の駅・夜光列車（夕暮れ）
status: 動きの設計と下絵（2026-11-04、Claude。Living Spec「A23 動きの設計（案）」。D-062 の 3D の段階）
approach: >-
  D-060・D-062。6章後半 回2 の最初（準備（案）の表の A23）。百騎兵が先に着いて鐘のそばで待ち、ビスコが追いつく。
  途切れた線路（A20 の伏線）。百騎兵が鐘を鳴らすと、何もない空間が裂けて夜光列車が滑り込む（見せ場）。
  乗せる・乗せないの口論は半分に（L728・L733・L742・L743・L747・L750・L752 を削る）。百騎兵がビスコを叩き伏せて避難させる（ギャグ）。
  戦いは台詞なしで約30秒（4カット）。アルレッキーノの委任状。「線路なんかなくても大丈夫」の受けとして、出発は線路から浮き上がって空の裂け目へ。
  ビスコを放り投げて乗せる（ギャグ）。A24 へはワイプ。
