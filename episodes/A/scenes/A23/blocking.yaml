  hk_bell: [14.0, 42.2]      # 鐘の街灯のそば（魔法陣の北西の縁）
  hk_front: [25.3, 45.6]     # 魔法陣の東の縁（列車の正面）
  bi_front: [23.4, 46.4]
  train_stop: [30.6, 45.0]
  train_back: [32.4, 45.0]   # 戦いの後
  rift_e: [38.6, 45.0]       # 線路の東の先の裂け目
  ar_n: [21.6, 34.0]         # 北の獣道
  ar_plat: [22.4, 41.4]      # アルレッキーノが魔法陣の上に来て立つ所
