# A23 駅・夜光列車（6章後半 回2 の最初）。D-058、D-060、D-062「3D を全編先に」。Claude の案（2026-11-04）
# Living Spec「A23 動きの設計（案）」。準備（案）の表の A23。
# 場所は world/hekkahenne-forest-layout.yaml（x: 西0→東40、y: 北0→南110、m）。森の発着場（ユーザーの背景 forest-station_bg_01）: 地面に描いた魔法陣 (20, 45)
#   （半径 7、地面と同じ高さ。魔法陣の上の人物はキーの z に 0.05）。線路は魔法陣を東西に横切り（x 1.5〜37.5、y 45）、北西・北東へも出る。
#   北西の線路の脇にレンガのホーム、その丸い端 (12.9, 40.75) に鐘を吊るした街灯（鐘は (13.2, 41.1)、高さ約 2.15）。南の獣道から駅に入り（y 53）、
#   北の獣道（y 22〜37）からアルレッキーノが来る。2026-11-05 に、前の高さ 0.6 の円い石のホームから、ユーザーの背景に合わせて直した。
# 光: 夕暮れ station_dusk（A22 の夕方の後。西の低い橙の光と紫の空、灯りを強めた）。
# 夜光列車（night-train）は1体の人形（前が獅子の顔＝ライオネル、両側に山羊の頭＝ゴードーラ（南）・ゴードール（北）、後ろの上に蛇＝スネーカー）。
#   列車の位置は車体の中ほど。西向き（face 270）で (30.6, 45) に止まると: 獅子の顔 (27.3, 45) 高さ 1.75、山羊 (29.5, 46.45)・(29.5, 43.55) 高さ 1.9、
#   蛇の頭 (34.05, 45) 高さ 4.25、ドーム (33.2, 45)。戦いの後は (32.4, 45) に下がる（獅子 (29.1, 45)、山羊 (31.3, ±)、蛇 (35.85, 45)）。
#   頭ごとには動かせないので、話す頭はカメラで示す。
# 何もない空間の裂け目は fx の rift、獅子の炎は fx の breath。マーニィは魔女邸から通信で話す（小窓は scene.yaml の comm）。
