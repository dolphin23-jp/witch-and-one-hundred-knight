title: ゴミ山の虫姫と特訓
status: 動きの設計と下絵（2026-11-06、Claude。Living Spec「A34 動きの設計（案）」。D-062 の 3D の段階）
approach: 'D-060・D-062。準備（案）の表の 7-03（縮める）〜7-06（縮める）。7-03 は場所の資料（チンクエの森とゴミ山、7-03〜7-09）に合わせ、紅嵐街道から森へ入る所に置いた。ルッキーニィの本音「……ただ、望みが高すぎるからって、無駄ってことにはならないと思うんです。」（寄る）。ゴミ山でゴミを食べるミトン（「ゴ、ゴミを食べた！？」）、名乗り（「よろしくでち！あたちはミトンでち！」）、「王子様は馬車に乗ってきたでち。運命の出会いでち。」（ミトンが街道の方を見る）、拾い食いの往復と「これはもう……、特訓するしかないですね！！」、ずっしりの実の頼み、ルッキーニィの心の声「(ボクだって……)」。7-05
  の探索は台詞なしの見せ場（準備（案）: 百騎兵が穂を揺すり、落ちてきた重い実を頭で受ける）。得意料理、満腹。7-06 の臭いの指摘（「……ミトンさん、あなたが臭うんです」）と香水の計画、森の小道を北へ歩く百騎兵にメタリカの千里眼越しの念押し。'
source: 原作テキスト（Drive「Mj100 7-8」）、原作音源パート24 の 10:01〜24:30 ごろ
