layout:
- 屋敷の前の土の広場。百騎兵は広場の中ほどに一人で立って待っている。ビスコは屋敷の玄関から橋を駆け下りてくる
- 広場から外へ出る道は、東へ延びる遊歩道だけ（森へ下りる小道はない）。ビスコとアルレッキーノは遊歩道から出ていく
- 会話の軸はビスコと百騎兵を結ぶ線。カメラは軸の南側（広場の側）に置く。ビスコの寄りは百騎兵の側の低い位置から（見上げる）、百騎兵の寄りはビスコの側の高い位置から（見下ろす）
- 背丈の差（ビスコ 1.55m、百騎兵 0.9m）を画に使う。黙って見上げる百騎兵に、ビスコが勝手に照れていく

