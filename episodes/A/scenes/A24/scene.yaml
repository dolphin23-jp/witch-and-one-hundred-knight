title: 異空間・閉じた門
status: 動きの設計と下絵（2026-11-04、Claude。Living Spec「A24 動きの設計（案）」。D-062 の 3D の段階）
approach: >-
  D-060・D-062。6章後半 回2（準備（案）の表の A24）。異空間を走る列車（並走）と、真っ暗な車中のビスコ（「何も殴ることはないじゃないか」）。
  急停車して、虚空に立つ閉じた門の前へ。流刑者が送り込まれる場所、門を閉められるのは魔女だけ、瘴気で三日ともたずに発狂。
  切符を盗んだと疑うくだり（L782〜L786）、L789・L792・L793・L795・L796、列車の前に戻る場面（L804〜L808）は削る。拠点の L798〜L803（Revival だけ）は確かめたいことに。
  ビスコは北、百騎兵は南へ手分けして魔女を捜す（A25 で百騎兵が先に魔女を見つける）。A23 から・A25 へはワイプ。
