  - {src: audio/sfx/rumble_low.ogg, cut: A24-003, t: 0.0, until: {cut: A24-003, t: 13.0}, loop: true, fade_in: 0.2, fade_out: 0.2, volume: 0.3}
  - {src: audio/sfx/rumble_low.ogg, cut: A24-004, t: 0.0, until: {cut: A24-007, t: 0.5}, loop: true, rate: 0.85, fade_in: 0.2, fade_out: 0.1, volume: 0.15}
  # 002 ビスコが起き上がる
  - {src: audio/sfx/cloth_swish.ogg, cut: A24-002, t: 1.6, volume: 0.25}
  # 007 急停車（車中）
  - {src: audio/sfx/metal_clank.ogg, cut: A24-007, t: 0.4, rate: 0.7, volume: 0.5}
  - {src: audio/sfx/impact_heavy.ogg, cut: A24-007, t: 0.8, rate: 1.2, volume: 0.45}
  - {src: audio/sfx/thud_land.ogg, cut: A24-007, t: 1.3, rate: 1.3, volume: 0.3}
