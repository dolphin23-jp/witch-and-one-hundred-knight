  - {src: audio/sfx/metal_clank.ogg, cut: A24-008, t: 1.6, rate: 0.6, volume: 0.45}
  - {src: audio/sfx/metal_clank.ogg, cut: A24-008, t: 2.4, rate: 0.75, volume: 0.4}
  - {src: audio/sfx/metal_clank.ogg, cut: A24-008, t: 3.2, rate: 0.9, volume: 0.35}
  - {src: audio/sfx/thud_land.ogg, cut: A24-008, t: 4.0, rate: 0.6, volume: 0.4}
