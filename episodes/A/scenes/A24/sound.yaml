# A24 の BGM・効果音の置き場所（D-068、2026-11-04）。tools/previs_reel.py が通しの下絵に重ねる。書き方は previs_reel.py の sound_items()。
# 音量は台詞を 1.0 とした大きさ（素材の大きさをならしてから掛ける）。BGM 0.28、環境音 0.07〜0.15、効果音 0.3〜0.8
scene: A24
bgm:
  # 原作どおり（パート21 の 11:43〜17:07 は M09「パート21の曲2」。A24 の台詞 L769〜L797 はすべてこの中）
  - {src: audio/bgm/catalog/M09.ogg, cut: A24-001, t: 0.0, until: {cut: A24-017, t: 18.4}, loop: true, fade_in: 1.5, fade_out: 2.5, volume: 0.28}
sfx:
  # 足音は自動（footsteps.yaml）
  # 虚空の空気（ずっと小さく）
  - {src: audio/sfx/wind_night_loop.ogg, cut: A24-001, t: 0.0, until: {cut: A24-017, t: 18.4}, loop: true, rate: 0.8, fade_in: 1.5, fade_out: 2.0, volume: 0.08}
