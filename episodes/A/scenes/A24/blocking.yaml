# A24 異空間・閉じた門（6章後半 回2）。D-058、D-060、D-062「3D を全編先に」。Claude の案（2026-11-04）
# Living Spec「A24 動きの設計（案）」。準備（案）の表の A24（「何も殴ることはないじゃないか」、門で急停車、流刑者の場所、三日もたずに発狂、門を閉めるのは魔女だけ。
#   切符を盗んだと疑うくだり L782〜L786 と、L789・L792・L793・L795・L796、列車の前に戻る場面 L804〜L808 は削る。拠点の L798〜L803 は確かめたいことに）。
# 場所は world/rift-void-layout.yaml（x 西→東、y 北→南、m）。線路は石の土手の上を東へ（y 50）。閉じた門は x 120。門の前の浮いた足場 (110, 50)、半径 10、上面 z 0。
#   車中は別の所に置いた箱の部屋（x 200〜202.6、y 100〜107。南が列車の前。座席は西 x 200.55・東 x 202.05、座面 z 0.45）。
# 夜光列車は東向き（face 90）。止まる所 (111.5, 45→50): 獅子の顔 (114.8, 50) 高さ 1.75、山羊は北 (112.6, 48.55)＝ゴードーラ・南 (112.6, 51.45)＝ゴードール
#   （A23 と同じく、列車の左がゴードーラ、右がゴードール）、蛇の頭 (108.05, 50) 高さ 4.25、ドーム (108.9, 50)。門の扉まで約 3.8m。
