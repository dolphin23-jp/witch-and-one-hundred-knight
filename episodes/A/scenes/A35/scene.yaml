id: A35
episode: A
title: 沼地のピラーとアロマニ・ジェル
status: 動きの設計と下絵（2026-11-06、Claude。Living Spec「A35 動きの設計（案）」。D-062 の 3D の段階）
approach: 'D-060・D-062。準備（案）の表の 7-07（縮める）と 7-08（残す）。森の小道で、フィールドワーク中のアルレッキーノに出会う（7-22 の登場の前振り。「さっきから、背後にいやな視線を感じておりますれば」、メタリカ「……ここは、沼からかなり距離があるぞ！」）。沼に着くと、メタリカ（千里眼越しの声）がピラーに気づき（「偶然か……それとも」「これは、さすがにちょっと、出来すぎてやしないか？」）、沼から守護者のアロマニ・ジェルが伸び上がる。短い戦闘の見せ場（体当たりを跳んでかわし、ゲルの吐き出しをくぐって脇を斬り、跳び上がって頭から斬り下ろす）。ジェルが崩れると、ピラーの碧が開く（準備（案）:
  ピラーの碧が開く画で締める）。「ふむ、あいかわらず沼はすばらしい！」、キモを抜き取り、「あいつらが待っているんだろ？」で戻る。'
source: 原作テキスト（Drive「Mj100 7-8」）、原作音源パート25 の頭〜5:30 ごろ
