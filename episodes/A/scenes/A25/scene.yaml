id: A25
episode: A
title: 盲いた魔女と追憶の園
status: 動きの設計と下絵（2026-11-04、Claude。Living Spec「A25 動きの設計（案）」。D-062 の 3D の段階）
approach: >-
  D-060・D-062。6章後半 回2 の核（準備（案）の表の A25）。百騎兵が先に虚空の奥で盲いた魔女に会い、遅れてビスコが来る。
  「あたしゃ目が見えないがあんたのことはよく見えるよ」、ビスコの名乗り（「父と母の名にかけて」）、門を閉めたのは魔女、翠ノ実のお使い。
  追憶の園でビスコが鼻で先に見つける。開門（指を鳴らすと門が光って開く）。列車の催促（合いの手は半分に: L847〜L849・L856・L857 を削る）。
  忠告「本当に大事なものは、いつだって、その手の中にあるんだ」、手を握ると翠ノ実。二人が駆け去った後の独白「今日だった。全部、見えていた」。
  魔女は顔の高さより下から撮り、独白だけ目元に寄る（準備（案）の演出）。魔女の居場所と門の前は普通のカットでつなぎ（同時に起きていること）、追憶の園への行き帰りはワイプ。
source: 原作テキスト（Drive「mj100 5-6」）、原作音源パート21 の 18:05〜25:50 とパート22 の 00:00〜08:30
