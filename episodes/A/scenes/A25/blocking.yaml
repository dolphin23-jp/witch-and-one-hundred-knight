    act: {start: 差し出された魔女の閉じた手を、ビスコの両手が上下から包む（手もとの寄り。魔女の右手は左の前腕を下から支える）, do: 指の間から緑の光が漏れ、魔女が両手をそっと抜くと、ビスコの右の手のひらに翠ノ実。ビスコ「これは……」と実を胸の高さへ持ち上げて驚く（カメラは実を追って東へ上がり、驚いた顔を真ん中に）。魔女「ヒッヒッヒ」でカメラが速く引き、のけぞって笑う魔女が帽子ごと入る（膝上の 2 人）。「さあ、」で魔女は両手でビスコの手ごと実を包んで押し返し、「それを持っておきな」でぽんぽんと叩いて手を離す。ビスコは実を胸へ引き寄せる。「そいつは砂糖漬けにすると旨いんだ」で魔女は指を振っておどけ、カメラはゆっくり寄る。ビスコははっとして照れ笑い。魔女が先に手を下ろし、カメラが南南東へ回り込む。ビスコ「ありがとうございます、」で実を胸の前に持ったまま小さく会釈、「魔女殿……」で顔を見る（魔女は小さくうなずく）。「感謝を。」で深く礼（実は胸の前の両手の中でほのかに光る）, end: 実を胸の前に持って深く礼をするビスコ（横顔）と、肩を揺らして笑う魔女}
    camera: 線の南、魔女の右肩の後ろの低い所（0.78m、52〜55mm）から手もとの寄り。実を追って東へ上がり、ビスコの驚いた顔（3/4）を真ん中に（2.5、50mm。魔女の顔と遠くの門は画の外）。「ヒッヒッヒ」で速く引いて（2.62〜3.35）のけぞって笑う魔女を帽子ごと入れ、南の低い所の膝上の 2 人（38mm）。「さあ」〜「それを持っておきな」はほぼ止め（7.5 で動画を 2 本に分ける）。「砂糖漬け」でゆっくり寄り（10.7、44mm。ビスコのはっと・照れ笑いが大きくなる）、南南東へ回り込んで横顔の礼（15.2、48mm）。礼で少し引き上がって放す
