# A25 盲いた魔女と追憶の園（6章後半 回2 の核）。D-058、D-060、D-062「3D を全編先に」。Claude の案（2026-11-04）
# Living Spec「A25 動きの設計（案）」。準備（案）の表の A25（「あたしゃ目が見えないがあんたのことはよく見えるよ」、名乗り、翠ノ実のお使い、
#   追憶の園でビスコが鼻で先に見つける、開門、忠告「本当に大事なものは、いつだって、その手の中にあるんだ」、翠ノ実を手渡す、独白「今日だった。全部、見えていた」）。
#   列車の催促の合いの手は半分に（L847〜L849・L856・L857 を削る）。L840「よいしょっと」は声が見つからないので置かない（芝居だけ）。
# 場所は world/rift-void-layout.yaml。魔女の居場所は浮いた円い足場 (78, 104)（半径 8、上面 z 0。古い椅子 (76, 102)、灯り2つ、光る石）。
#   門の前の足場から南の板の道を渡って北東から入る。西の板の道の先に追憶の園 (48, 112)（翠ノ実の木 (41.5, 116)）。
# 盲いた魔女の形は仮（設定画待ち。顔の高さより下から撮り、独白だけ目元に寄る、準備（案）の演出）。
# 列車の側（開門・催促・出発）は門の前（A24 と同じ。夜光列車は (111.5, 50) に東向き）。門が開くのは fx の rift（扉の前に光る楕円）で表す。
# 光: 魔女の居場所 witch_den、追憶の園 memory_garden、門の前 void。
