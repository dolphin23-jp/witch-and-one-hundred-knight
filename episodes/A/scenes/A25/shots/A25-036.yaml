shot: 全身→肩なめ→胸上・呼び止める魔女と断るビスコ
acting: 魔女「……。ちょいとお待ちな！娘さんや。ちょいと待っておくれ……」。ビスコは「お待ちな！」まで走り、後ろへ反って滑って止まり、「娘さんや」で頭だけ肩越しに振り返る。百騎兵は追い越して行き過ぎ、振り返りながら剣を立てて持ち直して戻る（剣先を人に向けない。037 と同じ持ち方）。無音の間にビスコは魔女へ向き直って半歩戻りかけ、右の肩越しに門を見る（急ぎと礼儀の綱引き）。百騎兵は待ちきれずに門の方へ数歩先に行く（画の右の外へ）。魔女は右手を出したまま首をかしげて耳を澄まし、息で肩を落として背を丸め、手のひらを上に小さく手招きする（命令から哀願へ）。左手は胸元で閉じたまま。ビスコはじりじり出口へ下がり、「……？」で足を止めて首をかしげ、「魔女殿。」で小さく会釈し、「急ぎますので……」と足を出口へ向けたまま右手で出口を示す。肩を落として出口へ向き直り、一歩目を出す（037
  へまたぐ。百騎兵は画の外で迎えに戻り、ビスコの北東に立つ）
