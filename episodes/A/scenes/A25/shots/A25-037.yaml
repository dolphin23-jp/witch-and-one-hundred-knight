shot: 2人・根負けして戻るビスコ → 下から魔女（忠告の切り出し）
acting: 前かがみの魔女「イ〜ヒッヒッヒ」の高笑い（身をそらして肩を揺らす）で、出口へ一歩出たビスコが一歩目のまま止まり、右の肩越しに振り返る。魔女「ちょっとした立ち話じゃないかい」と手招き。ビスコは門と魔女を見比べて迷い、門へ半歩出てから、腰に手を当ててもう一度振り返る（百騎兵は門へ向いて跳ねて急かす）。魔女「老い先短い」で胸に手を当てて身を縮め、ビスコは魔女へ向き直って肩を落とし、ため息。「老人の話は聞くもんだよ」で魔女が開いた手を肩の高さでビスコへ差し出し、ビスコは渋々戻って（7.5〜10.6）魔女の前で止まり、腕を組む（10.6〜10.85）。百騎兵はビスコの右奥（引きでビスコと重ならない）で剣を立てて待ち、画の外で遅れて戻って門の方を見る。魔女は差し出した手をそのまま
  11.2 まで保つ。11.2 で下からの腰上に切り替わり、魔女は手を下ろし、「なあに、」で小さく払って身を引き、人差し指を立てて「ひとつ忠告さね」と身を乗り出す（16.1 まで指を立てたまま止める）
dialogue:
- L862「イ〜ヒッヒッヒ。ちょっとした立ち話じゃないかい。老い先短い老人の話は聞くもんだよ。」
- L863「なあに、ひとつ忠告さね。」
