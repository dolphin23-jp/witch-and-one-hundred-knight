  の頭 lean 18 で終わる）。魔女の左手は胸元で閉じたまま（031 で受け取った翠ノ実を隠す手。041 まで同じ）。翠ノ実は映さない。037a の終わりの静止画は、肩の高さで手を差し出す魔女と、腕を組んだビスコ（魔女の手は奥の椅子に重ねない）。立てた指は顔の横ではなく、あごの高さの胸の前（カメラが魔女の右前にあり、顔の横へ上げると右腕が顔をふさぐため）。静止画では指をはっきり立て、閉じた左手より高く。百騎兵は頭から剣を立てて持つ（剣先を人に向けない）。カメラが寄ると画の外へ出て、画の外で戻る（038
  の頭の位置） 037b は 4.9 秒なので 5 秒で作って切る。'
