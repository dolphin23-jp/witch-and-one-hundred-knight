shot: 寄り（手もと）→ 膝上 2 人 → 横顔の礼・手渡される翠ノ実
acting: 線の南、魔女の右肩の後ろの低い所からの手もとの寄り。0〜0.3 にビスコの両手が、差し出された魔女の閉じた左手を下と上から包む（手は二人の真ん中、地平の線より上の暗い空を背に。魔女の右手は下ろさず、差し出した左の前腕を下から支える）。0.45〜1.3 に握り合った手のすき間から小さな緑の光が漏れ（暗い拳は見えたまま。実の大きさの緑はまだ出さない）、ビスコははっとして身をかがめる。魔女が両手をそっと抜き、上の手が開くと、ビスコの右の手のひら（038
  で空だった手）に翠ノ実（1.3、光の小さな山。閃光にしない）。ビスコ「これは……」で実を胸の高さへ持ち上げ、驚いた顔（3/4）が真ん中の上に入る。魔女「ヒッヒッヒ」でのけぞって笑い（ビスコは魔女の顔を見る）、カメラが速く引いて、笑う魔女が帽子ごと入る（3.2 から）。「さあ、」で魔女は両手でビスコの手ごと実を包んで押し返し、「それを持っておきな」でぽん、ぽんと叩いて手を離す。ビスコは両手で実を胸へ引き寄せて見下ろす。「そいつは砂糖漬けにすると旨いんだ」で魔女はあごの高さで人差し指を立てて振っておどける（037b
  の忠告の指と呼応する。振り上げた拳に見せない）（顔はビスコの声の方を向いたまま、実は見ない）。カメラはゆっくり寄る。ビスコは魔女へ目を上げ、「砂糖漬け」ではっとし（園で思ったことを言い当てられた）、照れて目を落とし、照れ笑い。声の後（11.5〜12.0）に魔女が先に手を下ろし、腹の前で両手を重ねる。ビスコ「ありがとうございます、」で実を胸の前に持ったまま小さく会釈（手と実は胸と一緒に前へ出る）、「魔女殿……」で魔女の顔を見る（魔女は小さくうなずく）。「感謝を。」で深く礼（腕は胸の前で実を持ったまま。実は両手の中でほのかに光る）。礼のまま止め、魔女は肩を小さく揺らして笑う
dialogue:
- L870「これは……。」
- L871「ヒッヒッヒ、さあ、それを持っておきな。そいつは砂糖漬けにすると旨いんだ。」
- L872「ありがとうございます、魔女殿……。感謝を。」
