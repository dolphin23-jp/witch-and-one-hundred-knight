notes: '翠ノ実は手に追従しないので、姿勢が移る間を 0.05 秒ごとに手の位置（FK）から求めてキーを打つ（1.3 秒までは足場の下に隠し、ease: step で手のひらに出す）。胸の前で持つ手は胸に対する腕の角度で決めてあり、会釈・礼で手と実が胸と一緒に前へ出る（前の版は手と実が場面の同じ点に残り、12.7〜13.4・15.3〜15.6 に実が胴に埋まった）。040 の終わりの魔女の手は
  (76.25,102.70) で、0〜0.3 に二人の真ん中 (76.12) へ 13cm 戻る。動画は 7.12〜7.62 の無言（カメラはほぼ止め）で 0〜7.4・7.4〜17.3 の 2 本に分ける。044（範囲の外）の頭のビスコは翠ノ実を持っていない（only に jade-fruit がない）。そろえるなら 044 の only と keys に jade-fruit を足す'
