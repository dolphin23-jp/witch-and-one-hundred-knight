acting: 魔女「本当に大事なものは、いつだって、その手の中にあるんだ」。腕を腰の前で組んで出口の門を気にしていたビスコは、右の肩越しに門へ目をやってから、魔女の静かな声に腕をほどく。もう一度門の方へ気が向きかけるが、「いつだって」で言葉に捕まって魔女へ戻り、首をかしげる。「その手の中に」で目を落とし、空の両手を胸の前で椀にし、頭を下げてのぞき込む（041 で翠ノ実が現れる手の仕込み）。魔女「それを心に留めておけば色んなことが見えてくるはずだよ」。胸の閉じた左手（実を隠した手）に右手を重ねて頭を胸へ寄せ、「見えてくる」で顔を少し上げて背を伸ばし（目はつばの陰のまま）、口元に笑みを残し、言い終わりに右手を下ろす（盲いた魔女の下からの顔。045〜047 の「すべて視える」の種）
