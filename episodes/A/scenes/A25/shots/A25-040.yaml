shot: 引き（南の高い所から三人）→ クレーンで下りて膝上・手を差し出す魔女
acting: 南の高い所の引き。ビスコは腰に手を当て（0〜0.5）、うんざり顔で「……まだあるのですか」。魔女は「ヒッヒッヒ」で肩を揺らしてのけぞり（2.75）、「そう言いなさんな」で胸の高さに右手を出し、手のひらを下にひらひら（4.35〜5.4、まあまあ）。台詞の間（5.75〜6.85）にビスコは体ごと右の肩越しに門の方をちらりと振り返り、門を気にしてそわそわする百騎兵が振り向いて目が合う（百騎兵は
  7.7 に門へ戻る）。魔女「それに、これで最後さ」で人差し指を顔の横に 1 本立て（8.45）、ビスコは首をかしげる。無音（9.3〜11.6）で魔女は立てた指をそのまま胸元へ下ろし、閉じた左手（翠ノ実を包んだ手）に右手を重ねて包み、少しうつむく。ビスコはうつむいてため息をつき、手が腰から落ち（10.2）、顔を上げて観念する（11.3）。魔女「こっちにきて」の右手の手招き（11.85〜12.6、左の拳は胸元のまま）で、ビスコはひと呼吸ためらってから（12.05）足を運んで歩み寄り（12.3〜13.7、3
  歩）、魔女の前 1m に止まる。「ちょっとあたしの手をにぎっておくれな」の「手を」（14.2）で、閉じた左手が胸元から 0.3m 前へ、ビスコの胸の前（腰の高さ）へ差し出され、ビスコは手を見下ろし、魔女の顔（14.85）、また手（15.55）と見比べる。声の後（15.65〜16.5）、ビスコは両手を下から伸ばし始め（拳の手のひら 1 枚分ほど下。まだ触れない）、魔女の右手も下から添えに上がる。041
  の頭で手が上がりきり、0.3 で包む
