site: world/tettara-desert-layout.yaml
audio: audio/A04/original/   # L113〜L142（使う台詞 25本・125.5秒）
time: 昼

layout:
- 百騎兵は西から砂丘を越えて東へ歩く。ルッキーニィは砂漠の中ほど（62, 50）に倒れていて、頭を西南西（百騎兵の来る方）に向けている
- 商人のキャンプはルッキーニィの北東 約45m。百騎兵はそこへ水を取りに行って戻る
- 会話の軸は百騎兵とルッキーニィを結ぶ線。カメラは軸の北側（太陽の当たる南を背景にすると逆光になる向き）に置く。真上・POV・走りの追いかけは軸の外
- 背丈の差（ルッキーニィ 1.4m、百騎兵 0.9m）。ルッキーニィは 005〜014 は砂に伏せている、015〜018 は座っている、019 で立ち上がる

sections:
- {name: 砂漠, cuts: [A04-001, A04-004], note: 果てのない砂漠を一人で歩く。メタリカの砂漠の講義（縮めたもの）。遠くで角笛（伏線）}
- {name: 行き倒れ, cuts: [A04-005, A04-011], note: 倒れた羊飼いを見つけ、スズの音草を聞く。「水を」で、水を探しに行く}
- {name: 水, cuts: [A04-012, A04-016], note: 商人のテントから水瓶を奪って駆け戻り、飲ませる（台詞なしの3カットは短く速く）}
- {name: 砂食みの話と村へ, cuts: [A04-017, A04-023], note: 砂食みの話、村へ誘う。角笛を吹いて砂丘へ駆け出す}

continuity:
- '探し物メモ: 008 で百騎兵がガントレットから出し、009 でルッキーニィの前に差し出す。011 以降は百騎兵の手の中（映さない）'
- '水瓶: 013 で百騎兵が奪い、014 で頭の上に掲げて走る。015〜017 はルッキーニィが抱える。019 で砂の上に置く'
- '角笛: ルッキーニィの背中の杖の先。022 で口に当て、023 で吹く'
- '光: 昼の高い太陽（ほぼ南から）。影は短い'
