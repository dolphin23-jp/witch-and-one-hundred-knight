title: 砂漠と行き倒れ（昼）
status: 配置とカメラの案（2026-10-30、Claude。「砂漠編 台詞と画（構想）」の A04 を元に、長い台詞のカットを分けて23カットにした）
approach: >-
  A02 と同じ作り方（配置の計算 → Blender の下絵 → 開始と終わりの静止画 → Seedance 2.0）。D-058 のとおりカメラを動かす:
  歩く・走る人物は追いかける、感情の山は寄る、場面の始めと終わりは引きやクレーン。向き・高さ・レンズを散らす。
  メタリカは魔女邸から声だけ（画に出さない）。D-059 の選別で残した台詞だけを使う（audio/A04/original/script.yaml の use）。
