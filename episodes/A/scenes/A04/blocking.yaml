# A04 砂漠と行き倒れの立ち位置・向き・動きとカメラ割り（演出ノート P-01・P-03・P-04、D-058）。Claude の案（2026-10-30）。ユーザーのイメージを聞いて直す
# 場所は world/tettara-desert-layout.yaml（x: 西0→東140、y: 北0→南100、m）。方位: 北 0・東 90・南 180・西 270。見た目の資料はユーザーが用意した背景（テッタラ砂漠・商隊キャンプ）
# 書き方は episodes/A/scenes/A01b/blocking.yaml の頭のコメントと同じ。足した項目:
#   posture: {人物: lying|sitting|kneeling|crouching|standing}（posture_end: 終わり、posture_t: 変わる秒）。lying はうつ伏せで、face の向きに頭がある
#   cam_end / cam_t: カメラ本体の移動（tools/previs.py）。look_end / lens_end: 終わりの向きとレンズ
# 秒は原作の声の実測（audio/A04/original/lines.csv）に、芝居の間を足した目安。確かめるのは python tools/staging.py episodes/A/scenes/A04
scene: A04
layout: world/tettara-desert-layout.yaml
map_ymax: 100

places:
  hk_a:    [18.0, 51.0]   # 001 歩き始め（西の砂丘）
  hk_b:    [23.0, 51.0]
  hk_c:    [25.0, 51.5]   # 002
  hk_d:    [31.0, 51.8]
  hk_e:    [33.5, 52.0]   # 003 骨の向こうを通る
  hk_f:    [38.5, 51.8]
  hk_g:    [40.5, 51.6]   # 004 立ち止まって太陽を見上げる
  hk_h:    [44.0, 51.2]
  hk_i:    [47.5, 50.6]   # 005 砂丘を越えて、倒れた人影に気づく
  hk_j:    [50.6, 50.0]
  lk:      [62.4, 50.2]   # ルッキーニィ（伏せている。頭は西南西 250°、頭の位置は約 [61.8, 50.4]）
  lk_head: [61.8, 50.4]
  hk_n:    [60.9, 51.6]   # 006〜011 百騎兵（ルッキーニィの頭の南西 1.3m）
  sun_s:   [44.0, 90.0]   # 南の空（太陽を見上げる向き）
  tent_in: [97.5, 24.5]   # テントの入口
  goods:   [101.6, 29.5]  # 水甕と荷物
  hk_t0:   [94.6, 27.7]   # 012 キャンプへ駆け込む（カメラの右手前から）
  hk_t1:   [96.9, 25.3]
  hk_jar:  [100.6, 30.4]  # 013 水甕を奪う
  mer:     [103.0, 28.4]  # 水瓶売りの商人
  hk_r0:   [86.5, 36.2]   # 014 水瓶を掲げて駆け戻る
  hk_r1:   [75.0, 43.2]
  lk_sit:  [62.2, 50.3]   # 015〜 ルッキーニィ（座る・立つ）
  hk_s:    [61.0, 51.2]   # 015〜 百騎兵
  two:     [61.6, 50.75]  # 二人の間
  ne:      [74.0, 41.0]   # 北東の砂丘（村への抜け道の方）
  lk_go:   [73.0, 42.2]   # 023 駆けていく先
  hk_go:   [71.2, 43.4]

start:
  hundred-knight: {at: hk_a, face: 90}
  luckiny:        {at: lk, face: 250}
  water-merchant: {at: mer, face: 200}

# 会話の軸。同じ区間ではカメラを線の同じ側（北）に置く
axes:
  - {name: 行き倒れ 百騎兵↔ルッキーニィ, cuts: [A04-006, A04-011], a: hundred-knight, b: luckiny, side: [62.0, 47.0]}
  - {name: 水を飲む〜立ち上がる 百騎兵↔ルッキーニィ, cuts: [A04-015, A04-019], a: hundred-knight, b: luckiny, side: [62.0, 47.0]}

cuts:
  # ---------- 砂漠（001〜004） ----------
  A04-001:
    frame: 大引き
    cam: [26.0, 40.0, 16.0]
    cam_end: [12.0, 45.0, 3.5]
    look: [22.0, 51.0]
    look_end: [24.0, 51.0]
    lens: 28
    tilt: down
    only: [hundred-knight]
    move: {hundred-knight: {to: hk_b, face: 90}}
    act: {start: 高い空から見下ろす果てのない砂丘。砂の上に小さな点（百騎兵）, do: カメラが下りながら引き、砂丘の稜線をまたいで一人歩く百騎兵を見せる, end: 地平線まで続く砂丘と、その手前を歩く小さな百騎兵, sync: L113「ふーん。これが砂漠というものか。」は 1.0秒から}
    camera: 高い空から下りながら引く（クレーン）。百騎兵は画面の中で小さく
    pose: {"hundred-knight": "walking steadily across the sand"}
    pose_end: {"hundred-knight": "walking steadily across the sand"}
    kind: A
  A04-002:
    frame: 全身
    cam: [25.0, 54.2, 0.3]
    cam_end: [31.0, 54.5, 0.3]
    look: hundred-knight
    look_h: 0.45
    lens: 28
    only: [hundred-knight]
    move: {hundred-knight: {to: hk_d, face: 90}}
    set: {hundred-knight: {at: hk_c, face: 90}}
    act: {start: 砂の高さから、百騎兵の足元。一歩ごとに足が砂に沈む, do: 横に並んで同じ速さで追いかける。頭の炎が熱でゆらゆら揺れる, end: 同じ構図のまま歩き続ける, sync: L114「砂漠とはよく言ったものだ……つまらんな。」}
    camera: 足元の低い位置で横に並んで追う（トラック）
    pose: {"hundred-knight": "trudging through soft sand, its feet sinking with every step"}
    pose_end: {"hundred-knight": "trudging through soft sand, its feet sinking with every step"}
    kind: M
  A04-003:
    frame: 引き
    cam: [34.0, 78.0, 1.2]
    look: [36.0, 64.0]
    look_end: [37.5, 63.5]
    lens: 85
    only: [hundred-knight]
    move: {hundred-knight: {to: hk_f, face: 90}}
    set: {hundred-knight: {at: hk_e, face: 90}}
    act: {start: 陽炎で揺らぐ砂の上に、半分埋まった大きな獣のあばら骨。その向こう遠くに小さな百騎兵, do: 骨の向こうを百騎兵が横切っていく。カメラはゆっくり横へ振る, end: 骨と、遠ざかる百騎兵, sync: L119「昼は灼熱、夜は極寒！……死の世界だ。」}
    camera: 望遠で陽炎を強く。ゆっくり横へ振る（パン）
    pose: {"hundred-knight": "walking far in the background, small"}
    pose_end: {"hundred-knight": "walking far in the background, small"}
    kind: M
  A04-004:
    frame: 全身
    cam: [47.6, 51.0, 0.35]
    cam_end: [49.0, 50.9, 0.45]
    cam_t: [6.0, 10.0]
    look: hundred-knight
    look_h: 0.9
    lens: 50
    only: [hundred-knight]
    move: {hundred-knight: {to: hk_h, face: 90, t: [0.0, 2.2]}}
    set: {hundred-knight: {at: hk_g, face: 90}}
    gaze: {hundred-knight: sun_s}
    act: {start: 正面の低い位置。百騎兵が歩いてきて止まる, do: 空を見上げ、まぶしい太陽をしばらく見つめる。遠くで角笛の音がかすかに鳴る（BGM の効果音）, end: 視線を戻して、また歩き出す, sync: L121「まあ、オマエの場合は……いらないからな。」で見上げ、L122「いつもと何も変わらんさ。」で歩き出す。角笛の音でカメラが後ろへ引く}
    camera: 正面の煽り。角笛の音で、後ろへ滑るように引く（ドリー）
    pose: {"hundred-knight": "walking toward the camera"}
    pose_end: {"hundred-knight": "standing still, its head tilted up toward the blazing sun"}
    kind: M

