    set: {hundred-knight: {at: hk_i, face: 90}}
    posture: {luckiny: lying}
    gaze: {hundred-knight: lk}
    act: {start: 百騎兵の肩越し。砂丘の稜線を越えた先に、赤いフードの人影が倒れている, do: 百騎兵が止まる。カメラが倒れた人影へ一気に寄る, end: 砂に伏せた赤いフードの小さな体, sync: L123「なんだ、あいつ？行き倒れか……？」}
