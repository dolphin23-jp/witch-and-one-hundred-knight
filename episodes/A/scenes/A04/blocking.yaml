    pose: {"hundred-knight": "walking over the crest of a dune, then stopping", "luckiny": "lying face down in the sand, motionless, far ahead"}
    pose_end: {"hundred-knight": "standing still, staring ahead", "luckiny": "lying face down in the sand, motionless"}
