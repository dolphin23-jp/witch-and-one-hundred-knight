id: A13
episode: A
title: テッタラ・弟子入りと白夜月（黄昏の前）
status: 動きの設計と下絵（2026-11-01、Claude。Living Spec「A13 動きの設計（案）」。D-062 の 3D の段階）
approach: >-
  D-060・D-062。夜会編 回2 の最初（選別の 8・9・10）。テッタラへ来た百騎兵を、村を追い出されたルッキーニィが村の外の砂地で迎える。
  メタリカの幻影がルッキーニィにも見え（A11 のビスコに続く伏線）、スズの音草で三品が揃い、ルッキーニィは一番弟子になる。
  追放を明るく話すルッキーニィに黙るメタリカ、「一人前の魔女にしてやろう！」。白夜月の下、百騎兵はアズ・ブロッケン山へ先に向かう。
source: 原作テキスト（Drive「mj100 5-6」）、原作音源パート18 の 23:49〜29:19
