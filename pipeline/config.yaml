# 役割ごとの実装。ツールを替えるときはここだけを書き換える。
# status: candidate（ベイクオフ中） / adopted（採用） / fallback（予備）
# 方針: 制作パイプライン（Living Spec）、D-034、D-035、D-036

# Drive の「魔女と百騎兵 原作音源」フォルダの受け口（setup/drive_bridge.gs）。大きい音声の読み書きに使う（tools/drive.py）。
# URL だけでは使えない。鍵は環境変数 DRIVE_BRIDGE_KEY（Drive の「Claude受け口_鍵.txt」の中身をクラウド環境の設定に入れる）。
drive_bridge:
  url: https://script.google.com/macros/s/AKfycbyMCue7G3GxcruxRcaLJVDpHd2WDNm4NHG1jT0VQJoVEqMMkxX7lYRK8weKRU-Ur6k5zw/exec
  root: 1TMvhdD_r2KuW6iblN86JY567IpwalXSz   # 魔女と百騎兵 原作音源

roles:
  image:
    input: ショット指定 + 参照画像
    output: 静止画 (PNG)
    implementations:
      - {name: nano-banana-pro, via: higgsfield, status: adopted, note: アニメとして動かしやすい（ユーザー判断、D-041）}
      - {name: gpt-image-2, via: higgsfield, status: fallback, note: A01-019 の試作で逆光と表情は良かった}
      - {name: gpt-image-2, via: codex-cli, status: dropped, note: 利用上限で試行できず。比較せず Nano Banana Pro で進める（ユーザー判断 2026-09-26。D-036 のまま）}
      - {name: soul, via: higgsfield, status: dropped, note: A01-019 の試作で指示とキャラクターを保てなかった}

  previs:
    input: blocking.yaml（人物の位置・向き・移動、カメラ、レンズ）+ ショットファイルの秒
    output: 人形が動く下絵動画 (MP4、音なし)。Seedance の参照動画に渡す（D-055）
    implementations:
      - {name: blender-bpy, via: local, status: adopted, tool: tools/previs.py, note: "配置・動き・カメラだけを写す。顔と衣装は写さない。Cycles（CPU）で描く。セッションごとに venv へ pip install bpy pyyaml pillow（約20秒）。1フレーム約2秒（768x432、10サンプル）"}
      - {name: 3d-jutsu, via: higgsfield, status: fallback, note: "Higgsfield 上の Blender。自前のモデルは読み込めない（カタログのみ）。Seedance 2.5 に描画を開始フレームとして渡せる"}

  video:
    input: 開始の静止画（必要なら終わりの静止画）+ 動きの指定 + プリビズ動画（動きとカメラの参照）+ 口パクの参照（原作の声）
    output: 数秒の動画 (MP4)。生成された音声は使わない（generate_audio=false。声は原作の音源だけ、D-045）
    implementations:
      - {name: seedance-2.0, via: higgsfield, status: candidate, note: "D-055 で動画は Seedance に決定。2.0 か 2.5 かは試験で決める（決まったら adopted にする）。std は Plus 以上。5秒の見積もり: 720p 22.5クレジット、480p 15、fast 480p 5（参照なしの見積もり。参照を付けると変わるかは未確認）。参照は 開始・終了フレーム、画像、動画、音声"}
      - {name: seedance-2.5, via: higgsfield, status: candidate, note: "D-055 で動画は Seedance に決定。2.0 か 2.5 かは A01b-001・030・031 の試験で決める。5秒の見積もり: 720p 35クレジット、480p のドラフト 15（7日以内に 1080p へ仕上げられる）。4〜30秒、omni_reference で画像・動画・音声の参照"}
      - {name: seedance-2.0-mini, via: higgsfield, status: candidate, note: "5秒 720p 5クレジット。構図や動きの確認用の候補"}
      - {name: wan-3.0, via: higgsfield, status: fallback, note: "D-055 で予備に変更（D-043 は採用だった）。最初のフレームに忠実。720p・4秒で7クレジット"}
      - {name: wan-3.0, via: alibaba-model-studio, status: fallback, note: "公式API。アカウント手続きが途中のため未使用"}
      - {name: kling-3.0, via: higgsfield, status: fallback, note: "1本6クレジット（4秒）"}
      - {name: veo-3.1, via: higgsfield, status: dropped}
      - {name: runway-gen-4.5, via: runway, status: dropped, note: "個別契約が必要"}
      - {name: vidu, via: vidu, status: dropped, note: "個別契約が必要"}

  voice:
    input: 原作音源（ユーザーが用意）+ 脚本の台詞（D-045）
    output: 台詞ごとの音声 (WAV、声だけ)
    implementations:
      - {name: original, via: user, status: adopted, tool: tools/extract_lines.py, note: 原作の台詞音源をユーザーが用意（D-045）。長い音源は Demucs htdemucs_ft で声を分け、Whisper large-v3 の時刻で脚本と突き合わせて切り出す}
      - {name: gemini-3.8-flash-tts, via: gemini-api, status: dropped, tool: tools/gemini_tts.py, note: D-045 で不採用}

  hundred_knight_voice:
    input: 感情の語彙
    output: 効果音
    implementations: []   # 未定。効果音の合成と加工

  music_sfx:
    input: 場面の感情、主題の型
    output: BGM、効果音
    implementations:
      - {name: original, via: user, status: adopted, note: BGM は原作の音源をユーザーが用意（D-045）。効果音は未定}
      - {name: lyria-3.5, via: gemini-api, status: dropped, tool: tools/lyria.py, note: D-045 で不採用}

  compositing:
    input: 動画 + 漫符 + エフェクト
    output: 完成カット
    implementations:
      - {name: hyperframes, status: candidate}
      - {name: remotion, status: candidate}

  animatic_assembly:
    input: ショットファイル + 素材
    output: 一話の動画
    implementations:
      - {name: ffmpeg, status: temporary, tool: tools/animatic.py, note: 静止画がそろうまでの仮の組み立て（尺と間の確認用）}
      - {name: hyperframes, status: candidate}
      - {name: remotion, status: candidate}
