# 役割ごとの実装。ツールを替えるときはここだけを書き換える。
# status: candidate（ベイクオフ中） / adopted（採用） / fallback（予備）
# 方針: 制作パイプライン（Living Spec）、D-034、D-035、D-036

roles:
  image:
    input: ショット指定 + 参照画像
    output: 静止画 (PNG)
    implementations:
      - {name: nano-banana-pro, via: higgsfield, status: adopted, note: アニメとして動かしやすい（ユーザー判断、D-041）}
      - {name: gpt-image-2, via: higgsfield, status: fallback, note: A01-019 の試作で逆光と表情は良かった}
      - {name: gpt-image-2, via: codex-cli, status: candidate, note: ChatGPT のプラン枠で生成（試行中。D-036 の改訂案）}
      - {name: soul, via: higgsfield, status: dropped, note: A01-019 の試作で指示とキャラクターを保てなかった}

  video:
    input: 最初と最後の静止画 + 動きの指定
    output: 数秒の動画 (MP4)
    implementations:
      - {name: wan-3.0, via: alibaba-model-studio, status: adopted, tool: tools/wan_video.py（未作成）, note: 最初のフレームに忠実で安い（D-043）。環境変数 DASHSCOPE_API_KEY と DASHSCOPE_WORKSPACE_ID}
      - {name: seedance-2.0, via: higgsfield, status: fallback, note: Higgsfield の Plus プラン以上が必要。大きな動きのカットで比較する候補}
      - {name: kling-3.0, via: higgsfield, status: fallback, note: 1本6クレジット（4秒）}
      - {name: veo-3.1, via: higgsfield, status: dropped}
      - {name: runway-gen-4.5, via: runway, status: dropped, note: 個別契約が必要}
      - {name: vidu, via: vidu, status: dropped, note: 個別契約が必要}

  voice:
    input: 台詞 + 声の設計書 + 演技指定
    output: 音声 (WAV)
    implementations:
      - {name: gemini-3.8-flash-tts, via: gemini-api, status: candidate, tool: tools/gemini_tts.py}

  hundred_knight_voice:
    input: 感情の語彙
    output: 効果音
    implementations: []   # 未定。効果音の合成と加工

  music_sfx:
    input: 場面の感情、主題の型
    output: BGM、効果音
    implementations: []   # 未定

  compositing:
    input: 動画 + 漫符 + エフェクト
    output: 完成カット
    implementations:
      - {name: hyperframes, status: candidate}
      - {name: remotion, status: candidate}

  animatic_assembly:
    input: ショットファイル + 素材
    output: 一話の動画
    implementations:
      - {name: hyperframes, status: candidate}
      - {name: remotion, status: candidate}
