# 魔女邸の下絵用の配置に足す部分（6章後半 回1、A18〜A22。2026-11-02、Claude の案）。blocking.yaml の layout_extra で offset [0, 0] のまま足す。
# 元の world/witch-house-3d-layout.yaml（居間と寝室）は夜会編の場面が使うので触らない。
#   - 2階の廊下とメタリカの部屋の扉（x 12〜18、y −3.4〜−0.4）。扉は廊下の南の壁 x 17.0。扉の前に冷めた食事のお盆。
#     寝室の北の壁（y 0）と壁が重なると黒く描かれる（2026-11-02 に確かめた）ので、0.4m 離した。
#     閉じこもるメタリカの部屋。カットの door_closed: true で扉を閉じる。扉の下から漏れる緑の光は fx の leak（A30 の毒沼の逆襲の伏線、2026-11-02 ユーザー判断「匂わせる」）。
#   - バスルーム（x 12〜18、y 6〜11）。北の壁の西寄り x 13.0 に扉。赤いカーテンと大きな浴槽（沼の水が光る）。原作「赤いカーテンと大きな浴槽のあるバスルーム」。
# 実際は2階と1階の別の所だが、下絵では居間の東に別に置く（寝室と同じ扱い）。開口の c は絶対座標（offset はずらさない）。
id: witch-house-6b-extra
size: {w: 18.0, d: 11.0}
lighting:
  hall_morning:   # 2階の廊下の朝（東の小窓から低い朝日、廊下の燭台）
    sun_from: 100
    sun_elev: 14
    sun_energy: 2.6
    sun_color: [255, 220, 180]
    sky: [150, 165, 200]
    sky_strength: 0.45
    lamps: 0.8
    fill: {at: [15.0, -1.9], z: 2.6, energy: 160, color: [255, 220, 190]}
  hall_afternoon:   # 2階の廊下の午後（A19）
    sun_from: 250
    sun_elev: 25
    sun_energy: 1.6
    sun_color: [255, 205, 150]
    sky: [170, 150, 125]
    sky_strength: 0.45
    lamps: 0.9
    fill: {at: [15.0, -1.9], z: 2.6, energy: 150, color: [255, 215, 175]}
  hall_night:   # 2階の廊下の夜（A24b。東の小窓から青い月明かり、廊下の燭台だけが灯る。2026-11-05）
    sun_from: 95
    sun_elev: 20
    sun_energy: 0.9
    sun_color: [150, 170, 255]
    sky: [20, 26, 60]
    sky_strength: 0.35
    lamps: 1.3
    fill: {at: [15.0, -1.9], z: 2.6, energy: 70, color: [255, 190, 140]}
  bath_day:   # バスルームの昼（東の窓から白い光、天井のランプ、浴槽の沼の光）
    sun_from: 110
    sun_elev: 35
    sun_energy: 2.0
    sun_color: [240, 240, 235]
    sky: [170, 185, 200]
    sky_strength: 0.5
    lamps: 1.0
    fill: {at: [15.0, 8.5], z: 2.8, energy: 260, color: [235, 240, 245]}
  living_morning:   # 居間の朝（A18）。元の morning は窓から光が入らず暗かったので、補助光と吊りランプを強めた（2026-11-02）
    sun_from: 100
    sun_elev: 18
    sun_energy: 3.0
    sun_color: [255, 225, 190]
    sky: [175, 195, 225]
    sky_strength: 0.75
    lamps: 0.8
    fill: {at: [4.0, 3.5], z: 3.8, energy: 800, color: [235, 238, 255], radius: 4.0}
  evening:   # 居間の夕方（A22。西の低い橙の光と吊りランプ）
    sun_from: 265
    sun_elev: 8
    sun_energy: 2.2
    sun_color: [255, 160, 90]
    sky: [120, 90, 100]
    sky_strength: 0.45
    lamps: 1.3
    fill: {at: [4.0, 3.5], z: 3.8, energy: 650, color: [255, 200, 150], radius: 4.0}
