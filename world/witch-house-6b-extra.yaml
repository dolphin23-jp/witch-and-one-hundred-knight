  lantern_hall_w: {at: [13.0, -3.15], z: 2.1, energy: 14, ja: 廊下の燭台（西）}
  lantern_hall_e: {at: [17.85, -1.4], z: 2.1, energy: 12, ja: 廊下の燭台（扉の脇）}
  # --- バスルーム ---
  room_bath:
    x: [12.0, 18.0]
    y: [6.0, 11.0]
    h: 3.2
    roof: 1.2
    ja: バスルーム
    openings:
    - {side: n, c: 13.0, w: 1.0, h: 2.2, ja: バスルームの扉}
    - {side: e, c: 8.0, w: 0.8, h: 1.0, sill: 1.3, ja: 東の窓}
