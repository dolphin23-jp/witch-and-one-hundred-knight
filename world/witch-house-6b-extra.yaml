  curtain_bath_back: {at: [15.6, 10.78], w: 3.6, h: 2.8, color: [165, 25, 35], ja: 浴槽の奥の赤いカーテン}
  curtain_bath_w: {at: [13.95, 9.6], w: 1.7, h: 2.6, rot: 90, color: [165, 25, 35], ja: 浴槽の西の赤いカーテン（マーニィがこの陰から出てくる）}
  curtain_bath_e: {at: [17.3, 9.6], w: 1.7, h: 2.6, rot: 90, color: [165, 25, 35], ja: 浴槽の東の赤いカーテン}
  shelf_bath: {at: [17.72, 6.9], w: 0.45, d: 1.1, h: 1.5, ja: 薬瓶とタオルの棚}
  stool_bath: {at: [12.9, 7.5], ja: 腰かけ}
  lantern_bath: {at: [15.4, 8.2], z: 2.7, energy: 30, ja: 天井のランプ}
