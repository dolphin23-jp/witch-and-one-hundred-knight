# アズ・ブロッケン山の下絵用の配置（D-060・D-062、tools/previs.py と tools/staging.py が読む）。Claude の案（2026-11-01、A14〜A17 用）
# 見た目の資料: 山の道は refs/az-brocken-path_bg_01（岩の尖塔のあいだを縫う木の板の道、渦巻きの模様の丸い板の踊り場、下に広がる砂漠）、
#   山頂は refs/az-brocken-summit_bg_01（崖の上の丸い広場、渦巻きの丸い石の敷き、黄色い枯れ草、中央に黒い丸太を積んだ塔と白い面、木の柵）。
#   背景の画像は「場所の見た目の資料」で、その視点は写さない（D-058）。構図はカメラから見た略図と下絵に従う。
# 座標: x は西 → 東、y は北 → 南（m）。方位: 北 0・東 90・南 180・西 270。高さ z は m（上が +）。
#   下の砂漠（地面）は z −60。足場（ledge）は岩の柱の上の丸い板で、上面の高さが h。人物は足場の上でキーの z に h を書く（ground_z には入れない）。
# 場所（南から北へ登る。西に日が沈む）:
#   行き止まり（ledge_end、z 0）: 南から来た板の道が、谷に突き当たって終わる丸い踊り場。北の縁に草むら（古の風紋が隠れている）。
#   風紋で跳ぶ足場（ledge_j1〜j4、z 5〜19）: 谷の向こうに、ジグザグに高くなる小さな足場。それぞれに風紋（rune）。
#   ピラーの峰（ledge_pillar、z 22、半径 8）: 丸い広場。中央に咲く前のピラー（bud）。守護者のからくり人形と戦う。A15 で沼に変わる。
#   山頂の峰（ledge_summit、z 26、半径 11）: 東の隣の峰（谷をはさんで約 30m）。中央に木の像（effigy）、そばに樽（A16）。夜会の広場（A16・A17）。
# 魔女邸の居間（A14 の 003・004・007、ルッキーニィの星読み）は layout_extra で world/witch-house-3d-layout.yaml を x +200、y +200 に置く。
