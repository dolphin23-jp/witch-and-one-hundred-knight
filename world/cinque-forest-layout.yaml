# チンクエの森（紅嵐街道沿いの森）の下絵用の配置。7章前半（A34〜A36・A38・A40）。Claude の案（2026-11-06）
# 見た目の資料: world/cinque-dump（紅葉の森のゴミ山。樽・車輪・木箱・骨・壺、苔の盛り土、小道、街道の柵）と
#   world/marsh-pillar（紅葉の森の沼。中の島に緑の尖塔形のピラー、がま、倒木、もや、泡）。背景の画像は「場所の見た目の資料」で、その視点は写さない（D-058）
# 座標: x は西 0 → 東 80、y は北 0 → 南 100（m）。方位: 北 0・東 90・南 180・西 270
# 地図（1枚に、7章前半のチンクエの場所を全部置く。場面ごとに使う所を決める）:
#   ゴミ山の広場（中心 34, 53、半径約 12m）: ミトンの住みか。北西に大きなゴミの山、西・北東・南西にも山。東は街道への道（x 44〜52、y 51〜56）。
#   紅嵐街道（x 52〜56、南北にまっすぐ）。西の縁に柵（x 51.4、y 30〜50 と 57〜85。広場の前は柵が切れる）。ハインツの馬車は南から北へ通る（7-13）。
#   かなきり穂の茂み（中心 25, 71）: ずっしりの実が落ちる穂の茂み（7-05）。
#   森の小道（x 32.5〜35.5、y 22〜41）: 広場から北の沼へ。アルレッキーノのフィールドワーク（7-07、33, 30 あたり）。
#   沼地のピラー（沼の中心 34, 13、半径 7.5m）: 中の島（半径 2.4m）に咲く前のピラー（bud）。がまと倒木。アロマニ・ジェルが守る（7-08）。
