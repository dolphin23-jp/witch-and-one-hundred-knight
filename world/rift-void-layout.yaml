# 異空間（夜光列車が走る世界の裏側）の下絵用の配置（6章後半 回2 の A24・A25。2026-11-04、Claude の案。2026-11-05 にユーザーの背景に合わせて直した）
# 原作: 列車は「異空間」を走る（線路なんかなくても大丈夫）。途中、流刑者が送り込まれるような場所で、閉じた大きな門の前に急停車する（A24）。
#   門を閉めたのは「盲いた魔女」。百騎兵とビスコは手分けして魔女を捜し、魔女の居場所（異空間の奥）で会う。魔女のお使いで「追憶の園」の翠ノ実を取ってくる（A25）。
#   車中は「列車の座席のような真っ暗な空間」。
# 背景の資料: ユーザーが用意した refs/otherspace_bg_01.jpg（異空間(線路を塞ぐように作られた門)）。青紫に光る渦の地面がどこまでも続き、線路はその上に直に敷かれる。
#   線路を塞ぐのは透けたゴシックの門（両脇の尖塔、尖った頭、縦の格子、裾が外へ広がる）。葉のない大木が根を広げ、まわりに暗い穴がある。遠くは暗い木々の影。
#   追憶の園は Claude が作った参考画 world/memory-garden/（光る翠ノ実の生る木々、大木の根元の石の輪とベンチ、立石、同じ光る地面）。
#   前の配置（浮いた岩の足場と板の道、虚空は z −80）は、この画像を見ずに作ったので改めた。人の立つ所の高さ（z 0）と位置は変えていない。
# 座標: x は西 → 東、y は北 → 南（m）。地面（光る渦）は z 0。
#   線路: 東へまっすぐ（y 50、x −200〜118）。門は x 120（線路をふさぐ。幅 19m・高さ 17m）。門の前 (110, 50)。
#   門の前から南東へ → 中継 (98, 84) → 魔女の居場所 (78, 104)（A25 の前半。大木の根元）→ 西へ → 追憶の園 (48, 112)（A25 の後半）。
#   門の前から北へも（百騎兵とビスコが手分けする）→ 北の行き止まり (96, 20)。
#   車中（A24 の前半）は別の所に置いた箱の部屋（x 200〜202.6、y 100〜107。座席が2列、琥珀色の窓明かり）。
