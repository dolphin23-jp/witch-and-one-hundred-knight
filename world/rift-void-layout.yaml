# 異空間（夜光列車が走る世界の裏側）の下絵用の配置（6章後半 回2 の A24・A25。2026-11-04、Claude の案）
# 原作: 列車は「異空間」を走る（線路なんかなくても大丈夫）。途中、流刑者が送り込まれるような場所で、閉じた大きな門の前に急停車する（A24）。
#   門を閉めたのは「盲いた魔女」。百騎兵とビスコは手分けして魔女を捜し、魔女の居場所（異空間の奥）で会う。魔女のお使いで「追憶の園」の翠ノ実を取ってくる（A25）。
#   車中は「列車の座席のような真っ暗な空間」。
# 背景の資料はまだない（静止画の日までに、ユーザーが用意するか、Claude が参考画を作る。D-058）。形は仮置き。
# 座標: x は西 → 東、y は北 → 南（m）。足元の「地面」はずっと下（z −80）の暗い虚空。人の立てる所は浮いた岩の足場（ledge、上面 h）と板の道。
#   線路: 石の土手の上を東へまっすぐ（y 50、x −200〜118）。門は x 120（線路をふさぐ）。門の前の足場 (110, 50)。
#   門の前から南へ板の道 → 中継の足場 (98, 84) → 魔女の居場所 (78, 104)（A25 の前半）→ 西へ板の道 → 追憶の園 (48, 112)（A25 の後半。翠ノ実の木）。
#   門の前から北へも板の道（百騎兵とビスコが手分けする）→ 北の足場 (96, 20)。
#   車中（A24 の前半）は別の所に置いた箱の部屋（x 200〜202.6、y 100〜107。座席が2列、琥珀色の窓明かり）。
