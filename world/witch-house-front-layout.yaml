# 魔女邸の前（A01b）の配置（上から見た図の座標、単位はメートル）。演出ノート P-04
# 位置関係の基準はユーザーが用意した背景画像（refs/witch-house-front_bg_01・02）。設定画（witch-house-exterior_sheet_01）より優先（ユーザー指定 2026-09-27）。
#   bg_01: 広場の南の端から、橋と玄関と屋敷の正面を見た画。右（東）に沼へ延びる遊歩道
#   bg_02: 屋敷の前の橋の上から、広場を見た画（南向き）。左（東）に遊歩道。広場のまわりは沼で、森へ下りる小道はない
# 屋敷は沼の中の丸いデッキの上に立ち、短い木の橋（階段）で南の土の広場につながる。広場のふちに赤いきのこ、杭、切り株、街灯
# 背景は Claude が作らない。足りない向きはユーザーが用意する（ユーザー指定 2026-09-27）。ピラーは映さない
# 座標: x は西 0 → 東 20。y は北（屋敷）0 → 南 19。方位: 北（屋敷の玄関）0・東 90・南 180・西 270。
id: witch-house-front
size: {w: 20.0, d: 19.0}
compass: 北＝屋敷 0、東 90、南 180、西 270
time: 朝
# 用意画像 bg_01・02 は夜の画。シーンは朝に合わせる（ユーザー指定 2026-09-27）。画像は位置関係と見た目の参照にし、光は指示文で朝にする
light_en: "Early morning: a pale, clear morning sky with soft low sunlight from the east and a thin mist over the swamp; the swamp still glows green; the lamps are unlit or faint. (The background reference image is a night scene; keep its layout and details but render it in morning light.)"

