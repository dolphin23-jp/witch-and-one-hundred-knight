# 魔女都ヴァルプルギスの下絵用の配置（6章後半 回2 の A26・A27。2026-11-04、Claude の案）
# 原作: 夜光列車で異空間を抜けると、宝石のように輝く魔女の都（「深遠なるどこかと、現世の狭間」「世界の裏側のような場所」。夜光列車でしか来られない）。
#   駅で案内魔女が迎え、通りの先にそびえる議事塔ブロッケントゥルム（夜会の会場）を指す。列車は塔の前の広場まで運ぶ。
#   塔の門前でテレッサが待ち伏せ、閃光でビスコを連れ去る。門には顔があり、魔女以外を通さない（A27）。
# 背景の資料はまだない（静止画の日までに、ユーザーが用意するか、Claude が参考画を作る。D-058）。形は仮置き。
# 座標: x は西 0 → 東 200、y は北 0 → 南 200（m）。南の駅 (100, 170) から北へ大通り（x 94〜106）と線路（x 100）、北の端に塔の前の広場 (100, 70)、
#   議事塔 (100, 40)（22m 角、高さ 55m＋とがり屋根 30m）。塔の南の面に門（x 96〜104、y 52、高さ 10m）。
#   大通りの両側に家並み（窓が灯る）。街の外側にも家並み。月は北東の空。
#   A26 の頭（異空間で列車に飛び乗る）は、blocking.yaml の layout_extra で world/rift-void-layout.yaml を x +400 に置く。光は void_gate（この配置に書いた）。
