views:
  city_sky: {ja: 上空から見た魔女都, panel: null, en: "a breathtaking night view of a gothic witch city from the sky: rings of black stone buildings with steep pointed roofs and spires around a great cathedral-like tower with many spires in the center, countless warm golden windows glittering like jewels, a dark navy sky with heavy clouds"}
  city_station: {ja: 魔女都の駅, panel: null, en: "a small round stone station platform beside the railway at the end of a grand avenue lined with black stone gothic houses with glowing golden windows, a great cathedral-like tower with many spires far down the avenue"}
  city_plaza: {ja: 議事塔の前の広場, panel: null, en: "a wide round stone plaza at the foot of a gigantic gothic cathedral-like tower with many spires, a huge arched gate glowing golden at its base with a carved face, golden windows of the black stone buildings around"}
