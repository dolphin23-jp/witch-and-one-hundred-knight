  bisco: {ja: ビスコ, eye: 1.5, h: 1.55, en: "Bisco (short black bob hair with two gold hair ornaments, blue eyes, silver shoulder and chest armor over a navy uniform with gold trim, brown belt, a fluffy black-and-white tail, silver armored boots)"}
  night-train: {ja: 夜光列車, eye: 1.9, h: 4.3, en: "the Night Train (night-train_sheet_01): a dark purple-black steam locomotive with a big lion face with a burning orange mane at the front, a purple goat head with curved horns on each side, a green snake rising from the rear, a dome with glowing amber windows, big wheels with copper rims, two short chimneys"}
  guide-witch: {ja: 魔女都の案内魔女, eye: 1.45, h: 1.55, en: "the guide witch of the witch city (guide-witch_sheet_01): a calm, graceful young woman of about 25, silver-gray hair in a low chignon, a dark navy pointed witch hat with a silver band and a silver crest, a tailored dark navy long coat with a short cape, silver trim and silver buttons, a high collar, white gloves, a white underskirt showing at the front, dark heeled boots, holding a tall staff topped with a lantern"}
