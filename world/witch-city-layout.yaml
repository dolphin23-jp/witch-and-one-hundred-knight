# 魔女都ヴァルプルギスの下絵用の配置（6章後半 回2 の A26・A27。2026-11-04、Claude の案）
# 原作: 夜光列車で異空間を抜けると、宝石のように輝く魔女の都（「深遠なるどこかと、現世の狭間」「世界の裏側のような場所」。夜光列車でしか来られない）。
#   駅で案内魔女が迎え、通りの先にそびえる議事塔ブロッケントゥルム（夜会の会場）を指す。列車は塔の前の広場まで運ぶ。
#   塔の門前でテレッサが待ち伏せ、閃光でビスコを連れ去る。門には顔があり、魔女以外を通さない（A27）。
# 背景の資料: ユーザーが用意した refs/walpurgis_bg_01.jpg（魔女都ヴァルプルギス）。黒い石のゴシックの街並みに金色の窓が無数に灯り、中央に尖塔の多い大聖堂のような議事塔、
#   そのまわりを同心円の街が囲む。塔の前は広い石畳の広場と、金色に光る大きな門。2026-11-05 に色と形をこれに合わせた（家の位置は前のまま）。
# 座標: x は西 0 → 東 200、y は北 0 → 南 200（m）。南の駅 (100, 170) から北へ大通り（x 94〜106）と線路（x 100）、北の端に塔の前の広場 (100, 70)、
#   議事塔 (100, 40)（22m 角の本体 高さ 40m、中央の尖塔の先は約 97m、四隅に小塔）。塔の南の面に門（x 96〜104、y 52、高さ 10m）。
#   大通りの両側に家並み（窓が灯る）。街の外側にも家並み。月は北東の空。
#   A26 の頭（異空間で列車に飛び乗る）は、blocking.yaml の layout_extra で world/rift-void-layout.yaml を x +400 に置く。光は void_gate（この配置に書いた）。
id: witch-city
size: {w: 200.0, d: 200.0}
compass: 北 0、東 90、南 180、西 270（駅は南、議事塔は北）
time: 夜（宝石のように灯る都）
ground: {color: [52, 48, 62], ja: 都の石畳}
sky: {color: [12, 14, 40]}
sun: {from: 120, elev: 35}
light_en: "Night in a gothic witch city: a dark navy night sky with heavy clouds, black stone buildings with steep pointed roofs and spires, countless warm golden windows and lanterns glittering like jewels, a great cathedral-like tower with many spires at the end of the main avenue."
lighting:
