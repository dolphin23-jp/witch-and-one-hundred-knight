  hundred-knight: {ja: 百騎兵, eye: 0.8, h: 0.9, sword: true, en: "the Hundred Knight (small, waist-high: big round silver-and-blue helmet with a gold crown piece and a pale blue flame plume, black face with orange eyes, oversized blue-and-silver gauntlets, holding its sword)"}
  forest-servant: {ja: 森の魔女のシモベ, eye: 0.95, h: 1.12, en: "a forest witch's servant: a short stocky automaton (about 1.25 m with its horns) with a big glossy white round head, two small glowing orange rectangular eyes and a white jagged-teeth mouth band, two curved copper pipe horns with cone caps wreathed in faint green glow, a grey scarf, a dark red coat over a grey vest with copper buttons, dark olive-green arms and big gloved hands, black boots (reference: forest-servant_sheet_01)"}
