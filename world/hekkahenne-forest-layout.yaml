# ヘッカヘンネの隠し森の下絵用の配置（6章後半 回1 の A20、回2 の A23 の駅でも使う。2026-11-02、Claude の案）
# 原作: 「森の中の円形の石造りの台座」（森の庭園。以前、百騎兵がマーリカと対峙した所。シモベが手入れしている）→ 奥の「ヘッカヘンネの隠し森」
#   （人の手の入っていない野生の森、魔獣が多い）→「線路が伸びる円形の駅」（線路は途中で途切れている。鐘がある。A23 で夜光列車が来る）
#   →「切り株や花がある森の開けた場所」（マーリカのネズミが鳥にさらわれ、切符を落とす）。
# 背景の資料はまだない（静止画の日までに、ユーザーが用意するか、Claude が参考画を作る。D-058）。形は仮置き。
# 座標: x は西 0 → 東 40、y は北 0 → 南 110（m）。南の庭園から北へ一本道で進む。
#   庭園 (20, 95)・隠し森の小道 y 60〜86・駅 (20, 45)・駅から北への小道 y 22〜36・開けた場所 (20, 14)
