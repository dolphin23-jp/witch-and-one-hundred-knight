  bisco: {ja: ビスコ, eye: 1.5, h: 1.55, en: "Bisco (short black bob hair with two gold hair ornaments, blue eyes, silver shoulder and chest armor over a navy uniform with gold trim, brown belt, a fluffy black-and-white tail, silver armored boots)"}
  arlecchino: {ja: アルレッキーノ, eye: 1.9, h: 1.9, en: "Arlecchino (a bulky servant as tall as a man: white egg-shaped head with red eyes, a crack over one eye and a stitched tooth pattern, two copper horn-like pipes on the head, pink scarf, black double-breasted coat, olive-green arms, big black boots)"}
  night-train: {ja: 夜光列車, eye: 1.9, h: 4.3, en: "the Night Train (night-train_sheet_01): a dark purple-black steam locomotive with a big lion face with a burning orange mane at the front, a purple goat head with curved horns on each side, a green snake rising from the rear, a dome with glowing amber windows, big wheels with copper rims, two short chimneys"}
views:
  garden: {ja: 森の庭園の円形の台座, panel: null, en: "a garden deep in the forest: a round stone platform surrounded by withered flower beds and hedges, old lanterns on posts, huge trees around"}
  deep: {ja: ヘッカヘンネの隠し森, panel: null, en: "a wild untouched dark forest: huge ancient trees, thick roots across a narrow animal trail, ferns and dense undergrowth, dim green light"}
  station: {ja: 森の中の円形の駅, panel: null, en: "an abandoned round stone station in the middle of the forest: a circular stone platform ringed by tall posts with old lamps, railway tracks running out of it that end abruptly in the trees, an old bell on a post"}
  clearing: {ja: 切り株と花の開けた場所, panel: null, en: "a small sunny clearing in the forest with old tree stumps and wildflowers, open sky above"}
