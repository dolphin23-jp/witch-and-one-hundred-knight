# 議事塔ブロッケントゥルム最上階の議会室の下絵用の配置（6章後半 回3 の A28〜A32。2026-11-05、Claude の案）
# 原作: 魔女達の宴（ビスコが目覚める、ツギハギの魔女が本に息を吹きかけて百騎兵を倒す）→ 霧と議長（杖が話す）の登場、魔女の呼び出し、ベルダの議題
#   → 地震、夜光列車が壁を破って毒沼を運び込み、逃げる → 会場が毒沼に沈み、メタリカが現れる → 小瓶を飲んで巨大化、パープルピール・リリアーヌとの戦い、雷撃
#   → 霧と朝の光 → ビスコがニワトリを捕まえ、議長に採決を求める → 可決。
# 壊れた後の倒れた椅子は、人物の立ち位置とカメラから離した壁ぎわに置く（下絵で人物やカメラと重なったため、2026-11-05）。
# 背景の資料: ユーザーが用意した refs/council-room_bg_01.jpg（議会室）と refs/council-room-ruined_bg_01.jpg（メタリカ襲撃で壊れた後、戦闘の背景）。
#   円い部屋。床は木、中央に紫の絨毯の輪（茶色の縁）と、赤い布に金色の魔法陣の円卓、背の高いゴシックの椅子（濃い赤）が円卓を囲む。
#   天井から天球儀（星座の線が光る透けた大きな球、金の輪と光る惑星（黄・桃・白））が下がる。壁は濃い木の羽目板と柱、縦長の窓（夜空）に紫がかった赤のカーテン。両開きの扉。
#   壊れた後: 扉の向かいの壁と天井が大きく破れて夜空が見え、円卓はなく、椅子は倒れて散らばり、床はひび割れて瓦礫、天球儀の惑星が床に転がる。
# 座標: x は西 0 → 東 100、y は北 0 → 南 100（m）。部屋の中心 (50, 50)、壁の内側の半径 12.5m、壁の高さ 9m、円すいの天井の頂上は 14m。
#   扉は南 (50, 62.5)（幅 3m、高さ 4.4m）。円卓は半径 3m、椅子は中心から 3.9m に12脚（北から30度ごと）。
#   壊れる壁は扉の向かいの北〜北東（方位 345〜55 度）。夜光列車はそこから突っ込んで沼を吐き、引き返して逃げる（A30）。
#   部屋の外（塔の外）は空。地面（ground）を 60m 下に下げ、遠くの都の灯りの色にした。
# 部屋の2つの状態は only_lit（その光のときだけ描く）で切り替える: 壊れる前＝council_night・council_fog、壊れた後＝council_ruin・council_dawn。
# 形（cwall・cceil・ctable・cchair・correry・cdoor・crubble・cswamp・cplanet）は tools/previs_council.py。
