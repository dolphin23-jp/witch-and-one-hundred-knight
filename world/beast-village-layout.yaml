# 獣人の村（アスタロの隠れ里、原作テキストでは「テッタラ村」）とティトの家の配置（上から見た図の座標、単位はメートル）。Claude の構想（2026-10-30、A05b 用）
# 見た目の資料: 村は refs/beast-village_bg_01（切り抜きは world/beast-village/panel_*.png）、ティトの家の中は world/tito-house/（D-058 の参考画）
# 背景の画像は「場所の見た目の資料」で、その視点は写さない（D-058）。構図はカメラから見た略図と下絵に従う
# 座標: x は西 0 → 東 70。y は北 0 → 南 60。方位: 北 0・東 90・南 180・西 270
# 村は赤い岩の崖に囲まれた谷。南西の岩の狭い隙間（幅2m）から入り、石壁の門を抜けると、中央に石の井戸、まわりに赤い瓦の木の家と柵。
# ティトの家は村の東のはずれ（x 53〜60、y 23〜29）。中に入れる（壁・扉・窓・奥の部屋への出入口を作る）。
#   南の壁に扉（外から入る）、北の壁の西寄りに窓（星空が見える）、北の壁の東寄りにカーテンの出入口（奥の部屋）。
#   西の壁に棚、中央に赤い布のテーブルと丸椅子、東の壁に小さな暖炉、北の壁ぞいに寝台、南東の隅に藁の木箱と壺。
id: beast-village
size: {w: 70.0, d: 60.0}
compass: 北 0、東 90、南 180、西 270（村の入口は南西の岩の隙間）
time: 夕方〜夜
ground: {color: [214, 170, 96], ja: 砂}
sky: {color: [230, 140, 90]}
sun: {from: 262, elev: 5}   # 夕方。西の岩の向こうに沈む
light_en: "Dusk in the desert valley: the sun setting in the west behind the red cliffs, an orange-red sky fading to purple overhead, long soft shadows, warm light on the walls, the first lamps lit."

# 光の切り替え（カットの lighting で選ぶ。previs.py が太陽・空・明かりの強さを変える）
lighting:
  dusk:  {sun_from: 262, sun_elev: 5, sun_energy: 2.5, sun_color: [255, 170, 110], sky: [230, 140, 90], sky_strength: 1.0, lamps: 1.0}
  night: {sun_from: 300, sun_elev: 35, sun_energy: 0.6, sun_color: [150, 170, 255], sky: [35, 50, 110], sky_strength: 1.0, lamps: 1.6}
light_en_night: "Night in the village: a deep blue starry sky, cool faint moonlight, warm orange lamplight from windows and lanterns."
light_en_interior: "Night inside the house: warm orange light from oil lamps and the small hearth fire, deep soft shadows in the corners, cool blue starlight at the window."

