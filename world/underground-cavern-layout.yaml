# 村の下の地下空洞と、そこへ通じる井戸（A07・A08）の配置（上から見た図の座標、単位はメートル）。Claude の構想（2026-10-31、D-062 の 3D の段階）
# 見た目の資料: world/underground-cavern/（D-058 の参考画。全景・奥・俯瞰・壁際・井戸の中）。村の地上は world/beast-village/panel_*.png
# 背景の画像は「場所の見た目の資料」で、その視点は写さない（D-058）。構図はカメラから見た略図と下絵に従う
# 座標: x は西 0 → 東 60。y は北 0 → 南 60。高さ z は空洞の床が 0、村の地面が 30（井戸の口）。方位: 北 0・東 90・南 180・西 270
# 空洞は中心 (30, 30)、東西 40m・南北 36m・天井の高さ 14m の丸い大きな洞。天井の真ん中の穴（井戸の底）から月の光の柱が落ちる。
#   床は砂。岩の柱4本、壁に横穴3つ、緑に光る苔、天井からの砂の滝、獣の骨。北の壁の奥（30, 12）から砂食みが壁を破って出てくる。
#   ピラー（魔法の柱）は床の北寄り（30, 21）。A07 の終わりに光り始める（A08）。
# 井戸は (30, 30) の真上。井戸の筒は z 14〜30（内側の半径 0.65m）。地上は z 30 の円い地面と石の井戸の縁（A07-001〜004）。
