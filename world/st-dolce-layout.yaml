# セント・ドルチェ（ヴァレンティーヌ領の町）の下絵用の配置（上から見た図の座標、単位はメートル）。Claude の案（2026-10-31、A11 用）
# 見た目の資料: refs/st-dolce_bg_01（ユーザーが用意した背景。赤茶のレンガ敷きの道、紫の瓦屋根の木組みの家、玄関の吊りランタン、
#   石の柱の上のランタン、家々の前の花壇（桃色・紫・黄色の花）、レンガの円い模様の広場、桃色の夕空）
# 背景の画像は「場所の見た目の資料」で、その視点は写さない（D-058）。構図はカメラから見た略図と下絵に従う
# 座標: x は西 0 → 東 40、y は北 0 → 南 36。方位: 北 0・東 90・南 180・西 270
# 町の中ほどに円い広場（中心 20, 16、半径 6.5）。南の道（x 18〜22）から入る。北の道の先、遠くの丘の上に華の大公爵ヴァレンティーヌの館
