# マーリカの森（ゲロクソオンナの森）の下絵用の配置（上から見た図の座標、単位はメートル）。Claude の案（2026-10-31、A10 用）
# 見た目の資料: refs/marika-forest_bg_01（ユーザーが用意した背景。苔の広場、扉と石段のある大樹、木の柱の吊りランタン、苔の中の石の渦の模様、碧く光る点、蛍）
