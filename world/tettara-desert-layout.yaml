# テッタラ砂漠（A04〜A06 の砂漠）の配置（上から見た図の座標、単位はメートル）。Claude の構想（2026-10-30）
# 見た目の資料はユーザーが用意した背景（refs/tettara-desert_bg_01、refs/caravan-camp_bg_01。切り抜きは world/desert-panels.yaml）。
# 背景の画像は「場所の見た目の資料」で、その視点は写さない（D-058）。構図はカメラから見た略図に従う
# 座標: x は西 0 → 東 140。y は北 0 → 南 100。方位: 北 0・東 90・南 180・西 270。
# 百騎兵は西から砂丘を越えて歩いてくる。ルッキーニィは中ほど（62, 50）に倒れている。商人のキャンプはその北東 約45m（100, 28）
id: tettara-desert
size: {w: 140.0, d: 100.0}
compass: 北 0、東 90、南 180、西 270（商人のキャンプは北東）
time: 昼
ground: {color: [222, 176, 92], ja: 砂}
sky: {color: [150, 196, 240]}
sun: {from: 170, elev: 62}   # 昼の高い太陽（ほぼ南から）
light_en: "Midday in the desert: a blazing sun high in a pale blue sky, harsh light with short dark shadows, shimmering heat haze over the golden dunes."

# 背景のパネル（tools/stills_plan.py が名前から画像を引く）
panels:
  砂漠 全景: world/tettara-desert/panel_wide.png
  砂漠 斜めの眺望: world/tettara-desert/panel_oblique.png
  砂漠 地上の視点: world/tettara-desert/panel_ground.png
  砂漠 見下ろし: world/tettara-desert/panel_high.png
  砂漠 砂模様の寄り: world/tettara-desert/panel_closeup.png
  キャンプ 全景: world/caravan-camp/panel_wide.png
  キャンプ テントの入口: world/caravan-camp/panel_tent-entrance.png
  キャンプ 物資と水甕: world/caravan-camp/panel_goods.png
  キャンプ 高めの俯瞰: world/caravan-camp/panel_high.png

# 地面の区分（略図と下絵に描く）。砂丘の稜線のあたりを少し明るく
areas:
  - {kind: poly, points: [[0, 30], [40, 22], [70, 28], [96, 40], [140, 36], [140, 44], [96, 48], [70, 36], [40, 30], [0, 38]], ja: 砂丘の稜線（北）, color: [235, 195, 115]}
  - {kind: poly, points: [[0, 70], [30, 62], [60, 66], [100, 76], [140, 72], [140, 80], [100, 84], [60, 74], [30, 70], [0, 78]], ja: 砂丘の稜線（南）, color: [235, 195, 115]}
  - {kind: circle, center: [100.0, 28.0], r: 13.0, ja: 商人のキャンプ（踏み固めた砂）, color: [205, 160, 85]}

# 遠景（カメラの向く方位ごと）
horizon:
  - {from: 315, to: 45, ja: 北の砂丘と岩山, panel: 砂漠 全景, en: "endless golden dunes covered in swirling sand patterns, with tall red sandstone mesas and rock pillars on the horizon"}
  - {from: 45, to: 135, ja: 東の砂丘と岩山, panel: 砂漠 斜めの眺望, en: "rolling golden dunes with swirling sand patterns, scattered dry shrubs and a few dead trees, red sandstone mesas far away"}
  - {from: 135, to: 225, ja: 南の砂丘, panel: 砂漠 地上の視点, en: "a wide flat stretch of golden sand with swirling patterns, low dunes and distant red rock pillars under the sky"}
  - {from: 225, to: 315, ja: 西の砂丘と岩, panel: 砂漠 見下ろし, en: "golden dunes with swirling patterns, scattered red rocks and dry thorny shrubs, red sandstone mesas on the horizon"}

# 近くの背景（見る点がその近くで、カメラも近いとき）
near:
  - {at: [97.5, 24.5], r: 3.5, cam_max: 14, from: 0, to: 360, ja: テントの入口, panel: キャンプ テントの入口, en: "the entrance of a large round merchant tent of striped orange, brown and cream canvas with a wooden door, clay jars and sacks beside it"}
  - {at: [101.5, 29.5], r: 3.0, cam_max: 10, from: 0, to: 360, ja: 物資と水甕, panel: キャンプ 物資と水甕, en: "a merchant's stall of wooden crates, sacks and big blue-glazed water jars under a purple awning"}
  - {at: [100.0, 28.0], r: 14.0, cam_max: 70, from: 0, to: 360, ja: 商人のキャンプ, panel: キャンプ 全景, en: "a small caravan camp in the desert: round striped tents, a wooden fence, a boardwalk, torches, crates and blue water jars"}

props:
  dune_n:     {at: [45.0, 18.0], r: 22, h: 7, ja: 北の大きな砂丘}
  dune_s:     {at: [20.0, 93.0], r: 14, h: 5, ja: 南西の大きな砂丘}
  dune_e:     {at: [86.0, 58.0], r: 7, ry: 0.5, h: 2.5, ja: 南東の低い砂丘}
  rock_1:     {at: [56.0, 44.0], h: 2.2, ja: 赤い岩}
  rock_2:     {at: [70.0, 59.0], h: 1.6, ja: 赤い岩（小）}
  skeleton:   {at: [36.0, 64.0], h: 2.4, ja: 砂に半分埋まった大きな獣の骨, en: "the huge rib cage of a long-dead beast, half buried in the sand"}
  bones:      {at: [66.0, 47.0], r: 0.6, ja: 砂羊の骨, en: "the small scattered bones of sand sheep"}
  tent_1:     {at: [97.0, 22.0], r: 3.0, h: 4.0, ja: 商人のテント（大）}
  tent_2:     {at: [106.5, 23.5], r: 2.4, h: 3.4, ja: 商人のテント（小）}
  goods:      {at: [101.5, 29.5], r: 0.5, ja: 水甕と荷物}

people:
  hundred-knight: {ja: 百騎兵, eye: 0.8, h: 0.9, en: "the Hundred Knight (small, about waist-high to an adult: big round silver-and-blue helmet with a gold crown piece and a pale blue flame plume on top, black face with orange eyes, oversized blue-and-silver gauntlets with black claws, beige shorts, brown shoes; it carries no sword here)"}
  luckiny:        {ja: ルッキーニィ, eye: 1.3, h: 1.4, en: "Luckiny (a small goat-like beastfolk: two tall ridged horns, short light ash-brown hair, a red hood and short red cape with white fur trim, green furry goat legs with dark hooves, a green fluffy tail, a long brass horn-trumpet on a wooden staff)"}
  water-merchant: {ja: 水瓶売りの商人, eye: 1.6, h: 1.7, en: "the water-jar merchant (a plump human man with a thick black mustache, an orange-and-indigo striped turban, loose rust-orange and indigo desert robes)"}

# カットで背景を名前で決めるとき（blocking.yaml の bg）
views:
  overhead:  {ja: 高い空から見下ろす砂漠, panel: 砂漠 見下ろし, en: "seen from high above: an endless sea of golden dunes with swirling sand patterns, long dune ridges and scattered red rocks"}
  sand:      {ja: 砂の表面, panel: 砂漠 砂模様の寄り, en: "the rippled surface of golden sand with fine swirling patterns, a few dry shrubs"}
  sun:       {ja: 太陽と空, panel: null, en: "the blazing white sun in a pale blue sky, shimmering heat haze"}
  camp_high: {ja: 高めの所から見た商人のキャンプ, panel: キャンプ 高めの俯瞰, en: "a small caravan camp in the desert seen from above: round striped tents inside a wooden fence, a boardwalk, crates and blue water jars"}
