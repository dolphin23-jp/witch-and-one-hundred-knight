<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <!-- 怒りマーク（漫符、D-027）。4つの弧が中心に背を向けて並ぶ形。合成で重ねる -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#ffffff" stroke-width="30">
      <path d="M40 80 Q80 80 80 40"/><path d="M120 40 Q120 80 160 80"/>
      <path d="M160 120 Q120 120 120 160"/><path d="M80 160 Q80 120 40 120"/>
    </g>
    <g stroke="#e0202a" stroke-width="16">
      <path d="M40 80 Q80 80 80 40"/><path d="M120 40 Q120 80 160 80"/>
      <path d="M160 120 Q120 120 120 160"/><path d="M80 160 Q80 120 40 120"/>
    </g>
  </g>
</svg>
