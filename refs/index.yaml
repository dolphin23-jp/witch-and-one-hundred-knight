# 参照画像の一覧。ユーザーが選んだ画像を、ユーザーの説明に従って登録する。
# 手順は CLAUDE.md の「参照画像を受け取ったとき」を参照。
#
# 公式資料は次の2種類だけ（ユーザー指定 2026-09-27、D-054）。それ以外の画像は参照しない（削除済み。Git の履歴には残る）。
#   人物: 三面図の載った設定画（<人物>_sheet_01）
#   背景: カットが複数載ったイメージ画（witch-house-*_sheet_01）
# ほかに、ユーザーが用意した背景画像（<場所>_bg_<連番>）を使う。位置関係はこちらが設定画より優先（ユーザー指定 2026-09-27）。
#
# 書き方（1枚1行）:
#   <ファイル名（拡張子なし）>: {subjects: [<対象>], kind: <種類>, note: <ユーザーの説明>}

