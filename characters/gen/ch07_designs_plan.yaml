    Character design sheet of a NEW character, drawn in exactly the same 2D anime art style, line art, cel shading and
    color treatment as the reference sheets; do not copy the reference characters' faces, hair or outfits. On a plain white
    background: full-body front view, side view and back view standing in a row, plus two head close-ups (front and
    three-quarter) on the right. Neutral standing pose. No text, no labels, no captions, no manga symbols, no color
    palette swatches.
  background: >-
    Background art only: no characters, no creatures, no text. A 2D anime environment design sheet: five panels of the
    same place from different viewpoints, separated by thin white borders, in the same painting style and colors as the
    reference images; the references only show the painting style, do not copy their places or viewpoints.

