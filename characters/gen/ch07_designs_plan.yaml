# 7章の新しい設定画・背景の参考画・小物の生成計画（承認待ち）
# ユーザー指示（2026-11-01 15:59）: ミトン・外道化したミトン・ハインツ・ヒルダ姫・アロマニジェルの設定画を用意し、「残りは背景含めてあなたの方で生成して欲しい」
# 1案だけ作る（CLAUDE.md「守ること」1）。原作に画像がないので Claude が生成し、そのまま登録する（ユーザーが見て直しを言えば作り直す）。
#
# 原作テキスト（Mj100、Living Spec「7章」タブ）の手がかり:
#   - 護衛の兵士: ハインツの護衛。「大型の蟲が出没するという目撃情報もございます」。外道ミトンの前で悲鳴。アマタイア王国の兵。
#   - チンクエの村の子供3人: 強がりな少年、ひねくれぼうず、臆病な男の子。ミトンをいじめ、ルッキーニィに「獣人だ、臭い仲間」と言い、百騎兵の目に怯えて逃げる。
#   - 墓守: 綿蛍の谷の墓地（雪）。老人。「ここに旅人が来るのは何年ぶりかの」。隣に住んでいた魔女の昔話をする。
#   - 回想のブリダンゴ虫: 雪の日、寒さで弱っていた「おおきなブリダンゴ虫」。少年のハインツに手袋（ミトン）をもらい、どんぐりを返す。立たない虫の姿（推定: ミトン本人の昔の姿）。
#   - チンクエ: 紅嵐街道沿いの森のゴミ山。ミトンがゴミを漁って食べている。
#   - チンクエの村と馬車の道: ハインツの豪華な馬車が通る。子供たちの場面。
#   - 見晴らしの良い丘: ハインツとヒルダの逢瀬（「この時期は綿蛍が飛んで美しいですよ」）。のちにミトンの埋葬。
#   - 沼地のピラー: 7-08。「ここにはピラーがあるようだぞ」。アロマニ・ジェル（スライム型の魔獣）がいる沼地。魔女の沼とは別の場所。
#   - 小物: 魔女会報（魔女にしか届かない便り）、ずっしりの実（ミトンを満腹にする重い実）、手紙とペン（ミトンが王子に書く）、手袋（ミトン）、どんぐり、ダウジング・ペンデュラム（メタリカ）、豪華な馬車。
model: gpt_image_2_5
params: {quality: medium, resolution: 2k, aspect_ratio: "16:9"}
credits_per_image: 1
status: 生成済み（ユーザー承認 2026-11-01 16:15「OK」、11クレジット、残高 481→470）。人物・物は refs/<対象>_sheet_01.png、背景は world/<場所>/plates.yaml。村の子供3人は臆病な子の全身がない（hold）
total_images: 11

common:
