    out: characters/scarecocco/design/scarecocco_B_design_gpt-image-2.5_01.png
  - who: scarecocco_c
    ja: スケアコッコ C（魔獣らしい怪しい姿）
    count: 1
    aspect_ratio: "16:9"
    refs: [refs/sand-eater_sheet_01.png, refs/tito_sheet_01.png]
    prompt: >-
      {creature} Design C: a more monstrous magical beast. Dark indigo plumage with faint pale-blue rune-like markings on
      the wings and chest, a slightly larger head, sharp bird claws, a jagged dark comb. Its eyes are sleepy but
      unsettling, and the drooping tail tips fade into a faint pale-blue glow.
    out: characters/scarecocco/design/scarecocco_C_design_gpt-image-2.5_01.png

