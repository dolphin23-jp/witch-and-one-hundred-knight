# 夜会編 回1（A09〜A12）の新しい設定画（スケアコッコ）と、魔女邸の寝室の背景の参考画の生成計画（承認待ち）
# ユーザー指示（2026-10-31）:「スケアコッコ、魔女邸寝室については設定画を用意しないのであなたで生成してもらう」
# 原作に画像がないので、設定画は Claude が生成し、ユーザーが候補から選んだものを refs/<人物>_sheet_01 として登録する（砂漠編の村人と同じ方式）。
# 寝室は D-058（用意画像と設定画を元に参考画を作ってよい。承認を取る）。選ばれた1枚から、必要な向きの参考画を別に作る（そのときもう一度承認を取る）。
#
# スケアコッコの外見は、原作テキストに次の手がかりしかない（Living Spec にも記述なし）。ユーザーが直してよい。
#   - 通称「尾の先がだるいニワトリ」（狩人たちの隠語）。実際は「スケアコッコ」というレアな魔獣。マーリカの森にいて、探しても探しても見つからない。
#   - 獲物は「殺さない程度に十分に痛めつけてから、トーチカで捕獲」する。→ 戦えて、逃げ回る、すばしこい魔獣。
#   - 夜会では「樽の中でスズの音草が鳴り、くしゃみをしたネコをニワトリが目撃したら開始」。後の場面ではビスコが捕まえて、手を離すまで鳴かない
#     （「冬のニワトリが三回鳴くまで」夜会は終わらない）。→ ビスコが両腕で抱えられる大きさ（高さ約60cm、推定）の、鳴くニワトリ。
#   → 3案を作って選んでもらう: A 森に溶ける自然な魔獣、B 案山子（かかし）風、C 魔獣らしい怪しい姿。
model: gpt_image_2_5
params: {quality: medium, resolution: 2k}
credits_per_image: 1
status: 承認待ち（概算 5クレジット。残高 516）
total_images: 5

common:
  creature: >-
    Character design sheet of a NEW creature, drawn in exactly the same 2D anime art style, line art, cel shading and
    color treatment as the two reference sheets (images 1 and 2); the references only show the drawing style and the sheet
    layout, do not copy their subjects. Layout like the references, on a plain white background: full-body front view,
    side view and back view standing in a row, plus two head close-ups (front and three-quarter) on the right.
    Neutral standing pose. No text, no labels, no captions, no manga symbols, no color palette swatches.
    The creature: Scarecocco, a rare elusive forest beast that looks like a rooster. About 60 cm tall, small enough for a
    girl to hold in her arms. A proud puffed-out chest and a small comb, because it crows at dawn. Its long tail feathers
    droop limply at the tips (the hunters call it "the chicken with the lazy tail tip"). Sleepy, bored, half-closed eyes.
  bedroom: >-
    Background art only: no characters, no creatures, no text. A 2D anime background painting in the same style, colors and
    materials as the reference images (dark wood paneling, glowing green vines creeping along the walls, red fabrics,
    brass hanging lamps, stacked old books, a few creepy stitched dolls); they only show the look of the materials and the
    mood of the mansion, do not copy their viewpoints or layout.

creatures:
