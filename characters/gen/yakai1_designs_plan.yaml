    ja: スケアコッコ A（森に溶ける自然な魔獣）
    count: 1
    aspect_ratio: "16:9"
    refs: [refs/sand-eater_sheet_01.png, refs/tito_sheet_01.png]
    prompt: >-
      {creature} Design A: plump body, plumage in mossy greens, olive and warm browns that blends into the forest, a small
      red comb and wattle, cream-colored chest feathers, sturdy yellow-gray legs with small claws. The long tail has
      drooping, wilted-leaf-like tips.
    out: characters/scarecocco/design/scarecocco_A_design_gpt-image-2.5_01.png
  - who: scarecocco_b
    ja: スケアコッコ B（案山子風）
    count: 1
    aspect_ratio: "16:9"
    refs: [refs/sand-eater_sheet_01.png, refs/tito_sheet_01.png]
    prompt: >-
      {creature} Design B: a scarecrow-like look. Straw-yellow and faded patchwork feathers with stitched seams between
