backgrounds:   # 16:9、各1枚。添付: 砂の渦模様・砂岩・村の井戸の見た目
  refs: [world/tettara-desert/panel_closeup.png, world/tettara-desert/panel_wide.png, world/beast-village/panel_wide.png]
  items:
    - id: cavern-wide
      ja: 全景（床から、井戸の穴から落ちる月の光の柱を見る）。A07-005・A08-003 など
      prompt: >-
        {cave} Camera: on the sand floor near one wall, eye level 1.5 m, wide-angle lens, looking across the cavern toward
        the shaft of moonlight falling from the well opening in the ceiling at the center; the far walls fade into darkness.
      out: world/underground-cavern/cavern-wide_gpt-image-2.5_01.png
    - id: cavern-deep
      ja: 奥（光の下から、奥の大きな穴を見る）。A07-007・戦い
      prompt: >-
        {cave} Camera: standing in the moonlight under the well opening, looking toward the far end of the cavern, where the
        largest tunnel mouth (about 8 m across) gapes in the wall, dark inside, with sand spilling out of it. The light shaft
        is behind the camera and casts a pale pool of light in the foreground.
      out: world/underground-cavern/cavern-deep_gpt-image-2.5_01.png
    - id: cavern-top
      ja: 俯瞰（井戸の穴のすぐ下から真下を見る）。A07-004 の落下・A07-005
      prompt: >-
        {cave} Camera: just below the well opening in the ceiling, looking straight down from about 30 m: the round pool of
        moonlight on the sand far below, the edges of the cavern disappearing into green-lit darkness, streams of sand
        falling past the camera.
      out: world/underground-cavern/cavern-top_gpt-image-2.5_01.png
    - id: cavern-wall
      ja: 壁際（低い位置、砂の滝と光る苔と横穴）。A07-006・戦い
      prompt: >-
        {cave} Camera: low, 0.5 m above the sand, close to a cavern wall: layered sandstone with glowing green moss, a
        curtain of trickling sand in the foreground, the mouth of a tunnel at ground level beside it; the cavern behind is
        softly out of focus.
      out: world/underground-cavern/cavern-wall_gpt-image-2.5_01.png
    - id: well-shaft
      ja: （任意）井戸の中（縦穴を真下に見る）。A07-001〜004
      optional: true
      prompt: >-
        Background art only: no characters, no text. A 2D anime background painting in the same style and materials as the
        reference images (they only show the look of the materials). Inside the shaft of an old stone well of a desert
        village: the camera looks straight down the narrow round shaft of rough stacked sandstone blocks into deep darkness,
        with a faint eerie green glow far at the bottom. Night: pale moonlight from above lights the top rows of stones. No
        water, no rope, no bucket.
      out: world/underground-cavern/well-shaft_gpt-image-2.5_01.png

