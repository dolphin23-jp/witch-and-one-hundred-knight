# 砂漠編の新しい人物（獣人の村人4人・水瓶売りの商人）の設定画と、地下空洞の背景の参考画の生成計画（承認待ち）
# ユーザー指示（2026-10-30 14:31）:「獣人はルッキーニィとティトの画像から同種族の別キャラクターを用意して欲しい。
#   商人も共通の絵柄であれば後は用意して欲しい。地下空洞の背景画像もないので作ってください」
# 原作に画像がない人物なので、設定画は Claude が生成し、ユーザーが候補から選んだものを refs/<人物>_sheet_01 として登録する。
# 背景は D-058（用意画像と設定画を元に参考画を作ってよい。承認を取る）。
# 性別・年齢は台詞と声の高さからの推定（ユーザーが直してよい）:
#   怯えきった獣人 L178・L179・L182・L184「旅人がいるだろう！」「〜と思ってんだ！」→ 中年の男
#   蒼白な獣人 L181「見つかっちまってる！」→ 若い男
#   冷淡な獣人 L183・L185「とんでもないものを連れてきてくれたね！」「疫病神もいいところだよ！！」→ 年配の女（声は村人の中で低め 約236Hz）
#   恐慌状態の獣人 L188「逃げろーーーっ！！」→ 年配の男
model: gpt_image_2_5
params: {quality: medium, resolution: 2k}
credits_per_image: 1
status: 承認待ち

common:
  character: >-
    Character design sheet of a NEW character, drawn in exactly the same 2D anime art style, line art, cel shading and
    color treatment as the two reference sheets (images 1 and 2). The new character is the same species as the characters
    in the references but a different person: a goat-like beastfolk with ridged horns growing from the head, shaggy fur on
    the legs, digitigrade goat legs ending in dark cloven hooves, a fluffy tail, and a human face and hands. Do not copy the
    reference characters' faces, hair, outfits or colors. Layout like the references, on a plain white background:
    full-body front view, side view and back view standing in a row, plus two head close-ups (front and three-quarter) on
    the right. Neutral standing pose, neutral expression. No text, no labels, no captions, no manga symbols, no color
    palette swatches.
  cave: >-
    Background art only: no characters, no creatures, no text. A 2D anime background painting in the same style, colors and
    materials as the reference images (golden desert sand with swirl patterns, red-brown sandstone rocks, the stone well of a
    small desert village); they only show the look of the materials, do not copy their viewpoints. The place: a vast natural
    cavern deep under a small desert village, hollowed out of layered red-brown sandstone, as tall as a cathedral (about
    30 m high and 60 m across). The floor is a wide basin of golden sand with faint swirl patterns, scattered rocks and old
    bones. Thin streams of sand trickle down from cracks in the ceiling. Large round tunnels, bored by a giant
    sand-burrowing beast about 8 m long, open into the walls. Night: the only openings are the small round mouth of the
    village well in the ceiling, through which a narrow shaft of pale moonlight falls onto the sand, and patches of softly
    glowing green moss and fungus on the walls and rock columns, giving a dim, eerie green light with deep shadows.

