total_images: 6

common:
  apprentice: >-
    Character design sheet of ONE character: the girl described below in image 1, exactly as designed there (same face, hair, hat, outfit,
    wand, shoes and colors), drawn in the same 2D anime art style, line art and cel shading. Layout like image 2, on a plain
    white background: full-body front view, side view and back view standing in a row, plus two head close-ups (front and
    three-quarter) on the right. Neutral standing pose, a cheeky little smile. Draw only this one girl. No text, no labels,
    no captions, no manga symbols, no color palette swatches.

