# 見習い魔女の一人ずつの設定画と、6章後半の追憶の園・小物の生成計画
# ユーザー指示（2026-11-01 14:45）:「追憶の園、小物はあなたが作ってください。見習い魔女の三面図も作って良い」
# 1案だけ作る（CLAUDE.md「守ること」1、2026-11-01「今後も2通り生成しないで良い」）。
# 見習い魔女4枚は上の指示で承認済み（4クレジットと案内済み）。追憶の園と小物は承認の表を出してから作る。
#
# 原作テキスト（Mj100）の手がかり:
#   - 追憶の園: 夜行列車が異空間で止められ、降りて探すと「盲いた魔女」がいる場所（6章の場面メモ: 異空間→盲いた魔女→追憶の園（翠ノ実））。
#     魔女はビスコの手を握り、翠の実を手渡す（「そいつは砂糖漬けにして食うと美味いんだ」）。異空間の背景（refs/otherspace_bg_01）と地続きにする。
#   - 翠の実: 「"朧なる神ニケ"、その血を浴びたリンゴが翌朝には翠萌ゆる光の実になった」。→ リンゴの形で翠色に淡く光る実。
#   - 翠の実の砂糖漬け: ビスコの好物。後の章でメタリカが大量に土産にする。→ ガラス瓶の砂糖漬け。
#   - 切符: 隠し森でネズミ（マーリカ）がいた場所に落ちていた「一切れの紙のようなもの」。2人まで乗れる。山羊の頭が食べて本物と確かめる。後に偽造が発覚。
#   - 委任状: メタリカは沼の外に出られないので、百騎兵に持たせる（6章の場面メモ「駅（鐘、夜光列車、戦闘、委任状）」）。
#   - 小瓶の緑の液体: メタリカが議会場で飲んで巨大化する。
model: gpt_image_2_5
params: {quality: medium, resolution: 2k, aspect_ratio: "16:9"}
