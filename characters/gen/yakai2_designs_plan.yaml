# 5章の残り（A11〜A17）と6章後半（A18〜A32）の新しい設定画・背景の参考画の生成計画
# ユーザー指示（2026-11-01 13:04）:「ヒゲが13本ある猫、見習い魔女、ホウキ、護符、森の魔女のシモベ、白ネズミ、案内魔女、ニワトリ、
#   巨大メタリカ、沼を浴びたテレッサ、バスルーム、庭園と隠し森についてはあなたが作ってください」
# 原作に画像がないので Claude が生成し、ユーザーが候補から選んだものを refs/<対象>_sheet_01（背景は <場所>_bg_01）として登録する
# （砂漠編の村人・スケアコッコと同じ方式）。背景は D-058。
#
# 原作テキスト（Mj100）と録画の書き起こし（part19・20）の手がかり:
#   - ネコ: 招待状の3品の一つ「ヒゲが13本あるネコ」。実在したがすでに死んでおり、メタリカが錬金術で作り出す。樽の鈴の音草の音でクシャミをする。
#   - 見習い魔女: 「幼年の魔女見習いのお子様」「小さな子供達」。夜会の出し物としてワルギスのダンスを踊る。A17 で4人と決めた。
#   - 護符: 沼に耐性のないルッキーニィのために、メタリカが瘴気から守る護符を用意（ビスコはいらない）。
#   - シモベ: 「アルレッキーノそっくりの魔法生物」「森の魔女の僕」。庭園の手入れ係。マーリカ不在で魔力が足らず植物がうまく育たない。
#   - 白ネズミ: ネズミにされたマーリカ。ネザリアと一緒にいる。10章で尻尾が切られる（尻尾なしは後で差分）。
#   - ニワトリ: 夜明けに3回鳴く「ニワトリ」は、招待状の「尾の先がだるいニワトリ」＝スケアコッコ（ビスコが捕まえて手を離すまで鳴かない）。
#     スケアコッコの設定画（refs/scarecocco_sheet_01.png）があるので、この計画では作らない。
#   - 巨大メタリカ: 6-15 で毒沼とともに議会場へ乱入し、小瓶の緑の液体を飲んで巨大化する（実体として作る）。
#   - テレッサ: 列車が吐き出した毒沼の泥水を頭から浴び、「何も見えませんわ」と叫んで事切れる。
#   - バスルーム: 録画 part20「お弟子ちゃんの風呂って沼の水を使う」。赤いカーテン、大きな浴槽（6章の場面メモ）。
#   - 庭園: 森の魔女の庭園。円形の石の台座。植物がうまく育たない。マーリカの森の背景（refs/marika-forest_bg_01）に石の輪がある。
#   - 隠し森: 「ほとんど人の手が入っていない森」「強い魔獣がたくさん」。森の庭園のさらに奥。途中に線路と駅（駅はこの計画に含めない）。
model: gpt_image_2_5
params: {quality: medium, resolution: 2k, aspect_ratio: "16:9"}
credits_per_image: 1
status: 生成済み（ユーザー承認 2026-11-01 13:10「OK」、24クレジット、残高 511→487。送信時に 429 が5件出たが課金なし、出し直して全24枚）。ユーザーが候補から選ぶ
total_images: 24

common:
  sheet_rules: >-
    Layout like the references, on a plain white background. No text, no labels, no captions, no manga symbols, no color
    palette swatches.
  creature: >-
    Character design sheet of a NEW creature, drawn in exactly the same 2D anime art style, line art, cel shading and
    color treatment as the two reference sheets (images 1 and 2); the references only show the drawing style and the sheet
    layout, do not copy their subjects. Full-body front view, side view and back view in a row, plus two head close-ups
    (front and three-quarter) on the right.
  character: >-
    Character design sheet of a NEW character, drawn in exactly the same 2D anime art style, line art, cel shading and
    color treatment as the two reference sheets (images 1 and 2); do not copy the reference characters' faces, hair,
    outfits or colors. Full-body front view, side view and back view standing in a row, plus two head close-ups (front and
    three-quarter) on the right. Neutral standing pose.
  prop: >-
    Prop design sheet, drawn in exactly the same 2D anime art style, line art, cel shading and color treatment as the
    reference images; the references only show the style and the swamp witch's colors and materials (deep purple, crimson,
    gold rings, dark wood, glowing jade-green swamp magic), do not draw the characters.
  background: >-
    Background art only: no characters, no creatures, no text. A 2D anime environment design sheet: several panels of the
    same place from different viewpoints, separated by thin white borders, in the same painting style, colors and
    materials as the reference images; the references only show the look of the materials and the mood, do not copy their
    viewpoints or layout.

