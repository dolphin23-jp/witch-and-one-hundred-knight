tests:
  - id: normal
    text: 見たよ。昨日の夜も見たし、今朝起きてすぐにも見せられた
    style: flat and mildly exasperated, not looking up, matter-of-fact
  - id: gag
    text: 明日！？　無茶だろう、そんなの
    style: startled, voice jumping upward, flustered and quick
  - id: honne
    text: <short pause> ……おやすみ、メタリカ
    style: soft and lowered, a little breathy, tender
