# 声の設計書（ベイクオフ準備タブより）。実在の声優の名前や声の模倣は指定しない（D-022）。
character: metallica
design:
  高さ: 中高音で芯があり、よく通る
  質感: 張りがあり、少しハスキーなざらつきがある。勝気でエネルギッシュ
  年齢感: 若い成人女性（実年齢は100歳を超える魔女。魔女は寿命が長く、長く若い姿を保つ）
  話す速さ: 速い。たたみかける
  態度: 尊大、自信過剰。怒鳴るときは声が裏返る
  笑い: 喉の奥で引っかける、短く細かい「キヒヒ」
  本音の場面: 声量と速さが落ち、語尾がかすれる

# Gemini の声の設計（POST /v1beta/voices, type=prompted）に渡す説明。
# 永続的な声の性質だけを書く。場面ごとの演技は tests の style で指定する。
gemini:
  display_name: Metallica
  gender: female
  language_code: ja-JP
  description: 日本語を母語とする若い成人女性の声。中高音で芯があり、よく通る。少しハスキーなざらつきがある。勝気でエネルギッシュ。尊大で自信過剰。日本のアニメの高飛車な魔女役のように、早口でたたみかける、メリハリの強い演技をする。
  voice_id: voice_zgiqm9pnws1r     # 作成後に tools/gemini_tts.py が書き込む
  # 権利のあるサンプル音声から作る場合（D-037）。文章による設計（description）と、どちらか一方を使う。
  replicate:
    source: null     # 例: voice-samples/metallica/source.m4a（10〜30秒の自然な話し声。雑音なし）
    consent: null    # 例: voice-samples/metallica/consent.m4a（同じ人が同じ環境で、同意文を一字一句そのまま読み上げたもの）
    rights: null     # 誰の声で、どのように同意・許諾を得たか

tests:
  - id: normal
    text: キヒヒ……見ろ。この封蠟。この紙の手触り。一流の魔女にしか届かん代物だぞ
    style: 得意げで勝ち誇った調子。早口でたたみかける。冒頭の笑いは短く、喉の奥で引っかける
  - id: gag
    text: ……散れと言っている！
    style: 一拍の沈黙のあと、爆発するように怒鳴る。怒りで声が裏返る
  - id: honne
    text: ……ワタシだって、感謝くらいするんだ
    style: 小さくゆっくり、つぶやくように。照れている。語尾がかすれる
