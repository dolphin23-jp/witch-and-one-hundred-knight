character: arlecchino
design:
  高さ: 男性の中低音域
  質感: 柔らかく、少し鼻にかかった上品さ
  年齢感: 年齢不詳の大人
  話す速さ: 一定で、ゆったり
  態度: 慇懃だが、言葉の奥に皮肉がある。「……いえ」と言い直す直前に、半拍の間を置く
  ギャグの場面: 首が飛ぶときの悲鳴だけ、声が裏返る

gemini:
  display_name: Arlecchino
  gender: male
  language_code: ja-JP
  description: 日本語を母語とする男性の声。中低音で、柔らかく少し鼻にかかった上品な響きに、よく通る張りがある。年齢不詳の大人。常に慇懃だが、言葉の奥に皮肉がにじむ。日本のアニメの執事役のように、発音がはっきりしていて、抑揚にメリハリのある演技をする。ゆったりとした一定の速さで話す。
  voice_id: voice_ctv9tei7mkdj
  # 権利のあるサンプル音声から作る場合（D-037）。文章による設計（description）と、どちらか一方を使う。
  replicate:
    source: null     # 例: voice-samples/arlecchino/source.m4a（10〜30秒の自然な話し声。雑音なし）
    consent: null    # 例: voice-samples/arlecchino/consent.m4a（同じ人が同じ環境で、同意文を一字一句そのまま読み上げたもの）
    rights: null     # 誰の声で、どのように同意・許諾を得たか

tests:
  - id: normal
    text: さようでございますね。なにしろ招待状が届きましたのは、百年余りで今回が初めてでございますから。お喜びもひとしお…… <short pause> いえ、当然の結果にございます、はい
    style: 慇懃で落ち着いているが、含みがある。間のあとの言い直しは、少し急いで、妙に滑らかに
  - id: gag
    text: く、首はいけませぬー！
    style: 慌てた悲鳴。声が裏返って裏声になる
  - id: deadpan
    text: おおむね、毎朝でございます
    style: まったくの無表情で、動じない
